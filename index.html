<!DOCTYPE html>
<!--
  Deer Trail Cam Scorer - one single page app.
  Everything (look, logic, pages) lives in this one file:
    1. <head>   page settings, PWA install links, Leaflet map stylesheet, and the CSS styles
    2. <body>   an empty <div id="root"> that the script below fills in
    3. <script> the React code: helpers, charts, Google Drive sync, and the App itself
-->

<head>

<!-- Make the page fit phone screens instead of being zoomed out -->

<title>Deer Trail Cam Scorer</title>
<!-- PWA: manifest.json lets the app be installed to a home screen -->
<link rel="manifest" href="manifest.json">
<!-- Color of the phone status bar / browser toolbar -->
<meta name="theme-color" content="#1f4d2b">
<!-- Let the app open full screen when launched from the home screen (Android / iOS) -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trail Cams">
<!-- Icon iPhones use on the home screen -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- Leaflet (the map library) stylesheet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

/* Make padding and borders count inside an element's width so sizes are predictable */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

button {

    padding: 9px 12px;

    font-size: 14px;
}

/* Form controls use the same font as the rest of the page */
input,
select,
textarea {
    font-family: Arial, sans-serif;
}

/* Green top bar holding the title and the Drive / Export / Import buttons */
header {

    color: white;
    padding: 15px 22px;
    display: flex;
    justify-content: space-between;

/* The app title in the top bar */
header h1 {

    font-size: 22px;
}

/* Row that holds the buttons on the right side of the top bar */
.header-buttons {
    display: flex;

}

/* White button style used inside the green top bar */

}

}

h2,
h3 {

}

/* A block of the sidebar (cameras, trails, stands) with space below it */
.section {
    margin-bottom: 22px;
}

/* White rounded box used for items in the sidebar */
.card {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 13px;
    margin-bottom: 10px;
}

/* Heading inside a sidebar card */
.card h3 {
    margin-bottom: 7px;
}

/* Small grey text inside a sidebar card */
.card p {
    margin: 5px 0;
    color: #555;
    font-size: 13px;
}

/* Green action button */
.primary {
    background: #1f4d2b;
    color: white;
}

/* Red delete button */
.danger {
    background: #c0392b;
    color: white;
}

/* Grey neutral button */
.secondary {
    background: #ddd;
    color: #222;
}

/* Brown '+ Add Deer Trail' button */
.trail-button {
    width: 100%;
    background: #6b4f2a;

    margin-bottom: 8px;
}

/* Green 'Finish Trail' button */

    width: 100%;
    background: #1f4d2b;
    color: white;
    margin-bottom: 8px;
}

/* Dark grey 'Cancel' button */
.cancel-button {
    width: 100%;
    background: #777;
    color: white;
}

/* One labelled field in a form */
.form-group {
    margin-bottom: 12px;
}

/* Bold label above a form field */
.form-group label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 5px;
}

/* Inputs, dropdowns and text areas fill the width of the form */
.form-group input,
.form-group select,
/* The notes box is taller and can be resized up and down */

    width: 100%;

}

/* The notes box is taller and can be resized up and down */

/* Row of buttons inside a card (Open / Delete) */

/* Buttons in that row share the width equally */

<body>

<!-- React draws the whole app (tabs, dashboard, charts, map) inside this empty div -->
<div id="root"></div>

<!-- Safety net script -->
<script>
// If the app ever crashes, show the error instead of a blank page.
window.addEventListener("error", function(event) {
    var root = document.getElementById("root");
    if (root && !root.children.length) {
        var box = document.createElement("div");
        box.style.cssText = "padding:20px;font-family:Arial,sans-serif";
        var title = document.createElement("h3");
        title.textContent = "Something went wrong";
        var detail = document.createElement("pre");
        detail.style.whiteSpace = "pre-wrap";
        detail.textContent = String(event.message || "Unknown error");
        box.appendChild(title);
        box.appendChild(detail);
        root.appendChild(box);
    }
});
</script>

<!-- Libraries, loaded from the internet (the service worker caches them for offline use) -->
<!-- React: builds the user interface -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<!-- React DOM: puts React output on the page -->
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<!-- Leaflet: the interactive map -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- leaflet.heat: draws the heat map layer -->
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<!-- Google Identity Services: the "Connect Google Drive" sign-in -->
<script src="https://accounts.google.com/gsi/client"></script>

<script>

// ===================================================================
// DEER TRAIL CAM SCORER - application code
//
// How this file is organised (top to bottom):
//   1. Small helpers: saved colors, deer directions, scoring, sunrise/sunset
//   2. Collapsible sections and the SVG chart drawing functions
//   3. Stand / layer / hour / direction helpers
//   4. Loading and saving data in this device's localStorage
//   5. Google Drive sync (sign-in and the Drive web calls)
//   6. App(): the main screen - state, map code, handlers, and the pages
// ===================================================================
//
// Shorthand names for React features used everywhere below
const e = React.createElement;  // e(tag, props, ...children) builds one piece of the page
const useState = React.useState;  // hook: a value that redraws the page when it changes
const useEffect = React.useEffect;  // hook: run code after drawing, or when chosen values change
const useRef = React.useRef;  // hook: a box that remembers a value without causing a redraw

// localStorage keys: the names this app saves its data under on your device
const CAMERA_KEY = "deerCameras";  // cameras and their sightings
const TRAIL_KEY = "deerTrails";  // deer trails
const COLORS_KEY = "deerMapColors";  // map color choices
const STAND_KEY = "deerStands";  // hunting stands
const LAYERS_KEY = "deerMapLayers";  // which map layers (trails, stands) are switched on

// Starting map colors (the Reset Colors button returns to these)
const DEFAULT_COLORS = {
    camera: "#ff0000",  // camera dot fill
    cameraOutline: "#ffffff",  // camera dot outline
    trail: "#ffff00",  // deer trail lines
    stand: "#ff9800"  // stand triangles
};

// Reads the saved map colors, falling back to the defaults for any that are missing
function getColors() {
    try {
        // Read the saved colors text and turn it into an object
        const saved = JSON.parse(localStorage.getItem(COLORS_KEY));
        // Saved colors win; anything not saved uses the default
        return { ...DEFAULT_COLORS, ...(saved || {}) };
    } catch {
        // Nothing saved (or unreadable): use the defaults
        return { ...DEFAULT_COLORS };
    }
}

// The 8 compass directions used for 'Direction of Travel' (value is stored, label/arrow are shown)
const DIRECTIONS = [
    { value: "N", label: "North", arrow: "↑" },
    { value: "NE", label: "Northeast", arrow: "↗" },
    { value: "E", label: "East", arrow: "→" },
    { value: "SE", label: "Southeast", arrow: "↘" },
    { value: "S", label: "South", arrow: "↓" },
    { value: "SW", label: "Southwest", arrow: "↙" },
    { value: "W", label: "West", arrow: "←" },
    { value: "NW", label: "Northwest", arrow: "↖" }
];

// Turns a stored direction like 'NE' into display text like '↗ Northeast'
function directionText(value) {
    // Look up the direction whose value matches
    const found = DIRECTIONS.find(function(d) {
        return d.value === value;
    });
    // Show arrow + name, or nothing if it wasn't found
    return found ? found.arrow + " " + found.label : "";
}

// ---- Camera scoring ----
// A camera's score is the sum of its sightings' weights. Each sighting is worth:
//   number of deer x deer type weight x shooting-hours multiplier x age decay
// Change the numbers below to tune it.
// Numbers that control the camera score. Edit these to tune how scoring works.
const SCORE_CONFIG = {
    halfLifeDays: 7,            // a sighting counts half as much after this many days  // a sighting counts half as much after this many days
    typeWeights: {
        "Big Buck": 8,  // points per deer for a big buck
        Buck: 4,  // points per deer for a regular buck
        Doe: 2,  // points per deer for a doe
        Fawn: 1,  // points per deer for a fawn
        Unknown: 1  // points per deer when the type is unknown
    },
    shootingMultiplier: 2,      // sightings during shooting hours  // sightings during shooting hours are multiplied by this
    otherMultiplier: 1,         // sightings outside shooting hours  // sightings outside shooting hours are multiplied by this
    shootingBufferMinutes: 30   // shooting hours = sunrise - buffer to sunset + buffer  // shooting hours start this long before sunrise and end this long after sunset
};

// Sunrise or sunset as a UTC timestamp (ms) for a calendar date and location.
// Works out sunrise or sunset for a date and location using the standard 'Almanac for Computers' method.
// Returns the moment as a UTC timestamp (milliseconds), or null if the sun never rises/sets that day.
function sunEvent(year, month0, day, lat, lng, isRise) {

    // Multiply degrees by this to get radians
    const rad = Math.PI / 180;

    // Day number of the year (Jan 1 = 1)
    const dayOfYear = Math.floor(
        (Date.UTC(year, month0, day) - Date.UTC(year, 0, 0)) / 86400000
    );

    // Longitude expressed in hours (the Earth turns 15 degrees per hour)
    const lngHour = lng / 15;
    // Approximate time of the event in days
    const t = dayOfYear + ((isRise ? 6 : 18) - lngHour) / 24;
    // The sun's mean anomaly (where it is in its orbit)
    const M = 0.9856 * t - 3.289;

    // The sun's true longitude in the sky
    let L = M +
        1.916 * Math.sin(M * rad) +
        0.020 * Math.sin(2 * M * rad) +
        282.634;

    L = ((L % 360) + 360) % 360;

    // Right ascension, then fixed to be in the same quadrant as L and converted to hours
    let RA = Math.atan(0.91764 * Math.tan(L * rad)) / rad;
    RA = ((RA % 360) + 360) % 360;
    RA += Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90;
    RA = RA / 15;

    // The sun's declination (how far north/south of the equator it is)
    const sinDec = 0.39782 * Math.sin(L * rad);
    const cosDec = Math.cos(Math.asin(sinDec));

    // Cosine of the sun's hour angle for sunrise/sunset (90.833 degrees accounts for atmosphere)
    const cosH =
        (Math.cos(90.833 * rad) - sinDec * Math.sin(lat * rad)) /
        (cosDec * Math.cos(lat * rad));

    // Sun never rises or never sets on this day at this latitude
    if (cosH > 1 || cosH < -1) return null;

    // Hour angle: use the morning side for sunrise, the evening side for sunset, then convert to hours
    let H = isRise
        ? 360 - Math.acos(cosH) / rad
        : Math.acos(cosH) / rad;

    H = H / 15;

    // Local mean time of the event, kept between 0 and 24 hours
    let T = H + RA - 0.06571 * t - 6.622;
    T = ((T % 24) + 24) % 24;

    // Convert local mean time to UTC and return it as a timestamp
    return Date.UTC(year, month0, day) + (T - lngHour) * 3600000;
}

// True if a sighting happened during shooting hours (30 min before sunrise to 30 min after sunset)
// at the camera's location on that date.
function isShootingTime(sighting, camera) {

    // Without a date and time we can't tell, so count it as outside shooting hours
    if (!sighting.date || !sighting.time) return false;

    // Split '2026-09-28' and '06:45' into numbers
    const dateParts = sighting.date.split("-").map(Number);
    const timeParts = sighting.time.split(":").map(Number);

    const y = dateParts[0];
    const m = dateParts[1] - 1;
    const d = dateParts[2];
    const hh = timeParts[0];
    const mm = timeParts[1] || 0;

    // Bad date/time text: not shooting hours
    if (![y, m, d, hh, mm].every(Number.isFinite)) return false;

    // The sighting moment (in this device's time zone)
    const when = new Date(y, m, d, hh, mm).getTime();

    // Sunrise and sunset at the camera for that date
    const rise = sunEvent(y, m, d, camera.lat, camera.lng, true);
    const set = sunEvent(y, m, d, camera.lat, camera.lng, false);

    // No sunrise/sunset that day (extreme latitudes): fall back to 6 AM - 7 PM
    if (rise === null || set === null) {
        return hh >= 6 && hh < 19;
    }

    // The 30 minute buffer, in milliseconds
    const buffer = SCORE_CONFIG.shootingBufferMinutes * 60000;

    // Inside the window if after (sunrise - buffer) and before (sunset + buffer)
    return when >= rise - buffer && when <= set + buffer;
}

// Score for ONE sighting = number of deer x type points x shooting-hours multiplier x age decay
function sightingScore(sighting, camera, now) {

    // Points per deer for this type (unknown types count as 1)
    const typeWeight =
        SCORE_CONFIG.typeWeights[sighting.deerType] !== undefined
            ? SCORE_CONFIG.typeWeights[sighting.deerType]
            : 1;

    // Bonus multiplier if it happened during shooting hours
    const timeWeight = isShootingTime(sighting, camera)
        ? SCORE_CONFIG.shootingMultiplier
        : SCORE_CONFIG.otherMultiplier;

    // How many days ago the sighting was (0 if there is no date)
    let ageDays = 0;

    if (sighting.date) {
        const when = new Date(
            sighting.date + "T" + (sighting.time || "12:00")
        ).getTime();

        if (Number.isFinite(when)) {
            ageDays = Math.max(0, (now - when) / 86400000);
        }
    }

    // Halve the value every 'halfLifeDays' days: 0.5 ^ (age / halfLife)
    const decay = Math.pow(0.5, ageDays / SCORE_CONFIG.halfLifeDays);

    // Put it all together
    return Number(sighting.number || 1) * typeWeight * timeWeight * decay;
}

// A camera's score is the sum of the scores of all of its sightings
function cameraScore(camera) {

    // Current moment, so every sighting is aged against the same time
    const now = Date.now();

    return camera.sightings.reduce(function(total, sighting) {
        return total + sightingScore(sighting, camera, now);
    }, 0);
}

// ---- Collapsible sections ----
const COLLAPSE_KEY = "deerCollapsed";  // where open/closed choices are saved

// Reads which collapsible sections the user closed last time (an object like { 'chart-daily': true })
function getCollapsedMap() {
    try {
        return JSON.parse(localStorage.getItem(COLLAPSE_KEY)) || {};
    } catch {
        return {};
    }
}

// A card or section with a clickable header that hides/shows its contents.
// props: id (remembers open/closed), title, tag (h2/h3), className, children
function Collapsible(props) {

    // The id is how this section's open/closed choice is remembered
    const id = props.id;

    // Start open, unless a saved choice says it was closed
    const [open, setOpen] = useState(function() {
        const saved = getCollapsedMap()[id];
        return saved === undefined ? props.defaultOpen !== false : !saved;
    });

    // Called when the title bar is clicked: flip open/closed and save the choice
    function toggle() {
        // The new state (opposite of the current one)
        const next = !open;
        // Redraw with the new state
        setOpen(next);
        // Load the saved choices, update this section's entry, and save them again
        const map = getCollapsedMap();
        map[id] = !next;
        localStorage.setItem(COLLAPSE_KEY, JSON.stringify(map));
    }

    return e(
        "div",
        {
            // The outer box takes whatever class the caller gave it (card, section, dashboard-card...)
            className: props.className || "",
            style: props.style
        },

        e(
            "div",
            {
                // The clickable title bar
                className: "collapse-header" + (open ? " open" : ""),
                onClick: toggle
            },
            // The title text (as an h2 or h3 heading)
            e(props.tag || "h3", null, props.title),
            // Arrow: ▾ when open, ▸ when closed
            e("span", { className: "collapse-arrow" }, open ? "▾" : "▸")
        ),

        open
            // The contents are only drawn while the section is open
            ? e("div", { className: "collapse-body" }, props.children)
            : null
    );
}

// ---- Chart helpers (all charts are drawn as inline SVG, no libraries) ----
// One color per deer type, used by all the charts
const TYPE_COLORS = {
    "Big Buck": "#7b1e1e",
    Buck: "#c0392b",
    Doe: "#2e7d32",
    Fawn: "#f9a825",
    Unknown: "#757575"
};

// The deer types in the order they are stacked and listed in charts
const CHART_TYPES = ["Big Buck", "Buck", "Doe", "Fawn", "Unknown"];
// Day names in the same order JavaScript numbers days (0 = Sunday)
const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

// Grey message shown in place of a chart that has no data yet
function chartNote(text) {
    return e("div", { className: "empty" }, text);
}

// "2026-09-28" -> a Date at noon that day (noon avoids daylight-saving edge cases)
function parseDay(dateString) {
    // Split '2026-09-28' into [2026, 9, 28]
    const p = dateString.split("-").map(Number);
    return new Date(p[0], p[1] - 1, p[2], 12, 0, 0);
}

// Turns a Date back into 'YYYY-MM-DD' text (used as a lookup key)
function dayKey(date) {
    return date.getFullYear() + "-" +
        String(date.getMonth() + 1).padStart(2, "0") + "-" +
        String(date.getDate()).padStart(2, "0");
}

// Monday of the week a date falls in
function weekStart(date) {
    const copy = new Date(date.getTime());
    // Step back to Monday (Sunday counts as the end of the week)
    copy.setDate(copy.getDate() - ((copy.getDay() + 6) % 7));
    return copy;
}

// Rounds a maximum up to a tidy number for axis labels
function niceMax(value) {
    // Small numbers just round up to a whole number
    if (value <= 5) return Math.max(1, Math.ceil(value));
    // Size of the number: 1, 10, 100...
    const power = Math.pow(10, Math.floor(Math.log10(value)));
    const n = value / power;
    // Round up to 1, 2, 5 or 10 times that size
    const nice = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
    return nice * power;
}

// Adds up the 'number of deer' across a list of sightings
function sumNumber(list) {
    return list.reduce(function(total, sighting) {
        return total + Number(sighting.number || 0);
    }, 0);
}

// Draws the colored squares + names shown under some charts
function legendRow(items) {
    return e(
        "div",
        { className: "legend" },
        items.map(function(item) {
            return e(
                "div",
                { className: "legend-item", key: item.label },
                e("span", {
                    className: "legend-swatch",
                    style: { background: item.color }
                }),
                item.label +
                (item.value !== undefined ? " (" + item.value + ")" : "")
            );
        })
    );
}

// Vertical bars. items = [{label, value, title}]
function columnChart(items, color, labelEvery) {

    // Chart size and margins: W/H = total, L/R/T/B = left/right/top/bottom space
    const W = 640, H = 220, L = 36, R = 8, T = 10, B = 26;
    const plotW = W - L - R;
    const plotH = H - T - B;

    // The tallest bar decides the scale of the y-axis
    const max = niceMax(Math.max.apply(
        null,
        items.map(function(item) { return item.value; }).concat([1])
    ));

    // Width of each bar slot
    const barW = plotW / items.length;
    const kids = [];

    // horizontal grid lines with value labels
    // Draw 5 horizontal grid lines with their value labels
    for (let g = 0; g <= 4; g++) {
        const y = T + plotH - plotH * g / 4;
        kids.push(e("line", { key: "g" + g, x1: L, x2: W - R, y1: y, y2: y, stroke: "#e3e3e3" }));
        kids.push(e("text", { key: "t" + g, x: L - 5, y: y + 3, textAnchor: "end", fontSize: 10, fill: "#666" }, Math.round(max * g / 4 * 10) / 10));
    }

    // the bars and their x labels
    // Draw one bar per item, plus its label underneath every few bars
    items.forEach(function(item, i) {

        // Bar height in proportion to its value
        const h = plotH * item.value / max;

        kids.push(e(
            "rect",
            {
                key: "b" + i,
                x: L + i * barW + 0.5,
                y: T + plotH - h,
                width: Math.max(barW - 1, 1),
                height: h,
                fill: color
            },
            e("title", null, item.title || (item.label + ": " + item.value))
        ));

        if (i % labelEvery === 0) {
            kids.push(e("text", { key: "l" + i, x: L + i * barW + barW / 2, y: H - 8, textAnchor: "middle", fontSize: 10, fill: "#666" }, item.label));
        }
    });

    // Wrap all the shapes in an SVG that scales to the card width
    return e("svg", { viewBox: "0 0 " + W + " " + H, className: "chart-svg" }, kids);
}

// Line with a filled area underneath. points = [{label, value}]
function lineChart(points, color) {

    // Chart size and margins
    const W = 640, H = 220, L = 36, R = 12, T = 10, B = 26;
    const plotW = W - L - R;
    const plotH = H - T - B;

    const max = niceMax(Math.max.apply(
        null,
        points.map(function(point) { return point.value; }).concat([1])
    ));

    // Horizontal distance between points
    const step = points.length > 1 ? plotW / (points.length - 1) : 0;

    // Turn each point into an x,y position on the chart
    const coords = points.map(function(point, i) {
        return [
            L + (points.length > 1 ? i * step : plotW / 2),
            T + plotH - plotH * point.value / max
        ];
    });

    // Text form of the line and the filled area under it (SVG 'points' format)
    const line = coords.map(function(c) { return c[0] + "," + c[1]; }).join(" ");
    const area = L + "," + (T + plotH) + " " + line + " " + coords[coords.length - 1][0] + "," + (T + plotH);

    const kids = [];

    for (let g = 0; g <= 4; g++) {
        const y = T + plotH - plotH * g / 4;
        kids.push(e("line", { key: "g" + g, x1: L, x2: W - R, y1: y, y2: y, stroke: "#e3e3e3" }));
        kids.push(e("text", { key: "t" + g, x: L - 5, y: y + 3, textAnchor: "end", fontSize: 10, fill: "#666" }, Math.round(max * g / 4 * 10) / 10));
    }

    // Soft filled area under the line, then the line itself
    kids.push(e("polygon", { key: "area", points: area, fill: color, fillOpacity: 0.15 }));
    kids.push(e("polyline", { key: "line", points: line, fill: "none", stroke: color, strokeWidth: 2.5 }));

    // label roughly five evenly spaced points along the bottom
    // Only label about five points so the labels don't overlap
    const every = Math.max(1, Math.ceil(points.length / 5));

    points.forEach(function(point, i) {
        kids.push(e("circle", { key: "p" + i, cx: coords[i][0], cy: coords[i][1], r: 3, fill: color }, e("title", null, point.label + ": " + point.value)));
        if (i % every === 0 || i === points.length - 1) {
            kids.push(e("text", { key: "l" + i, x: coords[i][0], y: H - 8, textAnchor: "middle", fontSize: 10, fill: "#666" }, point.label));
        }
    });

    return e("svg", { viewBox: "0 0 " + W + " " + H, className: "chart-svg" }, kids);
}

// Donut with a legend. items = [{label, value, color}]
function donutChart(items, centerLabel, legendAll) {

    // Only slices with something in them are drawn
    const shown = items.filter(function(item) { return item.value > 0; });
    // Total used to work out each slice's share
    const total = shown.reduce(function(t, item) { return t + item.value; }, 0);

    if (!total) return chartNote("No data yet.");

    // Donut center and its outer / inner radius
    const cx = 100, cy = 100, outer = 80, inner = 50;
    // Start drawing at 12 o'clock
    let angle = -Math.PI / 2;

    // Position on the circle for an angle and a radius
    function point(a, radius) {
        return [cx + radius * Math.cos(a), cy + radius * Math.sin(a)];
    }

    // One curved slice per item, sized by its share of the total
    const slices = shown.map(function(item, idx) {

        const fraction = item.value / total;
        const tip = item.label + ": " + item.value + " (" + Math.round(fraction * 100) + "%)";

        // a single slice is a full ring (an arc can't start and end at the same point)
        // A single 100% slice is drawn as a full ring
        if (fraction >= 0.9999) {
            return e("circle", { key: idx, cx: cx, cy: cy, r: (outer + inner) / 2, fill: "none", stroke: item.color, strokeWidth: outer - inner }, e("title", null, tip));
        }

        // Where this slice ends
        const next = angle + fraction * 2 * Math.PI;
        const a = point(angle, outer);
        const b = point(next, outer);
        const c = point(next, inner);
        const d = point(angle, inner);
        // SVG needs to know if the arc is more than half a circle
        const large = fraction > 0.5 ? 1 : 0;

        // Path: outer arc, line to the inner edge, inner arc back, close
        const path =
            "M" + a[0] + " " + a[1] +
            " A" + outer + " " + outer + " 0 " + large + " 1 " + b[0] + " " + b[1] +
            " L" + c[0] + " " + c[1] +
            " A" + inner + " " + inner + " 0 " + large + " 0 " + d[0] + " " + d[1] + " Z";

        angle = next;

        return e("path", { key: idx, d: path, fill: item.color }, e("title", null, tip));
    });

    return e(
        "div",
        null,
        e(
            "svg",
            { viewBox: "0 0 200 200", className: "chart-svg", style: { maxWidth: "240px", margin: "0 auto" } },
            slices,
            e("text", { x: cx, y: cy + 5, textAnchor: "middle", fontSize: 22, fontWeight: "bold", fill: "#1f4d2b" }, total),
            e("text", { x: cx, y: cy + 22, textAnchor: "middle", fontSize: 10, fill: "#666" }, centerLabel)
        ),
        // legendAll = also list slices that are zero (so 'Shooting hours (0)' is visible)
        legendRow((legendAll ? items : shown).map(function(item) {
            return { label: item.label, color: item.color, value: item.value };
        }))
    );
}

// Days of the week (rows) by hour of the day (columns), darker = more deer
function hourGridChart(sightings) {

    // Grid of counts: 7 days of the week x 24 hours
    const grid = [];
    for (let d = 0; d < 7; d++) grid.push(new Array(24).fill(0));

    let any = false;

    sightings.forEach(function(sighting) {

        const hour = sightingHour(sighting);

        if (!sighting.date || hour === null) return;

        grid[parseDay(sighting.date).getDay()][hour] += Number(sighting.number || 0);
        any = true;
    });

    if (!any) return chartNote("No sightings with a date and time yet.");

    // Biggest cell decides the darkest color
    let max = 1;
    grid.forEach(function(row) { row.forEach(function(v) { if (v > max) max = v; }); });

    // Cell size and left/top space for labels
    const cell = 22, left = 34, top = 6;
    const W = left + 24 * cell + 4;
    const H = top + 7 * cell + 22;
    const kids = [];

    // Draw each day's row: its name, then 24 cells shaded by how many deer
    grid.forEach(function(row, d) {

        kids.push(e("text", { key: "d" + d, x: left - 6, y: top + d * cell + 15, textAnchor: "end", fontSize: 10, fill: "#666" }, DAY_NAMES[d]));

        row.forEach(function(value, h) {
            kids.push(e(
                "rect",
                { key: d + "-" + h, x: left + h * cell, y: top + d * cell, width: cell - 1, height: cell - 1, fill: "#1f4d2b", fillOpacity: value ? 0.12 + 0.88 * value / max : 0.04 },
                e("title", null, DAY_NAMES[d] + " " + hourLabel(h) + ": " + value + " deer")
            ));
        });
    });

    // Hour labels along the bottom, every 3 hours
    for (let h = 0; h < 24; h += 3) {
        kids.push(e("text", { key: "h" + h, x: left + h * cell + cell / 2, y: top + 7 * cell + 14, textAnchor: "middle", fontSize: 10, fill: "#666" }, hourShort(h)));
    }

    return e("svg", { viewBox: "0 0 " + W + " " + H, className: "chart-svg" }, kids);
}

// Compass rose: each wedge reaches further the more deer travelled that way
function compassChart(sightings) {

    // Deer counts per direction of travel
    const counts = {};
    let total = 0;

    sightings.forEach(function(sighting) {
        if (!DIRECTION_BEARINGS.hasOwnProperty(sighting.direction)) return;
        const n = Number(sighting.number || 1);
        counts[sighting.direction] = (counts[sighting.direction] || 0) + n;
        total += n;
    });

    if (!total) return chartNote("No sightings with a direction of travel yet.");

    // Compass center and the longest wedge length
    const cx = 130, cy = 130, maxR = 90;
    const max = Math.max.apply(null, Object.values(counts));
    const kids = [];

    // Three faint guide rings
    [1 / 3, 2 / 3, 1].forEach(function(f, i) {
        kids.push(e("circle", { key: "r" + i, cx: cx, cy: cy, r: maxR * f, fill: "none", stroke: "#e3e3e3" }));
    });

    // Screen position for a compass bearing (0 = up / north) at a distance from the center
    function at(bearing, radius) {
        const a = (bearing - 90) * Math.PI / 180;
        return [cx + radius * Math.cos(a), cy + radius * Math.sin(a)];
    }

    // One wedge per direction, longer = more deer, with its letter label
    DIRECTIONS.forEach(function(dir) {

        const bearing = DIRECTION_BEARINGS[dir.value];
        const count = counts[dir.value] || 0;
        const label = at(bearing, maxR + 16);

        if (count) {
            const r = maxR * count / max;
            const p1 = at(bearing - 20, r);
            const p2 = at(bearing + 20, r);

            kids.push(e(
                "path",
                { key: "w" + dir.value, d: "M" + cx + " " + cy + " L" + p1[0] + " " + p1[1] + " A" + r + " " + r + " 0 0 1 " + p2[0] + " " + p2[1] + " Z", fill: "#1f4d2b", fillOpacity: 0.75 },
                e("title", null, dir.label + ": " + count + " deer")
            ));
        }

        kids.push(e("text", { key: "t" + dir.value, x: label[0], y: label[1] + 4, textAnchor: "middle", fontSize: 12, fontWeight: "bold", fill: "#444" }, dir.value));
    });

    return e("svg", { viewBox: "0 0 260 260", className: "chart-svg", style: { maxWidth: "300px", margin: "0 auto" } }, kids);
}

// One horizontal stacked bar per camera, split by deer type
function cameraTypeChart(sightings, cameras) {

    // One row per camera: its deer counts split by type
    const rows = cameras.map(function(camera) {

        const mine = sightings.filter(function(s) { return s.cameraId === camera.id; });

        const parts = CHART_TYPES.map(function(type) {
            return { type: type, value: sumNumber(mine.filter(function(s) { return s.deerType === type; })) };
        });

        return { name: camera.name, parts: parts, total: sumNumber(mine) };

    }).filter(function(row) { return row.total > 0; })
      .sort(function(a, b) { return b.total - a.total; });

    if (!rows.length) return chartNote("No sightings yet.");

    // Chart width, space for camera names, and row height
    const W = 640, labelW = 130, rowH = 28;
    const max = Math.max.apply(null, rows.map(function(r) { return r.total; }));
    // Longest possible bar (leaves room for the number at the end)
    const barMax = W - labelW - 50;
    const kids = [];

    // Draw each camera: name, colored segments, then the total
    rows.forEach(function(row, i) {

        let x = labelW;
        const y = i * rowH + 4;

        kids.push(e("text", { key: "n" + i, x: labelW - 8, y: y + 15, textAnchor: "end", fontSize: 12, fill: "#444" }, row.name.length > 18 ? row.name.slice(0, 17) + "…" : row.name));

        row.parts.forEach(function(part) {

            if (!part.value) return;

            const w = barMax * part.value / max;

            kids.push(e("rect", { key: i + part.type, x: x, y: y, width: w, height: rowH - 8, fill: TYPE_COLORS[part.type] }, e("title", null, row.name + " — " + part.type + ": " + part.value)));

            x += w;
        });

        kids.push(e("text", { key: "v" + i, x: x + 6, y: y + 15, fontSize: 11, fill: "#666" }, row.total));
    });

    return e(
        "div",
        null,
        e("svg", { viewBox: "0 0 " + W + " " + (rows.length * rowH + 6), className: "chart-svg" }, kids),
        legendRow(CHART_TYPES.map(function(type) { return { label: type, color: TYPE_COLORS[type] }; }))
    );
}

// Deer per week over the last 12 weeks, stacked by type
function weeklyTypeChart(sightings) {

    const dated = sightings.filter(function(s) { return s.date; });

    if (!dated.length) return chartNote("No sightings with dates yet.");

    // The newest date with a sighting; the chart ends on that week
    const latest = dated.map(function(s) { return s.date; }).sort().pop();
    const lastWeek = weekStart(parseDay(latest));

    // Build the last 12 weeks (oldest first)
    const weeks = [];

    for (let i = 11; i >= 0; i--) {
        const d = new Date(lastWeek.getTime() - i * 7 * 86400000);
        weeks.push({ key: dayKey(d), label: (d.getMonth() + 1) + "/" + d.getDate(), counts: {} });
    }

    // Quick lookup from a week's start date to its position
    const lookup = {};
    weeks.forEach(function(w, i) { lookup[w.key] = i; });

    dated.forEach(function(s) {
        const key = dayKey(weekStart(parseDay(s.date)));
        if (!(key in lookup)) return;
        const counts = weeks[lookup[key]].counts;
        counts[s.deerType] = (counts[s.deerType] || 0) + Number(s.number || 0);
    });

    // Total deer in each week (to set the chart height)
    const totals = weeks.map(function(w) {
        return Object.values(w.counts).reduce(function(t, v) { return t + v; }, 0);
    });

    // Chart size and margins
    const W = 640, H = 220, L = 36, R = 8, T = 10, B = 26;
    const plotW = W - L - R;
    const plotH = H - T - B;
    const max = niceMax(Math.max.apply(null, totals.concat([1])));
    const barW = plotW / weeks.length;
    const kids = [];

    for (let g = 0; g <= 4; g++) {
        const y = T + plotH - plotH * g / 4;
        kids.push(e("line", { key: "g" + g, x1: L, x2: W - R, y1: y, y2: y, stroke: "#e3e3e3" }));
        kids.push(e("text", { key: "t" + g, x: L - 5, y: y + 3, textAnchor: "end", fontSize: 10, fill: "#666" }, Math.round(max * g / 4 * 10) / 10));
    }

    // Draw each week as a stack of colored blocks, one per deer type
    weeks.forEach(function(week, i) {

        let y = T + plotH;

        CHART_TYPES.forEach(function(type) {

            const value = week.counts[type] || 0;

            if (!value) return;

            const h = plotH * value / max;
            y -= h;

            kids.push(e("rect", { key: i + type, x: L + i * barW + 3, y: y, width: barW - 6, height: h, fill: TYPE_COLORS[type] }, e("title", null, "Week of " + week.label + " — " + type + ": " + value)));
        });

        kids.push(e("text", { key: "l" + i, x: L + i * barW + barW / 2, y: H - 8, textAnchor: "middle", fontSize: 10, fill: "#666" }, week.label));
    });

    return e(
        "div",
        null,
        e("svg", { viewBox: "0 0 " + W + " " + H, className: "chart-svg" }, kids),
        legendRow(CHART_TYPES.map(function(type) { return { label: type, color: TYPE_COLORS[type] }; }))
    );
}

// Sightings per day over the 30 days ending at the latest sighting
function dailyChart(sightings) {

    const dated = sightings.filter(function(s) { return s.date; });

    if (!dated.length) return chartNote("No sightings with dates yet.");

    // The newest date with a sighting; the chart covers the 30 days ending there
    const end = parseDay(dated.map(function(s) { return s.date; }).sort().pop());
    // One entry per day, oldest first, starting at zero
    const days = [];

    for (let i = 29; i >= 0; i--) {
        const d = new Date(end.getTime() - i * 86400000);
        days.push({ key: dayKey(d), label: (d.getMonth() + 1) + "/" + d.getDate(), value: 0 });
    }

    const lookup = {};
    days.forEach(function(d, i) { lookup[d.key] = i; });

    dated.forEach(function(s) {
        if (s.date in lookup) days[lookup[s.date]].value += Number(s.number || 0);
    });

    return columnChart(
        days.map(function(d) { return { label: d.label, value: d.value, title: d.label + ": " + d.value + " deer" }; }),
        "#1f4d2b",
        5
    );
}

// Running total of deer seen, day by day
function cumulativeChart(sightings) {

    // Deer seen on each date
    const totals = {};

    sightings.forEach(function(s) {
        if (!s.date) return;
        totals[s.date] = (totals[s.date] || 0) + Number(s.number || 0);
    });

    // Dates in order (YYYY-MM-DD sorts correctly as text)
    const dates = Object.keys(totals).sort();

    if (!dates.length) return chartNote("No sightings with dates yet.");

    // Running total that grows each day
    let running = 0;

    return lineChart(
        dates.map(function(date) {
            running += totals[date];
            const d = parseDay(date);
            return { label: (d.getMonth() + 1) + "/" + d.getDate(), value: running };
        }),
        "#2a6a3b"
    );
}

// How many bucks had each number of antler points
function antlerChart(sightings) {

    // One counter per antler point count: 1 to 15, and 16 or more
    const bins = new Array(16).fill(0);
    let any = false;

    sightings.forEach(function(s) {

        if (!isBuckType(s.deerType) || !s.antlerPoints) return;

        // Add this sighting's deer to its antler-point bin (16+ share the last bin)
        bins[Math.min(Number(s.antlerPoints), 16) - 1] += Number(s.number || 1);
        any = true;
    });

    if (!any) return chartNote("No bucks with antler points recorded yet.");

    return columnChart(
        bins.map(function(count, i) {
            const label = i === 15 ? "16+" : String(i + 1);
            return { label: label, value: count, title: label + " points: " + count };
        }),
        "#c0392b",
        1
    );
}

// ---- Camera facing direction + relative directions ----

// "Left to right" etc. only make sense once we know which way the camera faces
const RELATIVE_DIRECTIONS = [
    { value: "rel:LR", label: "Left to right", offset: 90 },
    { value: "rel:RL", label: "Right to left", offset: -90 },
    { value: "rel:TOWARD", label: "Toward the camera", offset: 180 },
    { value: "rel:AWAY", label: "Away from the camera", offset: 0 }
];

// Turns a choice like "rel:LR" into a compass direction using the camera's facing direction.
// Normal compass values pass through unchanged.
function resolveDirection(value, camera) {

    if (!value || value.indexOf("rel:") !== 0) return value;

    if (!camera || !DIRECTION_BEARINGS.hasOwnProperty(camera.facing)) return "";

    const relative = RELATIVE_DIRECTIONS.find(function(r) { return r.value === value; });

    if (!relative) return "";

    const bearing = ((DIRECTION_BEARINGS[camera.facing] + relative.offset) % 360 + 360) % 360;

    return DIRECTIONS[Math.round(bearing / 45) % 8].value;
}

// The extra dropdown choices (greyed out until the camera's facing direction is set)
function relativeDirectionOptions(camera) {

    const known = camera && DIRECTION_BEARINGS.hasOwnProperty(camera.facing);

    return RELATIVE_DIRECTIONS.map(function(r) {
        return e(
            "option",
            { key: r.value, value: r.value, disabled: !known },
            r.label + (known ? "" : " (set 'Camera faces' first)")
        );
    });
}

// Corner points of the faint wedge drawn on the map to show where a camera points
// (60 degrees wide, 45 metres long)
function facingWedge(camera) {

    const bearing = DIRECTION_BEARINGS[camera.facing];
    const metres = 45;
    const points = [[camera.lat, camera.lng]];

    for (let a = -30; a <= 30; a += 10) {
        const rad = (bearing + a) * Math.PI / 180;
        points.push([
            camera.lat + metres * Math.cos(rad) / 111320,
            camera.lng + metres * Math.sin(rad) / (111320 * Math.cos(camera.lat * Math.PI / 180))
        ]);
    }

    return points;
}

// Gmail's own pass (separate from the Drive one; kept in memory only)

// Opens Google's permission popup for Gmail and resolves when we have a pass.
// Must be called straight from a button tap so the browser allows the popup.
function gmailSignIn() {

    return new Promise(function(resolve, reject) {

        if (!window.google || !window.google.accounts) {
            reject(new Error("Google's sign-in script hasn't loaded yet. Check your connection and try again."));
            return;
        }

        if (!clientIdLooksValid(getClientId())) {
            reject(new Error("Set your Google Client ID first (the gear button in the header)."));
            return;
        }

        const client = google.accounts.oauth2.initTokenClient({
            client_id: getClientId(),
            scope: GMAIL_SCOPE,
            callback: function(response) {

                if (response && response.access_token) {

                    if (!google.accounts.oauth2.hasGrantedAllScopes(response, GMAIL_SCOPE)) {
                        reject(new Error("Gmail access wasn't granted. Tick the box allowing read access to your email and try again."));
                        return;
                    }

                    gmailAccessToken = response.access_token;
                    resolve(response.access_token);

                } else {

                    reject(new Error("Google sign-in failed: " + ((response && (response.error_description || response.error)) || "unknown error")));
                }
            },
            error_callback: function(error) {
                reject(new Error(
                    error && error.type === "popup_closed"
                        ? "The Google sign-in window was closed before it finished."
                        : "Google sign-in failed, or your browser blocked the popup."
                ));
            }
        });

        client.requestAccessToken({ prompt: "" });
    });
}

// Reads one thing from the Gmail API (throws a readable error if it fails)
async function gmailGet(path) {

    const response = await fetch(
        "https://gmail.googleapis.com/gmail/v1/users/me/" + path,
        { headers: { Authorization: "Bearer " + gmailAccessToken } }
    );

    if (!response.ok) {

        let detail = "";

        try {
            const body = await response.json();
            if (body && body.error && body.error.message) detail = body.error.message;
        } catch (error) {}

        let message = "Gmail request failed (" + response.status + ")" + (detail ? ": " + detail : "");

        if (response.status === 403) {
            message += " - make sure the Gmail API is enabled in your Google Cloud project and the gmail.readonly permission was granted.";
        }

        const error = new Error(message);
        error.status = response.status;
        throw error;
    }

    return response.json();
}

// Gmail sends data as "base64url"; turn it into plain base64 text
function base64UrlToBase64(data) {

    let b64 = data.replace(/-/g, "+").replace(/_/g, "/");

    while (b64.length % 4) b64 += "=";

    return b64;
}

// Decodes Gmail's base64url text into a normal string
function decodeGmailText(data) {

    try {
        const binary = atob(base64UrlToBase64(data));
        const bytes = Uint8Array.from(binary, function(c) { return c.charCodeAt(0); });
        return new TextDecoder("utf-8").decode(bytes);
    } catch (error) {
        return "";
    }
}

function stripHtml(html) {
    return html
        .replace(/<style[\s\S]*?<\/style>/gi, " ")
        .replace(/<[^>]+>/g, " ")
        .replace(/&nbsp;/g, " ")
        .replace(/&amp;/g, "&")
        .replace(/\s+/g, " ");
}

// Shrinks a photo to a small JPEG so a page full of photos doesn't use up the phone's memory
function shrinkImage(dataUrl, maxSide) {

    return new Promise(function(resolve) {

        const img = new Image();

        img.onload = function() {

            const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
            const canvas = document.createElement("canvas");

            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);

            resolve(canvas.toDataURL("image/jpeg", 0.75));
        };

        img.onerror = function() {
            resolve(dataUrl);
        };

        img.src = dataUrl;
    });
}

const MONTH_NUMBERS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };

// Looks through the email text for a date and time (several common formats).
// If none is found (or it's wildly different from when the email arrived), uses the time the email arrived.
function parseEmailDateTime(text, receivedTs) {

    const candidates = [];

    function add(year, month, day, hour, minute, ampm) {

        let y = Number(year), mo = Number(month), d = Number(day), h = Number(hour), mi = Number(minute);

        if (y < 100) y += 2000;

        if (ampm) {
            const pm = ampm.toUpperCase() === "PM";
            if (h === 12) h = pm ? 12 : 0;
            else if (pm) h += 12;
        }

        if (mo < 1 || mo > 12 || d < 1 || d > 31 || h > 23 || mi > 59) return;

        const date = new Date(y, mo - 1, d, h, mi);

        if (date.getMonth() !== mo - 1) return;

        candidates.push(date);
    }

    let m;

    // 2026-09-28 06:45 (or with a T between)
    const iso = /(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?/gi;
    while ((m = iso.exec(text))) add(m[1], m[2], m[3], m[4], m[5], m[6]);

    // 09/28/2026 6:45 PM  (month first, as in the US)
    const us = /(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})[ ,T]+(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?/gi;
    while ((m = us.exec(text))) add(m[3], m[1], m[2], m[4], m[5], m[6]);

    // Sep 28, 2026 6:45 PM
    const named = /(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})[ ,]+(?:at\s+)?(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?/gi;
    while ((m = named.exec(text))) add(m[3], MONTH_NUMBERS[m[1].toLowerCase()], m[2], m[4], m[5], m[6]);

    // the first one within 3 days of the email arriving is believable
    const believable = candidates.find(function(date) {
        return Math.abs(date.getTime() - receivedTs) <= 3 * 86400000;
    });

    const chosen = believable || new Date(receivedTs);

    return {
        date: dayKey(chosen),
        time: String(chosen.getHours()).padStart(2, "0") + ":" + String(chosen.getMinutes()).padStart(2, "0"),
        source: believable ? "the email text" : "when the email arrived"
    };
}

// Finds which camera an email is about by looking for its name (or its 'email match text') in the email
function matchCamera(cameras, text) {

    const lower = text.toLowerCase();
    let best = null;
    let bestLength = 0;

    cameras.forEach(function(camera) {

        const needle = (camera.emailMatch || camera.name || "").trim().toLowerCase();

        if (!needle) return;

        const escaped = needle.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

        // whole-word match so a camera called "A" doesn't match every email
        if (new RegExp("(^|[^a-z0-9])" + escaped + "([^a-z0-9]|$)").test(lower) && needle.length > bestLength) {
            best = camera;
            bestLength = needle.length;
        }
    });

    return best;
}

// ---- Reading the date/time and camera name from the photo itself ----

// Trail cameras save the exact time the picture was taken inside the JPEG file (called EXIF data).
// This reads it from the raw file bytes. Returns { date: "2026-10-01", time: "14:35" } or null.
function readExifDate(bytes) {

    try {

        // a JPEG file starts with the bytes FF D8
        if (bytes[0] !== 0xFF || bytes[1] !== 0xD8) return null;

        let pos = 2;

        // walk through the JPEG's labelled sections until we find the "Exif" one
        while (pos + 4 < bytes.length) {

            if (bytes[pos] !== 0xFF) return null;

            const marker = bytes[pos + 1];
            const length = (bytes[pos + 2] << 8) | bytes[pos + 3];

            if (
                marker === 0xE1 &&
                String.fromCharCode(bytes[pos + 4], bytes[pos + 5], bytes[pos + 6], bytes[pos + 7]) === "Exif"
            ) {
                return readTiffDate(bytes, pos + 10);
            }

            // FF DA = the picture itself starts here, so there is no Exif section
            if (marker === 0xDA) return null;

            pos += 2 + length;
        }

    } catch (error) {}

    return null;
}

// Reads the date tags out of the Exif block ("base" is where its header starts)
function readTiffDate(b, base) {

    const little = b[base] === 0x49;   // "II" = numbers stored little-end first, "MM" = big-end first

    function u16(o) { return little ? (b[o] | (b[o + 1] << 8)) : ((b[o] << 8) | b[o + 1]); }

    function u32(o) {
        return little
            ? ((b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0)
            : (((b[o] << 24) | (b[o + 1] << 16) | (b[o + 2] << 8) | b[o + 3]) >>> 0);
    }

    // reads the tags we care about from one directory of tags
    function readDirectory(offset, wanted) {

        const found = {};
        const count = u16(base + offset);

        for (let i = 0; i < count; i++) {

            const entry = base + offset + 2 + i * 12;
            const tag = u16(entry);
            const type = u16(entry + 2);
            const items = u32(entry + 4);

            if (!wanted[tag]) continue;

            if (type === 2) {
                // text: stored right here if 4 characters or fewer, otherwise at the offset given
                const at = items <= 4 ? entry + 8 : base + u32(entry + 8);
                let text = "";
                for (let k = 0; k < items - 1; k++) text += String.fromCharCode(b[at + k]);
                found[tag] = text;
            } else if (type === 4) {
                found[tag] = u32(entry + 8);
            }
        }

        return found;
    }

    const main = readDirectory(u32(base + 4), { 0x0132: true, 0x8769: true });

    let text = null;

    // "date taken" lives in a sub-directory; the plain "date" tag is the fallback
    if (main[0x8769] !== undefined) {
        text = readDirectory(main[0x8769], { 0x9003: true })[0x9003] || null;
    }

    text = text || main[0x0132] || null;

    const m = text && /^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2})/.exec(text);

    if (!m || Number(m[1]) < 2000) return null;

    return { date: m[1] + "-" + m[2] + "-" + m[3], time: m[4] + ":" + m[5] };
}

// Turns the text read from the photo's black strip into { name, date, time }.
// The strip looks like:  10/1/2026  2:35PM  DOUBLE DUECE  004  CuddeLink
function parseStripText(text) {

    const flat = String(text || "").replace(/\s+/g, " ").trim();

    const m = /(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})\s+(\d{1,2}):(\d{2})\s*([AP])\s*M\s+(.+?)\s+(\d{3,4})\b/i.exec(flat);

    if (!m) return null;

    let hour = Number(m[4]);
    const pm = m[6].toUpperCase() === "P";

    if (hour === 12) hour = pm ? 12 : 0;
    else if (pm) hour += 12;

    let year = Number(m[3]);
    if (year < 100) year += 2000;

    const month = Number(m[1]);
    const day = Number(m[2]);

    if (month < 1 || month > 12 || day < 1 || day > 31 || hour > 23 || Number(m[5]) > 59) return null;

    return {
        // camera name between the time and the picture number; stray symbols at the ends are removed
        name: m[7].replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, "").replace(/\s+/g, " ").toUpperCase(),
        date: year + "-" + String(month).padStart(2, "0") + "-" + String(day).padStart(2, "0"),
        time: String(hour).padStart(2, "0") + ":" + m[5]
    };
}

// "Double Deuce" and "DOUBLE DUECE" -> "DOUBLEDUECE" (so small differences in spacing and case don't matter)
function normalizeName(name) {
    return String(name || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
}

// How many single-letter edits turn one word into another (used to forgive small reading mistakes)
function editDistance(a, b) {

    const row = [];

    for (let j = 0; j <= b.length; j++) row.push(j);

    for (let i = 1; i <= a.length; i++) {

        let previous = row[0];
        row[0] = i;

        for (let j = 1; j <= b.length; j++) {

            const saved = row[j];

            row[j] = Math.min(
                row[j] + 1,
                row[j - 1] + 1,
                previous + (a[i - 1] === b[j - 1] ? 0 : 1)
            );

            previous = saved;
        }
    }

    return row[b.length];
}

// Finds the camera whose name (or email match text) is the same as, or very close to, the name read from the photo.
// Returns null if nothing is close enough or two cameras tie.
function matchCameraByName(cameras, stripName) {

    const target = normalizeName(stripName);

    if (target.length < 2) return null;

    const digitsOf = function(text) { return text.replace(/[^0-9]/g, ""); };

    let best = null;
    let bestDistance = Infinity;
    let tie = false;

    cameras.forEach(function(camera) {

        [camera.name, camera.emailMatch].forEach(function(candidate) {

            const norm = normalizeName(candidate);

            if (!norm) return;

            // "NORTH 1" and "NORTH 2" are different cameras even though they are one letter apart
            if (digitsOf(norm) !== digitsOf(target)) return;

            const distance = editDistance(norm, target);
            const allowed = norm.length <= 4 ? 1 : Math.floor(norm.length / 4);

            if (distance > allowed) return;

            if (distance < bestDistance) {
                best = camera;
                bestDistance = distance;
                tie = false;
            } else if (distance === bestDistance && best && best.id !== camera.id) {
                tie = true;
            }
        });
    });

    return tie ? null : best;
}

// The text reader (Tesseract) is only downloaded when it is first needed
let ocrWorker = null;

function loadTextReader() {

    return new Promise(function(resolve, reject) {

        if (window.Tesseract) {
            resolve(window.Tesseract);
            return;
        }

        const script = document.createElement("script");

        script.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
        script.onload = function() { resolve(window.Tesseract); };
        script.onerror = function() { reject(new Error("Couldn't download the text reader")); };

        document.head.appendChild(script);
    });
}

async function getTextReader() {

    if (ocrWorker) return ocrWorker;

    const Tesseract = await loadTextReader();
    const worker = await Tesseract.createWorker("eng");

    // 6 = read it as one block of text; only allow the letters and symbols a time stamp uses
    await worker.setParameters({
        tessedit_pageseg_mode: "6",
        tessedit_char_whitelist: "0123456789/:-ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz "
    });

    ocrWorker = worker;

    return worker;
}

// Frees the text reader's memory when we're done
async function stopTextReader() {

    if (!ocrWorker) return;

    try {
        await ocrWorker.terminate();
    } catch (error) {}

    ocrWorker = null;
}

// Cuts the black time stamp bar off the bottom of a photo and prepares it for reading:
// enlarged, with the white-on-black text flipped to black-on-white (which text readers like better)
function stripCanvas(dataUrl) {

    return new Promise(function(resolve, reject) {

        const img = new Image();

        img.onload = function() {

            const W = img.width;
            const H = img.height;

            // look at the bottom 12% of the picture
            const look = Math.max(8, Math.round(H * 0.12));
            const probe = document.createElement("canvas");

            probe.width = W;
            probe.height = look;

            const probeContext = probe.getContext("2d");
            probeContext.drawImage(img, 0, H - look, W, look, 0, 0, W, look);

            const pixels = probeContext.getImageData(0, 0, W, look).data;

            // walk upward from the bottom while the rows are dark: that is the black bar
            let top = look;

            for (let y = look - 1; y >= 0; y--) {

                let sum = 0;
                let count = 0;

                for (let x = 0; x < W; x += 4) {
                    const i = (y * W + x) * 4;
                    sum += (pixels[i] + pixels[i + 1] + pixels[i + 2]) / 3;
                    count++;
                }

                if (sum / count < 70) top = y;
                else break;
            }

            // no clear bar found: just use the bottom 5%
            const stripHeight = look - top >= 6 ? look - top : Math.max(8, Math.round(H * 0.05));

            // enlarge small photos so the letters are big enough to read
            const scale = Math.max(1, Math.min(4, Math.round(2400 / W)));
            const pad = 12;

            const out = document.createElement("canvas");

            out.width = W * scale + pad * 2;
            out.height = stripHeight * scale + pad * 2;

            const context = out.getContext("2d");

            context.fillStyle = "#000";
            context.fillRect(0, 0, out.width, out.height);
            context.drawImage(img, 0, H - stripHeight, W, stripHeight, pad, pad, W * scale, stripHeight * scale);

            // flip to black text on white (a black border becomes a white one)
            const image = context.getImageData(0, 0, out.width, out.height);
            const d = image.data;

            for (let i = 0; i < d.length; i += 4) {
                const gray = 255 - Math.round((d[i] + d[i + 1] + d[i + 2]) / 3);
                d[i] = gray;
                d[i + 1] = gray;
                d[i + 2] = gray;
                d[i + 3] = 255;
            }

            context.putImageData(image, 0, 0);

            resolve(out);
        };

        img.onerror = function() { reject(new Error("Couldn't open the photo")); };

        img.src = dataUrl;
    });
}

// Reads the black strip on a photo. Returns { name, date, time } or null if it couldn't be read.
async function readPhotoStrip(dataUrl) {

    try {
        const worker = await getTextReader();
        const canvas = await stripCanvas(dataUrl);
        const result = await worker.recognize(canvas);
        return parseStripText(result.data.text);
    } catch (error) {
        return null;
    }
}

// Loads one email and turns each photo in it into a card (before grouping).
// 'known' lists photos we have already handled. Returns { photoCount, items }.
async function gmailLoadMessage(id, cameras, known, useOcr, onStatus) {

    const message = await gmailGet("messages/" + id + "?format=full");

    function header(name) {
        const found = ((message.payload && message.payload.headers) || []).find(function(h) {
            return h.name.toLowerCase() === name.toLowerCase();
        });
        return found ? found.value : "";
    }

    // flatten the email's nested parts into a simple list
    const leaves = [];
    (function collect(part) {
        if (!part) return;
        if (part.parts && part.parts.length) part.parts.forEach(collect);
        else leaves.push(part);
    })(message.payload);

    // the readable text of the email (plain text if there is some, otherwise the HTML with tags removed)
    let bodyText = "";
    leaves.forEach(function(part) {
        if (part.mimeType === "text/plain" && part.body && part.body.data) bodyText += " " + decodeGmailText(part.body.data);
    });
    if (!bodyText.trim()) {
        leaves.forEach(function(part) {
            if (part.mimeType === "text/html" && part.body && part.body.data) bodyText += " " + stripHtml(decodeGmailText(part.body.data));
        });
    }

    // photos: skip tiny images (logos and icons); keep up to ten
    const imageParts = leaves.filter(function(part) {
        return part.mimeType && part.mimeType.indexOf("image/") === 0 &&
            part.body && (part.body.attachmentId || part.body.data) &&
            (!part.body.size || part.body.size >= 6000);
    }).slice(0, 10);

    const subject = header("Subject");
    const from = header("From");
    const received = Number(message.internalDate) || Date.now();
    const emailTime = parseEmailDateTime(subject + "\n" + bodyText, received);

    const items = [];

    for (let index = 0; index < imageParts.length; index++) {

        const part = imageParts[index];
        const photoId = id + "#" + index;

        // already added as a sighting or skipped
        if (known[photoId]) continue;

        if (onStatus) onStatus("Reading photo " + (index + 1) + " of " + imageParts.length + " in an email...");

        let data = part.body.data;

        if (!data) {
            const attachment = await gmailGet("messages/" + id + "/attachments/" + part.body.attachmentId);
            data = attachment.data;
        }

        const base64 = base64UrlToBase64(data);
        const original = "data:" + part.mimeType + ";base64," + base64;

        // 1) the exact time the camera recorded inside the photo file
        const exif = readExifDate(Uint8Array.from(atob(base64), function(c) { return c.charCodeAt(0); }));

        // 2) the camera name (and a second copy of the time) from the black bar at the bottom of the photo
        let strip = null;

        if (useOcr) {
            if (onStatus) onStatus("Reading the camera name on photo " + (index + 1) + " of " + imageParts.length + " (the first time downloads a text reader, about 10 MB)...");
            strip = await readPhotoStrip(original);
        }

        // best available time: photo data, then the strip, then the email text, then when the email arrived
        let when;
        let source;

        if (exif) { when = exif; source = "the photo's data"; }
        else if (strip && strip.date) { when = strip; source = "the photo's time stamp bar"; }
        else { when = emailTime; source = emailTime.source; }

        const stripName = strip && strip.name ? strip.name : "";

        // camera: the name on the photo first, then the name or match text anywhere in the email
        const camera =
            (stripName ? matchCameraByName(cameras, stripName) : null) ||
            matchCamera(cameras, subject + "\n" + from + "\n" + (part.filename || "") + "\n" + bodyText);

        items.push({
            key: photoId,
            photoIds: [photoId],
            msgIds: [id],
            subject: subject,
            from: from,
            filename: part.filename || "",
            images: [await shrinkImage(original, 1000)],
            ts: new Date(when.date + "T" + when.time).getTime(),
            cameraId: camera ? String(camera.id) : "",
            stripName: stripName,
            date: when.date,
            time: when.time,
            timeSource: source,
            deerType: "",
            number: "1",
            antlerPoints: "",
            direction: ""
        });
    }

    return { photoCount: imageParts.length, items: items };
}

// Trail cameras send several photos for one deer. Photos from the same camera within
// 10 minutes of each other are combined into one card. Newest first.
function groupEmails(items) {

    const sorted = items.slice().sort(function(a, b) { return a.ts - b.ts; });
    const groups = [];

    // photos are grouped by the camera we matched, or by the name read from the photo if no camera matched
    function groupKey(item) {
        return item.cameraId ? "c" + item.cameraId : (item.stripName ? "s" + item.stripName : "");
    }

    sorted.forEach(function(item) {

        const key = groupKey(item);

        // the most recent card for this same camera (photos from other cameras may be mixed in between)
        const last = key
            ? groups.slice().reverse().find(function(group) { return groupKey(group) === key; })
            : null;

        if (last && item.ts - last.lastTs <= 10 * 60000) {

            last.photoIds = last.photoIds.concat(item.photoIds);
            last.msgIds = last.msgIds.concat(item.msgIds.filter(function(m) { return last.msgIds.indexOf(m) === -1; }));
            last.images = last.images.concat(item.images).slice(0, 6);
            last.lastTs = item.ts;

        } else {

            groups.push(Object.assign({}, item, { lastTs: item.ts }));
        }
    });

    return groups.reverse();
}

// ---- Shooting-hours check and weekly power rankings ----

// Readable shooting window for a camera on a date, e.g. "6:18 AM - 7:11 PM" (in this device's time zone)
function shootingWindowText(camera, dateString) {

    const p = dateString.split("-").map(Number);

    const rise = sunEvent(p[0], p[1] - 1, p[2], camera.lat, camera.lng, true);
    const set = sunEvent(p[0], p[1] - 1, p[2], camera.lat, camera.lng, false);

    if (rise === null || set === null) {
        return "the sun doesn't rise/set that day here";
    }

    const buffer = SCORE_CONFIG.shootingBufferMinutes * 60000;

    function clock(timestamp) {
        return new Date(timestamp).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }

    return clock(rise - buffer) + " - " + clock(set + buffer);
}

// When a sighting happened as a timestamp (noon if it has no time); null if it has no date
function sightingTime(sighting) {

    if (!sighting.date) return null;

    const t = new Date(sighting.date + "T" + (sighting.time || "12:00")).getTime();

    return Number.isFinite(t) ? t : null;
}

// A camera's score as it stood at a moment in time:
// only sightings up to that moment count, and older ones are faded by the half-life
function cameraScoreAsOf(camera, asOf) {

    return camera.sightings.reduce(function(total, sighting) {

        const t = sightingTime(sighting);

        if (t === null || t > asOf) return total;

        return total + sightingScore(sighting, camera, asOf);
    }, 0);
}

// Midnight on the Monday of the week that contains a timestamp
function weekMonday(timestamp) {

    const d = new Date(timestamp);

    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));

    return d;
}

// Every week (Monday to Sunday) from the first sighting to this week, newest last.
// Each week's 'asOf' is the end of that week (or right now for the current week).
function powerWeeks(cameras, nowMs) {

    let earliest = null;

    cameras.forEach(function(camera) {
        camera.sightings.forEach(function(sighting) {
            const t = sightingTime(sighting);
            if (t !== null && (earliest === null || t < earliest)) earliest = t;
        });
    });

    if (earliest === null) return [];

    const weeks = [];
    const last = weekMonday(nowMs).getTime();

    for (let d = weekMonday(earliest); d.getTime() <= last; d.setDate(d.getDate() + 7)) {

        const start = new Date(d.getTime());

        const nextMonday = new Date(start.getTime());
        nextMonday.setDate(nextMonday.getDate() + 7);

        const sunday = new Date(start.getTime());
        sunday.setDate(sunday.getDate() + 6);

        weeks.push({
            key: dayKey(start),
            start: start,
            asOf: Math.min(nextMonday.getTime() - 1, nowMs),
            label: (start.getMonth() + 1) + "/" + start.getDate() +
                " - " + (sunday.getMonth() + 1) + "/" + sunday.getDate()
        });
    }

    // keep the most recent 26 weeks
    return weeks.slice(-26);
}

// Cameras ranked by their score at the end of a week (highest first)
function powerRanking(cameras, week) {

    const rows = cameras.map(function(camera) {

        return {
            camera: camera,
            score: cameraScoreAsOf(camera, week.asOf),
            // deer actually seen during that week
            deer: sumNumber(camera.sightings.filter(function(sighting) {
                const t = sightingTime(sighting);
                return t !== null && t >= week.start.getTime() && t <= week.asOf;
            }))
        };
    });

    rows.sort(function(a, b) {
        return b.score - a.score || a.camera.name.localeCompare(b.camera.name);
    });

    rows.forEach(function(row, i) {
        row.rank = i + 1;
    });

    return rows;
}

// Lines showing how the top cameras' ranks moved over the last 8 weeks (rank 1 at the top)
function rankTrendChart(cameras, weeks, index) {

    const shownWeeks = weeks.slice(Math.max(0, index - 7), index + 1);

    if (shownWeeks.length < 2) {
        return chartNote("Rank trends appear once there are two or more weeks of data.");
    }

    const table = shownWeeks.map(function(week) {
        const byCamera = {};
        powerRanking(cameras, week).forEach(function(row) {
            byCamera[row.camera.id] = row;
        });
        return byCamera;
    });

    const finalRows = powerRanking(cameras, shownWeeks[shownWeeks.length - 1]);

    // follow the six best cameras this week
    const followed = finalRows.filter(function(row) { return row.score > 0; }).slice(0, 6);

    if (!followed.length) return chartNote("No scores yet.");

    const maxRank = Math.min(cameras.length, 10);
    const palette = ["#1f4d2b", "#c0392b", "#2980b9", "#f39c12", "#8e44ad", "#16a085"];

    const W = 640, H = 240, L = 34, R = 14, T = 14, B = 28;
    const plotW = W - L - R;
    const plotH = H - T - B;
    const stepX = plotW / (shownWeeks.length - 1);

    function xAt(i) { return L + i * stepX; }
    function yAt(rank) { return T + (maxRank === 1 ? plotH / 2 : plotH * (Math.min(rank, maxRank) - 1) / (maxRank - 1)); }

    const kids = [];

    // a grid line and number for each rank
    for (let r = 1; r <= maxRank; r++) {
        kids.push(e("line", { key: "g" + r, x1: L, x2: W - R, y1: yAt(r), y2: yAt(r), stroke: "#e3e3e3" }));
        kids.push(e("text", { key: "t" + r, x: L - 8, y: yAt(r) + 3, textAnchor: "end", fontSize: 10, fill: "#666" }, "#" + r));
    }

    // week labels along the bottom
    shownWeeks.forEach(function(week, i) {
        kids.push(e("text", { key: "w" + i, x: xAt(i), y: H - 8, textAnchor: "middle", fontSize: 10, fill: "#666" }, week.label.split(" - ")[0]));
    });

    // one colored line per followed camera
    followed.forEach(function(row, c) {

        const color = palette[c % palette.length];

        const points = table.map(function(byCamera, i) {
            return xAt(i) + "," + yAt(byCamera[row.camera.id].rank);
        }).join(" ");

        kids.push(e("polyline", { key: "l" + c, points: points, fill: "none", stroke: color, strokeWidth: 2.5 }));

        table.forEach(function(byCamera, i) {
            kids.push(e(
                "circle",
                { key: "p" + c + "-" + i, cx: xAt(i), cy: yAt(byCamera[row.camera.id].rank), r: 4, fill: color },
                e("title", null, row.camera.name + " - week of " + shownWeeks[i].label.split(" - ")[0] + ": #" + byCamera[row.camera.id].rank)
            ));
        });
    });

    return e(
        "div",
        null,
        e("svg", { viewBox: "0 0 " + W + " " + H, className: "chart-svg" }, kids),
        legendRow(followed.map(function(row, c) {
            return { label: row.camera.name, color: palette[c % palette.length] };
        }))
    );
}

// The whole Weekly Power Rankings card: week picker, ranking table, and the rank trend chart
function powerRankingsView(cameras, weeks, weekKey, onPick) {

    if (!cameras.length) return chartNote("Add cameras and sightings to see power rankings.");
    if (!weeks.length) return chartNote("No sightings with dates yet.");

    // the chosen week (defaults to the latest)
    let index = weeks.findIndex(function(week) { return week.key === weekKey; });
    if (index < 0) index = weeks.length - 1;

    const week = weeks[index];
    const rows = powerRanking(cameras, week);

    // last week's ranks, to show movement
    const previous = {};
    if (index > 0) {
        powerRanking(cameras, weeks[index - 1]).forEach(function(row) {
            previous[row.camera.id] = row;
        });
    }

    const medals = ["🥇", "🥈", "🥉"];

    function moveCell(row) {

        if (index === 0) return e("td", null, "-");

        const before = previous[row.camera.id];

        if (row.score <= 0) return e("td", null, "-");

        if (!before || before.score <= 0) return e("td", { className: "move-up" }, "NEW");

        const change = before.rank - row.rank;

        if (change > 0) return e("td", { className: "move-up" }, "▲ " + change);
        if (change < 0) return e("td", { className: "move-down" }, "▼ " + Math.abs(change));

        return e("td", null, "-");
    }

    return e(
        "div",
        null,

        e(
            "div",
            { className: "chart-filter" },
            e(
                "select",
                {
                    value: week.key,
                    onChange: function(event) { onPick(event.target.value); }
                },
                weeks.slice().reverse().map(function(w) {
                    return e(
                        "option",
                        { key: w.key, value: w.key },
                        "Week of " + w.label + (w.key === weeks[weeks.length - 1].key ? " (this week)" : "")
                    );
                })
            )
        ),

        e(
            "div",
            { className: "table-wrapper" },
            e(
                "table",
                null,
                e("thead", null, e(
                    "tr",
                    null,
                    e("th", null, "Rank"),
                    e("th", null, "Camera"),
                    e("th", null, "Score"),
                    e("th", null, "Move"),
                    e("th", null, "Deer this week")
                )),
                e("tbody", null, rows.map(function(row) {
                    return e(
                        "tr",
                        { key: row.camera.id },
                        e("td", null, (row.score > 0 && row.rank <= 3 ? medals[row.rank - 1] + " " : "") + row.rank),
                        e("td", null, row.camera.name),
                        e("td", null, row.score.toFixed(1)),
                        moveCell(row),
                        e("td", null, row.deer)
                    );
                }))
            )
        ),

        e(
            "p",
            { className: "empty", style: { marginBottom: "18px" } },
            "Score as of the end of the week. Each sighting is weighted by deer type and shooting hours, and fades with a " +
            SCORE_CONFIG.halfLifeDays + "-day half-life, so recent activity moves a camera up the rankings."
        ),

        rankTrendChart(cameras, weeks, index)
    );
}

// ---- Stands, layers and deer-type helpers ----
// Choices in the stand type dropdown
const STAND_TYPES = [
    "Tree Stand",
    "Ladder Stand",
    "Box Blind",
    "Ground Blind",
    "Other"
];

// True for both 'Buck' and 'Big Buck' (used wherever 'any buck' is meant)
function isBuckType(type) {
    return type === "Buck" || type === "Big Buck";
}

// Does a deer type pass the heat map's filter? ('Buck' also includes big bucks)
function matchesHeatFilter(type, filter) {
    if (filter === "All") return true;
    if (filter === "Buck") return isBuckType(type);
    return type === filter;
}

// Cleans a list of stands (from storage, Drive or a backup): fills in missing values and drops broken ones
function sanitizeStands(list) {

    // Not a list at all
    if (!Array.isArray(list)) return null;

    return list.map(function(stand) {
        return {
            // Give a stand an id if it lost it
            id: stand.id || Date.now() + Math.random(),
            name: stand.name || "Stand",
            type: stand.type || "Other",
            lat: Number(stand.lat),
            lng: Number(stand.lng)
        };
    }).filter(function(stand) {
        return Number.isFinite(stand.lat) &&
               Number.isFinite(stand.lng);
    });
}

// Loads the saved stands from this device (empty list if none)
function getStands() {
    try {
        return sanitizeStands(
            JSON.parse(localStorage.getItem(STAND_KEY))
        ) || [];
    } catch {
        return [];
    }
}

// Loads which map layers are switched on (both default to on)
function getLayers() {

        const saved = JSON.parse(localStorage.getItem(LAYERS_KEY)) || {};
        return {
