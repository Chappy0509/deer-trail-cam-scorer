                        className: "section"
                    },

                    drawingTrail
                        ? e(
                            React.Fragment,
                            null,

                            e(
                                "div",
                                {
                                    className: "drawing"
                                },
                                "Click points on the map to draw the trail."
                            ),

                            e(
                                "button",
                                {
                                    className:
                                        "finish-button",
                                    onClick:
                                        finishTrail
                                },
                                "Finish Trail"
                            ),

                            e(
                                "button",
                                {
                                    className:
                                        "cancel-button",
                                    onClick:
                                        cancelTrail
                                },
                                "Cancel"
                            )
                        )
                        : e(
                            "button",
                            {
                                className:
                                    "trail-button",
                                onClick:
                                    startTrail
                            },
                            "+ Add Deer Trail"
                        ),

                    trails.length
                        ? trails.map(
                            function(trail) {

                                return e(
                                    "div",
                                    {
                                        className:
                                            "card",
                                        key:
                                            trail.id
                                    },

                                    e(
                                        "h3",
                                        null,
                                        trail.name
                                    ),

                                    e(
                                        "p",
                                        null,
                                        trail.points.length +
                                        " points"
                                    ),

                                    e(
                                        "button",
                                        {
                                            className:
                                                "danger",
                                            onClick:
                                                function() {
                                                    deleteTrail(
                                                        trail.id
                                                    );
                                                }
                                        },
                                        "Delete"
                                    )
                                );

                            }
                        )
                        : e(
                            "div",
                            {
                                className: "empty"
                            },
                            "No trails yet."
                        )
                ),

                standsSection()
            );
        }

        return e(
            React.Fragment,
            null,

            e(
                "button",
                {
                    className: "secondary",
                    onClick: function() {
                        cancelMove();
                        setSelectedCameraId(null);
                        setShowSightingForm(false);
                    }
                },
                "← Back"
            ),

            e(
                "div",
                {
                    className: "card"
                },

                e(
                    "h2",
                    null,
                    selectedCamera.name
                ),

                e(
                    "p",
                    null,
                    selectedCamera.lat.toFixed(6) +
                    ", " +
                    selectedCamera.lng.toFixed(6)
                ),

                e(
                    "p",
                    null,
                    selectedCamera.sightings.length +
                    " sightings"
                ),

                e(
                    "p",
                    null,
                    "Camera score: " +
                    cameraScore(selectedCamera).toFixed(1)
                ),

                averageBearing(selectedCamera) !== null
                    ? e(
                        "p",
                        null,
                        "Average heading: " +
                        directionText(
                            bearingDirection(
                                averageBearing(selectedCamera)
                            ).value
                        )
                    )
                    : null,

                // Which way this camera points (shown on the map and used for "left to right" style directions)
                e(
                    "div",
                    { className: "form-group", style: { marginTop: "10px" } },
                    e("label", null, "Camera faces"),
                    e(
                        "select",
                        {
                            value: selectedCamera.facing || "",
                            onChange: function(event) {
                                updateCamera(selectedCamera.id, { facing: event.target.value });
                            }
                        },
                        e("option", { value: "" }, "Not set"),
                        DIRECTIONS.map(function(d) {
                            return e("option", { key: d.value, value: d.value }, d.arrow + " " + d.label);
                        })
                    )
                ),

                // Text that appears in this camera's emails (its name or ID) so imported photos land on the right camera
                e(
                    "div",
                    { className: "form-group" },
                    e("label", null, "Email match text"),
                    e("input", {
                        type: "text",
                        value: selectedCamera.emailMatch || "",
                        placeholder: "name or ID used in this camera's emails",
                        onChange: function(event) {
                            updateCamera(selectedCamera.id, { emailMatch: event.target.value });
                        }
                    })
                ),

                movingCameraId === selectedCamera.id
                    ? e(
                        "div",
                        {
                            className: "drawing",
                            style: {
                                marginTop: "10px",
                                marginBottom: "0"
                            }
                        },
                        "Tap the map where this camera should go."
                    )
                    : null,

                e(
                    "button",
                    {
                        className: "secondary",
                        style: {
                            width: "100%",
                            marginTop: "10px"
                        },
                        onClick: function() {
                            if (movingCameraId === selectedCamera.id) {
                                cancelMove();
                            } else {
                                startMoveCamera(selectedCamera.id);
                            }
                        }
                    },
                    movingCameraId === selectedCamera.id
                        ? "Cancel Move"
                        : "Move Marker"
                ),

                e(
                    "button",
                    {
                        className:
                            "primary",
                        style: {
                            width: "100%",
                            marginTop: "10px"
                        },
                        onClick:
                            function() {
                                setShowSightingForm(
                                    !showSightingForm
                                );
                            }
                    },
                    showSightingForm
                        ? "Cancel"
                        : "+ Add Sighting"
                )
            ),

            showSightingForm
                ? e(
                    "div",
                    {
                        className: "card"
                    },

                    e(
                        "h3",
                        null,
                        "New Sighting"
                    ),

                    e(
                        "form",
                        {
                            onSubmit:
                                addSighting
                        },

                        // Form field: Date
                        e(
                            "div",
                            {
                                className:
                                    "form-group"
                            },

                            e(
                                "label",
                                null,
                                "Date"
                            ),

                            e(
                                "input",
                                {
                                    type: "date",
                                    value: date,
                                    onChange:
                                        function(event) {
                                            setDate(
                                                event.target.value
                                            );
                                        },
                                    required: true
                                }
                            )
                        ),

                        // Form field: Time
                        e(
                            "div",
                            {
                                className:
                                    "form-group"
                            },

                            e(
                                "label",
                                null,
                                "Time"
                            ),

                            e(
                                "input",
                                {
                                    type: "time",
                                    value: time,
                                    onChange:
                                        function(event) {
                                            setTime(
                                                event.target.value
                                            );
                                        },
                                    required: true
                                }
                            )
                        ),

                        // Form field: Deer Type
                        e(
                            "div",
                            {
                                className:
                                    "form-group"
                            },

                            e(
                                "label",
                                null,
                                "Deer Type"
                            ),

                            e(
                                "select",
                                {
                                    value:
                                        deerType,
                                    onChange:
                                        function(event) {
                                            setDeerType(
                                                event.target.value
                                            );
                                        }
                                },

                                e(
                                    "option",
                                    null,
                                    "Buck"
                                ),

                                e(
                                    "option",
                                    null,
                                    "Big Buck"
                                ),

                                e(
                                    "option",
                                    null,
                                    "Doe"
                                ),

                                e(
                                    "option",
                                    null,
                                    "Fawn"
                                ),

                                e(
                                    "option",
                                    null,
                                    "Unknown"
                                )
                            )
                        ),

                        // Form field: Number of Deer
                        e(
                            "div",
                            {
                                className:
                                    "form-group"
                            },

                            e(
                                "label",
                                null,
                                "Number of Deer"
                            ),

                            e(
                                "input",
                                {
                                    type: "number",
                                    min: "1",
                                    value: number,
                                    onChange:
                                        function(event) {
                                            setNumber(
                                                event.target.value
                                            );
                                        },
                                    required: true
                                }
                            )
                        ),

                        isBuckType(deerType)
                            ? e(
                                React.Fragment,
                                null,

                                // Form field: Antler Points
                                e(
                                    "div",
                                    {
                                        className:
                                            "form-group"
                                    },

                                    e(
                                        "label",
                                        null,
                                        "Antler Points"
                                    ),

                                    e(
                                        "input",
                                        {
                                            type: "number",
                                            min: "0",
                                            value:
                                                antlerPoints,
                                            onChange:
                                                function(event) {
                                                    setAntlerPoints(
                                                        event.target.value
                                                    );
                                                }
                                        }
                                    )
                                )
                            )
                            : null,

                        // Form field: Direction of Travel
                        e(
                            "div",
                            {
                                className:
                                    "form-group"
                            },

                            e(
                                "label",
                                null,
                                "Direction of Travel"
                            ),

                            e(
                                "select",
                                {
                                    value: direction,
                                    onChange:
                                        function(event) {
                                            setDirection(
                                                event.target.value
                                            );
                                        }
                                },

                                e(
                                    "option",
                                    { value: "" },
                                    "Not sure"
                                ),

                                DIRECTIONS.map(function(d) {
                                    return e(
                                        "option",
                                        {
                                            value: d.value,
                                            key: d.value
                                        },
                                        d.arrow + " " + d.label
                                    );
                                }),

                                // "Left to right" etc. (available once the camera's facing direction is set)
                                relativeDirectionOptions(selectedCamera)
                            )
                        ),

                        // Form field: Notes
                        e(
                            "div",
                            {
                                className:
                                    "form-group"
                            },

                            e(
                                "label",
                                null,
                                "Notes"
                            ),

                            e(
                                "textarea",
                                {
                                    value: notes,
                                    onChange:
                                        function(event) {
                                            setNotes(
                                                event.target.value
                                            );
                                        }
                                }
                            )
                        ),

                        e(
                            "button",
                            {
                                className:
                                    "primary",
                                type: "submit",
                                style: {
                                    width: "100%"
                                }
                            },
                            "Save Sighting"
                        )
                    )
                )
                : null,

            // Collapsible sidebar section (side-sightings)
            e(
                Collapsible,
                {
                    id: "side-sightings",
                    title: "Sightings",
                    className: "card"
                },

                selectedCamera.sightings.length
                    ? selectedCamera.sightings
                        .slice()
                        .reverse()
                        .map(
                            function(sighting) {

                                return e(
                                    "div",
                                    {
                                        className:
                                            "sighting",
                                        key:
                                            sighting.id
                                    },

                                    e(
                                        "strong",
                                        null,

                                        sighting.number +
                                        " " +
                                        sighting.deerType
                                    ),

                                    e(
                                        "small",
                                        null,

                                        sighting.date +
                                        " at " +
                                        sighting.time
                                    ),

                                    sighting.antlerPoints
                                        ? e(
                                            "p",
                                            null,
                                            sighting.antlerPoints +
                                            " antler points"
                                        )
                                        : null,

                                    sighting.direction
                                        ? e(
                                            "p",
                                            null,
                                            "Heading: " +
                                            directionText(
                                                sighting.direction
                                            )
                                        )
                                        : null,

                                    // Was this sighting inside shooting hours?
                                    e(
                                        "p",
                                        null,
                                        "Shooting hours: " +
                                        (isShootingTime(sighting, selectedCamera)
                                            ? "Yes"
                                            : "No")
                                    ),

                                    // Link back to the original email (for sightings imported from email)
                                    sighting.emailIds && sighting.emailIds.length
                                        ? e(
                                            "p",
                                            null,
                                            e(
                                                "a",
                                                {
                                                    href: "https://mail.google.com/mail/u/0/#all/" + sighting.emailIds[0],
                                                    target: "_blank",
                                                    rel: "noopener"
                                                },
                                                "Open the email"
                                            )
                                        )
                                        : null,

                                    sighting.notes
                                        ? e(
                                            "p",
                                            null,
                                            sighting.notes
                                        )
                                        : null,

                                    e(
                                        "button",
                                        {
                                            className:
                                                "danger",
                                            onClick:
                                                function() {
                                                    deleteSighting(
                                                        sighting.id
                                                    );
                                                }
                                        },
                                        "Delete"
                                    )
                                );

                            }
                        )
                    : e(
                        "div",
                        {
                            className: "empty"
                        },
                        "No sightings recorded."
                    )
            ),

            mapOptions()
        );
    }

    return e(
        React.Fragment,
        null,

        e(
            "header",
            null,

            e(
                "h1",
                null,
                "Deer Trail Cam Scorer"
            ),

            e(
                "div",
                {
                    className:
                        "header-buttons"
                },

                e(
                    "button",
                    {
                        className:
                            "header-button",
                        onClick:
                            signedIn
                                ? signOutOfDrive
                                : signInToDrive
                    },
                    signedIn
                        ? "Disconnect Drive"
                        : "Connect Google Drive"
                ),

                signedIn
                    ? null
                    : e(
                        "button",
                        {
                            className:
                                "header-button",
                            title:
                                "Set Google Client ID",
                            onClick:
                                askForClientId
                        },
                        "⚙"
                    ),

                signedIn ||
                syncStatus === "error" ||
                localStorage.getItem(WAS_CONNECTED_KEY) === "1"
                    ? e(
                        "span",
                        {
                            onClick: function() {
                                if (syncError) {
                                    alert(syncError);
                                }
                            },
                            style: {
                                color: "white",
                                fontSize: "12px",
                                alignSelf: "center",
                                cursor: syncError ? "pointer" : "default",
                                textDecoration: syncError
                                    ? "underline"
                                    : "none"
                            }
                        },
                        syncStatus === "syncing"
                            ? "Syncing…"
                            : syncStatus === "error"
                                ? "Sync error (tap)"
                                : signedIn
                                    ? "Synced"
                                    : "Not syncing"
                    )
                    : null,

                e(
                    "button",
                    {
                        className:
                            "header-button",
                        onClick:
                            exportData
                    },
                    "Export Data"
                ),

                e(
                    "label",
                    {
                        className:
                            "header-button",
                        style: {
                            padding:
                                "9px 12px",
                            borderRadius:
                                "6px",
                            cursor:
                                "pointer",
                            fontSize:
                                "14px"
                        }
                    },

                    "Import Data",

                    e(
                        "input",
                        {
                            className:
                                "file-input",
                            type: "file",
                            accept:
                                ".json",
                            onChange:
                                importData
                        }
                    )
                )
            )
        ),

        e(
            "div",
            {
                className: "nav"
            },

            e(
                "button",
                {
                    className:
                        view === "dashboard"
                            ? "active"
                            : "",
                    onClick:
                        function() {
                            setView(
                                "dashboard"
                            );
                        }
                },
                "Dashboard"
            ),

            e(
                "button",
                {
                    className:
                        view === "charts"
                            ? "active"
                            : "",
                    onClick:
                        function() {
                            setView("charts");
                        }
                },
                "Charts"
            ),

            e(
                "button",
                {
                    className:
                        view === "email"
                            ? "active"
                            : "",
                    onClick:
                        function() {
                            setView("email");
                        }
                },
                "Email"
            ),

            e(
                "button",
                {
                    className:
                        view === "map"
                            ? "active"
                            : "",
                    onClick:
                        function() {
                            setView("map");
                        }
                },
                "Map"
            )
        ),

        view === "dashboard"
            ? e(
                Dashboard
            )
            : view === "charts"
            ? chartsPage()
            : view === "email"
            ? emailPage()
            : e(
                "div",
                {
                    className: "app"
                },

                e(
                    "div",
                    {
                        className:
                            "sidebar"
                    },

                    CameraPanel()
                ),

                e(
                    "div",
                    {
                        id: "map"
                    }
                )
            )
    );
}

const root = ReactDOM.createRoot(
    document.getElementById("root")
);

root.render(
    e(App)
);

if ("serviceWorker" in navigator) {
    window.addEventListener("load", function() {
        navigator.serviceWorker.register("sw.js").catch(function() {});
    });
}

</script>

</body>
</html>
