<!DOCTYPE html>
<!--
  Deer Trail Cam Scorer - one single page app.
  Everything (look, logic, pages) lives in this one file:
    1. <head>   page settings, PWA install links, Leaflet map stylesheet, and the CSS styles
    2. <body>   an empty <div id="root"> that the script below fills in
    3. <script> the React code: helpers, charts, Google Drive sync, and the App itself
-->
<html lang="en">
<head>
<!-- Use the UTF-8 character set so arrows and symbols display correctly -->
<meta charset="UTF-8">
<!-- Make the page fit phone screens instead of being zoomed out -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deer Trail Cam Scorer</title>
<!-- PWA: manifest.json lets the app be installed to a home screen -->
<link rel="manifest" href="manifest.json">
<!-- Color of the phone status bar / browser toolbar -->
<meta name="theme-color" content="#1f4d2b">
<!-- Let the app open full screen when launched from the home screen (Android / iOS) -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trail Cams">
<!-- Icon iPhones use on the home screen -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- Leaflet (the map library) stylesheet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
/* ===== Styles for the whole app. Each rule has a short note saying what it controls. ===== */
/* Make padding and borders count inside an element's width so sizes are predictable */
* {
    box-sizing: border-box;
}

/* Page-wide defaults: no outer margin, Arial font, light grey background, dark text */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

/* Base look shared by every button (colors are added by the classes below) */
button {
    border: none;
    border-radius: 6px;
    padding: 9px 12px;
    cursor: pointer;
    font-size: 14px;
}

/* Form controls use the same font as the rest of the page */
input,
select,
textarea {
    font-family: Arial, sans-serif;
}

/* Green top bar holding the title and the Drive / Export / Import buttons */
header {
    background: #1f4d2b;
    color: white;
    padding: 15px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* The app title in the top bar */
header h1 {
    margin: 0;
    font-size: 22px;
}

/* Row that holds the buttons on the right side of the top bar */
.header-buttons {
    display: flex;
    gap: 8px;
}

/* White button style used inside the green top bar */
.header-button {
    background: white;
    color: #1f4d2b;
}

/* Dark green tab bar (Dashboard / Charts / Map) */
.nav {
    background: #163a20;
    display: flex;
}

/* Each tab button: transparent with white text */
.nav button {
    background: transparent;
    color: white;
    border-radius: 0;
    padding: 12px 20px;
}

/* The tab you are currently on is shown white */
.nav button.active {
    background: white;
    color: #1f4d2b;
}

/* Map page layout: sidebar on the left, map on the right */
.app {
    display: flex;
    height: calc(100vh - 105px);
}

/* The scrolling left panel on the Map page */
.sidebar {
    width: 360px;
    background: white;
    padding: 18px;
    overflow-y: auto;
    border-right: 1px solid #ddd;
}

/* The map itself fills the rest of the space */
#map {
    flex: 1;
    min-height: 400px;
}

/* Headings have no top margin */
h2,
h3 {
    margin-top: 0;
}

/* A block of the sidebar (cameras, trails, stands) with space below it */
.section {
    margin-bottom: 22px;
}

/* White rounded box used for items in the sidebar */
.card {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 13px;
    margin-bottom: 10px;
}

/* Heading inside a sidebar card */
.card h3 {
    margin-bottom: 7px;
}

/* Small grey text inside a sidebar card */
.card p {
    margin: 5px 0;
    color: #555;
    font-size: 13px;
}

/* Green action button */
.primary {
    background: #1f4d2b;
    color: white;
}

/* Red delete button */
.danger {
    background: #c0392b;
    color: white;
}

/* Grey neutral button */
.secondary {
    background: #ddd;
    color: #222;
}

/* Brown '+ Add Deer Trail' button */
.trail-button {
    width: 100%;
    background: #6b4f2a;
    color: white;
    margin-bottom: 8px;
}

/* Green 'Finish Trail' button */
.finish-button {
    width: 100%;
    background: #1f4d2b;
    color: white;
    margin-bottom: 8px;
}

/* Dark grey 'Cancel' button */
.cancel-button {
    width: 100%;
    background: #777;
    color: white;
}

/* One labelled field in a form */
.form-group {
    margin-bottom: 12px;
}

/* Bold label above a form field */
.form-group label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 5px;
}

/* Inputs, dropdowns and text areas fill the width of the form */
.form-group input,
.form-group select,
/* The notes box is taller and can be resized up and down */
.form-group textarea {
    width: 100%;
    padding: 9px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

/* The notes box is taller and can be resized up and down */
.form-group textarea {
    min-height: 75px;
    resize: vertical;
}

/* Row of buttons inside a card (Open / Delete) */
.form-buttons {
    display: flex;
    gap: 8px;
}

/* Buttons in that row share the width equally */
.form-buttons button {
    flex: 1;
}

/* One sighting in a camera's list, separated by a line */
.sighting {
    border-top: 1px solid #ddd;
    padding-top: 10px;
    margin-top: 10px;
}

/* No separator line above the first sighting */
.sighting:first-child {
    border-top: none;
}

/* Sighting title on its own line */
.sighting strong {
    display: block;
}

/* Sighting date/time in grey */
.sighting small {
    color: #666;
}

/* Yellow hint box ('Click points on the map...') */
.drawing {
    background: #fff3cd;
    border: 1px solid #ffe69c;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 10px;
    font-size: 13px;
}

/* Scrolling page area used by Dashboard and Charts */
.dashboard {
    height: calc(100vh - 105px);
    overflow-y: auto;
    padding: 25px;
}

/* Centers the page content with a maximum width */
.dashboard-inner {
    max-width: 1400px;
    margin: auto;
}

/* Space under the page title */
.dashboard-title {
    margin-bottom: 20px;
}

/* Page title */
.dashboard-title h2 {
    margin-bottom: 5px;
}

/* Grey subtitle under the page title */
.dashboard-title p {
    margin: 0;
    color: #666;
}

/* Grid of the small number boxes at the top of the dashboard */
.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

/* One number box (label, big value, detail) */

    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 18px;
}

/* Small grey label in a number box */

    color: #666;
    font-size: 13px;
}

/* Big green number in a number box */
.stat-value {
    color: #1f4d2b;
    font-size: 28px;
    font-weight: bold;
    margin-top: 8px;
}

/* Tiny grey text under the big number */
.stat-detail {
    color: #777;
    font-size: 12px;
    margin-top: 5px;
}

/* Two-column grid that holds the dashboard / chart cards */
.dashboard-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

/* White rounded card on the dashboard and charts pages */
.dashboard-card {
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 18px;
}

/* Card heading */
.dashboard-card h3 {
    margin-bottom: 18px;
}

/* A card that spans both columns */
.wide {
    grid-column: 1 / -1;
}

/* One row of a horizontal bar chart */
.bar-row {
    margin-bottom: 14px;
}

/* Label on the left, number on the right above each bar */
.bar-header {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 5px;
}

/* Grey track behind a bar */
.bar-background {
    background: #e5e5e5;
    height: 12px;
    border-radius: 10px;
    overflow: hidden;
}

/* The green filled part of a bar */
.bar {
    height: 100%;
    background: #1f4d2b;
}

/* One entry in the Recent Sightings list */
.recent-item {
    border: 1px solid #ddd;
    border-radius: 7px;
    padding: 11px;
    margin-bottom: 9px;
}

/* Entry title */
.recent-item strong {
    display: block;
    margin-bottom: 4px;
}

/* Entry date/time in grey */
.recent-item span {
    font-size: 13px;
    color: #666;
}

/* Lets the big sightings table scroll sideways on small screens */
.table-wrapper {
    overflow-x: auto;
}

/* The All Sightings table */
table {
    width: 100%;
    border-collapse: collapse;
}

/* Table cells: padding and a thin line under each row */
th,
td {
    padding: 9px;
    text-align: left;
    border-bottom: 1px solid #eee;
    font-size: 13px;
}

/* Table header text is grey */
th {
    color: #555;
}

/* Grey 'nothing here yet' message */
.empty {
    color: #777;
    font-size: 14px;
}

/* Hides the real file picker (the Import Data label is shown instead) */
.file-input {
    display: none;
}

/* Row of data buttons */
.data-buttons {
    display: flex;
    gap: 8px;
}

/* Buttons in that row share the width */
.data-buttons button {
    flex: 1;
}

/* Clickable title bar of a collapsible section (title on the left, arrow on the right) */
.collapse-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
}

/* Headings inside the collapsible title bar have no margin */
.collapse-header h2,
.collapse-header h3 {
    margin: 0;
}

/* Space between the title bar and the contents while a section is open */

    margin-bottom: 12px;
}

/* The little ▾ / ▸ arrow on the right of a collapsible title */
.collapse-arrow {
    color: #666;
    font-size: 16px;
    padding-left: 10px;
}

/* Charts scale to the width of their card */
.chart-svg {
    width: 100%;
    height: auto;
    display: block;
}

/* Row of colored squares explaining a chart */
.legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    margin-top: 10px;
    font-size: 12px;
    color: #444;
}

/* One square + name in a legend */
.legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
}

/* The colored square in a legend */
.legend-swatch {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    display: inline-block;
}

/* Camera dropdown at the top of the Charts page */
.chart-filter {
    margin-bottom: 18px;
    max-width: 320px;
}

/* Style of that dropdown */
.chart-filter select {
    width: 100%;
    padding: 9px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

/* Activity-by-hour chart: 24 touching columns sitting on a baseline */
.hour-chart {
    display: flex;
    align-items: flex-end;
    height: 150px;
    background: #f3f3f3;
    border-bottom: 1px solid #bbb;
}

/* One hour's column slot */
.hour-col {
    flex: 1;
    height: 100%;
    display: flex;
    align-items: flex-end;
}

/* The bar inside an hour slot */
.hour-bar {
    width: 100%;
    background: #1f4d2b;
}

/* Every second bar is a slightly different green so touching bars can be told apart */
.hour-col:nth-child(even) .hour-bar {
    background: #2a6a3b;
}

/* Bar lights up when you hover over it */
.hour-col:hover .hour-bar {
    background: #3f9a5b;
}

/* Row of hour labels under the chart */
.hour-labels {
    display: flex;
    margin-top: 5px;
}

/* One hour label (only every third one has text) */
.hour-label {
    flex: 1;
    font-size: 10px;
    color: #666;
    white-space: nowrap;
}

/* Tablet-size screens: fewer columns and stacked cards */
@media (max-width: 1000px) {
    /* Grid of the small number boxes at the top of the dashboard */
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    /* Two-column grid that holds the dashboard / chart cards */
    .dashboard-grid {
        grid-template-columns: 1fr;
    }

    /* A card that spans both columns */
    .wide {
        grid-column: auto;
    }
}

/* Phone-size screens: tighter spacing, sidebar goes above the map */
@media (max-width: 700px) {
    /* Green top bar holding the title and the Drive / Export / Import buttons */
    header {
        padding: 12px;
    }

    /* The app title in the top bar */
    header h1 {
        font-size: 18px;
    }

    /* small screens: .header-buttons button */
    .header-buttons button {
        font-size: 11px;
        padding: 7px;
    }

    /* Each tab button: transparent with white text */
    .nav button {
        flex: 1;
        padding: 10px;
    }

    /* Map page layout: sidebar on the left, map on the right */
    .app {
        flex-direction: column;
    }

    /* The scrolling left panel on the Map page */
    .sidebar {
        width: 100%;
        height: 370px;
        border-right: none;
        border-bottom: 1px solid #ddd;
    }

    /* The map itself fills the rest of the space */
    #map {
        height: calc(100vh - 475px);
    }

    /* Scrolling page area used by Dashboard and Charts */
    .dashboard {
        padding: 15px;
    }

    /* Grid of the small number boxes at the top of the dashboard */
    .stats {
        gap: 10px;
    }

    /* One number box (label, big value, detail) */
    .stat {
        padding: 13px;
    }

    /* Big green number in a number box */
    .stat-value {
        font-size: 22px;
    }
}
</style>

<body>

<!-- React draws the whole app (tabs, dashboard, charts, map) inside this empty div -->
<div id="root"></div>

<!-- Safety net script -->
<script>
// If the app ever crashes, show the error instead of a blank page.
window.addEventListener("error", function(event) {
    var root = document.getElementById("root");
    if (root && !root.children.length) {
        var box = document.createElement("div");
        box.style.cssText = "padding:20px;font-family:Arial,sans-serif";
        var title = document.createElement("h3");
        title.textContent = "Something went wrong";
        var detail = document.createElement("pre");
        detail.style.whiteSpace = "pre-wrap";
        detail.textContent = String(event.message || "Unknown error");
        box.appendChild(title);
        box.appendChild(detail);
        root.appendChild(box);
    }
});
</script>

<!-- Libraries, loaded from the internet (the service worker caches them for offline use) -->
<!-- React: builds the user interface -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<!-- React DOM: puts React output on the page -->
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<!-- Leaflet: the interactive map -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- leaflet.heat: draws the heat map layer -->
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<!-- Google Identity Services: the "Connect Google Drive" sign-in -->
<script src="https://accounts.google.com/gsi/client"></script>

<script>

// ===================================================================
// DEER TRAIL CAM SCORER - application code
//
// How this file is organised (top to bottom):
//   1. Small helpers: saved colors, deer directions, scoring, sunrise/sunset
//   2. Collapsible sections and the SVG chart drawing functions
//   3. Stand / layer / hour / direction helpers
//   4. Loading and saving data in this device's localStorage
//   5. Google Drive sync (sign-in and the Drive web calls)
//   6. App(): the main screen - state, map code, handlers, and the pages
// ===================================================================
//
// Shorthand names for React features used everywhere below
const e = React.createElement;  // e(tag, props, ...children) builds one piece of the page
const useState = React.useState;  // hook: a value that redraws the page when it changes
const useEffect = React.useEffect;  // hook: run code after drawing, or when chosen values change
const useRef = React.useRef;  // hook: a box that remembers a value without causing a redraw

// localStorage keys: the names this app saves its data under on your device
const CAMERA_KEY = "deerCameras";  // cameras and their sightings
const TRAIL_KEY = "deerTrails";  // deer trails
const COLORS_KEY = "deerMapColors";  // map color choices
const STAND_KEY = "deerStands";  // hunting stands
const LAYERS_KEY = "deerMapLayers";  // which map layers (trails, stands) are switched on

// Starting map colors (the Reset Colors button returns to these)
const DEFAULT_COLORS = {
    camera: "#ff0000",  // camera dot fill
    cameraOutline: "#ffffff",  // camera dot outline
    trail: "#ffff00",  // deer trail lines
    stand: "#ff9800"  // stand triangles
};

// Reads the saved map colors, falling back to the defaults for any that are missing
function getColors() {
    try {
        // Read the saved colors text and turn it into an object
        const saved = JSON.parse(localStorage.getItem(COLORS_KEY));
        // Saved colors win; anything not saved uses the default
        return { ...DEFAULT_COLORS, ...(saved || {}) };
    } catch {
        // Nothing saved (or unreadable): use the defaults
        return { ...DEFAULT_COLORS };
    }
}

// The 8 compass directions used for 'Direction of Travel' (value is stored, label/arrow are shown)
const DIRECTIONS = [
    { value: "N", label: "North", arrow: "↑" },
    { value: "NE", label: "Northeast", arrow: "↗" },
    { value: "E", label: "East", arrow: "→" },
    { value: "SE", label: "Southeast", arrow: "↘" },
    { value: "S", label: "South", arrow: "↓" },
    { value: "SW", label: "Southwest", arrow: "↙" },
    { value: "W", label: "West", arrow: "←" },
    { value: "NW", label: "Northwest", arrow: "↖" }
];

// Turns a stored direction like 'NE' into display text like '↗ Northeast'
function directionText(value) {
    // Look up the direction whose value matches
    const found = DIRECTIONS.find(function(d) {
        return d.value === value;
    });
    // Show arrow + name, or nothing if it wasn't found
    return found ? found.arrow + " " + found.label : "";
}

// ---- Camera scoring ----
// A camera's score is the sum of its sightings' weights. Each sighting is worth:
//   number of deer x deer type weight x shooting-hours multiplier x age decay
// Change the numbers below to tune it.
// Numbers that control the camera score. Edit these to tune how scoring works.
const SCORE_CONFIG = {
    halfLifeDays: 7,            // a sighting counts half as much after this many days  // a sighting counts half as much after this many days
    typeWeights: {
        "Big Buck": 8,  // points per deer for a big buck
        Buck: 4,  // points per deer for a regular buck
        Doe: 2,  // points per deer for a doe
        Fawn: 1,  // points per deer for a fawn
        Unknown: 1  // points per deer when the type is unknown
    },
    shootingMultiplier: 2,      // sightings during shooting hours  // sightings during shooting hours are multiplied by this
    otherMultiplier: 1,         // sightings outside shooting hours  // sightings outside shooting hours are multiplied by this
    shootingBufferMinutes: 30   // shooting hours = sunrise - buffer to sunset + buffer  // shooting hours start this long before sunrise and end this long after sunset
};

// Sunrise or sunset as a UTC timestamp (ms) for a calendar date and location.
// Works out sunrise or sunset for a date and location using the standard 'Almanac for Computers' method.
// Returns the moment as a UTC timestamp (milliseconds), or null if the sun never rises/sets that day.
function sunEvent(year, month0, day, lat, lng, isRise) {

    // Multiply degrees by this to get radians
    const rad = Math.PI / 180;

    // Day number of the year (Jan 1 = 1)
    const dayOfYear = Math.floor(
        (Date.UTC(year, month0, day) - Date.UTC(year, 0, 0)) / 86400000
    );

    // Longitude expressed in hours (the Earth turns 15 degrees per hour)
    const lngHour = lng / 15;
    // Approximate time of the event in days
    const t = dayOfYear + ((isRise ? 6 : 18) - lngHour) / 24;
    // The sun's mean anomaly (where it is in its orbit)
    const M = 0.9856 * t - 3.289;

    // The sun's true longitude in the sky
    let L = M +
        1.916 * Math.sin(M * rad) +
        0.020 * Math.sin(2 * M * rad) +
        282.634;

    L = ((L % 360) + 360) % 360;

    // Right ascension, then fixed to be in the same quadrant as L and converted to hours
    let RA = Math.atan(0.91764 * Math.tan(L * rad)) / rad;
    RA = ((RA % 360) + 360) % 360;
    RA += Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90;
    RA = RA / 15;

    // The sun's declination (how far north/south of the equator it is)
    const sinDec = 0.39782 * Math.sin(L * rad);
    const cosDec = Math.cos(Math.asin(sinDec));

    // Cosine of the sun's hour angle for sunrise/sunset (90.833 degrees accounts for atmosphere)
    const cosH =
        (Math.cos(90.833 * rad) - sinDec * Math.sin(lat * rad)) /
        (cosDec * Math.cos(lat * rad));

    // Sun never rises or never sets on this day at this latitude
    if (cosH > 1 || cosH < -1) return null;

    // Hour angle: use the morning side for sunrise, the evening side for sunset, then convert to hours
    let H = isRise
        ? 360 - Math.acos(cosH) / rad
        : Math.acos(cosH) / rad;

    H = H / 15;

    // Local mean time of the event, kept between 0 and 24 hours
    let T = H + RA - 0.06571 * t - 6.622;
    T = ((T % 24) + 24) % 24;

    // Convert local mean time to UTC and return it as a timestamp
    return Date.UTC(year, month0, day) + (T - lngHour) * 3600000;
}

// True if a sighting happened during shooting hours (30 min before sunrise to 30 min after sunset)
// at the camera's location on that date.
function isShootingTime(sighting, camera) {

    // Without a date and time we can't tell, so count it as outside shooting hours
    if (!sighting.date || !sighting.time) return false;

    // Split '2026-09-28' and '06:45' into numbers
    const dateParts = sighting.date.split("-").map(Number);
    const timeParts = sighting.time.split(":").map(Number);

    const y = dateParts[0];
    const m = dateParts[1] - 1;
    const d = dateParts[2];
    const hh = timeParts[0];
    const mm = timeParts[1] || 0;

    // Bad date/time text: not shooting hours
    if (![y, m, d, hh, mm].every(Number.isFinite)) return false;

    // The sighting moment (in this device's time zone)
    const when = new Date(y, m, d, hh, mm).getTime();

    // Sunrise and sunset at the camera for that date
    const rise = sunEvent(y, m, d, camera.lat, camera.lng, true);
    const set = sunEvent(y, m, d, camera.lat, camera.lng, false);

    // No sunrise/sunset that day (extreme latitudes): fall back to 6 AM - 7 PM
    if (rise === null || set === null) {
        return hh >= 6 && hh < 19;
    }

    // The 30 minute buffer, in milliseconds
    const buffer = SCORE_CONFIG.shootingBufferMinutes * 60000;

    // Inside the window if after (sunrise - buffer) and before (sunset + buffer)
    return when >= rise - buffer && when <= set + buffer;
}

// Score for ONE sighting = number of deer x type points x shooting-hours multiplier x age decay
function sightingScore(sighting, camera, now) {

    // Points per deer for this type (unknown types count as 1)
    const typeWeight =
        SCORE_CONFIG.typeWeights[sighting.deerType] !== undefined
            ? SCORE_CONFIG.typeWeights[sighting.deerType]
            : 1;

    // Bonus multiplier if it happened during shooting hours
    const timeWeight = isShootingTime(sighting, camera)
        ? SCORE_CONFIG.shootingMultiplier
        : SCORE_CONFIG.otherMultiplier;

    // How many days ago the sighting was (0 if there is no date)
    let ageDays = 0;

    if (sighting.date) {
        const when = new Date(
            sighting.date + "T" + (sighting.time || "12:00")
        ).getTime();

        if (Number.isFinite(when)) {
            ageDays = Math.max(0, (now - when) / 86400000);
        }
    }

    // Halve the value every 'halfLifeDays' days: 0.5 ^ (age / halfLife)
    const decay = Math.pow(0.5, ageDays / SCORE_CONFIG.halfLifeDays);

    // Put it all together
    return Number(sighting.number || 1) * typeWeight * timeWeight * decay;
}

// A camera's score is the sum of the scores of all of its sightings
function cameraScore(camera) {

    // Current moment, so every sighting is aged against the same time
    const now = Date.now();

    return camera.sightings.reduce(function(total, sighting) {
        return total + sightingScore(sighting, camera, now);
    }, 0);
}

// ---- Collapsible sections ----
const COLLAPSE_KEY = "deerCollapsed";  // where open/closed choices are saved

// Reads which collapsible sections the user closed last time (an object like { 'chart-daily': true })
function getCollapsedMap() {
    try {
        return JSON.parse(localStorage.getItem(COLLAPSE_KEY)) || {};
    } catch {
        return {};
    }
}

// A card or section with a clickable header that hides/shows its contents.
// props: id (remembers open/closed), title, tag (h2/h3), className, children
function Collapsible(props) {

    // The id is how this section's open/closed choice is remembered
    const id = props.id;

    // Start open, unless a saved choice says it was closed
    const [open, setOpen] = useState(function() {
        const saved = getCollapsedMap()[id];
        return saved === undefined ? props.defaultOpen !== false : !saved;
    });

    // Called when the title bar is clicked: flip open/closed and save the choice
    function toggle() {
        // The new state (opposite of the current one)
        const next = !open;
        // Redraw with the new state
        setOpen(next);
        // Load the saved choices, update this section's entry, and save them again
        const map = getCollapsedMap();
        map[id] = !next;
        localStorage.setItem(COLLAPSE_KEY, JSON.stringify(map));
    }

    return e(
        "div",
        {
            // The outer box takes whatever class the caller gave it (card, section, dashboard-card...)
            className: props.className || "",
            style: props.style
        },

        e(
            "div",
            {
                // The clickable title bar
                className: "collapse-header" + (open ? " open" : ""),
                onClick: toggle
            },
            // The title text (as an h2 or h3 heading)
            e(props.tag || "h3", null, props.title),
            // Arrow: ▾ when open, ▸ when closed
            e("span", { className: "collapse-arrow" }, open ? "▾" : "▸")
        ),

        open
            // The contents are only drawn while the section is open
            ? e("div", { className: "collapse-body" }, props.children)
            : null
    );
}

// ---- Chart helpers (all charts are drawn as inline SVG, no libraries) ----
// One color per deer type, used by all the charts
const TYPE_COLORS = {
    "Big Buck": "#7b1e1e",
    Buck: "#c0392b",
    Doe: "#2e7d32",
    Fawn: "#f9a825",
    Unknown: "#757575"
};

// The deer types in the order they are stacked and listed in charts
const CHART_TYPES = ["Big Buck", "Buck", "Doe", "Fawn", "Unknown"];
// Day names in the same order JavaScript numbers days (0 = Sunday)
const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

// Grey message shown in place of a chart that has no data yet
function chartNote(text) {
    return e("div", { className: "empty" }, text);
}

// "2026-09-28" -> a Date at noon that day (noon avoids daylight-saving edge cases)
function parseDay(dateString) {
    // Split '2026-09-28' into [2026, 9, 28]
    const p = dateString.split("-").map(Number);
    return new Date(p[0], p[1] - 1, p[2], 12, 0, 0);
}

// Turns a Date back into 'YYYY-MM-DD' text (used as a lookup key)
function dayKey(date) {
    return date.getFullYear() + "-" +
        String(date.getMonth() + 1).padStart(2, "0") + "-" +
        String(date.getDate()).padStart(2, "0");
}

// Monday of the week a date falls in
function weekStart(date) {
    const copy = new Date(date.getTime());
    // Step back to Monday (Sunday counts as the end of the week)
    copy.setDate(copy.getDate() - ((copy.getDay() + 6) % 7));
    return copy;
}

// Rounds a maximum up to a tidy number for axis labels
function niceMax(value) {
    // Small numbers just round up to a whole number
    if (value <= 5) return Math.max(1, Math.ceil(value));
    // Size of the number: 1, 10, 100...
    const power = Math.pow(10, Math.floor(Math.log10(value)));
    const n = value / power;
    // Round up to 1, 2, 5 or 10 times that size
    const nice = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
    return nice * power;
}

// Adds up the 'number of deer' across a list of sightings
function sumNumber(list) {
    return list.reduce(function(total, sighting) {
        return total + Number(sighting.number || 0);
    }, 0);
}

// Draws the colored squares + names shown under some charts
function legendRow(items) {
    return e(
        "div",
        { className: "legend" },
        items.map(function(item) {
            return e(
                "div",
                { className: "legend-item", key: item.label },
                e("span", {
                    className: "legend-swatch",
                    style: { background: item.color }
                }),
                item.label +
                (item.value !== undefined ? " (" + item.value + ")" : "")
            );
        })
    );
}

// Vertical bars. items = [{label, value, title}]
function columnChart(items, color, labelEvery) {

    // Chart size and margins: W/H = total, L/R/T/B = left/right/top/bottom space
    const W = 640, H = 220, L = 36, R = 8, T = 10, B = 26;
    const plotW = W - L - R;
    const plotH = H - T - B;

    // The tallest bar decides the scale of the y-axis
    const max = niceMax(Math.max.apply(
        null,
        items.map(function(item) { return item.value; }).concat([1])
    ));

    // Width of each bar slot
    const barW = plotW / items.length;
    const kids = [];

    // horizontal grid lines with value labels
    // Draw 5 horizontal grid lines with their value labels
    for (let g = 0; g <= 4; g++) {
        const y = T + plotH - plotH * g / 4;
        kids.push(e("line", { key: "g" + g, x1: L, x2: W - R, y1: y, y2: y, stroke: "#e3e3e3" }));
        kids.push(e("text", { key: "t" + g, x: L - 5, y: y + 3, textAnchor: "end", fontSize: 10, fill: "#666" }, Math.round(max * g / 4 * 10) / 10));
    }

    // the bars and their x labels
    // Draw one bar per item, plus its label underneath every few bars
    items.forEach(function(item, i) {

        // Bar height in proportion to its value
        const h = plotH * item.value / max;

        kids.push(e(
            "rect",
            {
                key: "b" + i,
                x: L + i * barW + 0.5,
                y: T + plotH - h,
                width: Math.max(barW - 1, 1),
                height: h,
                fill: color
            },
            e("title", null, item.title || (item.label + ": " + item.value))
        ));

        if (i % labelEvery === 0) {
            kids.push(e("text", { key: "l" + i, x: L + i * barW + barW / 2, y: H - 8, textAnchor: "middle", fontSize: 10, fill: "#666" }, item.label));
        }
    });

    // Wrap all the shapes in an SVG that scales to the card width
    return e("svg", { viewBox: "0 0 " + W + " " + H, className: "chart-svg" }, kids);
}

// Line with a filled area underneath. points = [{label, value}]
function lineChart(points, color) {

    // Chart size and margins
    const W = 640, H = 220, L = 36, R = 12, T = 10, B = 26;
    const plotW = W - L - R;
    const plotH = H - T - B;

    const max = niceMax(Math.max.apply(
        null,
        points.map(function(point) { return point.value; }).concat([1])
    ));

    // Horizontal distance between points
    const step = points.length > 1 ? plotW / (points.length - 1) : 0;

    // Turn each point into an x,y position on the chart
    const coords = points.map(function(point, i) {
        return [
            L + (points.length > 1 ? i * step : plotW / 2),
            T + plotH - plotH * point.value / max
        ];
    });

    // Text form of the line and the filled area under it (SVG 'points' format)
    const line = coords.map(function(c) { return c[0] + "," + c[1]; }).join(" ");
    const area = L + "," + (T + plotH) + " " + line + " " + coords[coords.length - 1][0] + "," + (T + plotH);

    const kids = [];

    for (let g = 0; g <= 4; g++) {
        const y = T + plotH - plotH * g / 4;
        kids.push(e("line", { key: "g" + g, x1: L, x2: W - R, y1: y, y2: y, stroke: "#e3e3e3" }));
        kids.push(e("text", { key: "t" + g, x: L - 5, y: y + 3, textAnchor: "end", fontSize: 10, fill: "#666" }, Math.round(max * g / 4 * 10) / 10));
    }

    // Soft filled area under the line, then the line itself
    kids.push(e("polygon", { key: "area", points: area, fill: color, fillOpacity: 0.15 }));
    kids.push(e("polyline", { key: "line", points: line, fill: "none", stroke: color, strokeWidth: 2.5 }));

    // label roughly five evenly spaced points along the bottom
    // Only label about five points so the labels don't overlap
    const every = Math.max(1, Math.ceil(points.length / 5));

    points.forEach(function(point, i) {
        kids.push(e("circle", { key: "p" + i, cx: coords[i][0], cy: coords[i][1], r: 3, fill: color }, e("title", null, point.label + ": " + point.value)));
        if (i % every === 0 || i === points.length - 1) {
            kids.push(e("text", { key: "l" + i, x: coords[i][0], y: H - 8, textAnchor: "middle", fontSize: 10, fill: "#666" }, point.label));
        }
    });

    return e("svg", { viewBox: "0 0 " + W + " " + H, className: "chart-svg" }, kids);
}

// Donut with a legend. items = [{label, value, color}]
function donutChart(items, centerLabel) {

    // Only slices with something in them are drawn
    const shown = items.filter(function(item) { return item.value > 0; });
    // Total used to work out each slice's share
    const total = shown.reduce(function(t, item) { return t + item.value; }, 0);

    if (!total) return chartNote("No data yet.");

    // Donut center and its outer / inner radius
    const cx = 100, cy = 100, outer = 80, inner = 50;
    // Start drawing at 12 o'clock
    let angle = -Math.PI / 2;

    // Position on the circle for an angle and a radius
    function point(a, radius) {
        return [cx + radius * Math.cos(a), cy + radius * Math.sin(a)];
    }

    // One curved slice per item, sized by its share of the total
    const slices = shown.map(function(item, idx) {

        const fraction = item.value / total;
        const tip = item.label + ": " + item.value + " (" + Math.round(fraction * 100) + "%)";

        // a single slice is a full ring (an arc can't start and end at the same point)
        // A single 100% slice is drawn as a full ring
        if (fraction >= 0.9999) {
            return e("circle", { key: idx, cx: cx, cy: cy, r: (outer + inner) / 2, fill: "none", stroke: item.color, strokeWidth: outer - inner }, e("title", null, tip));
        }

        // Where this slice ends
        const next = angle + fraction * 2 * Math.PI;
        const a = point(angle, outer);
        const b = point(next, outer);
        const c = point(next, inner);
        const d = point(angle, inner);
        // SVG needs to know if the arc is more than half a circle
        const large = fraction > 0.5 ? 1 : 0;

        // Path: outer arc, line to the inner edge, inner arc back, close
        const path =
            "M" + a[0] + " " + a[1] +
            " A" + outer + " " + outer + " 0 " + large + " 1 " + b[0] + " " + b[1] +
            " L" + c[0] + " " + c[1] +
            " A" + inner + " " + inner + " 0 " + large + " 0 " + d[0] + " " + d[1] + " Z";

        angle = next;

        return e("path", { key: idx, d: path, fill: item.color }, e("title", null, tip));
    });

    return e(
        "div",
        null,
        e(
            "svg",
            { viewBox: "0 0 200 200", className: "chart-svg", style: { maxWidth: "240px", margin: "0 auto" } },
            slices,
            e("text", { x: cx, y: cy + 5, textAnchor: "middle", fontSize: 22, fontWeight: "bold", fill: "#1f4d2b" }, total),
            e("text", { x: cx, y: cy + 22, textAnchor: "middle", fontSize: 10, fill: "#666" }, centerLabel)
        ),
        legendRow(shown.map(function(item) {
            return { label: item.label, color: item.color, value: item.value };
        }))
    );
}

// Days of the week (rows) by hour of the day (columns), darker = more deer
function hourGridChart(sightings) {

    // Grid of counts: 7 days of the week x 24 hours
    const grid = [];
    for (let d = 0; d < 7; d++) grid.push(new Array(24).fill(0));

    let any = false;

    sightings.forEach(function(sighting) {

        const hour = sightingHour(sighting);

        if (!sighting.date || hour === null) return;

        grid[parseDay(sighting.date).getDay()][hour] += Number(sighting.number || 0);
        any = true;
    });

    if (!any) return chartNote("No sightings with a date and time yet.");

    // Biggest cell decides the darkest color
    let max = 1;
    grid.forEach(function(row) { row.forEach(function(v) { if (v > max) max = v; }); });

    // Cell size and left/top space for labels
    const cell = 22, left = 34, top = 6;
    const W = left + 24 * cell + 4;
    const H = top + 7 * cell + 22;
    const kids = [];

    // Draw each day's row: its name, then 24 cells shaded by how many deer
    grid.forEach(function(row, d) {

        kids.push(e("text", { key: "d" + d, x: left - 6, y: top + d * cell + 15, textAnchor: "end", fontSize: 10, fill: "#666" }, DAY_NAMES[d]));

        row.forEach(function(value, h) {
            kids.push(e(
                "rect",
                { key: d + "-" + h, x: left + h * cell, y: top + d * cell, width: cell - 1, height: cell - 1, fill: "#1f4d2b", fillOpacity: value ? 0.12 + 0.88 * value / max : 0.04 },
                e("title", null, DAY_NAMES[d] + " " + hourLabel(h) + ": " + value + " deer")
            ));
        });
    });

    // Hour labels along the bottom, every 3 hours
    for (let h = 0; h < 24; h += 3) {
        kids.push(e("text", { key: "h" + h, x: left + h * cell + cell / 2, y: top + 7 * cell + 14, textAnchor: "middle", fontSize: 10, fill: "#666" }, hourShort(h)));
    }

    return e("svg", { viewBox: "0 0 " + W + " " + H, className: "chart-svg" }, kids);
}

// Compass rose: each wedge reaches further the more deer travelled that way
function compassChart(sightings) {

    // Deer counts per direction of travel
    const counts = {};
    let total = 0;

    sightings.forEach(function(sighting) {
        if (!DIRECTION_BEARINGS.hasOwnProperty(sighting.direction)) return;
        const n = Number(sighting.number || 1);
        counts[sighting.direction] = (counts[sighting.direction] || 0) + n;
        total += n;
    });

    if (!total) return chartNote("No sightings with a direction of travel yet.");

    // Compass center and the longest wedge length
    const cx = 130, cy = 130, maxR = 90;
    const max = Math.max.apply(null, Object.values(counts));
    const kids = [];

    // Three faint guide rings
    [1 / 3, 2 / 3, 1].forEach(function(f, i) {
        kids.push(e("circle", { key: "r" + i, cx: cx, cy: cy, r: maxR * f, fill: "none", stroke: "#e3e3e3" }));
    });

    // Screen position for a compass bearing (0 = up / north) at a distance from the center
    function at(bearing, radius) {
        const a = (bearing - 90) * Math.PI / 180;
        return [cx + radius * Math.cos(a), cy + radius * Math.sin(a)];
    }

    // One wedge per direction, longer = more deer, with its letter label
    DIRECTIONS.forEach(function(dir) {

        const bearing = DIRECTION_BEARINGS[dir.value];
        const count = counts[dir.value] || 0;
        const label = at(bearing, maxR + 16);

        if (count) {
            const r = maxR * count / max;
            const p1 = at(bearing - 20, r);
            const p2 = at(bearing + 20, r);

            kids.push(e(
                "path",
                { key: "w" + dir.value, d: "M" + cx + " " + cy + " L" + p1[0] + " " + p1[1] + " A" + r + " " + r + " 0 0 1 " + p2[0] + " " + p2[1] + " Z", fill: "#1f4d2b", fillOpacity: 0.75 },
                e("title", null, dir.label + ": " + count + " deer")
            ));
        }

        kids.push(e("text", { key: "t" + dir.value, x: label[0], y: label[1] + 4, textAnchor: "middle", fontSize: 12, fontWeight: "bold", fill: "#444" }, dir.value));
    });

    return e("svg", { viewBox: "0 0 260 260", className: "chart-svg", style: { maxWidth: "300px", margin: "0 auto" } }, kids);
}

// One horizontal stacked bar per camera, split by deer type
function cameraTypeChart(sightings, cameras) {

    // One row per camera: its deer counts split by type
    const rows = cameras.map(function(camera) {

        const mine = sightings.filter(function(s) { return s.cameraId === camera.id; });

        const parts = CHART_TYPES.map(function(type) {
            return { type: type, value: sumNumber(mine.filter(function(s) { return s.deerType === type; })) };
        });

        return { name: camera.name, parts: parts, total: sumNumber(mine) };

    }).filter(function(row) { return row.total > 0; })
      .sort(function(a, b) { return b.total - a.total; });

    if (!rows.length) return chartNote("No sightings yet.");

    // Chart width, space for camera names, and row height
    const W = 640, labelW = 130, rowH = 28;
    const max = Math.max.apply(null, rows.map(function(r) { return r.total; }));
    // Longest possible bar (leaves room for the number at the end)
    const barMax = W - labelW - 50;
    const kids = [];

    // Draw each camera: name, colored segments, then the total
    rows.forEach(function(row, i) {

        let x = labelW;
        const y = i * rowH + 4;

        kids.push(e("text", { key: "n" + i, x: labelW - 8, y: y + 15, textAnchor: "end", fontSize: 12, fill: "#444" }, row.name.length > 18 ? row.name.slice(0, 17) + "…" : row.name));

        row.parts.forEach(function(part) {

            if (!part.value) return;

            const w = barMax * part.value / max;

            kids.push(e("rect", { key: i + part.type, x: x, y: y, width: w, height: rowH - 8, fill: TYPE_COLORS[part.type] }, e("title", null, row.name + " — " + part.type + ": " + part.value)));

            x += w;
        });

        kids.push(e("text", { key: "v" + i, x: x + 6, y: y + 15, fontSize: 11, fill: "#666" }, row.total));
    });

    return e(
        "div",
        null,
        e("svg", { viewBox: "0 0 " + W + " " + (rows.length * rowH + 6), className: "chart-svg" }, kids),
        legendRow(CHART_TYPES.map(function(type) { return { label: type, color: TYPE_COLORS[type] }; }))
    );
}

// Deer per week over the last 12 weeks, stacked by type
function weeklyTypeChart(sightings) {

    const dated = sightings.filter(function(s) { return s.date; });

    if (!dated.length) return chartNote("No sightings with dates yet.");

    // The newest date with a sighting; the chart ends on that week
    const latest = dated.map(function(s) { return s.date; }).sort().pop();
    const lastWeek = weekStart(parseDay(latest));

    // Build the last 12 weeks (oldest first)
    const weeks = [];

    for (let i = 11; i >= 0; i--) {
        const d = new Date(lastWeek.getTime() - i * 7 * 86400000);
        weeks.push({ key: dayKey(d), label: (d.getMonth() + 1) + "/" + d.getDate(), counts: {} });
    }

    // Quick lookup from a week's start date to its position
    const lookup = {};
    weeks.forEach(function(w, i) { lookup[w.key] = i; });

    dated.forEach(function(s) {
        const key = dayKey(weekStart(parseDay(s.date)));
        if (!(key in lookup)) return;
        const counts = weeks[lookup[key]].counts;
        counts[s.deerType] = (counts[s.deerType] || 0) + Number(s.number || 0);
    });

    // Total deer in each week (to set the chart height)
    const totals = weeks.map(function(w) {
        return Object.values(w.counts).reduce(function(t, v) { return t + v; }, 0);
    });

    // Chart size and margins
    const W = 640, H = 220, L = 36, R = 8, T = 10, B = 26;
    const plotW = W - L - R;
    const plotH = H - T - B;
    const max = niceMax(Math.max.apply(null, totals.concat([1])));
    const barW = plotW / weeks.length;
    const kids = [];

    for (let g = 0; g <= 4; g++) {
        const y = T + plotH - plotH * g / 4;
        kids.push(e("line", { key: "g" + g, x1: L, x2: W - R, y1: y, y2: y, stroke: "#e3e3e3" }));
        kids.push(e("text", { key: "t" + g, x: L - 5, y: y + 3, textAnchor: "end", fontSize: 10, fill: "#666" }, Math.round(max * g / 4 * 10) / 10));
    }

    // Draw each week as a stack of colored blocks, one per deer type
    weeks.forEach(function(week, i) {

        let y = T + plotH;

        CHART_TYPES.forEach(function(type) {

            const value = week.counts[type] || 0;

            if (!value) return;

            const h = plotH * value / max;
            y -= h;

            kids.push(e("rect", { key: i + type, x: L + i * barW + 3, y: y, width: barW - 6, height: h, fill: TYPE_COLORS[type] }, e("title", null, "Week of " + week.label + " — " + type + ": " + value)));
        });

        kids.push(e("text", { key: "l" + i, x: L + i * barW + barW / 2, y: H - 8, textAnchor: "middle", fontSize: 10, fill: "#666" }, week.label));
    });

    return e(
        "div",
        null,
        e("svg", { viewBox: "0 0 " + W + " " + H, className: "chart-svg" }, kids),
        legendRow(CHART_TYPES.map(function(type) { return { label: type, color: TYPE_COLORS[type] }; }))
    );
}

// Sightings per day over the 30 days ending at the latest sighting
function dailyChart(sightings) {

    const dated = sightings.filter(function(s) { return s.date; });

    if (!dated.length) return chartNote("No sightings with dates yet.");

    // The newest date with a sighting; the chart covers the 30 days ending there
    const end = parseDay(dated.map(function(s) { return s.date; }).sort().pop());
    // One entry per day, oldest first, starting at zero
    const days = [];

    for (let i = 29; i >= 0; i--) {
        const d = new Date(end.getTime() - i * 86400000);
        days.push({ key: dayKey(d), label: (d.getMonth() + 1) + "/" + d.getDate(), value: 0 });
    }

    const lookup = {};
    days.forEach(function(d, i) { lookup[d.key] = i; });

    dated.forEach(function(s) {
        if (s.date in lookup) days[lookup[s.date]].value += Number(s.number || 0);
    });

    return columnChart(
        days.map(function(d) { return { label: d.label, value: d.value, title: d.label + ": " + d.value + " deer" }; }),
        "#1f4d2b",
        5
    );
}

// Running total of deer seen, day by day
function cumulativeChart(sightings) {

    // Deer seen on each date
    const totals = {};

    sightings.forEach(function(s) {
        if (!s.date) return;
        totals[s.date] = (totals[s.date] || 0) + Number(s.number || 0);
    });

    // Dates in order (YYYY-MM-DD sorts correctly as text)
    const dates = Object.keys(totals).sort();

    if (!dates.length) return chartNote("No sightings with dates yet.");

    // Running total that grows each day
    let running = 0;

    return lineChart(
        dates.map(function(date) {
            running += totals[date];
            const d = parseDay(date);
            return { label: (d.getMonth() + 1) + "/" + d.getDate(), value: running };
        }),
        "#2a6a3b"
    );
}

// How many bucks had each number of antler points
function antlerChart(sightings) {

    // One counter per antler point count: 1 to 15, and 16 or more
    const bins = new Array(16).fill(0);
    let any = false;

    sightings.forEach(function(s) {

        if (!isBuckType(s.deerType) || !s.antlerPoints) return;

        // Add this sighting's deer to its antler-point bin (16+ share the last bin)
        bins[Math.min(Number(s.antlerPoints), 16) - 1] += Number(s.number || 1);
        any = true;
    });

    if (!any) return chartNote("No bucks with antler points recorded yet.");

    return columnChart(
        bins.map(function(count, i) {
            const label = i === 15 ? "16+" : String(i + 1);
            return { label: label, value: count, title: label + " points: " + count };
        }),
        "#c0392b",
        1
    );
}

// Does a deer type pass the heat map's filter? ('Buck' also includes big bucks)

// Cleans a list of stands (from storage, Drive or a backup): fills in missing values and drops broken ones

// 0-23 -> '12 AM', '9 AM', '12 PM', '5 PM'

// 0-23 -> short label like '9a' or '5p' (used on small chart axes)

// The hour (0-23) of a sighting's time, or null if it has none
function sightingHour(sighting) {

    return Number.isFinite(hour) && hour >= 0 && hour < 24
        ? hour
        : null;

// Compass bearing in degrees for each direction (0 = north, 90 = east...)
const DIRECTION_BEARINGS = {
    N: 0, NE: 45, E: 90, SE: 135,
    S: 180, SW: 225, W: 270, NW: 315
};

// Average travel direction (degrees, 0 = north) weighted by number of deer.
// Returns null if there are no directions, or they cancel each other out.
// Average direction the deer travel past a camera, weighted by number of deer.
// Uses vector math so that, for example, NW and NE average out to N.
// Returns degrees (0 = north) or null when there is no data or the directions cancel out.
function averageBearing(camera) {

    // Running east-west total
    let x = 0;
    // Running north-south total
    let y = 0;
    // Total deer that had a direction
    let total = 0;

    camera.sightings.forEach(function(sighting) {

        // Degrees for this sighting's direction
        const bearing = DIRECTION_BEARINGS[sighting.direction];

        // Skip sightings with no direction
        if (bearing === undefined) return;

        // More deer = more influence on the average
        const weight = Number(sighting.number || 1);

        // Add this sighting's east-west part
        x += weight * Math.sin(bearing * Math.PI / 180);
        // Add this sighting's north-south part
        y += weight * Math.cos(bearing * Math.PI / 180);
        total += weight;
    });

    // No directions recorded
    if (!total) return null;

    // Directions mostly cancel each other, so there is no real 'average' to show
    if (Math.hypot(x, y) / total < 0.15) return null;

    // Convert the combined vector back into a compass bearing between 0 and 360
    return (Math.atan2(x, y) * 180 / Math.PI + 360) % 360;
}

// Nearest of the 8 compass directions for a bearing in degrees
function bearingDirection(bearing) {
    return DIRECTIONS[Math.round(bearing / 45) % 8];
}

// The arrow drawn beside a camera, rotated to point the way the deer travel
function arrowIcon(bearing, colors) {

    // SVG picture of the arrow, rotated by the bearing
    const html =
        '<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">' +
        '<g transform="rotate(' + bearing + ' 30 30)">' +
        '<path d="M30 3 L38 15 L33 15 L33 21 L27 21 L27 15 L22 15 Z" ' +
        'fill="' + colors.camera + '" stroke="' + colors.cameraOutline + '" ' +
        'stroke-width="1.5" stroke-linejoin="round"/>' +
        '</g></svg>';

    return L.divIcon({
        html: html,
        className: "",
        iconSize: [60, 60],
        iconAnchor: [30, 30]
    });
}

// ---- Google Drive sync ----
// 1. Create a free Google Cloud project, enable the "Google Drive API",
//    set up an OAuth consent screen (External, Testing mode is fine),
//    add yourself as a test user, and create an OAuth Client ID
//    (Application type: Web application) with this site's URL added
//    under "Authorized JavaScript origins".
// 2. Paste that Client ID below.
// Your Google OAuth Client ID goes here (or enter it with the gear button in the header)
const GOOGLE_CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID_HERE.apps.googleusercontent.com";

// Permission we ask Google for: a private app-data area in your Drive (not visible in your normal Drive files)
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.appdata";
// Name of the backup file stored in that private area
const DRIVE_FILE_NAME = "deer-trail-cam-data.json";
const LAST_MODIFIED_KEY = "deerLastModified";  // when data was last edited on this device
const CLIENT_ID_KEY = "deerGoogleClientId";  // a Client ID typed into the app
const SYNCED_AT_KEY = "deerSyncedAt";  // when this device last finished a sync
const SYNCED_REMOTE_KEY = "deerSyncedRemote";  // the Drive file's modified time at that last sync
const WAS_CONNECTED_KEY = "deerDriveWasConnected";  // remembers you connected before, to show 'Not syncing' after a reload

// Time (on this device) of the last successful sync, 0 if never
function getSyncedAt() {
    return Number(localStorage.getItem(SYNCED_AT_KEY)) || 0;
}

// A Client ID typed into the app (gear button) wins over the one pasted above.
// Use the Client ID typed into the app if there is one, otherwise the one in this file
function getClientId() {
    return localStorage.getItem(CLIENT_ID_KEY) || GOOGLE_CLIENT_ID;
}

// Quick format check: digits, a dash, letters/digits, then .apps.googleusercontent.com
function clientIdLooksValid(id) {
    return /^\d+-[\w-]+\.apps\.googleusercontent\.com$/.test(id || "");
}

// Google sign-in helper object (created once Google's script has loaded)
let driveTokenClient = null;
// Temporary pass from Google; it is only kept in memory, so it is gone after a reload
let driveAccessToken = null;
// Id of our backup file in Drive once we have found or created it
let driveFileId = null;

// Time of the last edit made on this device
function getLastModified() {
    return Number(localStorage.getItem(LAST_MODIFIED_KEY)) || 0;
}

// Record that the data was just edited on this device
function setLastModified(timestamp) {
    localStorage.setItem(LAST_MODIFIED_KEY, String(timestamp));
}

// Sets up Google sign-in. Returns false if Google's script hasn't loaded yet.
function initDriveTokenClient(callback, errorCallback) {

    // Google's sign-in script isn't ready yet
    if (!window.google || !window.google.accounts) {
        return false;
    }

    driveTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: getClientId(),
        scope: DRIVE_SCOPE,
        callback: callback,
        error_callback: errorCallback
    });

    return true;
}

// Opens Google's sign-in / permission popup and calls 'callback' with the result
function requestDriveAccess(callback) {

    if (!driveTokenClient) return;

    driveTokenClient.callback = function(response) {

        if (response && response.access_token) {
            driveAccessToken = response.access_token;
        }

        callback(response);
    };

    driveTokenClient.requestAccessToken({
        prompt: ""
    });
}

// Tells Google to cancel our pass and forgets it
function driveSignOut() {

    if (driveAccessToken && window.google) {
        google.accounts.oauth2.revoke(driveAccessToken, function() {});
    }

    driveAccessToken = null;
    driveFileId = null;
}

// Builds a readable Error from a failed Drive reply (status number plus Google's own message)
async function driveFail(response, what) {

    // Try to read Google's explanation from the reply
    let detail = "";

    try {
        const body = await response.json();

        if (body && body.error && body.error.message) {
            detail = body.error.message;
        }
    } catch (error) {}

    let message = what + " (" + response.status + ")";

    if (detail) {
        message += ": " + detail;
    }

    // 403 usually means the Drive API isn't switched on in Google Cloud, or permission wasn't granted
    if (response.status === 403) {
        message += " — make sure the Google Drive API is enabled in your Google Cloud project and that you allowed access to the app's Drive data.";
    }

    const error = new Error(message);
    error.status = response.status;

    return error;
}

// Looks in the private app-data area for our backup file; returns it (id + modified time) or null
async function driveFindFile() {

    // Search for a file with our name that isn't in the trash
    const query = "name='" + DRIVE_FILE_NAME + "' and trashed=false";

    const url =
        "https://www.googleapis.com/drive/v3/files" +
        "?spaces=appDataFolder" +
        "&fields=" + encodeURIComponent("files(id,modifiedTime)") +
        "&q=" + encodeURIComponent(query);

    const response = await fetch(url, {
        headers: {
            Authorization: "Bearer " + driveAccessToken
        }
    });

    if (!response.ok) {
        throw await driveFail(response, "Drive lookup failed");
    }

    const data = await response.json();

    if (data.files && data.files.length) {
        return data.files[0];
    }

    return null;
}

// Downloads the backup file and returns its contents as data
async function driveDownload(fileId) {

    const response = await fetch(
        "https://www.googleapis.com/drive/v3/files/" +
        fileId +
        "?alt=media",
        {
            headers: {
                Authorization: "Bearer " + driveAccessToken
            }
        }
    );

    if (!response.ok) {
        throw await driveFail(response, "Drive download failed");
    }

    return response.json();
}

// Uploads data to Drive: creates the file if there is no fileId, otherwise replaces the existing file
async function driveUpload(fileId, dataObj) {

    // File details sent along with the data
    const metadata = {
        name: DRIVE_FILE_NAME,
        mimeType: "application/json"
    };

    // New files are created inside the private app-data folder
    if (!fileId) {
        metadata.parents = ["appDataFolder"];
    }

    // Drive expects 'multipart' uploads: details and data separated by a marker line
    const boundary = "deercamboundary";

    // Build the multipart body: details part, then data part
    const body =
        "--" + boundary + "\r\n" +
        "Content-Type: application/json; charset=UTF-8\r\n\r\n" +
        JSON.stringify(metadata) + "\r\n" +
        "--" + boundary + "\r\n" +
        "Content-Type: application/json\r\n\r\n" +
        JSON.stringify(dataObj) + "\r\n" +
        "--" + boundary + "--";

    // PATCH (update) the existing file, or POST (create) a new one; ask Drive to send back id + modified time
    const url = fileId
        ? "https://www.googleapis.com/upload/drive/v3/files/" +
          fileId +
          "?uploadType=multipart&fields=id%2CmodifiedTime"
        : "https://www.googleapis.com/upload/drive/v3/files" +
          "?uploadType=multipart&fields=id%2CmodifiedTime";

    const response = await fetch(url, {
        method: fileId ? "PATCH" : "POST",
        headers: {
            Authorization: "Bearer " + driveAccessToken,
            "Content-Type": "multipart/related; boundary=" + boundary
        },
        body: body
    });

    if (!response.ok) {
        throw await driveFail(response, "Drive upload failed");
    }

    return response.json();
}

// ==================== App: the whole application screen ====================

    const [heatOn, setHeatOn] = useState(false);  // heat map switched on?

    const [heatRadius, setHeatRadius] = useState(90);  // how wide each heat blotch is (bigger = blotches join up sooner)
    const [chartCamera, setChartCamera] = useState("all");  // Charts page camera filter ('all' or a camera id)
    const [timelapseOn, setTimelapseOn] = useState(false);  // heat map timelapse mode on?
    const [timelapseHour, setTimelapseHour] = useState(5);  // hour of the day (0-23) the timelapse is showing
    const [timelapsePlaying, setTimelapsePlaying] = useState(false);  // is the timelapse animating?
    const [mapVersion, setMapVersion] = useState(0);  // goes up each time the map is rebuilt so dependent effects redraw

    const [movingCameraId, setMovingCameraId] = useState(null);  // camera waiting to be placed at a new spot (Move Marker)

    const [stands, setStands] = useState(getStands);  // all hunting stands
    const [selectedStandId, setSelectedStandId] = useState(null);  // stand whose details are open
    const [standDraft, setStandDraft] = useState(null);  // the name/type being entered while adding a stand
    const [movingStandId, setMovingStandId] = useState(null);  // stand waiting to be placed at a new spot

    const [showTrails, setShowTrails] = useState(function() {  // show deer trails on the map?
        return getLayers().trails;
    });
    const [showStands, setShowStands] = useState(function() {  // show stands on the map?
        return getLayers().stands;
    });

    const [signedIn, setSignedIn] = useState(false);  // connected to Google Drive right now?
    const [syncStatus, setSyncStatus] = useState("");  // '', syncing, synced or error
    const [syncError, setSyncError] = useState("");  // the readable explanation shown when you tap a sync error

    // ---- Refs ----
    // Refs hold things that must survive redraws without causing one: the map and its markers/layers,
    // plus 'current' copies of state that the map's click handlers need (they were created once and can't see new state).
    const mapRef = useRef(null);  // the Leaflet map object
    const cameraMarkersRef = useRef({});  // camera id -> its dot on the map
    const trailLayersRef = useRef([]);  // the saved trail lines on the map
    const currentTrailLayerRef = useRef(null);  // the trail line being drawn
    const drawingTrailRef = useRef(false);  // copy of drawingTrail for the map click handler
    const movingCameraRef = useRef(null);  // copy of movingCameraId for map click handlers
    const movingStandRef = useRef(null);  // copy of movingStandId for map click handlers
    const standMarkersRef = useRef({});  // stand id -> its triangle on the map
    const standDraftRef = useRef(null);  // copy of standDraft for the map click handler
    const showTrailsRef = useRef(true);  // copy of showTrails for drawing trails
    const showStandsRef = useRef(true);  // copy of showStands
    const heatLayerRef = useRef(null);  // the heat map layer
    const arrowMarkersRef = useRef({});  // camera id -> its direction arrow
    const colorsRef = useRef(colors);  // copy of the colors for code that runs outside a redraw
    colorsRef.current = colors;
    // Keep the ref copies up to date on every redraw
    standDraftRef.current = standDraft;
    showTrailsRef.current = showTrails;
    showStandsRef.current = showStands;

    const driveSyncTimeoutRef = useRef(null);  // timer that waits 2 seconds after an edit before syncing
    const suppressNextPushRef = useRef(false);  // set when data was just downloaded so it isn't uploaded straight back
    const signedInRef = useRef(false);  // copy of signedIn for timers
    const firstSaveRef = useRef(true);  // lets the very first save (on page load) skip the 'edited' stamp
    const syncBusyRef = useRef(false);  // true while a sync is running
    const syncFnRef = useRef(null);  // always points at the newest syncFromDrive
    syncFnRef.current = syncFromDrive;

    // Keep signedInRef in step with signedIn
    useEffect(function() {
        signedInRef.current = signedIn;
    }, [signedIn]);

    // After data is downloaded, redraw the camera dots and trail lines on the map so they match
    function refreshMapLayers(newCameras, newTrails) {

        if (!mapRef.current) return;

        Object.values(cameraMarkersRef.current).forEach(function(marker) {
            try {
                mapRef.current.removeLayer(marker);
            } catch (error) {}
        });

        cameraMarkersRef.current = {};

        redrawAllTrails([]);

        newCameras.forEach(function(camera) {
            addCameraMarker(camera);
        });

        newTrails.forEach(function(trail) {
            drawSavedTrail(trail);
        });
    }

    // Remember when (and against which Drive version) this device last synced
    function markSynced(timestamp, remoteModified) {
        localStorage.setItem(SYNCED_AT_KEY, String(timestamp));
        localStorage.setItem(SYNCED_REMOTE_KEY, remoteModified || "");
    }

    // Show a sync problem in the header; a 401 means the Google pass expired so we sign out
    function reportDriveError(error) {

        setSyncStatus("error");

        if (error && error.status === 401) {

            driveAccessToken = null;
            setSignedIn(false);

            setSyncError(
                "Your Google session expired. Tap Connect Google Drive to reconnect. Changes on this device are saved and will upload then."
            );

            return;
        }

        setSyncError(
            (error && error.message) ||
            "Something went wrong talking to Google Drive."
        );
    }

    // UPLOAD: send this device's cameras, trails and stands to the Drive backup file
    async function pushToDrive() {

        setSyncStatus("syncing");

        const timestamp = Date.now();

        // What gets saved in the backup file
        const payload = {
            app: "Deer Trail Cam Scorer",
            version: 1,
            lastModified: timestamp,
            cameras: getCameras(),
            trails: getTrails(),
            stands: getStands()
        };

        const result = await driveUpload(
            driveFileId,
            payload
        );

        if (result && result.id) {
            driveFileId = result.id;
        }

        markSynced(timestamp, result && result.modifiedTime);
    }

    // DOWNLOAD: replace this device's data with the copy stored in Drive
    async function pullFromDrive(file) {

        const driveData = await driveDownload(file.id);

        if (
            !driveData ||
            !Array.isArray(driveData.cameras) ||
            !Array.isArray(driveData.trails)
        ) {
            throw new Error(
                "The file in Google Drive isn't valid Deer Trail Cam data."
            );
        }

        // Clean up the downloaded cameras the same way saved ones are cleaned
        const pulledCameras = driveData.cameras.map(function(camera) {
            return {
                id: camera.id || Date.now(),
                name: camera.name || "Camera",
                lat: Number(camera.lat),
                lng: Number(camera.lng),
                sightings: Array.isArray(camera.sightings)
                    ? camera.sightings
                    : []
            };
        }).filter(function(camera) {
            return Number.isFinite(camera.lat) &&
                   Number.isFinite(camera.lng);
        });

        // Tell the save effect not to treat this download as a new edit (otherwise it would upload it again)
        suppressNextPushRef.current = true;

        setCameras(pulledCameras);
        setTrails(driveData.trails);

        if (Array.isArray(driveData.stands)) {
            setStands(
                sanitizeStands(driveData.stands) || []
            );
        }

        refreshMapLayers(pulledCameras, driveData.trails);

        markSynced(Date.now(), file.modifiedTime);
    }

    // SYNC (the heart of Drive sync). Decides whether to upload, download, ask you, or do nothing:
    //   - no backup in Drive yet                          -> upload
    //   - this device has no data                         -> download
    //   - Drive unchanged since last sync                 -> upload only if you edited here
    //   - Drive changed and you did NOT edit here         -> download
    //   - Drive changed AND you edited here (or first sync with data on both) -> ask which to keep
    async function syncFromDrive() {

        // Don't run two syncs at once, and do nothing when not signed in
        if (syncBusyRef.current || !driveAccessToken) return;

        syncBusyRef.current = true;

        setSyncStatus("syncing");

        try {

            // Is there already a backup file in Drive?
            const file = await driveFindFile();

            // No backup yet: upload this device's data to create it
            if (!file) {

                await pushToDrive();

            } else {

                driveFileId = file.id;

                // Does this device have anything saved?
                const localHasData =
                    getCameras().length > 0 ||
                    getTrails().length > 0 ||
                    getStands().length > 0;

                // The Drive file version this device saw at its last sync
                const lastRemote =
                    localStorage.getItem(SYNCED_REMOTE_KEY) || "";

                // Has Drive changed since then (another device uploaded)?
                const remoteChanged = lastRemote !== file.modifiedTime;

                // Have you edited on this device since the last sync?
                const dirty = getLastModified() > getSyncedAt();

                // Nothing here to lose: just download
                if (!localHasData) {

                    await pullFromDrive(file);

                // Drive is as we left it: upload only if we have new edits
                } else if (!remoteChanged) {

                    if (dirty) {
                        await pushToDrive();
                    }

                // Drive has newer data and we have no unsynced edits: safe to download
                } else if (!dirty && lastRemote) {

                    await pullFromDrive(file);

                } else {

                    // Both sides have changes: let the user choose which copy wins
                    const useCloud = confirm(
                        "Google Drive already has saved data (from another device or an earlier sync).\n\n" +
                        "OK = load the cloud data here (replaces what's on this device).\n" +
                        "Cancel = keep this device's data and overwrite the cloud."
                    );

                    if (useCloud) {
                        await pullFromDrive(file);
                    } else {
                        await pushToDrive();
                    }
                }
            }

            setSyncStatus("synced");
            setSyncError("");

        } catch (error) {

            reportDriveError(error);

        } finally {

            syncBusyRef.current = false;
        }
    }

    // Runs when Google's sign-in popup finishes
    function handleDriveAuthResponse(response) {

        // Google reported a problem
        if (response && response.error) {

            setSyncStatus("error");

            setSyncError(
                "Google sign-in failed: " +
                (response.error_description || response.error)
            );

            return;
        }

        // Signed in: we got a pass (token)
        if (response && response.access_token) {

            if (
                window.google &&
                // The permission box for Drive access was left unticked on Google's screen
                !google.accounts.oauth2.hasGrantedAllScopes(
                    response,
                    DRIVE_SCOPE
                )
            ) {

                driveAccessToken = null;

                setSyncStatus("error");

                setSyncError(
                    "Drive access wasn't granted. When Google asks, tick the box that lets this app store its data in your Google Drive, then try again."
                );

                return;
            }

            // Connected OK: remember it, show 'Synced', and run a first sync
            localStorage.setItem(WAS_CONNECTED_KEY, "1");

            setSignedIn(true);
            setSyncError("");
            syncFromDrive();
        }
    }

    // Runs when the popup was closed or blocked before finishing
    function handleDriveTokenError(error) {

        setSyncStatus("error");

        setSyncError(
            error && error.type === "popup_closed"
                ? "The Google sign-in window was closed before it finished."
                : error && error.type === "popup_failed_to_open"
                    ? "Your browser blocked the Google sign-in popup. Allow popups for this site and try again."
                    : "Google sign-in failed."
        );
    }

    // Asks you to paste your Google Client ID (used by the gear button, or automatically if none is set)
    function askForClientId() {

        const current = getClientId();

        const value = prompt(
            "Paste your Google OAuth Client ID (from Google Cloud Console > Credentials). It ends in .apps.googleusercontent.com",
            clientIdLooksValid(current) ? current : ""
        );

        if (!value) return false;

        const id = value.trim();

        if (!clientIdLooksValid(id)) {
            alert("That doesn't look like a Client ID. It should look like 123456789012-abc123.apps.googleusercontent.com");
            return false;
        }

        localStorage.setItem(CLIENT_ID_KEY, id);
        initDriveTokenClient(handleDriveAuthResponse, handleDriveTokenError);

        return true;
    }

    // Connect button: make sure a Client ID exists, then open Google's sign-in
    function signInToDrive() {

        if (!clientIdLooksValid(getClientId())) {
            if (!askForClientId()) return;
        }

        requestDriveAccess(handleDriveAuthResponse);
    }

    // Disconnect button: forget the Google pass (your data stays on this device)
    function signOutOfDrive() {
        driveSignOut();
        localStorage.removeItem(WAS_CONNECTED_KEY);
        setSignedIn(false);
        setSyncStatus("");
        setSyncError("");
    }

    // Wait for Google's sign-in script to load, then set up the sign-in client (checks every 0.2 s)
    useEffect(function() {

        const interval = setInterval(function() {

            if (initDriveTokenClient(handleDriveAuthResponse, handleDriveTokenError)) {
                clearInterval(interval);
            }

        }, 200);

        return function() {
            clearInterval(interval);
        };

    }, []);

    // SAVE + SYNC: whenever cameras, trails or stands change, save them on this device,
    // stamp the edit time, and (if connected to Drive) sync 2 seconds later
    useEffect(function() {

        saveData(cameras, trails, stands);

        if (firstSaveRef.current) {
            firstSaveRef.current = false;
            return;
        }

        if (suppressNextPushRef.current) {
            suppressNextPushRef.current = false;
            return;
        }

        setLastModified(Date.now());

        if (signedInRef.current) {

            if (driveSyncTimeoutRef.current) {
                clearTimeout(driveSyncTimeoutRef.current);
            }

            driveSyncTimeoutRef.current = setTimeout(function() {

        }

    }, [cameras, trails, stands]);

    // Check Drive again when you return to the app and once a minute while connected
    useEffect(function() {

        function trySync() {

            if (
                signedInRef.current &&
                document.visibilityState === "visible"
            ) {
                syncFnRef.current();
            }
        }

        const interval = setInterval(trySync, 60000);

        document.addEventListener("visibilitychange", trySync);

        return function() {
            clearInterval(interval);
            document.removeEventListener("visibilitychange", trySync);
        };

    }, []);

    const selectedCamera = cameras.find(function(camera) {
        return camera.id === selectedCameraId;

    const selectedStand = stands.find(function(stand) {

    // Finishes 'Move Marker': puts the waiting camera at the tapped spot. Returns false if no camera was waiting.
    function placeMovingCamera(latlng) {

        const id = movingCameraRef.current;

        if (!id) return false;

        setCameras(function(previous) {
            return previous.map(function(camera) {
                if (camera.id !== id) return camera;
                return {
                    ...camera,
                    lat: latlng.lat,
                    lng: latlng.lng
                };
            });
        });

        const marker = cameraMarkersRef.current[id];

        if (marker) {
            marker.setLatLng(latlng);
        }

        movingCameraRef.current = null;
        setMovingCameraId(null);

        return true;
    }

    // Start 'Move Marker': remember which camera to move, then the next map tap places it
    function startMoveCamera(id) {

        setMovingStandId(null);
        movingCameraRef.current = id;
        setMovingCameraId(id);
    }

    // Stop any move in progress (camera or stand)
    function cancelMove() {

        setMovingCameraId(null);
