    const [stands, setStands] = useState(getStands);  // all hunting stands
    const [selectedStandId, setSelectedStandId] = useState(null);  // stand whose details are open
    const [standDraft, setStandDraft] = useState(null);  // the name/type being entered while adding a stand
    const [movingStandId, setMovingStandId] = useState(null);  // stand waiting to be placed at a new spot

    const [showTrails, setShowTrails] = useState(function() {  // show deer trails on the map?
        return getLayers().trails;
    });
    const [showStands, setShowStands] = useState(function() {  // show stands on the map?
        return getLayers().stands;
    });

    const [signedIn, setSignedIn] = useState(false);  // connected to Google Drive right now?
    const [syncStatus, setSyncStatus] = useState("");  // '', syncing, synced or error
    const [syncError, setSyncError] = useState("");  // the readable explanation shown when you tap a sync error

    // ---- Refs ----
    // Refs hold things that must survive redraws without causing one: the map and its markers/layers,
    // plus 'current' copies of state that the map's click handlers need (they were created once and can't see new state).
    const mapRef = useRef(null);  // the Leaflet map object
    const cameraMarkersRef = useRef({});  // camera id -> its dot on the map
    const trailLayersRef = useRef([]);  // the saved trail lines on the map
    const currentTrailLayerRef = useRef(null);  // the trail line being drawn
    const drawingTrailRef = useRef(false);  // copy of drawingTrail for the map click handler
    const movingCameraRef = useRef(null);  // copy of movingCameraId for map click handlers
    const movingStandRef = useRef(null);  // copy of movingStandId for map click handlers
    const standMarkersRef = useRef({});  // stand id -> its triangle on the map
    const standDraftRef = useRef(null);  // copy of standDraft for the map click handler
    const featureDraftRef = useRef(null);  // copy of featureDraft for map click handlers
    const trailsRef = useRef([]);  // newest trails for the map click handler
    const entryDraftRef = useRef(null);  // copy of entryDraft for the map click handler
    const readOnlyRef = useRef(false);  // true while a shared snapshot is open: nothing is saved or synced
    const entryLayerRef = useRef(null);  // the walk-in line drawn on the map
    const alertDataRef = useRef(null);  // newest data for the alert checker
    const showTrailsRef = useRef(true);  // copy of showTrails for drawing trails
    const showStandsRef = useRef(true);  // copy of showStands
    const heatLayerRef = useRef(null);  // the heat map layer
    const trailHeatRef = useRef(null);  // the coloured 'trail heat' segments
    const arrowMarkersRef = useRef({});  // camera id -> its direction arrow
    const facingLayersRef = useRef({});  // camera id -> the wedge showing which way it points
    const colorsRef = useRef(colors);  // copy of the colors for code that runs outside a redraw
    colorsRef.current = colors;
    // Keep the ref copies up to date on every redraw
    standDraftRef.current = standDraft;
    featureDraftRef.current = featureDraft;
    entryDraftRef.current = entryDraft;
    trailsRef.current = trails;
    alertDataRef.current = { cameras: cameras, stands: stands, trails: trails, forecast: forecast, bucks: bucks };
    showTrailsRef.current = showTrails;
    showStandsRef.current = showStands;

    const featureMarkersRef = useRef({});  // the map markers for features
    const scentLayerRef = useRef(null);  // the scent cone drawn on the map
    const tileCancelRef = useRef(false);  // set to true to stop the offline map download
    const weatherBusyRef = useRef(false);  // true while weather is being added to sightings
    const weatherTriedRef = useRef({});  // sightings we already tried this session (so failures don't loop)
    const driveSyncTimeoutRef = useRef(null);  // timer that waits 2 seconds after an edit before syncing
    const suppressNextPushRef = useRef(false);  // set when data was just downloaded so it isn't uploaded straight back
    const signedInRef = useRef(false);  // copy of signedIn for timers
    const firstSaveRef = useRef(true);  // lets the very first save (on page load) skip the 'edited' stamp
    const syncBusyRef = useRef(false);  // true while a sync is running
    const syncFnRef = useRef(null);  // always points at the newest syncFromDrive
    syncFnRef.current = syncFromDrive;

    // Keep signedInRef in step with signedIn
    useEffect(function() {
        signedInRef.current = signedIn;
    }, [signedIn]);

    // Applies colours / scoring numbers / reminder settings that came from Drive or a backup file
    function applySettingsBundleFromData(settings) {

        if (!settings || typeof settings !== "object") return;

        if (settings.theme && typeof settings.theme === "object") {
            setTheme({ ...THEME_PRESETS["Forest green"], ...settings.theme });
        }

        if (settings.maintenance && typeof settings.maintenance === "object") {
            setMaintenance({ ...MAINT_DEFAULT, ...settings.maintenance });
        }

        // the AI key from your Drive copy (only replaces this device's key if Drive has one)
        if (settings.ai && typeof settings.ai.key === "string" && settings.ai.key) {
            try { localStorage.setItem(AI_KEY_STORAGE, settings.ai.key); } catch (error) {}
            setAiKey(settings.ai.key);
        }

        if (settings.scoring && settings.scoring.v === SCORING_DEFAULTS_VERSION) {
            applyScoringSettings(settings.scoring);
            saveScoringSettings();
            setSettingsReset(function(n) { return n + 1; });
            setSettingsVersion(function(n) { return n + 1; });
        }
    }

    // After data is downloaded, redraw the camera dots and trail lines on the map so they match
    function refreshMapLayers(newCameras, newTrails) {

        if (!mapRef.current) return;

        Object.values(cameraMarkersRef.current).forEach(function(marker) {
            try {
                mapRef.current.removeLayer(marker);
            } catch (error) {}
        });

        cameraMarkersRef.current = {};

        redrawAllTrails([]);

        newCameras.forEach(function(camera) {
            addCameraMarker(camera);
        });

        newTrails.forEach(function(trail) {
            drawSavedTrail(trail);
        });
    }

    // Remember when (and against which Drive version) this device last synced
    function markSynced(timestamp, remoteModified) {
        localStorage.setItem(SYNCED_AT_KEY, String(timestamp));
        localStorage.setItem(SYNCED_REMOTE_KEY, remoteModified || "");
    }

    // Show a sync problem in the header; a 401 means the Google pass expired so we sign out
    function reportDriveError(error) {

        setSyncStatus("error");

        if (error && error.status === 401) {

            driveAccessToken = null;
            setSignedIn(false);

            setSyncError(
                "Your Google session expired. Tap Connect Google Drive to reconnect. Changes on this device are saved and will upload then."
            );

            return;
        }

        setSyncError(
            (error && error.message) ||
            "Something went wrong talking to Google Drive."
        );
    }

    // UPLOAD: send this device's cameras, trails and stands to the Drive backup file
    async function pushToDrive() {

        setSyncStatus("syncing");

        const timestamp = Date.now();

        // What gets saved in the backup file
        const payload = {
            app: "Deer Trail Cam Scorer",
            version: 1,
            lastModified: timestamp,
            cameras: getCameras(),
            trails: getTrails(),
            stands: getStands(),
            bucks: getBucks(),
            hunts: getHunts(),
            features: getFeatures(),
            // colours, scoring numbers and reminder settings travel with the data so every device matches
            settings: getSettingsBundle(getTheme(), getMaintenance(), true)
        };

        const result = await driveUpload(
            driveFileId,
            payload
        );

        if (result && result.id) {
            driveFileId = result.id;
        }

        markSynced(timestamp, result && result.modifiedTime);
    }

    // DOWNLOAD: replace this device's data with the copy stored in Drive
    async function pullFromDrive(file) {

        const driveData = await driveDownload(file.id);

        if (
            !driveData ||
            !Array.isArray(driveData.cameras) ||
            !Array.isArray(driveData.trails)
        ) {
            throw new Error(
                "The file in Google Drive isn't valid Deer Trail Cam data."
            );
        }

        // Clean up the downloaded cameras the same way saved ones are cleaned
        const pulledCameras = driveData.cameras.map(function(camera) {
            return {
                id: camera.id || Date.now(),
                name: camera.name || "Camera",
                lat: Number(camera.lat),
                lng: wrapLng(camera.lng),
                sightings: Array.isArray(camera.sightings) ? camera.sightings : [],
                facing: camera.facing || "",
                emailMatch: camera.emailMatch || "",
                lastChecked: camera.lastChecked || ""  // date you last visited / checked the camera
            };
        }).filter(function(camera) {
            return Number.isFinite(camera.lat) &&
                   Number.isFinite(camera.lng);
        });

        // Tell the save effect not to treat this download as a new edit (otherwise it would upload it again)
        suppressNextPushRef.current = true;

        setCameras(pulledCameras);
        setTrails(driveData.trails);

        if (Array.isArray(driveData.stands)) {
            setStands(
                sanitizeStands(driveData.stands) || []
            );
        }

        if (Array.isArray(driveData.bucks)) setBucks(sanitizeBucks(driveData.bucks));
        if (Array.isArray(driveData.hunts)) setHunts(sanitizeHunts(driveData.hunts));
        if (Array.isArray(driveData.features)) setFeatures(sanitizeFeatures(driveData.features));

        applySettingsBundleFromData(driveData.settings);

        refreshMapLayers(pulledCameras, driveData.trails);

        markSynced(Date.now(), file.modifiedTime);
    }

    // SYNC (the heart of Drive sync). Decides whether to upload, download, ask you, or do nothing:
    //   - no backup in Drive yet                          -> upload
    //   - this device has no data                         -> download
    //   - Drive unchanged since last sync                 -> upload only if you edited here
    //   - Drive changed and you did NOT edit here         -> download
    //   - Drive changed AND you edited here (or first sync with data on both) -> ask which to keep
    async function syncFromDrive() {

        // Don't run two syncs at once, and do nothing when not signed in
        if (syncBusyRef.current || !driveAccessToken || readOnlyRef.current) return;

        syncBusyRef.current = true;

        setSyncStatus("syncing");

        try {

            // Is there already a backup file in Drive?
            const file = await driveFindFile();

            // No backup yet: upload this device's data to create it
            if (!file) {

                await pushToDrive();

            } else {

                driveFileId = file.id;

                // Does this device have anything saved?
                const localHasData =
                    getCameras().length > 0 ||
                    getTrails().length > 0 ||
                    getStands().length > 0 ||
                    getBucks().length > 0 ||
                    getHunts().length > 0 ||
                    getFeatures().length > 0;

                // The Drive file version this device saw at its last sync
                const lastRemote =
                    localStorage.getItem(SYNCED_REMOTE_KEY) || "";

                // Has Drive changed since then (another device uploaded)?
                const remoteChanged = lastRemote !== file.modifiedTime;

                // Have you edited on this device since the last sync?
                const dirty = getLastModified() > getSyncedAt();

                // Nothing here to lose: just download
                if (!localHasData) {

                    await pullFromDrive(file);

                // Drive is as we left it: upload only if we have new edits
                } else if (!remoteChanged) {

                    if (dirty) {
                        await pushToDrive();
                    }

                // Drive has newer data and we have no unsynced edits: safe to download
                } else if (!dirty && lastRemote) {

                    await pullFromDrive(file);

                } else {

                    // Both sides have changes: let the user choose which copy wins
                    const useCloud = confirm(
                        "Google Drive already has saved data (from another device or an earlier sync).\n\n" +
                        "OK = load the cloud data here (replaces what's on this device).\n" +
                        "Cancel = keep this device's data and overwrite the cloud."
                    );

                    if (useCloud) {
                        await pullFromDrive(file);
                    } else {
                        await pushToDrive();
                    }
                }
            }

            setSyncStatus("synced");
            setSyncError("");

        } catch (error) {

            reportDriveError(error);

        } finally {

            syncBusyRef.current = false;
        }
    }

    // Runs when Google's sign-in popup finishes
    function handleDriveAuthResponse(response) {

        // Google reported a problem
        if (response && response.error) {

            setSyncStatus("error");

            setSyncError(
                "Google sign-in failed: " +
                (response.error_description || response.error)
            );

            return;
        }

        // Signed in: we got a pass (token)
        if (response && response.access_token) {

            if (
                window.google &&
                // The permission box for Drive access was left unticked on Google's screen
                !google.accounts.oauth2.hasGrantedAllScopes(
                    response,
                    DRIVE_SCOPE
                )
            ) {

                driveAccessToken = null;

                setSyncStatus("error");

                setSyncError(
                    "Drive access wasn't granted. When Google asks, tick the box that lets this app store its data in your Google Drive, then try again."
                );

                return;
            }

            // Connected OK: remember it, show 'Synced', and run a first sync
            localStorage.setItem(WAS_CONNECTED_KEY, "1");

            setSignedIn(true);
            setSyncError("");
            syncFromDrive();
        }
    }

    // Runs when the popup was closed or blocked before finishing
    function handleDriveTokenError(error) {

        setSyncStatus("error");

        setSyncError(
            error && error.type === "popup_closed"
                ? "The Google sign-in window was closed before it finished."
                : error && error.type === "popup_failed_to_open"
                    ? "Your browser blocked the Google sign-in popup. Allow popups for this site and try again."
                    : "Google sign-in failed."
        );
    }

    // Asks you to paste your Google Client ID (used by the gear button, or automatically if none is set)
    function askForClientId() {

        const current = getClientId();

        const value = prompt(
            "Paste your Google OAuth Client ID (from Google Cloud Console > Credentials). It ends in .apps.googleusercontent.com",
            clientIdLooksValid(current) ? current : ""
        );

        if (!value) return false;

        const id = value.trim();

        if (!clientIdLooksValid(id)) {
            alert("That doesn't look like a Client ID. It should look like 123456789012-abc123.apps.googleusercontent.com");
            return false;
        }

        localStorage.setItem(CLIENT_ID_KEY, id);
        initDriveTokenClient(handleDriveAuthResponse, handleDriveTokenError);

        return true;
    }

    // Connect button: make sure a Client ID exists, then open Google's sign-in
    function signInToDrive() {

        if (!clientIdLooksValid(getClientId())) {
            if (!askForClientId()) return;
        }

        requestDriveAccess(handleDriveAuthResponse);
    }

    // Disconnect button: forget the Google pass (your data stays on this device)
    function signOutOfDrive() {
        driveSignOut();
        localStorage.removeItem(WAS_CONNECTED_KEY);
        setSignedIn(false);
        setSyncStatus("");
        setSyncError("");
    }

    // Wait for Google's sign-in script to load, then set up the sign-in client (checks every 0.2 s)
    useEffect(function() {

        const interval = setInterval(function() {

            if (initDriveTokenClient(handleDriveAuthResponse, handleDriveTokenError)) {
                clearInterval(interval);
            }

        }, 200);

        return function() {
            clearInterval(interval);
        };

    }, []);

    // SAVE + SYNC: whenever cameras, trails or stands change, save them on this device,
    // stamp the edit time, and (if connected to Drive) sync 2 seconds later
    useEffect(function() {

        // viewing a shared snapshot: never save or sync it
        if (readOnlyRef.current) return;

        setStorageFull(!saveData(cameras, trails, stands, bucks, hunts, features));

        try { localStorage.setItem(MAINT_KEY, JSON.stringify(maintenance)); } catch (error) {}

        if (firstSaveRef.current) {
            firstSaveRef.current = false;
            return;
        }

        if (suppressNextPushRef.current) {
            suppressNextPushRef.current = false;
            return;
        }

        setLastModified(Date.now());

        if (signedInRef.current) {

            if (driveSyncTimeoutRef.current) {
                clearTimeout(driveSyncTimeoutRef.current);
            }

            driveSyncTimeoutRef.current = setTimeout(function() {
                syncFnRef.current();
            }, 2000);
        }

    }, [cameras, trails, stands, bucks, hunts, features, theme, maintenance, settingsVersion]);

    // Check Drive again when you return to the app and once a minute while connected
    useEffect(function() {

        function trySync() {

            if (
                signedInRef.current &&
                document.visibilityState === "visible"
            ) {
                syncFnRef.current();
            }
        }

        const interval = setInterval(trySync, 60000);

        document.addEventListener("visibilitychange", trySync);

        return function() {
            clearInterval(interval);
            document.removeEventListener("visibilitychange", trySync);
        };

    }, []);

    const selectedCamera = cameras.find(function(camera) {
        return camera.id === selectedCameraId;
    });

    const selectedStand = stands.find(function(stand) {
        return stand.id === selectedStandId;
    });

    const selectedFeature = features.find(function(f) { return f.id === selectedFeatureId; });

    // Finishes 'Move Marker': puts the waiting camera at the tapped spot. Returns false if no camera was waiting.
    function placeMovingCamera(latlng) {

        const id = movingCameraRef.current;

        if (!id) return false;

        setCameras(function(previous) {
            return previous.map(function(camera) {
                if (camera.id !== id) return camera;
                return {
                    ...camera,
                    lat: latlng.lat,
                    lng: latlng.lng
                };
            });
        });

        const marker = cameraMarkersRef.current[id];

        if (marker) {
            marker.setLatLng(latlng);
        }

        movingCameraRef.current = null;
        setMovingCameraId(null);

        return true;
    }

    // Start 'Move Marker': remember which camera to move, then the next map tap places it
    function startMoveCamera(id) {
        movingStandRef.current = null;
        setMovingStandId(null);
        movingCameraRef.current = id;
        setMovingCameraId(id);
    }

    // Stop any move in progress (camera or stand)
    function cancelMove() {
        movingCameraRef.current = null;
        setMovingCameraId(null);
        movingStandRef.current = null;
        setMovingStandId(null);
    }

    // Finishes 'Move Stand': puts the waiting stand at the tapped spot
    function placeMovingStand(latlng) {

        const id = movingStandRef.current;

        if (!id) return false;

        setStands(function(previous) {
            return previous.map(function(stand) {
                if (stand.id !== id) return stand;
                return {
                    ...stand,
                    lat: latlng.lat,
                    lng: latlng.lng
                };
            });
        });

        movingStandRef.current = null;
        setMovingStandId(null);

        return true;
    }

    // Start 'Move Stand'
    function startMoveStand(id) {
        movingCameraRef.current = null;
        setMovingCameraId(null);
        movingStandRef.current = id;
        setMovingStandId(id);
    }

    // Start adding a stand: show the name/type form, next map tap places it
    function startStandDraft() {

        cancelMove();

        // Drawing a trail: add this point
        if (drawingTrailRef.current) {
            cancelTrail();
        }

        setSelectedCameraId(null);
        setSelectedStandId(null);
        setShowSightingForm(false);
        setShowStands(true);
        setStandDraft({ name: "", type: STAND_TYPES[0] });
    }

    // Cancel adding a stand
    function cancelStandDraft() {
        standDraftRef.current = null;
        setStandDraft(null);
    }

    // Open a stand's details and zoom the map to it
    function openStand(stand) {

        setSelectedStandId(stand.id);
        setSelectedCameraId(null);
        setShowSightingForm(false);
        setShowStands(true);
        setView("map");

        setTimeout(function() {

            if (mapRef.current) {

                mapRef.current.setView(
                    [stand.lat, stand.lng],
                    16
                );
            }

        }, 150);
    }

    // Delete a stand (after confirming)
    function deleteStand(id) {

        const stand = stands.find(function(item) {
            return item.id === id;
        });

        if (!stand) return;

        if (!confirm("Delete " + stand.name + "?")) return;

        cancelMove();

        setStands(function(previous) {
            return previous.filter(function(item) {
                return item.id !== id;
            });
        });

        setSelectedStandId(null);
    }

    // BUILD THE MAP. Runs when the Map tab opens.
    // If an old map exists for a container that no longer exists, throw it away and start fresh; otherwise just resize it.
    function initializeMap() {

        if (
            mapRef.current &&
            // (is the old map attached to a map box that is no longer on the page?)
            mapRef.current.getContainer() !==
                document.getElementById("map")
        ) {
            try {
                mapRef.current.remove();
            } catch (error) {}

            mapRef.current = null;
            cameraMarkersRef.current = {};
            trailLayersRef.current = [];
            currentTrailLayerRef.current = null;
            heatLayerRef.current = null;
            trailHeatRef.current = null;
            arrowMarkersRef.current = {};
            standMarkersRef.current = {};
            featureMarkersRef.current = {};
            scentLayerRef.current = null;
            facingLayersRef.current = {};
        }

        if (mapRef.current) {
            setTimeout(function() {
                mapRef.current.invalidateSize();
            }, 100);
            return;
        }

        // Create the map. zoomSnap/zoomDelta give finer zoom steps (quarter-level stops, half-level per button press)
        const map = L.map("map", {
            zoomSnap: 0.25,
            zoomDelta: 0.5,
            wheelPxPerZoomLevel: 90
        }).setView(
            [42.84, -88.54],
            13
        );

        // Remember the map; bump mapVersion so the heat/arrow/stand effects draw onto it
        mapRef.current = map;
        setMapVersion(function(v) { return v + 1; });

        // Camera markers live in their own pane above the trails
        // Custom layers ('panes') decide what draws on top: trails < stands (640) < cameras (650)
        map.createPane("cameraPane");
        map.getPane("cameraPane").style.zIndex = 650;

        // Stands sit above trails but below cameras
        map.createPane("standPane");
        map.getPane("standPane").style.zIndex = 640;

        // Satellite imagery background (Esri World Imagery)
        L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {
                attribution: "Tiles &copy; Esri"
            }
        ).addTo(map);

        // Put a dot on the map for every saved camera
        cameras.forEach(function(camera) {
            addCameraMarker(camera);
        });

        // Draw every saved trail
        trails.forEach(function(trail) {
            drawSavedTrail(trail);
        });

        // OPEN WHERE THE CAMERAS ARE: zoom the map to show every camera.
        // One camera -> centre on it; no cameras -> keep the default view.
        const camSpots = cameras.filter(function(camera) {
            return Number.isFinite(camera.lat) && Number.isFinite(camera.lng);
        }).map(function(camera) {
            return [camera.lat, camera.lng];
        });

        if (camSpots.length === 1) {
            map.setView(camSpots[0], 16);
        } else if (camSpots.length > 1) {
            map.fitBounds(camSpots, { padding: [40, 40], maxZoom: 18 });
        }

        // MAP CLICK: what tapping the map does, in priority order:
        //   1. a camera/stand is waiting to be moved -> put it here
        //   2. a stand is being added                -> create the stand here
        //   3. a trail is being drawn                -> add a point to the trail
        //   4. otherwise                             -> ask for a name and add a new camera here
        map.on("click", function(event) {

            // fix longitudes like -448 (map scrolled past the edge of the world) so positions stay valid
            event.latlng = event.latlng.wrap();

            if (
                placeMovingCamera(event.latlng) ||
                placeMovingStand(event.latlng)
            ) {
                return;
            }

            // Adding a stand: needs a name first
            if (standDraftRef.current) {

                const draft = standDraftRef.current;

                if (!draft.name.trim()) {
                    alert("Enter a name for the stand first.");
                    return;
                }

                const stand = {
                    id: Date.now(),
                    name: draft.name.trim(),
                    type: draft.type,
                    lat: event.latlng.lat,
                    lng: event.latlng.lng
                };

                setStands(function(previous) {
                    return [...previous, stand];
                });

                standDraftRef.current = null;
                setStandDraft(null);
                setSelectedStandId(stand.id);

                return;
            }

            // Drawing a walk-in route: each tap adds a point (snapped onto a nearby trail you drew)
            if (entryDraftRef.current) {

                const standId = entryDraftRef.current;
                let at = [event.latlng.lat, event.latlng.lng];
                const snapped = snapToTrails(at[0], at[1], trailsRef.current, 25);

                if (snapped) at = [snapped[0], wrapLng(snapped[1])];

                setStands(function(previous) {
                    return previous.map(function(st) { return st.id === standId ? { ...st, entryPath: (st.entryPath || []).concat([at]) } : st; });
                });

                return;
            }

            // Adding a map feature (food plot, water, bedding, scrape, rub)
            if (featureDraftRef.current) {

                const type = featureDraftRef.current;

                const feature = {
                    id: Date.now(),
                    type: type,
                    name: type,
                    notes: "",
                    lat: event.latlng.lat,
                    lng: event.latlng.lng
                };

                setFeatures(function(previous) { return [...previous, feature]; });

                featureDraftRef.current = null;
                setFeatureDraft(null);
                setSelectedCameraId(null);
                setSelectedStandId(null);
                setSelectedFeatureId(feature.id);

                return;
            }

            if (drawingTrailRef.current) {

    // HEAT MAP: rebuild the heat layer whenever its settings, the data or the timelapse hour change
    useEffect(function() {

        if (!mapRef.current) return;

        if (heatLayerRef.current) {
            mapRef.current.removeLayer(heatLayerRef.current);
            heatLayerRef.current = null;
        }

        // Heat map off (or its library failed to load): nothing to draw
        if (!heatOn || !L.heatLayer) return;

        const points = [];

        cameras.forEach(function(camera) {

            const count = camera.sightings
                .filter(function(sighting) {
                    return matchesHeatFilter(sighting.deerType, heatFilter) &&
                        (!timelapseOn ||
                            sightingHour(sighting) === timelapseHour);
                })
                .reduce(function(total, sighting) {
                    return total + Number(sighting.number || 0);
                }, 0);

            if (count > 0) {
                points.push([camera.lat, camera.lng, count]);
            }
        });

        if (!points.length) return;

        // The busiest camera sets the top of the color scale
        let maxCount = Math.max.apply(
            null,
            points.map(function(point) {
                return point[2];
            })
        );

        // In timelapse, use the busiest camera-hour of the whole day as the scale so hours can be compared fairly
        if (timelapseOn) {

            // keep the scale fixed across the whole day so hours are comparable
            maxCount = 1;

            cameras.forEach(function(camera) {

                for (let hour = 0; hour < 24; hour++) {

                    const hourCount = camera.sightings
                        .filter(function(sighting) {
                            return matchesHeatFilter(sighting.deerType, heatFilter) &&
                                sightingHour(sighting) === hour;
                        })
                        .reduce(function(total, sighting) {
                            return total + Number(sighting.number || 0);
                        }, 0);

                    if (hourCount > maxCount) {
                        maxCount = hourCount;
                    }
                }
            });
        }

        // Draw the heat layer; radius/blur come from the Heat radius slider
        heatLayerRef.current = L.heatLayer(points, {
            radius: heatRadius,
            blur: Math.round(heatRadius * 0.7),
            maxZoom: 17,
            max: maxCount,
            minOpacity: 0.35
        }).addTo(mapRef.current);

    }, [heatOn, heatFilter, heatRadius, cameras, mapVersion, timelapseOn, timelapseHour]);

    // TRAIL HEAT: with the heat map on, colour each stretch of trail by how hot the cameras near it are
    // (blue = cool, yellow = warm, red = hot). Follows the same deer filter and timelapse hour as the heat map.
    useEffect(function() {

        const map = mapRef.current;

        if (!map) return;

        if (trailHeatRef.current) {
            map.removeLayer(trailHeatRef.current);
            trailHeatRef.current = null;
        }

        if (!heatOn || !trailHeatOn || !showTrails) return;

        // Deer counted at each camera (same rule as the heat map)
        const hot = cameras.map(function(camera) {
            return {
                lat: camera.lat,
                lng: camera.lng,
                count: camera.sightings
                    .filter(function(sighting) {
                        return matchesHeatFilter(sighting.deerType, heatFilter) &&
                            (!timelapseOn || sightingHour(sighting) === timelapseHour);
                    })
                    .reduce(function(total, sighting) { return total + Number(sighting.number || 0); }, 0)
            };
        }).filter(function(c) { return c.count > 0; });

        if (!hot.length) return;

        // A camera warms the trail within this many meters of it (fading out with distance)
        const reach = Math.max(heatRadius * 2, 60);
        const pieces = [];
        let top = 0.0001;

        trails.forEach(function(trail) {

            const pts = trail.points || [];

            for (let i = 0; i + 1 < pts.length; i++) {

                const a = pts[i];
                const b = pts[i + 1];
                const len = metersBetween(a[0], a[1], b[0], b[1]);

                // Cut long segments into ~15 m pieces so the colour changes smoothly along the trail
                const n = Math.max(1, Math.min(60, Math.round(len / 15)));

                for (let k = 0; k < n; k++) {

                    const p1 = [a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n];
                    const p2 = [a[0] + (b[0] - a[0]) * (k + 1) / n, a[1] + (b[1] - a[1]) * (k + 1) / n];
                    const mid = [(p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2];

                    let heat = 0;

                    hot.forEach(function(c) {
                        const d = metersBetween(mid[0], mid[1], c.lat, c.lng);
                        if (d < reach) heat += c.count * (1 - d / reach);
                    });

                    if (heat > top) top = heat;

                    pieces.push({ p1: p1, p2: p2, heat: heat });
                }
            }
        });

        // blue -> yellow -> red
        function heatColor(t) {
            const hue = Math.round(220 - 220 * t * 1);  // 220 (blue) down to 0 (red), passing yellow
            return "hsl(" + Math.max(0, hue) + ", 90%, 50%)";
        }

        const group = L.layerGroup();

        pieces.forEach(function(piece) {
            if (piece.heat <= 0) return;
            L.polyline([piece.p1, piece.p2], {
                color: heatColor(Math.min(1, piece.heat / top)),
                weight: 7,
                opacity: 0.95,
                lineCap: "butt",
                interactive: false
            }).addTo(group);
        });

        trailHeatRef.current = group.addTo(map);

    }, [heatOn, trailHeatOn, showTrails, heatFilter, heatRadius, cameras, trails, mapVersion, timelapseOn, timelapseHour]);

    // Download a fresh forecast for the middle of your cameras/stands
    async function refreshForecast() {

        const center = propertyCenter(cameras, stands);

        if (!center) {
            setForecastStatus("Add a camera or stand first so the app knows where to get the forecast.");
            return;
        }

        setForecastStatus("Loading forecast…");

        try {
            const fresh = await fetchForecast(center.lat, center.lng);
            setForecast(fresh);
            setForecastStatus("Forecast updated " + new Date(fresh.fetchedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + ".");
        } catch (error) {
            setForecastStatus("Couldn't load the forecast (" + (error && error.message ? error.message : "no connection") + "). " + (forecast ? "Showing the last saved one." : ""));
        }
    }

    // WEATHER LEARNING: when the planner's weather adjustment is on, make sure we have the weather history it needs
    useEffect(function() {

        if (view !== "hunt" || !SCORE_CONFIG.weatherAdjust) return;

        const center = propertyCenter(cameras, stands);

        let first = null;
        cameras.forEach(function(c) { c.sightings.forEach(function(sg) { if (sg.date && (first === null || sg.date < first)) first = sg.date; }); });

        if (!center || first === null) return;

        const yesterday = addDaysToDate(todayString(), -1);
        const earliest = addDaysToDate(todayString(), -120);
        const from = first < earliest ? earliest : first;

        const saved = getSavedHist();

        // reuse the saved history if it covers the range and is under 12 hours old
        if (saved && saved.from <= from && saved.to >= yesterday && Date.now() - saved.fetchedAt < 12 * 3600000) {
            if (!histWx) setHistWx(saved);
            return;
        }

        if (from > yesterday) return;

        (async function() {
            try {
                const rows = await fetchRangeWeather(center.lat, center.lng, from, yesterday);
                const fresh = { from: from, to: yesterday, fetchedAt: Date.now(), rows: rows };
                try { localStorage.setItem(HIST_KEY, JSON.stringify(fresh)); } catch (error) {}
                setHistWx(fresh);
            } catch (error) {
                setForecastStatus("Couldn't load weather history (" + (error && error.message ? error.message : "no connection") + ").");
            }
        })();

    }, [view, settingsVersion]);

    // WEATHER ON SIGHTINGS: quietly add temperature / wind / pressure to sightings that don't have it yet,
    // 25 at a time, looking up each camera's spot and day. (Turn it off on the Settings tab.)
    useEffect(function() {

        localStorage.setItem("deerWeatherAuto", weatherAuto ? "1" : "0");

        if (!weatherAuto || weatherBusyRef.current) return;

        const today = todayString();
        const todo = [];

        cameras.forEach(function(camera) {
            camera.sightings.forEach(function(sighting) {
                const key = camera.id + ":" + sighting.id;
                if (!sighting.weather && sighting.date && sighting.time && sighting.date <= today && !weatherTriedRef.current[key]) {
                    todo.push({ camera: camera, sighting: sighting, key: key });
                }
            });
        });

        // hunt log entries get the weather at the stand too
        const huntTodo = hunts.filter(function(h) {
            return !h.weather && h.date && h.start && h.date <= today && !weatherTriedRef.current["h" + h.id] &&
                stands.some(function(st) { return String(st.id) === String(h.standId); });
        });

        if (!todo.length && !huntTodo.length) return;

        weatherBusyRef.current = true;

        (async function() {

            const updates = {};

            // group by camera + date so each day is only downloaded once
            const batch = todo.slice(0, 25);

            for (const item of batch) {

                weatherTriedRef.current[item.key] = true;

                try {
                    const day = await fetchDayWeather(item.camera.lat, item.camera.lng, item.sighting.date);
                    const w = conditionsAt(day, item.sighting.date, item.sighting.time);
                    if (w) updates[item.key] = w;
                } catch (error) {
                    // offline or service busy: skip, we'll try again next time the app is opened
                }
            }

            // hunts
            const huntUpdates = {};

            for (const h of huntTodo.slice(0, 10)) {

                weatherTriedRef.current["h" + h.id] = true;

                const st = stands.find(function(x) { return String(x.id) === String(h.standId); });

                try {
                    const day = await fetchDayWeather(st.lat, st.lng, h.date);
                    const w = conditionsAt(day, h.date, h.start);
                    if (w) huntUpdates[h.id] = w;
                } catch (error) {}
            }

            if (Object.keys(huntUpdates).length) {
                setHunts(function(previous) {
                    return previous.map(function(h) { return huntUpdates[h.id] ? { ...h, weather: huntUpdates[h.id] } : h; });
                });
            }

            if (Object.keys(updates).length) {
                setCameras(function(previous) {
                    return previous.map(function(camera) {
                        return {
                            ...camera,
                            sightings: camera.sightings.map(function(sighting) {
                                const w = updates[camera.id + ":" + sighting.id];
                                return w ? { ...sighting, weather: w } : sighting;
                            })
                        };
                    });
                });
            }

        })().finally(function() {
            weatherBusyRef.current = false;
            setWeatherTick(function(n) { return n + 1; });
        });

    }, [cameras, hunts, weatherAuto, weatherTick]);

    useEffect(function() {

            let state = {};

            sent.forEach(function(n) { pushNotice(n.title, n.body, n.tag); });
        }

        const first = setTimeout(check, 4000);
        const interval = setInterval(check, 15 * 60000);

        } catch (error) {}

    // Save the trails/stands on-off choice and show or hide the trail lines
    useEffect(function() {

            LAYERS_KEY,
            JSON.stringify({
                trails: showTrails,
                stands: showStands,
                features: showFeatures
            })
        );

        const map = mapRef.current;

        if (!map) return;

        trailLayersRef.current.forEach(function(layer) {

            if (showTrails) {

                if (!map.hasLayer(layer)) {
                    layer.addTo(map);
                }

            } else if (map.hasLayer(layer)) {

                map.removeLayer(layer);
            }
        });

    function openCamera(camera) {

        setSelectedStandId(null);
        setSelectedCameraId(camera.id);
        setShowSightingForm(false);
        setView("map");

        setTimeout(function() {

            if (mapRef.current) {

                mapRef.current.setView(

                );

    // Delete a camera and all its sightings (after confirming)
    function deleteCamera(id) {

        const camera = cameras.find(function(item) {
            return item.id === id;
        });

        if (!camera) return;

        const confirmed = confirm(
            "Delete " +
            camera.name +
            " and all of its sightings?"
        );

        if (!confirmed) return;

        setCameras(function(previous) {

            return previous.filter(function(item) {
                return item.id !== id;
            });

        });

        if (
            cameraMarkersRef.current[id] &&
            mapRef.current
        ) {

            mapRef.current.removeLayer(
                cameraMarkersRef.current[id]
            );

            delete cameraMarkersRef.current[id];
        }

        setSelectedCameraId(null);
    }

    // Clear the New Sighting form back to its starting values
    function resetSightingForm() {

        setDate("");
        setTime("");
        setDeerType("Buck");
        setNumber("1");
        setAntlerPoints("");
        setDirection("");
        setNotes("");
        setFormBuckId("");
        setFormThumb("");
    }

    // Save the New Sighting form as a sighting on the selected camera
    // Connect / disconnect a camera to a stand by hand (connected cameras count at full strength toward the stand's score)
    function toggleStandCamera(standId, cameraId) {

        setStands(function(previous) {
            return previous.map(function(stand) {

                if (stand.id !== standId) return stand;

                const ids = stand.cameraIds || [];
                const has = ids.some(function(id) { return String(id) === String(cameraId); });

                return {
                    ...stand,
                    cameraIds: has
                        ? ids.filter(function(id) { return String(id) !== String(cameraId); })
                        : ids.concat([cameraId])
                };
            });
        });
    }

    // The sighting as currently typed into the form (used for the live points preview)
    function draftSighting() {
        return {
            date: date,
            time: time,
            deerType: deerType,
            number: Number(number) || 1,
            direction: selectedCamera ? resolveDirection(direction, selectedCamera) : direction
        };
    }

    // Plain-text lines describing a points preview, e.g. ["Camera A: +12.4 points", "Stand B: +6.2 points"]
    function pointsLines(preview, cameraName) {

        const lines = [cameraName + ": +" + fmtScore(preview.camera) + " points"];

        preview.stands.forEach(function(row) {
            lines.push(row.stand.name + ": +" + fmtScore(row.points) + " points" + (row.manual ? " (connected)" : ""));
        });

        if (!preview.stands.length) lines.push("No stands count this camera yet.");

        return lines;
    }

    function addSighting(event) {

        // Stop the browser reloading the page when the form is submitted
        event.preventDefault();

        if (!selectedCamera) return;

        // The new sighting record
        const sighting = {
            id: Date.now(),
            date: date,
            time: time,
            deerType: deerType,
            number: Number(number) || 1,
            antlerPoints:
                antlerPoints === ""
                    ? null
                    : Number(antlerPoints),
            direction: resolveDirection(direction, selectedCamera),
            notes: notes
        };

        // named buck and attached photo thumbnail (if any)
        if (isBuckType(deerType) && formBuckId) sighting.buckId = isNaN(Number(formBuckId)) ? formBuckId : Number(formBuckId);
        if (formThumb) sighting.thumb = formThumb;

        setCameras(function(previous) {

            return previous.map(function(camera) {

                if (camera.id !== selectedCamera.id) {
                    return camera;
                }

                return {
                    ...camera,
                    sightings: [
                        ...camera.sightings,
                        sighting
                    ]
                };
            });

        });

        // Tell the user what this sighting is worth
        setPointsNotice({
            title: "Sighting saved",
            lines: pointsLines(sightingPointsPreview(sighting, selectedCamera, stands, trails, cameras), selectedCamera.name)
        });

        resetSightingForm();
        setShowSightingForm(false);
    }

    // Change fields on one sighting of the selected camera (undefined removes a field)
    function updateSighting(id, patch) {

        if (!selectedCamera) return;

        setCameras(function(previous) {
            return previous.map(function(camera) {

                if (camera.id !== selectedCamera.id) return camera;

                return {
                    ...camera,
                    sightings: camera.sightings.map(function(sighting) {
                        if (sighting.id !== id) return sighting;
                        const next = { ...sighting, ...patch };
                        Object.keys(next).forEach(function(k) { if (next[k] === undefined) delete next[k]; });
                        return next;
                    })
                };
            });
        });
    }

    // Remove one sighting from the selected camera
    function deleteSighting(id) {

        if (!selectedCamera) return;

        setCameras(function(previous) {

            return previous.map(function(camera) {

                if (camera.id !== selectedCamera.id) {
                    return camera;
                }

                return {
                    ...camera,
                    sightings: camera.sightings.filter(
                        function(sighting) {
                            return sighting.id !== id;
                        }
                    )
                };
            });

        });
    }

    // Start drawing a deer trail (also switches trails on)
    function startTrail() {

        cancelMove();
        cancelStandDraft();
        setShowTrails(true);
        setSelectedStandId(null);
        setSelectedCameraId(null);
        setShowSightingForm(false);

        drawingTrailRef.current = true;
        setDrawingTrail(true);
        setCurrentTrailPoints([]);
    }

    // Abandon the trail being drawn
    function cancelTrail() {

        drawingTrailRef.current = false;
        setDrawingTrail(false);
        setCurrentTrailPoints([]);

        if (
            currentTrailLayerRef.current &&
            mapRef.current
        ) {

            mapRef.current.removeLayer(
                currentTrailLayerRef.current
            );

            currentTrailLayerRef.current = null;
        }
    }

    // Save the trail being drawn (needs at least two points and a name)
    function finishTrail() {

        if (currentTrailPoints.length < 2) {

            alert(
                "A trail needs at least two points."
            );

            return;
        }

        const name = prompt(
            "Enter a name for this trail:"
        );

        if (!name) return;

        const trail = {
            id: Date.now(),
            name: name,
            points: currentTrailPoints
        };

        setTrails(function(previous) {
            return [...previous, trail];
        });

        drawingTrailRef.current = false;
        setDrawingTrail(false);
        setCurrentTrailPoints([]);

        if (
            currentTrailLayerRef.current &&
            mapRef.current
        ) {

            mapRef.current.removeLayer(
                currentTrailLayerRef.current
            );

            currentTrailLayerRef.current = null;
        }

        drawSavedTrail(trail);
    }

    // Delete a trail (after confirming)
    function deleteTrail(id) {

        const confirmed = confirm(
            "Delete this trail?"
        );

        if (!confirmed) return;

        setTrails(function(previous) {

            return previous.filter(function(trail) {
                return trail.id !== id;
            });

        });

        redrawAllTrails(
            trails.filter(function(trail) {
                return trail.id !== id;
            })
        );
    }

    // Remove all trail lines from the map and draw the given list again
    function redrawAllTrails(list) {

        if (!mapRef.current) return;

        trailLayersRef.current.forEach(function(layer) {

            mapRef.current.removeLayer(layer);

        });

        trailLayersRef.current = [];

        list.forEach(function(trail) {

            drawSavedTrail(trail);

        });
    }

    // Export Data button: download everything as a .json backup file
    function exportData() {

        const data = {
            app: "Deer Trail Cam Scorer",
            version: 1,
            exportedAt: new Date().toISOString(),
            cameras: cameras,
            trails: trails,
            stands: stands,
            bucks: bucks,
            hunts: hunts,
            features: features,
            settings: getSettingsBundle(theme, maintenance)
        };

        // Turn the data into nicely indented text
        const json = JSON.stringify(
            data,
            null,
            2
        );

        // Wrap the text in a downloadable file
        const blob = new Blob(
            [json],
            {
                type: "application/json"
            }
        );

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = url;

        // File name: deer-trail-cam-backup-<today's date>.json
        link.download =
            "deer-trail-cam-backup-" +
            new Date()
                .toISOString()
                .slice(0, 10) +
            ".json";

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

        URL.revokeObjectURL(url);
    }

    // Import Data button: read a backup file and replace this device's data with it
    function importData(event) {

        const file = event.target.files[0];

        if (!file) return;

        // Read the chosen file as text
        const reader = new FileReader();

        reader.onload = function(loadEvent) {

            try {

                const data = JSON.parse(
                    loadEvent.target.result
                );

                if (
                    !data ||
                    !Array.isArray(data.cameras) ||
                    !Array.isArray(data.trails)
                ) {

                    alert(
                        "That file is not a valid Deer Trail Cam backup."
                    );

                    return;
                }

                const confirmed = confirm(
                    "Import this backup? This will replace the data currently on this device."
                );

                if (!confirmed) return;

                // Clean up imported cameras, trails and stands before using them
                const importedCameras =
                    data.cameras.map(function(camera) {

                        return {
                            id: camera.id,
                            name: camera.name,
                            lat: Number(camera.lat),
                            lng: wrapLng(camera.lng),
                            sightings: Array.isArray(camera.sightings) ? camera.sightings : [],
                            facing: camera.facing || "",
                            emailMatch: camera.emailMatch || "",
                            lastChecked: camera.lastChecked || ""
                        };

                    });

                const importedTrails =
                    data.trails.map(function(trail) {

                        return {
                            id: trail.id,
                            name: trail.name,
                            points:
                                Array.isArray(
                                    trail.points
                                )
                                    ? trail.points
                                    : []
                        };

                    });

                localStorage.setItem(
                    CAMERA_KEY,
                    JSON.stringify(
                        importedCameras
                    )
                );

                localStorage.setItem(
                    TRAIL_KEY,
                    JSON.stringify(
                        importedTrails
                    )
                );

                setCameras(importedCameras);
                setTrails(importedTrails);

                // stands, bucks, hunts and settings (older backups don't have all of these)
                if (Array.isArray(data.stands)) setStands(sanitizeStands(data.stands) || []);
                setBucks(sanitizeBucks(data.bucks));
                setHunts(sanitizeHunts(data.hunts));
                setFeatures(sanitizeFeatures(data.features));
                applySettingsBundleFromData(data.settings);

                setSelectedCameraId(null);
                setShowSightingForm(false);

                if (mapRef.current) {

                    Object.values(
                        cameraMarkersRef.current
                    ).forEach(function(marker) {

                        mapRef.current.removeLayer(
                            marker
                        );

                    });

                    cameraMarkersRef.current = {};

                    redrawAllTrails([]);

                    importedCameras.forEach(
                        function(camera) {
                            addCameraMarker(camera);
                        }
                    );

                    importedTrails.forEach(
                        function(trail) {
                            drawSavedTrail(trail);
                        }
                    );
                }

                alert(
                    "Backup imported successfully."
                );

            } catch {

                alert(
                    "Could not read that file."
                );
            }

            event.target.value = "";

        };

        reader.readAsText(file);
    }

    // ---- Numbers used by the dashboard and charts ----
    // Flat list of every sighting from every camera (each remembers which camera it came from)
    const allSightings = [];

    cameras.forEach(function(camera) {

        camera.sightings.forEach(function(sighting) {

            allSightings.push({
                ...sighting,
                cameraName: camera.name,
                cameraId: camera.id,
                inShootingHours: isShootingTime(sighting)
            });

        });

    });

    // Newest sightings first
    allSightings.sort(function(a, b) {

        return new Date(
            (b.date || "") +
            "T" +
            (b.time || "00:00")
        ) -
        new Date(
            (a.date || "") +
            "T" +
            (a.time || "00:00")
        );

    });

    // Total deer across all sightings
    const totalDeer =
        allSightings.reduce(
            function(total, sighting) {
                return total +
                    Number(sighting.number || 0);
            },
            0
        );

    // Bucks seen (includes big bucks)
    const buckCount =
        allSightings
            .filter(function(s) {
                return isBuckType(s.deerType);
            })
            .reduce(function(total, s) {
                return total +
                    Number(s.number || 0);
            }, 0);

    // Big bucks seen
    const bigBuckCount =
        allSightings
            .filter(function(s) {
                return s.deerType === "Big Buck";
            })
            .reduce(function(total, s) {
                return total +
                    Number(s.number || 0);
            }, 0);

    // Does seen
    const doeCount =
        allSightings
            .filter(function(s) {
                return s.deerType === "Doe";
            })
            .reduce(function(total, s) {
                return total +
                    Number(s.number || 0);
            }, 0);

    // Fawns seen
    const fawnCount =
        allSightings
            .filter(function(s) {
                return s.deerType === "Fawn";
            })
            .reduce(function(total, s) {
                return total +
                    Number(s.number || 0);
            }, 0);

    // Deer of unknown type
    const unknownCount =
        allSightings
            .filter(function(s) {
                return s.deerType === "Unknown";
            })
            .reduce(function(total, s) {
                return total +
                    Number(s.number || 0);
            }, 0);

    // Deer per direction of travel, to find the most common one
    const directionCounts = {};

    allSightings.forEach(function(sighting) {

        if (!sighting.direction) return;

        directionCounts[sighting.direction] =
            (directionCounts[sighting.direction] || 0) +
            Number(sighting.number || 0);
    });

    // The direction with the most deer
    const topDirectionKey =
        Object.keys(directionCounts).sort(function(x, y) {
            return directionCounts[y] - directionCounts[x];
        })[0];

    // Deer seen per camera, busiest first
    const cameraActivity =
        cameras.map(function(camera) {

            return {
                name: camera.name,
                count:
                    camera.sightings.reduce(
                        function(total, sighting) {
                            return total +
                                Number(
                                    sighting.number || 0
                                );
                        },
                        0
                    )
            };

        }).sort(function(a, b) {
            return b.count - a.count;
        });

    // Each camera's score (see SCORE_CONFIG), highest first
    const cameraScores =
        cameras.map(function(camera) {

            return {
                name: camera.name,
                score: cameraScore(camera)
            };

        }).sort(function(a, b) {
            return b.score - a.score;
        });

    // Deer seen in each hour of the day (index 0 = midnight hour)
    const hourActivity = new Array(24).fill(0);

    allSightings.forEach(function(sighting) {

        const hour = sightingHour(sighting);

        if (hour === null) return;

        hourActivity[hour] += Number(sighting.number || 0);

    });

    // Draws one horizontal bar row (label, number, filled bar) sized against the biggest value
    function bar(label, value, maximum) {

        const width =
            maximum > 0
                ? Math.max(
                    2,
                    value / maximum * 100
                )
                : 0;

        return e(
            "div",
            {
                className: "bar-row",
                key: label
            },

            e(
                "div",
                {
                    className: "bar-header"
                },

                e("span", null, label),
                e("strong", null, value)
            ),

            e(
                "div",
                {
                    className: "bar-background"
                },

                e(
                    "div",
                    {
                        className: "bar",
                        style: {
                            width: width + "%"
                        }
                    }
                )
            )
        );
    }

    // ---- AI PHOTO HELPER ----
    function changeAiKey(value) {
        const v = value.trim();
        try { localStorage.setItem(AI_KEY_STORAGE, v); } catch (error) {}
        setAiKey(v);
        setAiMessage("");
        setSettingsVersion(function(n) { return n + 1; });  // lets the key sync to Drive
    }

    async function testAiKey() {

        if (!aiKey) { setAiMessage("Paste a key first."); return; }

        setAiMessage("Testing…");

        try {
            const response = await fetch("https://api.anthropic.com/v1/messages", {
                method: "POST",
                headers: { "content-type": "application/json", "x-api-key": aiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
                body: JSON.stringify({ model: AI_MODEL, max_tokens: 5, messages: [{ role: "user", content: "Say OK" }] })
            });

            let body = null;
            try { body = await response.json(); } catch (error) {}

            setAiMessage(response.ok ? "✅ The key works." : "❌ " + (response.status === 401 ? "The key was rejected." : "Failed (" + response.status + (body && body.error ? ": " + body.error.message : "") + ")."));
        } catch (error) {
            setAiMessage("❌ Couldn't reach the AI service (" + (error && error.message ? error.message : "no connection") + ").");
        }
    }

    // Ask Haiku about one card and fill in its fields (you still confirm them)
    async function aiSuggest(item) {

        const key = getAiKey();

        if (!key) {
            updateEmailItem(item.key, { ai: { status: "error", note: "Add your API key in Settings first." } });
            return;
        }

        updateEmailItem(item.key, { ai: { status: "working" } });

        try {
            const out = await aiLookAtPhotos(key, item.images);
            const r = out.result;

            setAiUsage(addAiUsage(out.usage));

            const patch = { ai: { status: "done", confidence: r.confidence, note: r.note, noDeer: r.deerType === "None", suggested: r } };

            if (r.deerType !== "None") {
                patch.deerType = r.deerType;
                patch.number = String(r.number);
                patch.antlerPoints = r.antlerPoints === null ? "" : String(r.antlerPoints);
                patch.direction = r.direction;
            }

            updateEmailItem(item.key, patch);

        } catch (error) {
            updateEmailItem(item.key, { ai: { status: "error", note: error && error.message ? error.message : "The AI request failed." } });
        }
    }

    async function aiSuggestMany(list) {

        for (let i = 0; i < list.length; i++) {
            setEmailStatus("AI is looking at card " + (i + 1) + " of " + list.length + "…");
            await aiSuggest(list[i]);
        }
    }

    // FETCH button: sign in to Gmail if needed, find trail camera emails we haven't handled, and make cards for their photos
    async function fetchEmails() {

        setEmailBusy(true);
        setEmailStatus("Connecting to Gmail...");

        try {

            // ask Google for permission the first time (this has to happen right after the tap)
            if (!gmailAccessToken) {
                await gmailSignIn();
            }

            setEmailStatus("Looking for new emails...");

            // things we already handled: photos added as sightings, skipped photos/emails, and cards already waiting below
            const known = {};

            cameras.forEach(function(camera) {
                camera.sightings.forEach(function(sighting) {

                    (sighting.photoIds || []).forEach(function(id) { known[id] = true; });

                    // sightings from the first version of the importer only have whole-email ids
                    if (!sighting.photoIds) {
                        (sighting.emailIds || (sighting.emailId ? [sighting.emailId] : [])).forEach(function(id) { known[id] = true; });
                    }
                });
            });

            getDismissedEmails().forEach(function(id) { known[id] = true; });

            emailItems.forEach(function(item) {
                item.msgIds.forEach(function(id) { known[id] = true; });
                item.photoIds.forEach(function(id) { known[id] = true; });
            });

            // walk through the search results until we have up to 20 emails we haven't finished with
            const ids = [];
            let pageToken = "";

            for (let page = 0; page < 6 && ids.length < 20; page++) {

                const list = await gmailGet(
                    "messages?maxResults=50&q=" + encodeURIComponent(gmailQuery) +
                    (pageToken ? "&pageToken=" + pageToken : "")
                );

                (list.messages || []).forEach(function(message) {
                    if (!known[message.id] && ids.length < 20) ids.push(message.id);
                });

                if (!list.nextPageToken) break;

                pageToken = list.nextPageToken;
            }

            // read each email; ones with no photos, or whose photos are all handled, are remembered as finished
            const loaded = [];
            const finished = [];

            for (let i = 0; i < ids.length; i++) {

                setEmailStatus("Reading email " + (i + 1) + " of " + ids.length + "...");

                const result = await gmailLoadMessage(ids[i], cameras, known, emailOcr, setEmailStatus);

                if (result.photoCount === 0 || result.items.length === 0) finished.push(ids[i]);
                else result.items.forEach(function(item) { loaded.push(item); });
            }

            if (finished.length) addDismissedEmails(finished);

            const groups = groupEmails(loaded);

            setEmailItems(function(previous) {
                return groups.concat(previous);
            });

            setEmailStatus(
                loaded.length
                    ? "Found " + loaded.length + " new photo" + (loaded.length === 1 ? "" : "s") + " in " + groups.length + " card" + (groups.length === 1 ? "" : "s") + "."
                    : "No new photos found."
            );

            // let the AI fill in each new card (you still check and confirm them)
            if (groups.length && getAiKey() && localStorage.getItem(AI_AUTO_STORAGE) !== "0") {
                await aiSuggestMany(groups);
                setEmailStatus("Found " + loaded.length + " new photo" + (loaded.length === 1 ? "" : "s") + " in " + groups.length + " card" + (groups.length === 1 ? "" : "s") + ". The AI filled in its guesses; check them and tap Confirm.");
            }

        } catch (error) {

            // a 401 means the Gmail pass expired; the next tap asks for a new one
            if (error && error.status === 401) {
                gmailAccessToken = null;
                setEmailStatus("Your Gmail session expired. Tap Fetch again.");
            } else {
                setEmailStatus("Error: " + (error && error.message ? error.message : "something went wrong"));
            }

        } finally {

            await stopTextReader();
            setEmailBusy(false);
        }
    }

    // When the last card from an email is finished, remember the whole email as done so it isn't read again
    function finishEmails(card) {

        const remaining = emailItems.filter(function(i) { return i.key !== card.key; });
        const stillWaiting = {};

        remaining.forEach(function(i) {
            i.msgIds.forEach(function(m) { stillWaiting[m] = true; });
        });

        const done = card.msgIds.filter(function(m) { return !stillWaiting[m]; });

        if (done.length) addDismissedEmails(done);
    }

    // Picking a camera on one card also picks it for other waiting cards that show the same camera name on the photo
    function chooseEmailCamera(item, cameraId) {

        setEmailItems(function(previous) {
            return previous.map(function(other) {

                if (other.key === item.key) return { ...other, cameraId: cameraId };

                if (item.stripName && other.stripName === item.stripName && !other.cameraId) {
                    return { ...other, cameraId: cameraId };
                }

                return other;
            });
        });
    }

    // ADD SIGHTING button on a card: save it as a sighting on the chosen camera
    async function addEmailSighting(item) {

        const camera = cameras.find(function(c) { return String(c.id) === item.cameraId; });

        if (!camera) { alert("Choose a camera first."); return; }
        if (!item.deerType) { alert("Choose the deer type first."); return; }
        if (!item.date || !item.time) { alert("Enter the date and time."); return; }

    // ---- SHARING: read-only snapshots ----
    function applySnapshot(data) {

        if (!data || data.app !== "deer-snapshot") throw new Error("not a Deer Trail Cam snapshot");

        // stop all saving and syncing BEFORE the data goes in
        readOnlyRef.current = true;
        setReadOnly(true);

        setCameras((Array.isArray(data.cameras) ? data.cameras : []).map(function(camera) {
            return {
                id: camera.id || Date.now() + Math.random(),
                name: camera.name || "Camera",
                lat: Number(camera.lat),
                lng: wrapLng(camera.lng),
                sightings: Array.isArray(camera.sightings) ? camera.sightings : [],
                facing: camera.facing || "",
                emailMatch: camera.emailMatch || "",
                lastChecked: camera.lastChecked || ""
            };
        }).filter(function(camera) { return Number.isFinite(camera.lat) && Number.isFinite(camera.lng); }));

        setTrails(Array.isArray(data.trails) ? data.trails : []);
        setStands(sanitizeStands(data.stands) || []);
        setFeatures(sanitizeFeatures(data.features));
        setBucks(sanitizeBucks(data.bucks));
        setHunts([]);
    }

    function exitReadOnly() {
        try { history.replaceState(null, "", location.pathname + location.search); } catch (error) {}
        location.reload();
    }

    async function makeShareLink() {

        try {
            const code = await encodeSnapshot(buildSnapshot(cameras, stands, trails, features, bucks));
            const url = location.origin + location.pathname + "#view=" + code;

            setShareLink(url);

            let copied = false;
            try { await navigator.clipboard.writeText(url); copied = true; } catch (error) {}

            setShareStatus((copied ? "Link copied. " : "Copy the link below. ") + "It is " + Math.round(url.length / 1000) + "K long" +
                (url.length > 8000 ? "; long links can get cut off in text messages, so the file below is safer." : "."));
        } catch (error) {
            setShareStatus("Couldn't make the link (" + (error && error.message ? error.message : "error") + ").");
        }
    }

    function downloadSnapshotFile() {

        const text = JSON.stringify(buildSnapshot(cameras, stands, trails, features, bucks));
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
        a.download = "deer-snapshot-" + todayString() + ".json";
        a.click();

        setShareStatus("Snapshot file saved. Your partner opens the app, goes to Settings, and chooses \"Open a shared snapshot\".");
    }

    function openSnapshotFile(file) {

        if (!file) return;

        const reader = new FileReader();

        reader.onload = function() {
            try {
                applySnapshot(JSON.parse(reader.result));
                setView("map");
            } catch (error) {
                setShareStatus("That file isn't a Deer Trail Cam snapshot.");
            }
        };

        reader.readAsText(file);
    }

    async function enableAlerts() {

        if (typeof Notification === "undefined") {
            setShareStatus("This browser doesn't support notifications. On iPhone, add the app to the Home Screen first.");
            return;
        }

        const result = await Notification.requestPermission();

        if (result === "granted") {

            pushNotice("Alerts are on", "You'll get a note for new buck photos and tomorrow's best sit while the app is open or running in the background.", "deer-test");
        } else {

    // The wind direction (degrees it blows FROM) the scent cone should use, or null if there's no data
    function scentWindFrom() {

        if (WIND_CODES.indexOf(scentWind) !== -1) return WIND_CODES.indexOf(scentWind) * 45;

        const now = new Date();
        const day = todayString();
        const win = SCORE_CONFIG.primeWindows;

        let w = null;

        if (scentWind === "now") w = forecastWindFrom(forecast, day, now.getHours(), now.getHours() + 1);
        else if (scentWind === "am") w = forecastWindFrom(forecast, day, win[0][0], win[0][1]);
        else if (scentWind === "pm") w = forecastWindFrom(forecast, day, win[1][0], win[1][1]);

        return w ? w.dir : null;
    }
