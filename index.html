        }
        new Notification(title, { body: body, tag: tag });
    } catch (error) {}
}

// Looks for new buck photos and tomorrow's best sit, and sends alerts for them (once each).
// 'sendTest' only makes the first-time baseline; returns a list of {title, body} that were sent.
function runAlertCheck(data, prefs, state, hourNow) {

    const sent = [];
    const seen = new Set(state.seen || []);
    const fresh = [];

    data.cameras.forEach(function(c) {
        c.sightings.forEach(function(sg) {
            if (!isBuckType(sg.deerType) || sg.id === undefined) return;
            const key = c.id + ":" + sg.id;
            if (!seen.has(key)) { seen.add(key); fresh.push({ c: c, sg: sg }); }
        });
    });

    if (state.baselined && prefs.newBuck && fresh.length) {

        const first = fresh[0];
        const named = data.bucks.find(function(b) { return first.sg.buckId !== undefined && String(b.id) === String(first.sg.buckId); });

        sent.push({
            title: fresh.length === 1 ? "New buck photo" : fresh.length + " new buck photos",
            body: (named ? named.name + " at " : "") + first.c.name + (first.sg.time ? " · " + first.sg.time : "") + (fresh.length > 1 ? " and " + (fresh.length - 1) + " more" : ""),
            tag: "deer-buck"
        });
    }

    state.seen = Array.from(seen).slice(-1500);
    state.baselined = true;

    if (prefs.tomorrow && hourNow >= 16 && data.forecast && data.stands.length) {

        const tmr = addDaysToDate(todayString(), 1);

        if (state.tomorrowFor !== tmr) {

            const plan = planSits(data.stands, data.cameras, data.trails, data.forecast, tmr, null);
            const morning = plan[0];

            if (morning && morning.rows[0] && morning.rows[0].total > 0) {

                state.tomorrowFor = tmr;

                const best = morning.rows[0];

                if (best.okHours > 0 && best.value > 0) {
                    sent.push({ title: "Tomorrow morning: " + best.stand.name, body: "Best stand for the morning sit. " + morning.windText, tag: "deer-tomorrow" });
                }
            }
        }
    }

    return sent;
}

// ---- Shared snapshot (read-only copy of your map, stands, bucks and sightings, without photos) ----
function b64urlEncode(bytes) {
    let bin = "";
    for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function b64urlDecode(text) {
    const bin = atob(text.replace(/-/g, "+").replace(/_/g, "/"));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
}

function buildSnapshot(cameras, stands, trails, features, bucks) {
    return {
        app: "deer-snapshot",
        v: 1,
        when: new Date().toISOString(),
        cameras: cameras.map(function(c) {
            return { ...c, sightings: c.sightings.map(function(sg) { const copy = { ...sg }; delete copy.thumb; return copy; }) };
        }),
        stands: stands, trails: trails, features: features, bucks: bucks
    };
}

async function encodeSnapshot(obj) {

    const json = JSON.stringify(obj);

    if (typeof CompressionStream !== "undefined") {
        const stream = new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"));
        return "g." + b64urlEncode(new Uint8Array(await new Response(stream).arrayBuffer()));
    }

    return "j." + b64urlEncode(new TextEncoder().encode(json));
}

async function decodeSnapshot(text) {

    const kind = text.slice(0, 2);
    const bytes = b64urlDecode(text.slice(2));

    if (kind === "g.") {
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        return JSON.parse(await new Response(stream).text());
    }

    return JSON.parse(new TextDecoder().decode(bytes));
}

// ---- Buck movement: where a buck went each day, in order, and which way he was heading ----
function minutesOfTime(t) {
    const p = String(t || "").split(":").map(Number);
    return Number.isFinite(p[0]) && String(t).indexOf(":") !== -1 ? p[0] * 60 + (p[1] || 0) : null;
}

function clockMin(m) {
    const h = Math.floor(m / 60) % 24, mm = Math.round(m % 60);
    return (h % 12 === 0 ? 12 : h % 12) + ":" + String(mm).padStart(2, "0") + (h < 12 ? " AM" : " PM");
}

// { 'YYYY-MM-DD': [ { camera, min, dir, n } ... in time order ] } - consecutive photos at the same camera count as one stop
function buckDayVisits(st) {

    const days = {};

    st.rows.forEach(function(r) {

        const sg = r.sighting;
        const m = minutesOfTime(sg.time);

        if (!sg.date || m === null) return;

        (days[sg.date] = days[sg.date] || []).push({ camera: r.camera, min: m, dir: sg.direction || "", n: Number(sg.number || 1) });
    });

    Object.keys(days).forEach(function(d) {

        days[d].sort(function(a, b) { return a.min - b.min; });

        const merged = [];

        days[d].forEach(function(v) {
            const last = merged[merged.length - 1];
            if (!last || last.camera.id !== v.camera.id) merged.push(v);
        });

        days[d] = merged;
    });

    return days;
}

// Across all days: how often he went from one camera to the next, and the typical order of his route
function buckAverageRoute(days) {

    const edges = {}, firsts = {}, minutes = {}, visits = {}, cams = {};
    let maxEdge = 0;

    Object.keys(days).forEach(function(d) {

        const list = days[d];

        list.forEach(function(v, i) {
            const id = String(v.camera.id);
            cams[id] = v.camera;
            visits[id] = (visits[id] || 0) + 1;
            (minutes[id] = minutes[id] || []).push(v.min);
            if (i === 0) firsts[id] = (firsts[id] || 0) + 1;
            if (i > 0 && v.min - list[i - 1].min <= 8 * 60) {
                const key = list[i - 1].camera.id + ">" + v.camera.id;
                edges[key] = (edges[key] || { from: String(list[i - 1].camera.id), to: id, count: 0 });
                edges[key].count++;
                if (edges[key].count > maxEdge) maxEdge = edges[key].count;
            }
        });
    });

    // typical route: begin at the camera he's most often seen at first, then keep following his most common next camera
    const ids = Object.keys(cams);
    const route = [];

    if (ids.length) {

        let current = ids.slice().sort(function(a, b) { return (firsts[b] || 0) - (firsts[a] || 0) || visits[b] - visits[a]; })[0];

        while (current && route.indexOf(current) === -1) {
            route.push(current);
            const next = Object.keys(edges).map(function(k) { return edges[k]; })
                .filter(function(ed) { return ed.from === current && route.indexOf(ed.to) === -1; })
                .sort(function(a, b) { return b.count - a.count; })[0];
            current = next ? next.to : null;
        }
    }

    const avgMin = {};
    ids.forEach(function(id) { avgMin[id] = minutes[id].reduce(function(a, b) { return a + b; }, 0) / minutes[id].length; });

    return { edges: Object.keys(edges).map(function(k) { return edges[k]; }), maxEdge: maxEdge, cams: cams, visits: visits, avgMin: avgMin, route: route };
}

// Draws his movement on a sketch of your cameras. day = "all" (average route) or one date (that day's path, numbered).
function buckPathMap(days, cameras, day, uid) {

    const W = 320, H = 210, pad = 28;
    const lats = cameras.map(function(c) { return c.lat; }), lngs = cameras.map(function(c) { return c.lng; });

    if (!cameras.length) return null;

    const minLat = Math.min.apply(null, lats), maxLat = Math.max.apply(null, lats);
    const minLng = Math.min.apply(null, lngs), maxLng = Math.max.apply(null, lngs);
    const k = Math.cos((minLat + maxLat) / 2 * Math.PI / 180);
    const spanX = Math.max((maxLng - minLng) * k, 1e-6), spanY = Math.max(maxLat - minLat, 1e-6);
    const scale = Math.min((W - 2 * pad) / spanX, (H - 2 * pad) / spanY);
    const offX = (W - spanX * scale) / 2, offY = (H - spanY * scale) / 2;

    function px(c) { return offX + (c.lng - minLng) * k * scale; }
    function py(c) { return offY + (maxLat - c.lat) * scale; }

    const kids = [
        e("defs", { key: "defs" },
            e("marker", { id: "arr" + uid, markerWidth: 8, markerHeight: 8, refX: 6, refY: 4, orient: "auto" }, e("path", { d: "M0,0 L8,4 L0,8 z", fill: "#7b1e1e" })),
            e("marker", { id: "hd" + uid, markerWidth: 8, markerHeight: 8, refX: 6, refY: 4, orient: "auto" }, e("path", { d: "M0,0 L8,4 L0,8 z", fill: "#1f4d2b" }))),
        e("rect", { key: "bg", x: 0, y: 0, width: W, height: H, rx: 8, fill: "#f2f2ee", stroke: "#ddd" })
    ];

    function arrowLine(key, a, b, width, opacity, markerId, trim) {
        const dx = px(b) - px(a), dy = py(b) - py(a), len = Math.hypot(dx, dy) || 1;
        return e("line", { key: key, x1: px(a) + dx / len * trim, y1: py(a) + dy / len * trim, x2: px(b) - dx / len * trim, y2: py(b) - dy / len * trim, stroke: "#7b1e1e", strokeWidth: width, strokeOpacity: opacity, markerEnd: "url(#" + markerId + ")" });
    }

    const seen = {};

    if (day === "all") {

        const avg = buckAverageRoute(days);

        cameras.forEach(function(c) {
            const id = String(c.id);
            const used = !!avg.visits[id];
            kids.push(e("circle", { key: "c" + id, cx: px(c), cy: py(c), r: used ? 6 + Math.min(8, avg.visits[id]) : 3.5, fill: used ? "#7b1e1e" : "#b8b8b8", fillOpacity: used ? 0.8 : 1, stroke: "#fff", strokeWidth: 1.5 }));
            if (used) kids.push(e("text", { key: "t" + id, x: px(c), y: py(c) - 12 - Math.min(8, avg.visits[id]), textAnchor: "middle", fontSize: 10, fill: "#333" }, c.name));
        });

        avg.edges.forEach(function(ed, i) {
            const a = avg.cams[ed.from], b = avg.cams[ed.to];
            if (!a || !b) return;
            kids.push(arrowLine("e" + i, a, b, 1.5 + 4 * ed.count / Math.max(1, avg.maxEdge), 0.7, "arr" + uid, 11));
        });

    } else {

        const list = days[day] || [];

        cameras.forEach(function(c) {
            kids.push(e("circle", { key: "c" + c.id, cx: px(c), cy: py(c), r: 3.5, fill: "#b8b8b8", stroke: "#fff", strokeWidth: 1 }));
        });

        list.forEach(function(v, i) {

            if (i > 0) kids.push(arrowLine("p" + i, list[i - 1].camera, v.camera, 3, 0.85, "arr" + uid, 11));

            const c = v.camera;
            kids.push(e("circle", { key: "v" + i, cx: px(c), cy: py(c), r: 9, fill: "#7b1e1e", stroke: "#fff", strokeWidth: 1.5 }));
            kids.push(e("text", { key: "n" + i, x: px(c), y: py(c) + 3.5, textAnchor: "middle", fontSize: 11, fontWeight: 700, fill: "#fff" }, i + 1));
            kids.push(e("text", { key: "l" + i, x: px(c), y: py(c) - 14, textAnchor: "middle", fontSize: 10, fill: "#333" }, c.name));

            // which way he was heading when the camera saw him
            if (DIRECTION_BEARINGS.hasOwnProperty(v.dir)) {
                const ang = DIRECTION_BEARINGS[v.dir] * Math.PI / 180;
                kids.push(e("line", { key: "h" + i, x1: px(c) + Math.sin(ang) * 11, y1: py(c) - Math.cos(ang) * 11, x2: px(c) + Math.sin(ang) * 28, y2: py(c) - Math.cos(ang) * 28, stroke: "#1f4d2b", strokeWidth: 2.5, markerEnd: "url(#hd" + uid + ")" }));
            }
        });
    }

    kids.push(e("text", { key: "north", x: W - 14, y: 16, textAnchor: "middle", fontSize: 11, fill: "#666" }, "N ↑"));

    return e("svg", { viewBox: "0 0 " + W + " " + H, style: { width: "100%", maxWidth: "460px", display: "block" } }, kids);
}

// A real satellite map of a buck's movement, with a full-screen button.
// day = "all" (average route between cameras) or one date (numbered path for that day with heading arrows).
function BuckMap(props) {

    const boxRef = useRef(null);
    const mapRef = useRef(null);
    const layerRef = useRef(null);
    const [full, setFull] = useState(false);

    // build the map once
    useEffect(function() {

        if (!boxRef.current || typeof L === "undefined") return;

        const map = L.map(boxRef.current, { zoomControl: true, attributionControl: false, maxZoom: 19 });

        L.tileLayer(TILE_URL, { maxZoom: 19 }).addTo(map);

        mapRef.current = map;
        layerRef.current = L.layerGroup().addTo(map);

        return function() {
            try { map.remove(); } catch (error) {}
            mapRef.current = null;
            layerRef.current = null;
        };

    }, []);

    // draw the buck's cameras and route; redraw when the day changes or the size changes
    useEffect(function() {

        const map = mapRef.current, group = layerRef.current;

        if (!map || !group) return;

        group.clearLayers();

        const days = props.days, day = props.day;
        const red = "#ff5a4d", green = "#7CFC8A";
        const fitPoints = [];

        function arrowIcon(bearing, color, size) {
            return L.divIcon({
                html: '<div style="transform:rotate(' + bearing + 'deg);color:' + color + ';font-size:' + size + 'px;line-height:' + size + 'px;text-shadow:0 0 3px #000,0 0 3px #000;text-align:center">▲</div>',
                className: "",
                iconSize: [size, size],
                iconAnchor: [size / 2, size / 2]
            });
        }

        function midArrow(a, b, color) {
            const bearing = bearingBetween(a.lat, a.lng, b.lat, b.lng);
            const f = 0.6;
            L.marker([a.lat + (b.lat - a.lat) * f, a.lng + (b.lng - a.lng) * f], { icon: arrowIcon(bearing, color, 20), interactive: false }).addTo(group);
        }

        function nameTag(c, extra) {
            L.marker([c.lat, c.lng], {
                interactive: false,
                icon: L.divIcon({
                    html: '<div style="color:#fff;font-size:12px;font-weight:600;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap;transform:translate(-50%,-26px)">' + c.name + (extra || "") + '</div>',
                    className: "",
                    iconSize: [0, 0]
                })
            }).addTo(group);
        }

        if (day === "all") {

            const avg = buckAverageRoute(days);

            props.cameras.forEach(function(c) {

                const id = String(c.id);
                const used = !!avg.visits[id];

                L.circleMarker([c.lat, c.lng], {
                    radius: used ? 7 + Math.min(9, avg.visits[id]) : 4,
                    color: "#fff", weight: 2, fillColor: used ? red : "#b8b8b8", fillOpacity: used ? 0.85 : 0.9
                }).addTo(group);

                if (used) {
                    fitPoints.push([c.lat, c.lng]);
                    nameTag(c, " · ~" + clockMin(avg.avgMin[id]));
                }
            });

            avg.edges.forEach(function(ed) {
                const a = avg.cams[ed.from], b = avg.cams[ed.to];
                if (!a || !b) return;
                L.polyline([[a.lat, a.lng], [b.lat, b.lng]], { color: red, weight: 2 + 5 * ed.count / Math.max(1, avg.maxEdge), opacity: 0.85, interactive: false }).addTo(group);
                midArrow(a, b, red);
            });

        } else {

            const list = days[day] || [];

            props.cameras.forEach(function(c) {
                L.circleMarker([c.lat, c.lng], { radius: 4, color: "#fff", weight: 1.5, fillColor: "#b8b8b8", fillOpacity: 0.9 }).addTo(group);
            });

            list.forEach(function(v, i) {

                const c = v.camera;

                fitPoints.push([c.lat, c.lng]);

                if (i > 0) {
                    const p = list[i - 1].camera;
                    L.polyline([[p.lat, p.lng], [c.lat, c.lng]], { color: red, weight: 4, opacity: 0.9, interactive: false }).addTo(group);
                    midArrow(p, c, red);
                }

                // which way he was heading when this camera saw him
                if (DIRECTION_BEARINGS.hasOwnProperty(v.dir)) {
                    const bearing = DIRECTION_BEARINGS[v.dir];
                    const tip = pointAt(c.lat, c.lng, bearing, 35);
                    L.polyline([[c.lat, c.lng], tip], { color: green, weight: 3, opacity: 0.95, interactive: false }).addTo(group);
                    L.marker(tip, { icon: arrowIcon(bearing, green, 18), interactive: false }).addTo(group);
                }

                L.marker([c.lat, c.lng], {
                    icon: L.divIcon({
                        html: '<div style="width:24px;height:24px;border-radius:50%;background:' + red + ';color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.6)">' + (i + 1) + '</div>',
                        className: "",
                        iconSize: [24, 24],
                        iconAnchor: [12, 12]
                    })
                }).addTo(group);

                nameTag(c, " · " + clockMin(v.min));
            });
        }

        // zoom to what was drawn (or to all cameras if nothing was)
        const all = fitPoints.length ? fitPoints : props.cameras.map(function(c) { return [c.lat, c.lng]; });

        map.invalidateSize();

        if (all.length === 1) {
            map.setView(all[0], 17);
        } else if (all.length > 1) {
            map.fitBounds(all, { padding: [50, 50], maxZoom: 18 });
        }

    }, [props.day, props.days, props.cameras, full]);

    // Esc closes full screen
    useEffect(function() {

        if (!full) return;

        function onKey(ev) { if (ev.key === "Escape") setFull(false); }

        document.addEventListener("keydown", onKey);

        return function() { document.removeEventListener("keydown", onKey); };

    }, [full]);

    return e(
        "div",
        {
            style: full
                ? { position: "fixed", top: 0, left: 0, right: 0, bottom: 0, zIndex: 5000, background: "#000" }
                : { position: "relative", margin: "6px 0" }
        },
        e("div", { ref: boxRef, style: { width: "100%", height: full ? "100%" : "300px", borderRadius: full ? 0 : "8px", overflow: "hidden", background: "#222" } }),
        e("div", { style: { position: "absolute", top: full ? "calc(env(safe-area-inset-top, 0px) + 10px)" : "10px", right: "10px", zIndex: 1200, display: "flex", gap: "6px", maxWidth: "calc(100% - 70px)" } },
            full && props.dayOptions
                ? e("select", { value: props.day, style: { maxWidth: "220px" }, onChange: function(ev) { props.onDay(ev.target.value); } },
                    props.dayOptions.map(function(o) { return e("option", { key: o[0], value: o[0] }, o[1]); }))
                : null,
            e("button", { className: "primary", style: { minHeight: 0, padding: "6px 12px" }, onClick: function() { setFull(!full); } }, full ? "✕ Close" : "⛶ Full screen")),
        full
            ? e("div", { style: { position: "absolute", left: "10px", bottom: "calc(env(safe-area-inset-bottom, 0px) + 14px)", zIndex: 1200, background: "rgba(0,0,0,.65)", color: "#fff", padding: "6px 10px", borderRadius: "8px", fontSize: "13px", maxWidth: "70%" } },
                (props.title || "") + (props.day === "all" ? " · average route (red arrows = camera to camera, thicker = more often)" : " · " + props.day + " (numbers = order, green arrows = heading)"))
            : null
    );
}

// A small sketch of where a buck has been seen: bigger dot = more sightings. Grey dots are your other cameras.
function buckMiniMap(st, cameras) {

    const mine = {};
    st.rows.forEach(function(r) { mine[String(r.camera.id)] = (mine[String(r.camera.id)] || 0) + 1; });

    if (!cameras.length || !Object.keys(mine).length) return null;

    const W = 300, H = 170, pad = 22;
    const lats = cameras.map(function(c) { return c.lat; }), lngs = cameras.map(function(c) { return c.lng; });
    const minLat = Math.min.apply(null, lats), maxLat = Math.max.apply(null, lats);
    const minLng = Math.min.apply(null, lngs), maxLng = Math.max.apply(null, lngs);
    const k = Math.cos((minLat + maxLat) / 2 * Math.PI / 180);
    const spanX = Math.max((maxLng - minLng) * k, 1e-6), spanY = Math.max(maxLat - minLat, 1e-6);
    const scale = Math.min((W - 2 * pad) / spanX, (H - 2 * pad) / spanY);
    const offX = (W - spanX * scale) / 2, offY = (H - spanY * scale) / 2;
    const maxCount = Math.max.apply(null, Object.keys(mine).map(function(key) { return mine[key]; }));

    function px(c) { return offX + (c.lng - minLng) * k * scale; }
    function py(c) { return offY + (maxLat - c.lat) * scale; }

    const kids = [e("rect", { key: "bg", x: 0, y: 0, width: W, height: H, rx: 8, fill: "#f2f2ee", stroke: "#ddd" })];

    cameras.forEach(function(c) {
        if (mine[String(c.id)]) return;
        kids.push(e("circle", { key: "o" + c.id, cx: px(c), cy: py(c), r: 4, fill: "#b8b8b8" }));
    });

    cameras.forEach(function(c) {
        const n = mine[String(c.id)];
        if (!n) return;
        kids.push(e("circle", { key: "m" + c.id, cx: px(c), cy: py(c), r: 6 + 10 * n / maxCount, fill: "#7b1e1e", fillOpacity: 0.75, stroke: "#fff", strokeWidth: 1.5 },
            e("title", null, c.name + ": " + n)));
        kids.push(e("text", { key: "t" + c.id, x: px(c), y: py(c) - 10 - 10 * n / maxCount, textAnchor: "middle", fontSize: 10, fill: "#333" }, c.name));
    });

    return e("svg", { viewBox: "0 0 " + W + " " + H, style: { width: "100%", maxWidth: "420px", display: "block" } }, kids);
}

// ---- Rut tracker: deer seen per week of the season, one line per season ----
// Week 0 starts on 1 August. 'sightings' is a flat list of sightings; onlyBucks counts bucks only.
function rutWeekly(sightings, onlyBucks) {

    const bySeason = {};

    sightings.forEach(function(sg) {

        if (!sg.date) return;
        if (onlyBucks && !isBuckType(sg.deerType)) return;

        const year = seasonOf(sg.date);
        if (year === null) return;

        const start = new Date(year, 7, 1, 12).getTime();
        const when = new Date(sg.date + "T12:00:00").getTime();
        const week = Math.floor((when - start) / (7 * 86400000));

        if (week < 0 || week > 34) return;

        const list = bySeason[year] || (bySeason[year] = new Array(35).fill(0));
        list[week] += Number(sg.number || 1);
    });

    return Object.keys(bySeason).map(Number).sort(function(a, b) { return a - b; }).map(function(year) {

        const weeks = bySeason[year];
        let peak = 0;
        weeks.forEach(function(v, i) { if (v > weeks[peak]) peak = i; });

        const peakDate = new Date(year, 7, 1 + peak * 7, 12);

        return {
            year: year,
            weeks: weeks,
            total: weeks.reduce(function(a, b) { return a + b; }, 0),
            peakWeek: weeks[peak] > 0 ? peak : null,
            peakCount: weeks[peak],
            peakLabel: weeks[peak] > 0 ? peakDate.toLocaleDateString([], { month: "short", day: "numeric" }) : ""
        };
    });
}

function rutTrackerChart(sightings, onlyBucks) {

    const seasons = rutWeekly(sightings, onlyBucks);

    if (!seasons.length) return chartNote("No dated sightings yet.");

    const palette = ["#9e9e9e", "#2980b9", "#8e44ad", "#c0392b"];
    const W = chartWidth(), H = 240, L = 34, R = 12, T = 12, B = 30;
    const plotW = W - L - R, plotH = H - T - B;
    const n = 35;

    const max = niceMax(Math.max.apply(null, seasons.map(function(sn) { return Math.max.apply(null, sn.weeks); }).concat([1])));

    function xAt(i) { return L + i * plotW / (n - 1); }
    function yAt(v) { return T + plotH - plotH * v / max; }

    const kids = [];

    for (let g = 0; g <= 4; g++) {
        const y = T + plotH - plotH * g / 4;
        kids.push(e("line", { key: "g" + g, x1: L, x2: W - R, y1: y, y2: y, stroke: "#e3e3e3" }));
        kids.push(e("text", { key: "t" + g, x: L - 5, y: y + 3, textAnchor: "end", fontSize: 10, fill: "#666" }, Math.round(max * g / 4 * 10) / 10));
    }

    // month labels along the bottom (week 0 = 1 Aug)
    [["Aug", 0], ["Sep", 4.4], ["Oct", 8.9], ["Nov", 13.1], ["Dec", 17.4], ["Jan", 21.9], ["Feb", 26.3], ["Mar", 30.3]].forEach(function(m) {
        kids.push(e("text", { key: "m" + m[0], x: xAt(m[1]), y: H - 10, textAnchor: "middle", fontSize: 10, fill: "#666" }, m[0]));
    });

    seasons.forEach(function(sn, k) {

        const isNewest = k === seasons.length - 1;
        const color = isNewest ? "#1f4d2b" : palette[k % palette.length];
        const points = sn.weeks.map(function(v, i) { return xAt(i) + "," + yAt(v); }).join(" ");

        kids.push(e("polyline", { key: "l" + k, points: points, fill: "none", stroke: color, strokeWidth: isNewest ? 3 : 1.8, strokeLinejoin: "round" }));

        if (sn.peakWeek !== null) {
            kids.push(e("circle", { key: "p" + k, cx: xAt(sn.peakWeek), cy: yAt(sn.peakCount), r: 5, fill: color },
                e("title", null, seasonLabel(sn.year) + " peak: week of " + sn.peakLabel + " (" + sn.peakCount + ")")));
        }
    });

    return e(
        "div",
        null,
        e("svg", { viewBox: "0 0 " + W + " " + H, className: "chart-svg" }, kids),
        legendRow(seasons.map(function(sn, k) {
            return { label: seasonLabel(sn.year), color: k === seasons.length - 1 ? "#1f4d2b" : palette[k % palette.length] };
        })),
        e("div", { style: { marginTop: "8px", fontSize: "14px" } },
            seasons.slice().reverse().map(function(sn) {
                return e("div", { key: sn.year },
                    seasonLabel(sn.year) + ": " + sn.total + (onlyBucks ? " bucks" : " deer") +
                    (sn.peakWeek !== null ? " · busiest week of " + sn.peakLabel + " (" + sn.peakCount + ")" : ""));
            })),
        e("p", { className: "empty", style: { marginBottom: 0 } }, "Each dot marks that season's busiest week. Compare it across years to see when your deer really move.")
    );
}

// ---- Moon, weather and wind helpers ----

// Moon phase for a date (and optional time): { age in days, illum 0-100, name, emoji }
function moonInfo(dateString, timeString) {

    if (!dateString) return null;

    const t = new Date(dateString + "T" + (timeString || "12:00")).getTime();

    if (!Number.isFinite(t)) return null;

    // A known new moon (6 Jan 2000, 18:14 UTC) and the average length of a lunar cycle
    const knownNew = Date.UTC(2000, 0, 6, 18, 14);
    const cycle = 29.530588853;
    const age = (((t - knownNew) / 86400000) % cycle + cycle) % cycle;
    const illum = (1 - Math.cos(2 * Math.PI * age / cycle)) / 2 * 100;

    const phases = [
        [1.85, "New moon", "🌑"], [5.54, "Waxing crescent", "🌒"], [9.22, "First quarter", "🌓"],
        [12.91, "Waxing gibbous", "🌔"], [16.61, "Full moon", "🌕"], [20.30, "Waning gibbous", "🌖"],
        [23.99, "Last quarter", "🌗"], [27.68, "Waning crescent", "🌘"], [99, "New moon", "🌑"]
    ];

    const found = phases.find(function(p) { return age < p[0]; });

    return { age: age, illum: illum, name: found[1], emoji: found[2] };
}

// The 8 compass codes, and the code for a wind direction in degrees (0 = wind from the north)
const WIND_CODES = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];

function windCode(degrees) {
    return WIND_CODES[Math.round((((degrees % 360) + 360) % 360) / 45) % 8];
}

// Where the weather lookups are made: the middle of your cameras (or stands)
function propertyCenter(cameras, stands) {

    const spots = cameras.concat(stands).filter(function(p) {
        return Number.isFinite(p.lat) && Number.isFinite(p.lng);
    });

    if (!spots.length) return null;

    return {
        lat: spots.reduce(function(a, p) { return a + p.lat; }, 0) / spots.length,
        lng: spots.reduce(function(a, p) { return a + p.lng; }, 0) / spots.length
    };
}

// Open-Meteo is a free weather service that needs no account. These are the hourly values we ask for.
const WEATHER_VARS = "temperature_2m,wind_speed_10m,wind_direction_10m,pressure_msl";
const WEATHER_UNITS = "&timezone=auto";  // (the service sends °C and km/h; we convert to °F and mph ourselves)

// Throws an error that includes the weather service's own explanation (it sends a 'reason' with a 400 error)
async function weatherError(response) {

    let reason = "";

    try { reason = (await response.json()).reason || ""; } catch (error) {}

    return new Error("Weather service error " + response.status + (reason ? ": " + reason : ""));
}

// Turns Open-Meteo's answer into a list of { time, temp, speed, dir, pressure }
function parseHourly(json) {

    if (!json || !json.hourly || !Array.isArray(json.hourly.time)) return [];

    const h = json.hourly;

    return h.time.map(function(time, i) {
        return {
            time: time,
            temp: h.temperature_2m && h.temperature_2m[i] !== null ? h.temperature_2m[i] * 9 / 5 + 32 : null,
            speed: h.wind_speed_10m && h.wind_speed_10m[i] !== null ? h.wind_speed_10m[i] * 0.621371 : null,
            dir: h.wind_direction_10m ? h.wind_direction_10m[i] : null,
            pressure: h.pressure_msl ? h.pressure_msl[i] : null
        };
    });
}

// Adds days to a YYYY-MM-DD string
function addDaysToDate(dateString, n) {
    const d = new Date(dateString + "T12:00:00");
    d.setDate(d.getDate() + n);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

// Today's date as YYYY-MM-DD on this device
function todayString() {
    return addDaysToDate(new Date().getFullYear() + "-" + String(new Date().getMonth() + 1).padStart(2, "0") + "-" + String(new Date().getDate()).padStart(2, "0"), 0);
}

const dayWeatherMemory = {};  // weather already downloaded this session, so we don't ask twice

// Hourly weather for one calendar day at a spot (also fetches the day before, to work out pressure change).
// Returns { "YYYY-MM-DDTHH:00": { time, temp, speed, dir, pressure } }.
async function fetchDayWeather(lat, lng, date) {

    const key = lat.toFixed(2) + "," + lng.toFixed(2) + "," + date;

    if (dayWeatherMemory[key]) return dayWeatherMemory[key];

    const daysAgo = (Date.now() - new Date(date + "T12:00:00").getTime()) / 86400000;

    // Recent days come from the forecast service (which keeps ~3 months back); older days from the archive
    const base = daysAgo < 80
        ? "https://api.open-meteo.com/v1/forecast"
        : "https://archive-api.open-meteo.com/v1/archive";

    const url = base + "?latitude=" + lat.toFixed(4) + "&longitude=" + lng.toFixed(4) +
        "&hourly=" + WEATHER_VARS + WEATHER_UNITS +
        "&start_date=" + addDaysToDate(date, -1) + "&end_date=" + date;

    const response = await fetch(url);

    if (!response.ok) throw await weatherError(response);

    const byTime = {};

    parseHourly(await response.json()).forEach(function(row) { byTime[row.time] = row; });

    dayWeatherMemory[key] = byTime;

    return byTime;
}

// The weather summary stored on a sighting, from a day's hourly data: { temp, wind, dir, pressure, change }
function conditionsAt(byTime, date, time) {

    const hour = Number(String(time).split(":")[0]);

    if (!Number.isFinite(hour)) return null;

    function keyFor(dateString, h) {
        return dateString + "T" + String(h).padStart(2, "0") + ":00";
    }

    const now = byTime[keyFor(date, hour)];

    if (!now || now.temp === null) return null;

    // pressure 3 hours earlier (may be on the previous day)
    const earlierHour = hour - 3;
    const earlier = byTime[earlierHour >= 0 ? keyFor(date, earlierHour) : keyFor(addDaysToDate(date, -1), 24 + earlierHour)];

    return {
        temp: Math.round(now.temp),
        wind: Math.round(now.speed || 0),
        dir: Math.round(now.dir || 0),
        pressure: now.pressure !== null ? Math.round(now.pressure * 10) / 10 : null,
        change: earlier && earlier.pressure !== null && now.pressure !== null ? Math.round((now.pressure - earlier.pressure) * 10) / 10 : null
    };
}

// One line of text for a sighting's conditions, e.g. "🌔 Waxing gibbous 71% · 42°F · wind NW 8 mph · pressure falling"
function conditionsText(sighting) {

    const parts = [];
    const moon = moonInfo(sighting.date, sighting.time);

    if (moon) parts.push(moon.emoji + " " + moon.name + " " + Math.round(moon.illum) + "%");

    const w = sighting.weather;

    if (w) {
        parts.push(w.temp + "°F");
        parts.push("wind " + (w.wind < 2 ? "calm" : windCode(w.dir) + " " + w.wind + " mph"));
        if (w.change !== null && w.change !== undefined) {
            parts.push("pressure " + (w.change <= -1 ? "falling" : w.change >= 1 ? "rising" : "steady"));
        }
    }

    return parts.join(" · ");
}

// Is the wind OK for a stand? (empty safe list = any wind; calm wind is always OK)
function windOkForStand(stand, dirDegrees, speed) {

    if (!stand.safeWinds || !stand.safeWinds.length) return true;

    if (speed !== null && speed !== undefined && speed < 3) return true;

    return stand.safeWinds.indexOf(windCode(dirDegrees)) !== -1;
}

// Loads the last forecast saved on this device
const FORECAST_KEY = "deerForecast";

function getSavedForecast() {
    try {
        const saved = JSON.parse(localStorage.getItem(FORECAST_KEY));
        return saved && Array.isArray(saved.hours) ? saved : null;
    } catch {
        return null;
    }
}

// Downloads a 3-day hourly forecast for a spot
async function fetchForecast(lat, lng) {

    if (!Number.isFinite(lat) || !Number.isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) {
        throw new Error("The camera/stand locations aren't valid coordinates (" + lat + ", " + lng + ")");
    }

    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat.toFixed(4) + "&longitude=" + lng.toFixed(4) +
        "&hourly=" + WEATHER_VARS + WEATHER_UNITS + "&forecast_days=3";

    const response = await fetch(url);

    if (!response.ok) throw await weatherError(response);

    const forecast = { fetchedAt: Date.now(), lat: lat, lng: lng, hours: parseHourly(await response.json()) };

    try { localStorage.setItem(FORECAST_KEY, JSON.stringify(forecast)); } catch (error) {}

    return forecast;
}

// ---- Weather learning (optional): what your sightings say about weather ----
const HIST_KEY = "deerHistWeather";

function getSavedHist() {
    try {
        const saved = JSON.parse(localStorage.getItem(HIST_KEY));
        return saved && Array.isArray(saved.rows) ? saved : null;
    } catch {
        return null;
    }
}

// Hourly weather for a date range at a spot (archive for older days, forecast service for recent ones)
async function fetchRangeWeather(lat, lng, startDate, endDate) {

    const today = todayString();
    const archiveEnd = addDaysToDate(today, -7);  // the archive runs about a week behind
    const rows = [];

    async function get(base, from, to) {

        const url = base + "?latitude=" + lat.toFixed(4) + "&longitude=" + lng.toFixed(4) +
            "&hourly=" + WEATHER_VARS + WEATHER_UNITS + "&start_date=" + from + "&end_date=" + to;

        const response = await fetch(url);

        if (!response.ok) throw await weatherError(response);

        parseHourly(await response.json()).forEach(function(r) { rows.push(r); });
    }

    if (startDate <= archiveEnd) {
        await get("https://archive-api.open-meteo.com/v1/archive", startDate, endDate < archiveEnd ? endDate : archiveEnd);
    }

    const recentStart = startDate > archiveEnd ? startDate : addDaysToDate(archiveEnd, 1);

    if (recentStart <= endDate) {
        await get("https://api.open-meteo.com/v1/forecast", recentStart, endDate);
    }

    return rows.filter(function(r) { return r.temp !== null; }).map(function(r) {
        return [r.time, Math.round(r.temp), Math.round((r.speed || 0) * 10) / 10, Math.round(r.dir || 0), r.pressure !== null ? Math.round(r.pressure * 10) / 10 : null];
    });
}

// Which weather 'bins' an hour falls in: pressure trend, temperature band, wind strength
function conditionBins(temp, speed, pressure, pressureBefore) {

    const bins = {};

    if (pressure !== null && pressure !== undefined && pressureBefore !== null && pressureBefore !== undefined) {
        const change = pressure - pressureBefore;
        bins.pressure = change <= -1 ? "Falling" : change >= 1 ? "Rising" : "Steady";
    }

    if (temp !== null && temp !== undefined) {
        const t = temp < 20 ? "<20°" : temp >= 70 ? "70°+" : (Math.floor(temp / 10) * 10) + "s";
        bins.temp = t;
    }

    if (speed !== null && speed !== undefined) {
        bins.wind = speed < 5 ? "Calm" : speed < 12 ? "Breezy" : "Windy";
    }

    return bins;
}

// Learns how many deer you see per hour under each weather condition, during the prime windows.
// Each condition gets a factor: 1 = average, 1.3 = 30% more deer than usual, 0.7 = fewer.
// Conditions with little data are pulled toward 1 (weatherPriorHours controls how strongly).
function learnWeatherFactors(cameras, hist) {

    const cfg = SCORE_CONFIG;
    const byKey = {};

    hist.rows.forEach(function(r) { byKey[r[0]] = r; });

    function keyFor(dateString, h) { return dateString + "T" + String(h).padStart(2, "0") + ":00"; }

    function binsAt(dateString, h) {
        const row = byKey[keyFor(dateString, h)];
        if (!row) return null;
        const before = h >= 3 ? byKey[keyFor(dateString, h - 3)] : byKey[keyFor(addDaysToDate(dateString, -1), 24 + h - 3)];
        return conditionBins(row[1], row[2], row[4], before ? before[4] : null);
    }

    const hours = [];
    cfg.primeWindows.forEach(function(w) { for (let h = w[0]; h < w[1]; h++) hours.push(h); });

    // history starts at the first sighting and runs to yesterday
    let first = null;
    cameras.forEach(function(c) { c.sightings.forEach(function(sg) { if (sg.date && (first === null || sg.date < first)) first = sg.date; }); });

    const model = { ready: false, days: 0, deer: 0, reason: "", bins: { pressure: {}, temp: {}, wind: {} } };

    if (first === null) { model.reason = "No sightings yet."; return model; }

    const yesterday = addDaysToDate(todayString(), -1);
    const exposure = { pressure: {}, temp: {}, wind: {} };
    const deer = { pressure: {}, temp: {}, wind: {} };
    let totalE = 0, totalC = 0;

    for (let d = first, guard = 0; d <= yesterday && guard < 400; d = addDaysToDate(d, 1), guard++) {

        model.days++;

        hours.forEach(function(h) {
            const b = binsAt(d, h);
            if (!b) return;
            totalE++;
            Object.keys(b).forEach(function(dim) { exposure[dim][b[dim]] = (exposure[dim][b[dim]] || 0) + 1; });
        });
    }

    cameras.forEach(function(camera) {
        camera.sightings.forEach(function(sg) {

            const h = hourOfSighting(sg);

            if (!sg.date || h === null || hours.indexOf(h) === -1 || sg.date > yesterday) return;

            const b = binsAt(sg.date, h);

            if (!b) return;

            const n = Number(sg.number || 1);
            totalC += n;
            Object.keys(b).forEach(function(dim) { deer[dim][b[dim]] = (deer[dim][b[dim]] || 0) + n; });
        });
    });

    model.deer = totalC;

    if (model.days < cfg.weatherMinDays) { model.reason = "Needs " + cfg.weatherMinDays + " days of history (have " + model.days + ")."; return model; }
    if (totalC < 20 || totalE === 0) { model.reason = "Needs at least 20 deer seen in the prime windows (have " + totalC + ")."; return model; }

    const overall = totalC / totalE;
    const m = cfg.weatherPriorHours;

    Object.keys(exposure).forEach(function(dim) {
        Object.keys(exposure[dim]).forEach(function(label) {
            const E = exposure[dim][label];
            const C = deer[dim][label] || 0;
            const factor = Math.max(0.5, Math.min(2, (C + m * overall) / ((E + m) * overall)));
            model.bins[dim][label] = { hours: E, deer: C, factor: factor };
        });
    });

    model.ready = true;

    return model;
}

// The factor to apply to an hour of forecast: average (geometric) of the factors of its conditions
function weatherFactorFor(model, temp, speed, pressure, pressureBefore) {

    if (!model || !model.ready) return 1;

    const b = conditionBins(temp, speed, pressure, pressureBefore);
    let product = 1, count = 0;

    Object.keys(b).forEach(function(dim) {
        const bin = model.bins[dim] && model.bins[dim][b[dim]];
        if (bin) { product *= bin.factor; count++; }
    });

    return count ? Math.pow(product, 1 / count) : 1;
}

// ---- BEST STAND planner ----
// For one day's forecast, each prime window (morning / evening) gets the stand with the most hour-by-hour score
// during the hours when the wind is OK for that stand.
function planSits(stands, cameras, trails, forecast, dateString, model) {

    const scores = {};

    stands.forEach(function(stand) {
        scores[stand.id] = standScore(stand, cameras, trails, Date.now()).hours;
    });

    const byHour = {};
    const byKey = {};

    (forecast ? forecast.hours : []).forEach(function(row) {
        byKey[row.time] = row;
        if (row.time.slice(0, 10) === dateString) byHour[Number(row.time.slice(11, 13))] = row;
    });

    // weather factor for a forecast hour (1 when weather learning is off or not ready)
    function factorAt(h) {

        const row = byHour[h];

        if (!row || !model || !model.ready) return 1;

        const earlier = h >= 3 ? byKey[dateString + "T" + String(h - 3).padStart(2, "0") + ":00"] : null;

        return weatherFactorFor(model, row.temp, row.speed, row.pressure, earlier ? earlier.pressure : null);
    }

    return SCORE_CONFIG.primeWindows.map(function(w) {

        const rows = stands.map(function(stand) {

            let value = 0, okHours = 0, total = 0;

            for (let h = w[0]; h < w[1]; h++) {

                const wx = byHour[h];

                if (!wx) continue;

                total++;

                if (windOkForStand(stand, wx.dir, wx.speed)) {
                    okHours++;
                    value += (scores[stand.id][h] || 0) * factorAt(h);
                }
            }

            return { stand: stand, value: value, okHours: okHours, total: total };
        });

        rows.sort(function(a, b) { return b.value - a.value || b.okHours - a.okHours; });

        // typical wind during the window
        const winds = [];
        for (let h = w[0]; h < w[1]; h++) if (byHour[h]) winds.push(byHour[h]);

        let windText = "no forecast for these hours";

        if (winds.length) {
            const avgSpeed = winds.reduce(function(a, r) { return a + (r.speed || 0); }, 0) / winds.length;
            const x = winds.reduce(function(a, r) { return a + Math.sin((r.dir || 0) * Math.PI / 180); }, 0);
            const y = winds.reduce(function(a, r) { return a + Math.cos((r.dir || 0) * Math.PI / 180); }, 0);
            const avgDir = (Math.atan2(x, y) * 180 / Math.PI + 360) % 360;
            const avgTemp = winds.reduce(function(a, r) { return a + (r.temp || 0); }, 0) / winds.length;
            windText = (avgSpeed < 2 ? "calm" : windCode(avgDir) + " wind " + Math.round(avgSpeed) + " mph") + " · " + Math.round(avgTemp) + "°F";
        }

        return { window: w, rows: rows, windText: windText };
    });
}

// The planner card: pick Today / Tomorrow / the day after, see the best stand for each prime window
function huntPlannerView(stands, cameras, trails, forecast, dayOffset, onDay, onRefresh, status, onOpenStand, extras) {

    extras = extras || {};

    const date = addDaysToDate(todayString(), dayOffset);

    function clock(h) {
        return (h % 12 === 0 ? 12 : h % 12) + (h < 12 ? " AM" : " PM");
    }

    if (!stands.length) {
        return e("p", { className: "empty" }, "Add stands on the Map tab (and connect cameras to them) to get a best-stand recommendation.");
    }

    const plan = forecast ? planSits(stands, cameras, trails, forecast, date, extras.model) : null;
    const sun = extras.center ? sunTimes(extras.center.lat, extras.center.lng, date) : null;

    return e(
        "div",
        null,

        e(
            "div",
            { style: { display: "flex", gap: "8px", flexWrap: "wrap", marginBottom: "10px" } },
            ["Today", "Tomorrow", "In 2 days"].map(function(label, i) {
                return e("button", { key: label, className: dayOffset === i ? "primary" : "secondary", onClick: function() { onDay(i); } }, label);
            }),
            e("button", { className: "secondary", onClick: onRefresh }, "↻ Refresh forecast")
        ),

        status ? e("p", { className: "empty", style: { margin: "0 0 8px" } }, status) : null,

        // sunrise, sunset and legal shooting light for the chosen day
        sun
            ? e("p", { style: { margin: "0 0 10px", fontSize: "14px" } },
                "☀ Sunrise " + clockText(sun.rise) + " · Sunset " + clockText(sun.set) + " · Shooting light " + clockText(sun.legalStart) + " - " + clockText(sun.legalEnd) +
                " (" + SCORE_CONFIG.legalBufferMinutes + " min either side; check your state's rules)")
            : null,

        // weather learning status
        extras.adjustOn
            ? e("p", { className: "empty", style: { margin: "0 0 10px" } },
                extras.model && extras.model.ready
                    ? "Weather adjustment is ON: hour scores are nudged up or down using " + extras.model.deer + " deer over " + extras.model.days + " days of your history."
                    : "Weather adjustment is on but not active yet. " + (extras.model ? extras.model.reason : "Loading weather history…"))
            : null,

        !forecast
            ? e("p", { className: "empty" }, "No forecast yet. Tap Refresh forecast (needs a connection).")
            : plan.map(function(sit, i) {

                const best = sit.rows[0];
                const hasWind = sit.rows.some(function(r) { return r.okHours > 0; });

                return e(
                    "div",
                    { key: i, className: "card", style: { marginBottom: "10px" } },
                    e("h3", null, (sit.window[0] < 12 ? "Morning" : "Evening") + " sit · " + clock(sit.window[0]) + " - " + clock(sit.window[1])),
                    e("p", { className: "empty", style: { margin: "0 0 8px" } }, "Forecast: " + sit.windText),
                    sun && (new Date(date + "T" + String(sit.window[0]).padStart(2, "0") + ":00:00").getTime() < sun.legalStart || new Date(date + "T" + String(sit.window[1]).padStart(2, "0") + ":00:00").getTime() > sun.legalEnd)
                        ? e("p", { style: { margin: "0 0 8px", fontSize: "13px", color: "#c0392b" } }, "⚠ Part of this window is outside legal shooting light.")
                        : null,
                    !hasWind || !best.total
                        ? e("p", null, best && best.total ? "No stand has a safe wind for this window." : "No forecast hours for this window.")
                        : e(
                            "div",
                            { style: { marginBottom: "8px", fontSize: "15px" } },
                            "Best stand: ",
                            e("strong", { style: { cursor: "pointer", textDecoration: "underline" }, onClick: function() { onOpenStand(best.stand); } }, best.stand.name),
                            best.value > 0 ? " · score " + fmtScore(best.value) : " · wind is fine, but no scored activity yet"
                        ),
                    (function() {
                        if (!hasWind || !best.total || !extras.features) return null;
                        const w = forecastWindFrom(forecast, date, sit.window[0], sit.window[1]);
                        if (!w) return null;
                        const risks = scentRisks(best.stand, cameras, extras.features, w.dir, extras.range || 250);
                        return risks.length
                            ? e("div", { style: { marginBottom: "8px", fontSize: "13px", color: "#c0392b" } },
                                "⚠ Scent: " + risks.slice(0, 3).map(scentRiskText).join("; "))
                            : null;
                    })(),
                    sit.rows.map(function(r) {
                        return e(
                            "div",
                            { key: r.stand.id, style: { display: "flex", justifyContent: "space-between", fontSize: "13px", padding: "2px 0", opacity: r.okHours ? 1 : 0.55 } },
                            e("span", null, r.stand.name),
                            e("span", null, r.total ? (r.okHours + "/" + r.total + " hrs wind OK · " + fmtScore(r.value)) : "—")
                        );
                    })
                );
            }),

        extras.adjustOn && extras.model && extras.model.ready
            ? e("div", { style: { margin: "10px 0" } },
                e("div", { style: { fontWeight: 600, marginBottom: "4px" } }, "What your sightings say about weather"),
                ["pressure", "temp", "wind"].map(function(dim) {
                    return e("div", { key: dim, style: { fontSize: "13px", marginBottom: "2px" } },
                        (dim === "pressure" ? "Pressure: " : dim === "temp" ? "Temperature: " : "Wind: ") +
                        Object.keys(extras.model.bins[dim]).sort().map(function(label) {
                            const b = extras.model.bins[dim][label];
                            return label + " x" + b.factor.toFixed(2) + " (" + b.deer + " deer / " + b.hours + " hrs)";
                        }).join(" · "));
                }),
                e("div", { className: "empty", style: { fontSize: "12px" } }, "x1.00 = average. These are pulled toward 1 when there is little data, so early numbers are cautious."))
            : null,

        e("p", { className: "empty", style: { marginBottom: 0 } },
            "Score = the stand's hour-by-hour score (from its connected cameras) added up over the hours when the forecast wind is in the stand's safe list. Set safe winds in each stand's panel.")
    );
}

// Charts of deer seen by moon phase, temperature, wind direction and pressure trend.
// Counts are deer SEEN, so they also depend on how many days had each kind of weather: use them as hints, not proof.
function conditionCharts(sightings) {

    function sum(list) { return list.reduce(function(a, s) { return a + Number(s.number || 1); }, 0); }

    const moonNames = ["New moon", "Waxing crescent", "First quarter", "Waxing gibbous", "Full moon", "Waning gibbous", "Last quarter", "Waning crescent"];
    const moonEmoji = ["🌑", "🌒", "🌓", "🌔", "🌕", "🌖", "🌗", "🌘"];

    const moonItems = moonNames.map(function(name, i) {
        const value = sum(sightings.filter(function(s) { const m = moonInfo(s.date, s.time); return m && m.name === name; }));
        return { label: moonEmoji[i], value: value, title: name + ": " + value + " deer" };
    });

    const withWx = sightings.filter(function(s) { return s.weather; });

    const bands = [["<20", -999, 20], ["20s", 20, 30], ["30s", 30, 40], ["40s", 40, 50], ["50s", 50, 60], ["60s", 60, 70], ["70+", 70, 999]];
    const tempItems = bands.map(function(b) {
        const value = sum(withWx.filter(function(s) { return s.weather.temp >= b[1] && s.weather.temp < b[2]; }));
        return { label: b[0], value: value, title: b[0] + "°F: " + value + " deer" };
    });

    const windItems = WIND_CODES.map(function(code) {
        const value = sum(withWx.filter(function(s) { return s.weather.wind >= 2 && windCode(s.weather.dir) === code; }));
        return { label: code, value: value, title: "Wind from " + code + ": " + value + " deer" };
    });
    windItems.push({ label: "Calm", value: sum(withWx.filter(function(s) { return s.weather.wind < 2; })), title: "Calm" });

    const withP = withWx.filter(function(s) { return s.weather.change !== null && s.weather.change !== undefined; });
    const pressureItems = [
        ["Falling", function(c) { return c <= -1; }],
        ["Steady", function(c) { return c > -1 && c < 1; }],
        ["Rising", function(c) { return c >= 1; }]
    ].map(function(b) {
        const value = sum(withP.filter(function(s) { return b[1](s.weather.change); }));
        return { label: b[0], value: value, title: "Pressure " + b[0].toLowerCase() + ": " + value + " deer" };
    });

    return {
        moon: moonItems,
        temp: tempItems,
        wind: windItems,
        pressure: pressureItems,
        withWeather: withWx.length,
        total: sightings.length
    };
}

// Everything known about one named buck: sightings, cameras, hours, first / last seen
function buckStats(buck, cameras) {

    const rows = [];

    cameras.forEach(function(camera) {
        camera.sightings.forEach(function(sighting) {
            if (sighting.buckId !== undefined && String(sighting.buckId) === String(buck.id)) {
                rows.push({ camera: camera, sighting: sighting });
            }
        });
    });

    rows.sort(function(a, b) {
        return (sightingTime(a.sighting) || 0) - (sightingTime(b.sighting) || 0);
    });

    const hours = [];
    for (let h = 0; h < 24; h++) hours.push(0);

    const byCamera = {};
    let maxPoints = 0;

    rows.forEach(function(r) {
        const h = hourOfSighting(r.sighting);
        if (h !== null) hours[h] += Number(r.sighting.number || 1);
        byCamera[r.camera.name] = (byCamera[r.camera.name] || 0) + 1;
        if (Number(r.sighting.antlerPoints) > maxPoints) maxPoints = Number(r.sighting.antlerPoints);
    });

    return {
        rows: rows,
        hours: hours,
        cameras: Object.keys(byCamera).map(function(name) { return { name: name, count: byCamera[name] }; }).sort(function(a, b) { return b.count - a.count; }),
        maxPoints: maxPoints,
        first: rows.length ? rows[0].sighting.date : "",
        last: rows.length ? rows[rows.length - 1].sighting.date : ""
    };
}

// Days between a YYYY-MM-DD date and today (whole days, never negative)
function daysSince(dateString) {
    if (!dateString) return null;
    const t = new Date(dateString + "T12:00:00").getTime();
    if (!Number.isFinite(t)) return null;
    return Math.max(0, Math.floor((Date.now() - t) / 86400000));
}

// Cameras that need attention:
//   - silent: have had sightings, but none for 'silentDays' days (dead battery or full card?)
//   - overdue: you marked it checked, but not for 'checkDays' days
function maintenanceIssues(cameras, maintenance) {

    const issues = [];

    cameras.forEach(function(camera) {

        let last = "";

        camera.sightings.forEach(function(s) { if (s.date && s.date > last) last = s.date; });

        const silent = last ? daysSince(last) : null;
        const checked = daysSince(camera.lastChecked);
        const problems = [];

        if (silent !== null && silent >= maintenance.silentDays) problems.push("No sightings for " + silent + " days");
        if (checked !== null && checked >= maintenance.checkDays) problems.push("Last checked " + checked + " days ago");

        if (problems.length) issues.push({ camera: camera, problems: problems });
    });

    return issues;
}

// Hours of a sit as overlap fractions: start/end are "HH:MM" strings. Returns an array of 24 numbers.
function sitOverlap(start, end) {

    function toHours(t) {
        const p = String(t || "").split(":").map(Number);
        return Number.isFinite(p[0]) ? p[0] + (p[1] || 0) / 60 : null;
    }

    const a = toHours(start);
    let b = toHours(end);

    const out = [];
    for (let h = 0; h < 24; h++) out.push(0);

    if (a === null) return out;
    if (b === null || b <= a) b = a + 1;  // no end time: assume one hour

    for (let h = 0; h < 24; h++) {
        out[h] = Math.max(0, Math.min(b, h + 1) - Math.max(a, h));
    }

    return out;
}

// ---- Offline map tiles ----
// The satellite map is made of small square pictures ("tiles"). To use the map with no signal, we download the tiles
// for your area ahead of time and keep them on the phone; the service worker (sw.js) serves them when offline.
const TILE_CACHE = "deer-tiles-v1";  // must match sw.js
const TILE_URL = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";

// Tile column / row numbers for a longitude / latitude at a zoom level (standard web map maths)
function lngToTile(lng, z) { return Math.floor((lng + 180) / 360 * Math.pow(2, z)); }
function latToTile(lat, z) {
    const r = lat * Math.PI / 180;
    return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * Math.pow(2, z));
}

// How many tiles cover an area for zoom levels zmin to zmax
function tileCountFor(b, zmin, zmax) {
    let n = 0;
    for (let z = zmin; z <= zmax; z++) {
        n += (lngToTile(b.east, z) - lngToTile(b.west, z) + 1) * (latToTile(b.south, z) - latToTile(b.north, z) + 1);
    }
    return n;
}

// The list of tiles themselves, as { z, x, y }
function tileListFor(b, zmin, zmax) {
    const out = [];
    for (let z = zmin; z <= zmax; z++) {
        const x0 = lngToTile(b.west, z), x1 = lngToTile(b.east, z);
        const y0 = latToTile(b.north, z), y1 = latToTile(b.south, z);
        for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) out.push({ z: z, x: x, y: y });
    }
    return out;
}

function tileUrlFor(t) {
    return TILE_URL.replace("{z}", t.z).replace("{y}", t.y).replace("{x}", t.x);
}

// Wraps a longitude into -180..180. Scrolling the map sideways past the edge of the world makes Leaflet report
// longitudes like -448 for a spot that is really -88, so every saved position is wrapped back.
function wrapLng(lng) {
    const n = Number(lng);
    if (!Number.isFinite(n)) return n;
    return ((((n + 180) % 360) + 360) % 360) - 180;
}

// Named individual bucks: [{ id, name, notes }]

// ---- Google Drive sync ----
// 1. Create a free Google Cloud project, enable the "Google Drive API",
//    set up an OAuth consent screen (External, Testing mode is fine),
//    add yourself as a test user, and create an OAuth Client ID
//    (Application type: Web application) with this site's URL added
//    under "Authorized JavaScript origins".
// 2. Paste that Client ID below.
// Your Google OAuth Client ID goes here (or enter it with the gear button in the header)
const GOOGLE_CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID_HERE.apps.googleusercontent.com";

// Permission we ask Google for: a private app-data area in your Drive (not visible in your normal Drive files)
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.appdata";
// Name of the backup file stored in that private area
const DRIVE_FILE_NAME = "deer-trail-cam-data.json";
const LAST_MODIFIED_KEY = "deerLastModified";  // when data was last edited on this device
const CLIENT_ID_KEY = "deerGoogleClientId";  // a Client ID typed into the app
const SYNCED_AT_KEY = "deerSyncedAt";  // when this device last finished a sync
const SYNCED_REMOTE_KEY = "deerSyncedRemote";  // the Drive file's modified time at that last sync
const WAS_CONNECTED_KEY = "deerDriveWasConnected";  // remembers you connected before, to show 'Not syncing' after a reload

// Time (on this device) of the last successful sync, 0 if never

    return Number(localStorage.getItem(SYNCED_AT_KEY)) || 0;
}

// A Client ID typed into the app (gear button) wins over the one pasted above.
// Use the Client ID typed into the app if there is one, otherwise the one in this file
function getClientId() {
    return localStorage.getItem(CLIENT_ID_KEY) || GOOGLE_CLIENT_ID;
}

// Quick format check: digits, a dash, letters/digits, then .apps.googleusercontent.com
function clientIdLooksValid(id) {
    return /^\d+-[\w-]+\.apps\.googleusercontent\.com$/.test(id || "");
}

// Google sign-in helper object (created once Google's script has loaded)
let driveTokenClient = null;
// Temporary pass from Google; it is only kept in memory, so it is gone after a reload
let driveAccessToken = null;
// Id of our backup file in Drive once we have found or created it
let driveFileId = null;

// Time of the last edit made on this device
function getLastModified() {
    return Number(localStorage.getItem(LAST_MODIFIED_KEY)) || 0;
}

// Record that the data was just edited on this device
function setLastModified(timestamp) {
    localStorage.setItem(LAST_MODIFIED_KEY, String(timestamp));
}

// Sets up Google sign-in. Returns false if Google's script hasn't loaded yet.
function initDriveTokenClient(callback, errorCallback) {

    // Google's sign-in script isn't ready yet
    if (!window.google || !window.google.accounts) {
        return false;
    }

    driveTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: getClientId(),
        scope: DRIVE_SCOPE,
        callback: callback,
        error_callback: errorCallback
    });

    return true;
}

// Opens Google's sign-in / permission popup and calls 'callback' with the result
function requestDriveAccess(callback) {

    if (!driveTokenClient) return;

    driveTokenClient.callback = function(response) {

        if (response && response.access_token) {
            driveAccessToken = response.access_token;
        }

        callback(response);
    };

    driveTokenClient.requestAccessToken({
        prompt: ""
    });
}

// Tells Google to cancel our pass and forgets it
function driveSignOut() {

    if (driveAccessToken && window.google) {
        google.accounts.oauth2.revoke(driveAccessToken, function() {});
    }

    driveAccessToken = null;
    driveFileId = null;
}

// Builds a readable Error from a failed Drive reply (status number plus Google's own message)
async function driveFail(response, what) {

    // Try to read Google's explanation from the reply
    let detail = "";

    try {
        const body = await response.json();

        if (body && body.error && body.error.message) {
            detail = body.error.message;
        }
    } catch (error) {}

    let message = what + " (" + response.status + ")";

    if (detail) {
        message += ": " + detail;
    }

    // 403 usually means the Drive API isn't switched on in Google Cloud, or permission wasn't granted
    if (response.status === 403) {
        message += " — make sure the Google Drive API is enabled in your Google Cloud project and that you allowed access to the app's Drive data.";
    }

    const error = new Error(message);
    error.status = response.status;

    return error;
}

// Looks in the private app-data area for our backup file; returns it (id + modified time) or null
async function driveFindFile() {

    // Search for a file with our name that isn't in the trash
    const query = "name='" + DRIVE_FILE_NAME + "' and trashed=false";

    const url =
        "https://www.googleapis.com/drive/v3/files" +
        "?spaces=appDataFolder" +
        "&fields=" + encodeURIComponent("files(id,modifiedTime)") +
        "&q=" + encodeURIComponent(query);

    const response = await fetch(url, {
        headers: {
            Authorization: "Bearer " + driveAccessToken
        }
    });

    if (!response.ok) {
        throw await driveFail(response, "Drive lookup failed");
    }

    const data = await response.json();

    if (data.files && data.files.length) {
        return data.files[0];
    }

    return null;
}

// Downloads the backup file and returns its contents as data
async function driveDownload(fileId) {

    const response = await fetch(
        "https://www.googleapis.com/drive/v3/files/" +
        fileId +
        "?alt=media",
        {
            headers: {
                Authorization: "Bearer " + driveAccessToken
            }
        }
    );

    if (!response.ok) {
        throw await driveFail(response, "Drive download failed");
    }

    return response.json();
}

// Uploads data to Drive: creates the file if there is no fileId, otherwise replaces the existing file
async function driveUpload(fileId, dataObj) {

    // File details sent along with the data
    const metadata = {
        name: DRIVE_FILE_NAME,
        mimeType: "application/json"
    };

    // New files are created inside the private app-data folder
    if (!fileId) {
        metadata.parents = ["appDataFolder"];
    }

    // Drive expects 'multipart' uploads: details and data separated by a marker line
    const boundary = "deercamboundary";

    // Build the multipart body: details part, then data part
    const body =
        "--" + boundary + "\r\n" +
        "Content-Type: application/json; charset=UTF-8\r\n\r\n" +
        JSON.stringify(metadata) + "\r\n" +
        "--" + boundary + "\r\n" +
        "Content-Type: application/json\r\n\r\n" +
        JSON.stringify(dataObj) + "\r\n" +
        "--" + boundary + "--";

    // PATCH (update) the existing file, or POST (create) a new one; ask Drive to send back id + modified time
    const url = fileId
        ? "https://www.googleapis.com/upload/drive/v3/files/" +
          fileId +
          "?uploadType=multipart&fields=id%2CmodifiedTime"
        : "https://www.googleapis.com/upload/drive/v3/files" +
          "?uploadType=multipart&fields=id%2CmodifiedTime";

    const response = await fetch(url, {
        method: fileId ? "PATCH" : "POST",
        headers: {
            Authorization: "Bearer " + driveAccessToken,
            "Content-Type": "multipart/related; boundary=" + boundary
        },
        body: body
    });

    if (!response.ok) {
        throw await driveFail(response, "Drive upload failed");
    }

    return response.json();
}
