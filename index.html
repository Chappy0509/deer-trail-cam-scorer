<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deer Trail Cam Scorer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

button {
    border: none;
    border-radius: 6px;
    padding: 9px 12px;
    cursor: pointer;
    font-size: 14px;
}

input,
select,
textarea {
    font-family: Arial, sans-serif;
}

header {
    background: #1f4d2b;
    color: white;
    padding: 15px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

.header-buttons {
    display: flex;
    gap: 8px;
}

.header-button {
    background: white;
    color: #1f4d2b;
}

.nav {
    background: #163a20;
    display: flex;
}

.nav button {
    background: transparent;
    color: white;
    border-radius: 0;
    padding: 12px 20px;
}

.nav button.active {
    background: white;
    color: #1f4d2b;
}

.app {
    display: flex;
    height: calc(100vh - 105px);
}

.sidebar {
    width: 360px;
    background: white;
    padding: 18px;
    overflow-y: auto;
    border-right: 1px solid #ddd;
}

#map {
    flex: 1;
    min-height: 400px;
}

h2,
h3 {
    margin-top: 0;
}

.section {
    margin-bottom: 22px;
}

.card {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 13px;
    margin-bottom: 10px;
}

.card h3 {
    margin-bottom: 7px;
}

.card p {
    margin: 5px 0;
    color: #555;
    font-size: 13px;
}

.primary {
    background: #1f4d2b;
    color: white;
}

.danger {
    background: #c0392b;
    color: white;
}

.secondary {
    background: #ddd;
    color: #222;
}

.trail-button {
    width: 100%;
    background: #6b4f2a;
    color: white;
    margin-bottom: 8px;
}

.finish-button {
    width: 100%;
    background: #1f4d2b;
    color: white;
    margin-bottom: 8px;
}

.cancel-button {
    width: 100%;
    background: #777;
    color: white;
}

.form-group {
    margin-bottom: 12px;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 5px;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 9px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

.form-group textarea {
    min-height: 75px;
    resize: vertical;
}

.form-buttons {
    display: flex;
    gap: 8px;
}

.form-buttons button {
    flex: 1;
}

.sighting {
    border-top: 1px solid #ddd;
    padding-top: 10px;
    margin-top: 10px;
}

.sighting:first-child {
    border-top: none;
}

.sighting strong {
    display: block;
}

.sighting small {
    color: #666;
}

.drawing {
    background: #fff3cd;
    border: 1px solid #ffe69c;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 10px;
    font-size: 13px;
}

.dashboard {
    height: calc(100vh - 105px);
    overflow-y: auto;
    padding: 25px;
}

.dashboard-inner {
    max-width: 1400px;
    margin: auto;
}

.dashboard-title {
    margin-bottom: 20px;
}

.dashboard-title h2 {
    margin-bottom: 5px;
}

.dashboard-title p {
    margin: 0;
    color: #666;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.stat {
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 18px;
}

.stat-label {
    color: #666;
    font-size: 13px;
}

.stat-value {
    color: #1f4d2b;
    font-size: 28px;
    font-weight: bold;
    margin-top: 8px;
}

.stat-detail {
    color: #777;
    font-size: 12px;
    margin-top: 5px;
}

.dashboard-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.dashboard-card {
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 18px;
}

.dashboard-card h3 {
    margin-bottom: 18px;
}

.wide {
    grid-column: 1 / -1;
}

.bar-row {
    margin-bottom: 14px;
}

.bar-header {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 5px;
}

.bar-background {
    background: #e5e5e5;
    height: 12px;
    border-radius: 10px;
    overflow: hidden;
}

.bar {
    height: 100%;
    background: #1f4d2b;
}

.recent-item {
    border: 1px solid #ddd;
    border-radius: 7px;
    padding: 11px;
    margin-bottom: 9px;
}

.recent-item strong {
    display: block;
    margin-bottom: 4px;
}

.recent-item span {
    font-size: 13px;
    color: #666;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 9px;
    text-align: left;
    border-bottom: 1px solid #eee;
    font-size: 13px;
}

th {
    color: #555;
}

.empty {
    color: #777;
    font-size: 14px;
}

.file-input {
    display: none;
}

.data-buttons {
    display: flex;
    gap: 8px;
}

.data-buttons button {
    flex: 1;
}

.hour-chart {
    display: flex;
    align-items: flex-end;
    height: 150px;
    background: #f3f3f3;
    border-bottom: 1px solid #bbb;
}

.hour-col {
    flex: 1;
    height: 100%;
    display: flex;
    align-items: flex-end;
}

.hour-bar {
    width: 100%;
    background: #1f4d2b;
}

.hour-col:nth-child(even) .hour-bar {
    background: #2a6a3b;
}

.hour-col:hover .hour-bar {
    background: #3f9a5b;
}

.hour-labels {
    display: flex;
    margin-top: 5px;
}

.hour-label {
    flex: 1;
    font-size: 10px;
    color: #666;
    white-space: nowrap;
}

@media (max-width: 1000px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .dashboard-grid {
        grid-template-columns: 1fr;
    }

    .wide {
        grid-column: auto;
    }
}

@media (max-width: 700px) {
    header {
        padding: 12px;
    }

    header h1 {
        font-size: 18px;
    }

    .header-buttons button {
        font-size: 11px;
        padding: 7px;
    }

    .nav button {
        flex: 1;
        padding: 10px;
    }

    .app {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
        height: 370px;
        border-right: none;
        border-bottom: 1px solid #ddd;
    }

    #map {
        height: calc(100vh - 475px);
    }

    .dashboard {
        padding: 15px;
    }

    .stats {
        gap: 10px;
    }

    .stat {
        padding: 13px;
    }

    .stat-value {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>

<script>

const e = React.createElement;
const useState = React.useState;
const useEffect = React.useEffect;
const useRef = React.useRef;

const CAMERA_KEY = "deerCameras";
const TRAIL_KEY = "deerTrails";
const COLORS_KEY = "deerMapColors";

const DEFAULT_COLORS = {
    camera: "#ff0000",
    cameraOutline: "#ffffff",
    trail: "#ffff00"
};

function getColors() {
    try {
        const saved = JSON.parse(localStorage.getItem(COLORS_KEY));
        return { ...DEFAULT_COLORS, ...(saved || {}) };
    } catch {
        return { ...DEFAULT_COLORS };
    }
}

const DIRECTIONS = [
    { value: "N", label: "North", arrow: "↑" },
    { value: "NE", label: "Northeast", arrow: "↗" },
    { value: "E", label: "East", arrow: "→" },
    { value: "SE", label: "Southeast", arrow: "↘" },
    { value: "S", label: "South", arrow: "↓" },
    { value: "SW", label: "Southwest", arrow: "↙" },
    { value: "W", label: "West", arrow: "←" },
    { value: "NW", label: "Northwest", arrow: "↖" }
];

function directionText(value) {
    const found = DIRECTIONS.find(function(d) {
        return d.value === value;
    });
    return found ? found.arrow + " " + found.label : "";
}

// ---- Camera scoring ----
// A camera's score is the sum of its sightings' weights. Each sighting is worth:
//   number of deer x deer type weight x shooting-hours multiplier x age decay
// Change the numbers below to tune it.
const SCORE_CONFIG = {
    halfLifeDays: 7,            // a sighting counts half as much after this many days
    typeWeights: {
        Buck: 3,
        Doe: 2,
        Fawn: 1,
        Unknown: 1
    },
    shootingMultiplier: 2,      // sightings during shooting hours
    otherMultiplier: 1,         // sightings outside shooting hours
    shootingBufferMinutes: 30   // shooting hours = sunrise - buffer to sunset + buffer
};

// Sunrise or sunset as a UTC timestamp (ms) for a calendar date and location.
function sunEvent(year, month0, day, lat, lng, isRise) {

    const rad = Math.PI / 180;

    const dayOfYear = Math.floor(
        (Date.UTC(year, month0, day) - Date.UTC(year, 0, 0)) / 86400000
    );

    const lngHour = lng / 15;
    const t = dayOfYear + ((isRise ? 6 : 18) - lngHour) / 24;
    const M = 0.9856 * t - 3.289;

    let L = M +
        1.916 * Math.sin(M * rad) +
        0.020 * Math.sin(2 * M * rad) +
        282.634;

    L = ((L % 360) + 360) % 360;

    let RA = Math.atan(0.91764 * Math.tan(L * rad)) / rad;
    RA = ((RA % 360) + 360) % 360;
    RA += Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90;
    RA = RA / 15;

    const sinDec = 0.39782 * Math.sin(L * rad);
    const cosDec = Math.cos(Math.asin(sinDec));

    const cosH =
        (Math.cos(90.833 * rad) - sinDec * Math.sin(lat * rad)) /
        (cosDec * Math.cos(lat * rad));

    if (cosH > 1 || cosH < -1) return null;

    let H = isRise
        ? 360 - Math.acos(cosH) / rad
        : Math.acos(cosH) / rad;

    H = H / 15;

    let T = H + RA - 0.06571 * t - 6.622;
    T = ((T % 24) + 24) % 24;

    return Date.UTC(year, month0, day) + (T - lngHour) * 3600000;
}

function isShootingTime(sighting, camera) {

    if (!sighting.date || !sighting.time) return false;

    const dateParts = sighting.date.split("-").map(Number);
    const timeParts = sighting.time.split(":").map(Number);

    const y = dateParts[0];
    const m = dateParts[1] - 1;
    const d = dateParts[2];
    const hh = timeParts[0];
    const mm = timeParts[1] || 0;

    if (![y, m, d, hh, mm].every(Number.isFinite)) return false;

    const when = new Date(y, m, d, hh, mm).getTime();

    const rise = sunEvent(y, m, d, camera.lat, camera.lng, true);
    const set = sunEvent(y, m, d, camera.lat, camera.lng, false);

    if (rise === null || set === null) {
        return hh >= 6 && hh < 19;
    }

    const buffer = SCORE_CONFIG.shootingBufferMinutes * 60000;

    return when >= rise - buffer && when <= set + buffer;
}

function sightingScore(sighting, camera, now) {

    const typeWeight =
        SCORE_CONFIG.typeWeights[sighting.deerType] !== undefined
            ? SCORE_CONFIG.typeWeights[sighting.deerType]
            : 1;

    const timeWeight = isShootingTime(sighting, camera)
        ? SCORE_CONFIG.shootingMultiplier
        : SCORE_CONFIG.otherMultiplier;

    let ageDays = 0;

    if (sighting.date) {
        const when = new Date(
            sighting.date + "T" + (sighting.time || "12:00")
        ).getTime();

        if (Number.isFinite(when)) {
            ageDays = Math.max(0, (now - when) / 86400000);
        }
    }

    const decay = Math.pow(0.5, ageDays / SCORE_CONFIG.halfLifeDays);

    return Number(sighting.number || 1) * typeWeight * timeWeight * decay;
}

function cameraScore(camera) {

    const now = Date.now();

    return camera.sightings.reduce(function(total, sighting) {
        return total + sightingScore(sighting, camera, now);
    }, 0);
}

// ---- Hours, timelapse and direction helpers ----
function hourLabel(hour) {
    if (hour === 0) return "12 AM";
    if (hour < 12) return hour + " AM";
    if (hour === 12) return "12 PM";
    return (hour - 12) + " PM";
}

function hourShort(hour) {
    if (hour === 0) return "12a";
    if (hour < 12) return hour + "a";
    if (hour === 12) return "12p";
    return (hour - 12) + "p";
}

function sightingHour(sighting) {

    if (!sighting.time) return null;

    const hour = Number(sighting.time.split(":")[0]);

    return Number.isFinite(hour) && hour >= 0 && hour < 24
        ? hour
        : null;
}

const DIRECTION_BEARINGS = {
    N: 0, NE: 45, E: 90, SE: 135,
    S: 180, SW: 225, W: 270, NW: 315
};

// Average travel direction (degrees, 0 = north) weighted by number of deer.
// Returns null if there are no directions, or they cancel each other out.
function averageBearing(camera) {

    let x = 0;
    let y = 0;
    let total = 0;

    camera.sightings.forEach(function(sighting) {

        const bearing = DIRECTION_BEARINGS[sighting.direction];

        if (bearing === undefined) return;

        const weight = Number(sighting.number || 1);

        x += weight * Math.sin(bearing * Math.PI / 180);
        y += weight * Math.cos(bearing * Math.PI / 180);
        total += weight;
    });

    if (!total) return null;

    if (Math.hypot(x, y) / total < 0.15) return null;

    return (Math.atan2(x, y) * 180 / Math.PI + 360) % 360;
}

function bearingDirection(bearing) {
    return DIRECTIONS[Math.round(bearing / 45) % 8];
}

function arrowIcon(bearing, colors) {

    const html =
        '<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">' +
        '<g transform="rotate(' + bearing + ' 30 30)">' +
        '<path d="M30 3 L38 15 L33 15 L33 21 L27 21 L27 15 L22 15 Z" ' +
        'fill="' + colors.camera + '" stroke="' + colors.cameraOutline + '" ' +
        'stroke-width="1.5" stroke-linejoin="round"/>' +
        '</g></svg>';

    return L.divIcon({
        html: html,
        className: "",
        iconSize: [60, 60],
        iconAnchor: [30, 30]
    });
}

function getCameras() {
    try {
        const data = JSON.parse(localStorage.getItem(CAMERA_KEY));

        if (!Array.isArray(data)) {
            return [];
        }

        return data.map(function(camera) {
            return {
                id: camera.id || Date.now(),
                name: camera.name || "Camera",
                lat: Number(camera.lat),
                lng: Number(camera.lng),
                sightings: Array.isArray(camera.sightings)
                    ? camera.sightings
                    : []
            };
        }).filter(function(camera) {
            return Number.isFinite(camera.lat) &&
                   Number.isFinite(camera.lng);
        });

    } catch {
        return [];
    }
}

function getTrails() {
    try {
        const data = JSON.parse(localStorage.getItem(TRAIL_KEY));

        if (!Array.isArray(data)) {
            return [];
        }

        return data;

    } catch {
        return [];
    }
}

function saveData(cameras, trails) {
    localStorage.setItem(
        CAMERA_KEY,
        JSON.stringify(cameras)
    );

    localStorage.setItem(
        TRAIL_KEY,
        JSON.stringify(trails)
    );
}

// ---- Google Drive sync ----
// 1. Create a free Google Cloud project, enable the "Google Drive API",
//    set up an OAuth consent screen (External, Testing mode is fine),
//    add yourself as a test user, and create an OAuth Client ID
//    (Application type: Web application) with this site's URL added
//    under "Authorized JavaScript origins".
// 2. Paste that Client ID below.
const GOOGLE_CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID_HERE.apps.googleusercontent.com";

const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.appdata";
const DRIVE_FILE_NAME = "deer-trail-cam-data.json";
const LAST_MODIFIED_KEY = "deerLastModified";

let driveTokenClient = null;
let driveAccessToken = null;
let driveFileId = null;

function getLastModified() {
    return Number(localStorage.getItem(LAST_MODIFIED_KEY)) || 0;
}

function setLastModified(timestamp) {
    localStorage.setItem(LAST_MODIFIED_KEY, String(timestamp));
}

function initDriveTokenClient(callback) {

    if (!window.google || !window.google.accounts) {
        return false;
    }

    driveTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: DRIVE_SCOPE,
        callback: callback
    });

    return true;
}

function requestDriveAccess(callback) {

    if (!driveTokenClient) return;

    driveTokenClient.callback = function(response) {

        if (response && response.access_token) {
            driveAccessToken = response.access_token;
        }

        callback(response);
    };

    driveTokenClient.requestAccessToken({
        prompt: driveAccessToken ? "" : "consent"
    });
}

function driveSignOut() {

    if (driveAccessToken && window.google) {
        google.accounts.oauth2.revoke(driveAccessToken, function() {});
    }

    driveAccessToken = null;
    driveFileId = null;
}

async function driveFindFile() {

    const query = "name='" + DRIVE_FILE_NAME + "' and trashed=false";

    const url =
        "https://www.googleapis.com/drive/v3/files" +
        "?spaces=appDataFolder" +
        "&fields=" + encodeURIComponent("files(id,modifiedTime)") +
        "&q=" + encodeURIComponent(query);

    const response = await fetch(url, {
        headers: {
            Authorization: "Bearer " + driveAccessToken
        }
    });

    if (!response.ok) {
        throw new Error("Drive lookup failed");
    }

    const data = await response.json();

    if (data.files && data.files.length) {
        return data.files[0];
    }

    return null;
}

async function driveDownload(fileId) {

    const response = await fetch(
        "https://www.googleapis.com/drive/v3/files/" +
        fileId +
        "?alt=media",
        {
            headers: {
                Authorization: "Bearer " + driveAccessToken
            }
        }
    );

    if (!response.ok) {
        throw new Error("Drive download failed");
    }

    return response.json();
}

async function driveUpload(fileId, dataObj) {

    const metadata = {
        name: DRIVE_FILE_NAME,
        mimeType: "application/json"
    };

    if (!fileId) {
        metadata.parents = ["appDataFolder"];
    }

    const boundary = "deercamboundary";

    const body =
        "--" + boundary + "\r\n" +
        "Content-Type: application/json; charset=UTF-8\r\n\r\n" +
        JSON.stringify(metadata) + "\r\n" +
        "--" + boundary + "\r\n" +
        "Content-Type: application/json\r\n\r\n" +
        JSON.stringify(dataObj) + "\r\n" +
        "--" + boundary + "--";

    const url = fileId
        ? "https://www.googleapis.com/upload/drive/v3/files/" +
          fileId +
          "?uploadType=multipart"
        : "https://www.googleapis.com/upload/drive/v3/files" +
          "?uploadType=multipart";

    const response = await fetch(url, {
        method: fileId ? "PATCH" : "POST",
        headers: {
            Authorization: "Bearer " + driveAccessToken,
            "Content-Type": "multipart/related; boundary=" + boundary
        },
        body: body
    });

    if (!response.ok) {
        throw new Error("Drive upload failed");
    }

    return response.json();
}

function App() {

    const [view, setView] = useState("dashboard");

    const [cameras, setCameras] = useState(getCameras);
    const [trails, setTrails] = useState(getTrails);

    const [selectedCameraId, setSelectedCameraId] =
        useState(null);

    const [showSightingForm, setShowSightingForm] =
        useState(false);

    const [drawingTrail, setDrawingTrail] =
        useState(false);

    const [currentTrailPoints, setCurrentTrailPoints] =
        useState([]);

    const [date, setDate] = useState("");
    const [time, setTime] = useState("");
    const [deerType, setDeerType] = useState("Buck");
    const [number, setNumber] = useState("1");
    const [antlerPoints, setAntlerPoints] = useState("");
    const [direction, setDirection] = useState("");
    const [notes, setNotes] = useState("");

    const [colors, setColors] = useState(getColors);
    const [heatOn, setHeatOn] = useState(false);
    const [heatFilter, setHeatFilter] = useState("All");
    const [timelapseOn, setTimelapseOn] = useState(false);
    const [timelapseHour, setTimelapseHour] = useState(5);
    const [timelapsePlaying, setTimelapsePlaying] = useState(false);
    const [mapVersion, setMapVersion] = useState(0);

    const [movingCameraId, setMovingCameraId] = useState(null);

    const [signedIn, setSignedIn] = useState(false);
    const [syncStatus, setSyncStatus] = useState("");

    const mapRef = useRef(null);
    const cameraMarkersRef = useRef({});
    const trailLayersRef = useRef([]);
    const currentTrailLayerRef = useRef(null);
    const drawingTrailRef = useRef(false);
    const movingCameraRef = useRef(null);
    const heatLayerRef = useRef(null);
    const arrowMarkersRef = useRef({});
    const colorsRef = useRef(colors);
    colorsRef.current = colors;

    const driveSyncTimeoutRef = useRef(null);
    const suppressNextPushRef = useRef(false);
    const signedInRef = useRef(false);

    useEffect(function() {
        signedInRef.current = signedIn;
    }, [signedIn]);

    async function pushToDrive() {

        setSyncStatus("syncing");

        try {

            const timestamp = Date.now();

            const payload = {
                app: "Deer Trail Cam Scorer",
                version: 1,
                lastModified: timestamp,
                cameras: cameras,
                trails: trails
            };

            const result = await driveUpload(
                driveFileId,
                payload
            );

            if (result && result.id) {
                driveFileId = result.id;
            }

            setLastModified(timestamp);
            setSyncStatus("synced");

        } catch (error) {
            setSyncStatus("error");
        }
    }

    async function pullFromDrive(file) {

        try {

            const driveData = await driveDownload(file.id);

            if (
                driveData &&
                Array.isArray(driveData.cameras) &&
                Array.isArray(driveData.trails)
            ) {

                suppressNextPushRef.current = true;

                setCameras(driveData.cameras);
                setTrails(driveData.trails);

                setLastModified(
                    new Date(file.modifiedTime).getTime()
                );
            }

        } catch (error) {
            setSyncStatus("error");
        }
    }

    async function syncFromDrive() {

        setSyncStatus("syncing");

        try {

            const file = await driveFindFile();

            if (file) {

                driveFileId = file.id;

                const driveModified =
                    new Date(file.modifiedTime).getTime();

                const localModified = getLastModified();

                if (driveModified > localModified) {

                    const confirmed = confirm(
                        "Cloud data is newer than what's on this device. Load it? This will replace what's currently shown here."
                    );

                    if (confirmed) {
                        await pullFromDrive(file);
                    } else {
                        await pushToDrive();
                    }

                } else if (localModified > driveModified) {

                    await pushToDrive();
                }

            } else {

                await pushToDrive();
            }

            setSyncStatus("synced");

        } catch (error) {
            setSyncStatus("error");
        }
    }

    function handleDriveAuthResponse(response) {

        if (response && response.access_token) {
            setSignedIn(true);
            syncFromDrive();
        } else if (response && response.error) {
            setSyncStatus("error");
        }
    }

    function placeMovingCamera(latlng) {

        const id = movingCameraRef.current;

        if (!id) return false;

        setCameras(function(previous) {
            return previous.map(function(camera) {
                if (camera.id !== id) return camera;
                return {

                    lng: latlng.lng
                };
            });
        });

        const marker = cameraMarkersRef.current[id];

        if (marker) {

        }

        movingCameraRef.current = null;
        setMovingCameraId(null);

        return true;

    function initializeMap() {

        if (
            mapRef.current &&
            mapRef.current.getContainer() !==
                document.getElementById("map")
        ) {
            try {
                mapRef.current.remove();
            } catch (error) {}

            mapRef.current = null;
            cameraMarkersRef.current = {};
            trailLayersRef.current = [];
            currentTrailLayerRef.current = null;
            heatLayerRef.current = null;
            arrowMarkersRef.current = {};
        }

        if (mapRef.current) {
            setTimeout(function() {
                mapRef.current.invalidateSize();
            }, 100);
            return;
        }

        const map = L.map("map").setView(
            [42.84, -88.54],
            13
        );

        mapRef.current = map;
        setMapVersion(function(v) { return v + 1; });

        // Camera markers live in their own pane above the trails
        map.createPane("cameraPane");
        map.getPane("cameraPane").style.zIndex = 650;

        L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {
                attribution: "Tiles &copy; Esri"
            }
        ).addTo(map);

        cameras.forEach(function(camera) {
            addCameraMarker(camera);
        });

        trails.forEach(function(trail) {
            drawSavedTrail(trail);
        });

        map.on("click", function(event) {

            if (placeMovingCamera(event.latlng)) {
                return;
            }

            if (drawingTrailRef.current) {

                const point = [
                    event.latlng.lat,
                    event.latlng.lng
                ];

                setCurrentTrailPoints(function(previous) {
                    return [...previous, point];
                });

                return;
            }

            const name = prompt(
                "Enter a name for this camera:"
            );

            if (!name) return;

            const camera = {
                id: Date.now(),
                name: name,
                lat: event.latlng.lat,
                lng: event.latlng.lng,
                sightings: []
            };

            setCameras(function(previous) {
                return [...previous, camera];
            });

            addCameraMarker(camera);

            setSelectedCameraId(camera.id);
        });
    }

    useEffect(function() {

        if (!mapRef.current) return;

        if (heatLayerRef.current) {
            mapRef.current.removeLayer(heatLayerRef.current);
            heatLayerRef.current = null;
        }

        if (!heatOn || !L.heatLayer) return;

        const points = [];

        cameras.forEach(function(camera) {

            const count = camera.sightings
                .filter(function(sighting) {
                    return (heatFilter === "All" ||
                        sighting.deerType === heatFilter) &&
                        (!timelapseOn ||
                            sightingHour(sighting) === timelapseHour);
                })
                .reduce(function(total, sighting) {
                    return total + Number(sighting.number || 0);
                }, 0);

            if (count > 0) {
                points.push([camera.lat, camera.lng, count]);
            }
        });

        if (!points.length) return;

        let maxCount = Math.max.apply(
            null,
            points.map(function(point) {
                return point[2];
            })
        );

        if (timelapseOn) {

            // keep the scale fixed across the whole day so hours are comparable
            maxCount = 1;

            cameras.forEach(function(camera) {

                for (let hour = 0; hour < 24; hour++) {

                    const hourCount = camera.sightings
                        .filter(function(sighting) {
                            return (heatFilter === "All" ||
                                sighting.deerType === heatFilter) &&
                                sightingHour(sighting) === hour;
                        })
                        .reduce(function(total, sighting) {
                            return total + Number(sighting.number || 0);
                        }, 0);

                    if (hourCount > maxCount) {
                        maxCount = hourCount;
                    }
                }
            });
        }

        heatLayerRef.current = L.heatLayer(points, {
            radius: 40,
            blur: 30,
            maxZoom: 17,
            max: maxCount,
            minOpacity: 0.35
        }).addTo(mapRef.current);

    }, [heatOn, heatFilter, cameras, mapVersion, timelapseOn, timelapseHour]);

    useEffect(function() {

        if (!timelapsePlaying) return;

            setTimelapseHour(function(hour) {

        return function() {
            clearInterval(interval);
        };

    }, [timelapsePlaying]);

    function exportData() {

        const data = {
            app: "Deer Trail Cam Scorer",
            version: 1,
            exportedAt: new Date().toISOString(),
            cameras: cameras,
            trails: trails
        };

        const json = JSON.stringify(

        );

        const blob = new Blob(
            [json],
            {
                type: "application/json"
            }
        );

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = url;

        link.download =
            "deer-trail-cam-backup-" +
            new Date()
                .toISOString()
                .slice(0, 10) +
            ".json";

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

        URL.revokeObjectURL(url);

    function importData(event) {

        const file = event.target.files[0];

        if (!file) return;

        const reader = new FileReader();

        reader.onload = function(loadEvent) {

            try {

                const data = JSON.parse(
                    loadEvent.target.result
                );

                if (
                    !data ||
                    !Array.isArray(data.cameras) ||
                    !Array.isArray(data.trails)
                ) {

                    alert(
                        "That file is not a valid Deer Trail Cam backup."
                    );

                    return;
                }

                const confirmed = confirm(
                    "Import this backup? This will replace the data currently on this device."
                );

                if (!confirmed) return;

                const importedCameras =
                    data.cameras.map(function(camera) {

                        return {
                            id: camera.id,
                            name: camera.name,
                            lat: Number(camera.lat),
                            lng: Number(camera.lng),
                            sightings:
                                Array.isArray(
                                    camera.sightings
                                )
                                    ? camera.sightings
                                    : []
                        };

                    });

                const importedTrails =
                    data.trails.map(function(trail) {

                        return {
                            id: trail.id,
                            name: trail.name,
                            points:
                                Array.isArray(
                                    trail.points
                                )
                                    ? trail.points
                                    : []
                        };

                    });

                localStorage.setItem(
                    CAMERA_KEY,
                    JSON.stringify(
                        importedCameras
                    )
                );

                localStorage.setItem(
                    TRAIL_KEY,
                    JSON.stringify(
                        importedTrails
                    )
                );

                setCameras(importedCameras);
                setTrails(importedTrails);

                setSelectedCameraId(null);
                setShowSightingForm(false);

                if (mapRef.current) {

                    Object.values(
                        cameraMarkersRef.current
                    ).forEach(function(marker) {

                        mapRef.current.removeLayer(
                            marker
                        );

                    });

                    cameraMarkersRef.current = {};

                    redrawAllTrails([]);

                    importedCameras.forEach(
                        function(camera) {
                            addCameraMarker(camera);
                        }
                    );

                    importedTrails.forEach(
                        function(trail) {
                            drawSavedTrail(trail);
                        }
                    );
                }

                alert(
                    "Backup imported successfully."
                );

            } catch {

                alert(
                    "Could not read that file."
                );
            }

            event.target.value = "";

        };

        reader.readAsText(file);
    }

    function colorRow(label, key) {

        return e(
            "div",
            {
                key: key,
                style: {
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "space-between",
                    marginBottom: "8px"
                }
            },

            e(
                "span",
                { style: { fontSize: "13px" } },
                label
            ),

            e(
                "input",
                {
                    type: "color",
                    value: colors[key],
                    style: {
                        width: "48px",
                        height: "32px",
                        padding: "0",
                        border: "1px solid #ccc",
                        borderRadius: "6px"
                    },
                    onChange: function(event) {

                        const value = event.target.value;

                        setColors(function(previous) {
                            return { ...previous, [key]: value };
                        });
                    }
                }
            )
        );
    }

    function mapOptions() {

                    className: heatOn ? "primary" : "secondary",

                    onClick: function() {

                        if (heatOn) {
                            setTimelapseOn(false);
                            setTimelapsePlaying(false);
                        }

                        setHeatOn(!heatOn);
                    }

                heatOn ? "Heat Map: On" : "Heat Map: Off"

            heatOn
                ? e(
                    "div",
                    { className: "form-group" },

                    e("label", null, "Heat map shows"),

                        "select",

                            value: heatFilter,
                            onChange: function(event) {
                                setHeatFilter(event.target.value);
                            }
                        },
                        e("option", { value: "All" }, "All deer"),
                        e("option", { value: "Buck" }, "Bucks"),
                        e("option", { value: "Doe" }, "Does"),

                                    null,
                                    "Unknown"
                                )
                            )
                        ),

                        e(
                            "div",
                            {
                                className:
                                    "form-group"
                            },

                            e(
                                "label",
                                null,
                                "Number of Deer"
                            ),

                            e(
                                "input",
                                {
                                    type: "number",
                                    min: "1",
                                    value: number,
                                    onChange:
                                        function(event) {
                                            setNumber(
                                                event.target.value
                                            );
                                        },
                                    required: true
                                }
                            )
                        ),

                        deerType === "Buck"
                            ? e(
                                React.Fragment,
                                null,

                                e(
                                    "div",
                                    {
                                        className:
                                            "form-group"
                                    },

                                    e(
                                        "label",
                                        null,
                                        "Antler Points"
                                    ),

                                    e(
                                        "input",
                                        {
                                            type: "number",
                                            min: "0",
                                            value:
                                                antlerPoints,
                                            onChange:
                                                function(event) {
                                                    setAntlerPoints(
                                                        event.target.value
                                                    );
                                                }
                                        }
                                    )
                                )
                            )
                            : null,

                        e(
                            "div",
                            {
                                className:
                                    "form-group"
                            },

                            e(
                                "label",
                                null,
                                "Direction of Travel"
                            ),

                            e(
                                "select",
                                {
                                    value: direction,
                                    onChange:
                                        function(event) {
                                            setDirection(
                                                event.target.value
                                            );
                                        }
                                },

                                e(
                                    "option",
                                    { value: "" },
                                    "Not sure"
                                ),

                                DIRECTIONS.map(function(d) {
                                    return e(
                                        "option",
                                        {
                                            value: d.value,
                                            key: d.value
                                        },
                                        d.arrow + " " + d.label
                                    );
                                })
                            )
                        ),

                        e(
                            "div",
                            {
                                className:
                                    "form-group"
                            },

                            e(
                                "label",
                                null,
                                "Notes"
                            ),

                            e(
                                "textarea",
                                {
                                    value: notes,
                                    onChange:
                                        function(event) {
                                            setNotes(
                                                event.target.value
                                            );
                                        }
                                }
                            )
                        ),

                        e(
                            "button",
                            {
                                className:
                                    "primary",
                                type: "submit",
                                style: {
                                    width: "100%"
                                }
                            },
                            "Save Sighting"
                        )
                    )
                )
                : null,

            e(
                "div",
                {
                    className: "card"
                },

                e(
                    "h3",
                    null,
                    "Sightings"
                ),

                selectedCamera.sightings.length
                    ? selectedCamera.sightings
                        .slice()
                        .reverse()
                        .map(
                            function(sighting) {

                                return e(
                                    "div",
                                    {
                                        className:
                                            "sighting",
                                        key:
                                            sighting.id
                                    },

                                    e(
                                        "strong",
                                        null,

                                        sighting.number +
                                        " " +
                                        sighting.deerType
                                    ),

                                    e(
                                        "small",
                                        null,

                                        sighting.date +
                                        " at " +
                                        sighting.time
                                    ),

                                    sighting.antlerPoints
                                        ? e(
                                            "p",
                                            null,
                                            sighting.antlerPoints +
                                            " antler points"
                                        )
                                        : null,

                                    sighting.direction
                                        ? e(
                                            "p",
                                            null,
                                            "Heading: " +
                                            directionText(
                                                sighting.direction
                                            )
                                        )
                                        : null,

                                    sighting.notes
                                        ? e(
                                            "p",
                                            null,
                                            sighting.notes
                                        )
                                        : null,

                                    e(
                                        "button",
                                        {
                                            className:
                                                "danger",
                                            onClick:
                                                function() {
                                                    deleteSighting(
                                                        sighting.id
                                                    );
                                                }
                                        },
                                        "Delete"
                                    )
                                );

                            }
                        )
                    : e(
                        "div",
                        {
                            className: "empty"
                        },
                        "No sightings recorded."
                    )
            ),

            mapOptions()
        );
    }

    return e(
        React.Fragment,
        null,

        e(
            "header",
            null,

            e(
                "h1",
                null,
                "Deer Trail Cam Scorer"
            ),

            e(
                "div",
                {
                    className:
                        "header-buttons"
                },

                e(
                    "button",
                    {
                        className:
                            "header-button",
                        onClick:
                            signedIn
                                ? signOutOfDrive
                                : signInToDrive
                    },
                    signedIn
                        ? "Disconnect Drive"
                        : "Connect Google Drive"
                ),

                signedIn
                    ? e(
                        "span",
                        {
                            style: {
                                color: "white",
                                fontSize: "12px",
                                alignSelf: "center"
                            }
                        },
                        syncStatus === "syncing"
                            ? "Syncing…"
                            : syncStatus === "error"
                                ? "Sync error"
                                : "Synced"
                    )
                    : null,

                e(
                    "button",
                    {
                        className:
                            "header-button",
                        onClick:
                            exportData
                    },
                    "Export Data"
                ),

                e(
                    "label",
                    {
                        className:
                            "header-button",
                        style: {
                            padding:
                                "9px 12px",
                            borderRadius:
                                "6px",
                            cursor:
                                "pointer",
                            fontSize:
                                "14px"
                        }
                    },

                    "Import Data",

                    e(
                        "input",
                        {
                            className:
                                "file-input",
                            type: "file",
                            accept:
                                ".json",
                            onChange:
                                importData
                        }
                    )
                )
            )
        ),

        e(
            "div",
            {
                className: "nav"
            },

            e(
                "button",
                {
                    className:
                        view === "dashboard"
                            ? "active"
                            : "",
                    onClick:
                        function() {
                            setView(
                                "dashboard"
                            );
                        }
                },
                "Dashboard"
            ),

            e(
                "button",
                {
                    className:
                        view === "map"
                            ? "active"
                            : "",
                    onClick:
                        function() {
                            setView("map");
                        }
                },
                "Map"
            )
        ),

        view === "dashboard"
            ? e(
                Dashboard
            )
            : e(
                "div",
                {
                    className: "app"
                },

                e(
                    "div",
                    {
                        className:
                            "sidebar"
                    },

                    CameraPanel()
                ),

                e(
                    "div",
                    {
                        id: "map"
                    }
                )
            )
    );
}

const root = ReactDOM.createRoot(
    document.getElementById("root")
);

root.render(
    e(App)
);

</script>

</body>
</html>
