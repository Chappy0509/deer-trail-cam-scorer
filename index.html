// ---- Hours, timelapse and direction helpers ----
// 0-23 -> '12 AM', '9 AM', '12 PM', '5 PM'
function hourLabel(hour) {
    if (hour === 0) return "12 AM";
    if (hour < 12) return hour + " AM";
    if (hour === 12) return "12 PM";
    return (hour - 12) + " PM";
}

// 0-23 -> short label like '9a' or '5p' (used on small chart axes)
function hourShort(hour) {
    if (hour === 0) return "12a";
    if (hour < 12) return hour + "a";
    if (hour === 12) return "12p";
    return (hour - 12) + "p";
}

// The hour (0-23) of a sighting's time, or null if it has none
function sightingHour(sighting) {

    if (!sighting.time) return null;

    const hour = Number(sighting.time.split(":")[0]);

    return Number.isFinite(hour) && hour >= 0 && hour < 24
        ? hour
        : null;
}

// Compass bearing in degrees for each direction (0 = north, 90 = east...)
const DIRECTION_BEARINGS = {
    N: 0, NE: 45, E: 90, SE: 135,
    S: 180, SW: 225, W: 270, NW: 315
};

// Average travel direction (degrees, 0 = north) weighted by number of deer.
// Returns null if there are no directions, or they cancel each other out.
// Average direction the deer travel past a camera, weighted by number of deer.
// Uses vector math so that, for example, NW and NE average out to N.
// Returns degrees (0 = north) or null when there is no data or the directions cancel out.
function averageBearing(camera) {

    // Running east-west total
    let x = 0;
    // Running north-south total
    let y = 0;
    // Total deer that had a direction
    let total = 0;

    camera.sightings.forEach(function(sighting) {

        // Degrees for this sighting's direction
        const bearing = DIRECTION_BEARINGS[sighting.direction];

        // Skip sightings with no direction
        if (bearing === undefined) return;

        // More deer = more influence on the average
        const weight = Number(sighting.number || 1);

        // Add this sighting's east-west part
        x += weight * Math.sin(bearing * Math.PI / 180);
        // Add this sighting's north-south part
        y += weight * Math.cos(bearing * Math.PI / 180);
        total += weight;
    });

    // No directions recorded
    if (!total) return null;

    // Directions mostly cancel each other, so there is no real 'average' to show
    if (Math.hypot(x, y) / total < 0.15) return null;

    // Convert the combined vector back into a compass bearing between 0 and 360
    return (Math.atan2(x, y) * 180 / Math.PI + 360) % 360;
}

// Nearest of the 8 compass directions for a bearing in degrees
function bearingDirection(bearing) {
    return DIRECTIONS[Math.round(bearing / 45) % 8];
}

// The arrow drawn beside a camera, rotated to point the way the deer travel
function arrowIcon(bearing, colors) {

    // SVG picture of the arrow, rotated by the bearing
    const html =
        '<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">' +
        '<g transform="rotate(' + bearing + ' 30 30)">' +
        '<path d="M30 3 L38 15 L33 15 L33 21 L27 21 L27 15 L22 15 Z" ' +
        'fill="' + colors.camera + '" stroke="' + colors.cameraOutline + '" ' +
        'stroke-width="1.5" stroke-linejoin="round"/>' +
        '</g></svg>';

    return L.divIcon({
        html: html,
        className: "",
        iconSize: [60, 60],
        iconAnchor: [30, 30]
    });
}

// Loads the saved cameras from this device, cleaning up each one; returns [] if nothing valid is saved
function getCameras() {
    try {
        // Read the saved text and turn it into a list
        const data = JSON.parse(localStorage.getItem(CAMERA_KEY));

        if (!Array.isArray(data)) {
            return [];
        }

        // Make sure every camera has an id, name, numbers for its position, and a sightings list
        return data.map(function(camera) {
            return {
                id: camera.id || Date.now(),
                name: camera.name || "Camera",
                lat: Number(camera.lat),
                lng: Number(camera.lng),
                sightings: Array.isArray(camera.sightings) ? camera.sightings : [],
                facing: camera.facing || "",
                emailMatch: camera.emailMatch || ""
            };
        // Drop cameras with a broken position
        }).filter(function(camera) {
            return Number.isFinite(camera.lat) &&
                   Number.isFinite(camera.lng);
        });

    } catch {
        return [];
    }
}

// Loads the saved deer trails (a list of named lines); returns [] if none
function getTrails() {
    try {
        const data = JSON.parse(localStorage.getItem(TRAIL_KEY));

        return data;

// Saves cameras, trails and stands to this device (called whenever any of them change)
function saveData(cameras, trails, stands) {
    localStorage.setItem(
        CAMERA_KEY,
        JSON.stringify(cameras)
    );

    localStorage.setItem(
        TRAIL_KEY,
        JSON.stringify(trails)
    );

    localStorage.setItem(
        STAND_KEY,

    );
}

// Id of our backup file in Drive once we have found or created it
let driveFileId = null;

// Time of the last edit made on this device
function getLastModified() {
    return Number(localStorage.getItem(LAST_MODIFIED_KEY)) || 0;
}

// Record that the data was just edited on this device
function setLastModified(timestamp) {
    localStorage.setItem(LAST_MODIFIED_KEY, String(timestamp));
}

// Sets up Google sign-in. Returns false if Google's script hasn't loaded yet.
function initDriveTokenClient(callback, errorCallback) {

    // Google's sign-in script isn't ready yet
    if (!window.google || !window.google.accounts) {
        return false;
    }

    driveTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: getClientId(),
        scope: DRIVE_SCOPE,
        callback: callback,
        error_callback: errorCallback
    });

    return true;
}

// Opens Google's sign-in / permission popup and calls 'callback' with the result
function requestDriveAccess(callback) {

    if (!driveTokenClient) return;

    driveTokenClient.callback = function(response) {

        if (response && response.access_token) {
            driveAccessToken = response.access_token;
        }

        callback(response);
    };

    driveTokenClient.requestAccessToken({
        prompt: ""
    });
}

// Tells Google to cancel our pass and forgets it
function driveSignOut() {

    if (driveAccessToken && window.google) {
        google.accounts.oauth2.revoke(driveAccessToken, function() {});
    }

    driveAccessToken = null;
    driveFileId = null;
}

// Builds a readable Error from a failed Drive reply (status number plus Google's own message)
async function driveFail(response, what) {

    // Try to read Google's explanation from the reply
    let detail = "";

    try {
        const body = await response.json();

        if (body && body.error && body.error.message) {
            detail = body.error.message;
        }
    } catch (error) {}

    let message = what + " (" + response.status + ")";

    if (detail) {
        message += ": " + detail;
    }

    // 403 usually means the Drive API isn't switched on in Google Cloud, or permission wasn't granted
    if (response.status === 403) {
        message += " — make sure the Google Drive API is enabled in your Google Cloud project and that you allowed access to the app's Drive data.";
    }

    const error = new Error(message);
    error.status = response.status;

    return error;
}

// Looks in the private app-data area for our backup file; returns it (id + modified time) or null
async function driveFindFile() {

    // Search for a file with our name that isn't in the trash
    const query = "name='" + DRIVE_FILE_NAME + "' and trashed=false";

    const url =
        "https://www.googleapis.com/drive/v3/files" +
        "?spaces=appDataFolder" +
        "&fields=" + encodeURIComponent("files(id,modifiedTime)") +
        "&q=" + encodeURIComponent(query);

    const response = await fetch(url, {
        headers: {
            Authorization: "Bearer " + driveAccessToken
        }
    });

    if (!response.ok) {
        throw await driveFail(response, "Drive lookup failed");
    }

    const data = await response.json();

    if (data.files && data.files.length) {
        return data.files[0];
    }

    return null;
}

// Downloads the backup file and returns its contents as data
async function driveDownload(fileId) {

    const response = await fetch(
        "https://www.googleapis.com/drive/v3/files/" +
        fileId +
        "?alt=media",
        {
            headers: {
                Authorization: "Bearer " + driveAccessToken
            }
        }
    );

    if (!response.ok) {
        throw await driveFail(response, "Drive download failed");
    }

    return response.json();
}

// Uploads data to Drive: creates the file if there is no fileId, otherwise replaces the existing file
async function driveUpload(fileId, dataObj) {

    // File details sent along with the data
    const metadata = {
        name: DRIVE_FILE_NAME,
        mimeType: "application/json"
    };

    // New files are created inside the private app-data folder
    if (!fileId) {
        metadata.parents = ["appDataFolder"];
    }

    // Drive expects 'multipart' uploads: details and data separated by a marker line
    const boundary = "deercamboundary";

    // Build the multipart body: details part, then data part
    const body =
        "--" + boundary + "\r\n" +
        "Content-Type: application/json; charset=UTF-8\r\n\r\n" +
        JSON.stringify(metadata) + "\r\n" +
        "--" + boundary + "\r\n" +
        "Content-Type: application/json\r\n\r\n" +
        JSON.stringify(dataObj) + "\r\n" +
        "--" + boundary + "--";

    // PATCH (update) the existing file, or POST (create) a new one; ask Drive to send back id + modified time
    const url = fileId
        ? "https://www.googleapis.com/upload/drive/v3/files/" +
          fileId +
          "?uploadType=multipart&fields=id%2CmodifiedTime"
        : "https://www.googleapis.com/upload/drive/v3/files" +
          "?uploadType=multipart&fields=id%2CmodifiedTime";

    const response = await fetch(url, {
        method: fileId ? "PATCH" : "POST",
        headers: {
            Authorization: "Bearer " + driveAccessToken,
            "Content-Type": "multipart/related; boundary=" + boundary
        },
        body: body
    });

    if (!response.ok) {
        throw await driveFail(response, "Drive upload failed");
    }

    return response.json();
}

// ==================== App: the whole application screen ====================
// Everything the user sees is built by this one function. It runs again (redraws) whenever a 'state' value changes.

    const [trails, setTrails] = useState(getTrails);  // all deer trails

    const [selectedCameraId, setSelectedCameraId] =  // camera whose details are open in the sidebar (null = none)
        useState(null);

    const [showSightingForm, setShowSightingForm] =  // is the 'New Sighting' form open?
        useState(false);

    const [drawingTrail, setDrawingTrail] =  // true while you are clicking points to draw a trail
        useState(false);

    const [currentTrailPoints, setCurrentTrailPoints] =  // points of the trail being drawn right now
        useState([]);

    // Sighting form fields (what you are typing into the New Sighting form)
    const [date, setDate] = useState("");  // sighting date
    const [time, setTime] = useState("");  // sighting time
    const [deerType, setDeerType] = useState("Buck");  // Buck, Big Buck, Doe, Fawn or Unknown
    const [number, setNumber] = useState("1");  // how many deer
    const [antlerPoints, setAntlerPoints] = useState("");  // antler points (bucks only)
    const [direction, setDirection] = useState("");  // direction of travel
    const [notes, setNotes] = useState("");  // free-text notes

    // Map display settings
    const [colors, setColors] = useState(getColors);  // camera / outline / trail / stand colors
    const [heatOn, setHeatOn] = useState(false);  // heat map switched on?
    const [heatFilter, setHeatFilter] = useState("All");  // which deer the heat map counts (All, Buck, Big Buck, Doe, Fawn)
    const [heatRadius, setHeatRadius] = useState(90);  // how wide each heat blotch is (bigger = blotches join up sooner)
    const [chartCamera, setChartCamera] = useState("all");  // Charts page camera filter ('all' or a camera id)
    const [powerWeek, setPowerWeek] = useState("latest");  // week picked in Weekly Power Rankings ('latest' = this week)
    const [emailItems, setEmailItems] = useState([]);  // photo emails waiting to be turned into sightings
    const [emailBusy, setEmailBusy] = useState(false);  // true while fetching emails
    const [emailStatus, setEmailStatus] = useState("");  // progress / error text on the Email tab
    const [emailPhoto, setEmailPhoto] = useState(null);  // photo shown full screen (null = none)
    const [emailOcr, setEmailOcr] = useState(function() { return localStorage.getItem("deerEmailOcr") !== "0"; });  // read the camera name from the photo's black bar?
    const [gmailQuery, setGmailQuery] = useState(getGmailQuery);  // the Gmail search used to find trail camera emails
    const [timelapseOn, setTimelapseOn] = useState(false);  // heat map timelapse mode on?
    const [timelapseHour, setTimelapseHour] = useState(5);  // hour of the day (0-23) the timelapse is showing
    const [timelapsePlaying, setTimelapsePlaying] = useState(false);  // is the timelapse animating?
    const [mapVersion, setMapVersion] = useState(0);  // goes up each time the map is rebuilt so dependent effects redraw

    const [movingCameraId, setMovingCameraId] = useState(null);  // camera waiting to be placed at a new spot (Move Marker)

    const [stands, setStands] = useState(getStands);  // all hunting stands
    const [selectedStandId, setSelectedStandId] = useState(null);  // stand whose details are open
    const [standDraft, setStandDraft] = useState(null);  // the name/type being entered while adding a stand
    const [movingStandId, setMovingStandId] = useState(null);  // stand waiting to be placed at a new spot

    const [showTrails, setShowTrails] = useState(function() {  // show deer trails on the map?
        return getLayers().trails;
    });
    const [showStands, setShowStands] = useState(function() {  // show stands on the map?
        return getLayers().stands;
    });

    const [signedIn, setSignedIn] = useState(false);  // connected to Google Drive right now?
    const [syncStatus, setSyncStatus] = useState("");  // '', syncing, synced or error
    const [syncError, setSyncError] = useState("");  // the readable explanation shown when you tap a sync error

    // ---- Refs ----
    // Refs hold things that must survive redraws without causing one: the map and its markers/layers,
    // plus 'current' copies of state that the map's click handlers need (they were created once and can't see new state).
    const mapRef = useRef(null);  // the Leaflet map object
    const cameraMarkersRef = useRef({});  // camera id -> its dot on the map
    const trailLayersRef = useRef([]);  // the saved trail lines on the map
    const currentTrailLayerRef = useRef(null);  // the trail line being drawn
    const drawingTrailRef = useRef(false);  // copy of drawingTrail for the map click handler
    const movingCameraRef = useRef(null);  // copy of movingCameraId for map click handlers
    const movingStandRef = useRef(null);  // copy of movingStandId for map click handlers
    const standMarkersRef = useRef({});  // stand id -> its triangle on the map
    const standDraftRef = useRef(null);  // copy of standDraft for the map click handler
    const showTrailsRef = useRef(true);  // copy of showTrails for drawing trails
    const showStandsRef = useRef(true);  // copy of showStands
    const heatLayerRef = useRef(null);  // the heat map layer
    const arrowMarkersRef = useRef({});  // camera id -> its direction arrow
    const facingLayersRef = useRef({});  // camera id -> the wedge showing which way it points
    const colorsRef = useRef(colors);  // copy of the colors for code that runs outside a redraw
    colorsRef.current = colors;
    // Keep the ref copies up to date on every redraw
    standDraftRef.current = standDraft;
    showTrailsRef.current = showTrails;
    showStandsRef.current = showStands;

    const driveSyncTimeoutRef = useRef(null);  // timer that waits 2 seconds after an edit before syncing
    const suppressNextPushRef = useRef(false);  // set when data was just downloaded so it isn't uploaded straight back
    const signedInRef = useRef(false);  // copy of signedIn for timers
    const firstSaveRef = useRef(true);  // lets the very first save (on page load) skip the 'edited' stamp
    const syncBusyRef = useRef(false);  // true while a sync is running
    const syncFnRef = useRef(null);  // always points at the newest syncFromDrive
    syncFnRef.current = syncFromDrive;

    // Keep signedInRef in step with signedIn
    useEffect(function() {
        signedInRef.current = signedIn;
    }, [signedIn]);

    // After data is downloaded, redraw the camera dots and trail lines on the map so they match
    function refreshMapLayers(newCameras, newTrails) {

        if (!mapRef.current) return;

        Object.values(cameraMarkersRef.current).forEach(function(marker) {
            try {
                mapRef.current.removeLayer(marker);
            } catch (error) {}
        });

        cameraMarkersRef.current = {};

        redrawAllTrails([]);

        newCameras.forEach(function(camera) {
            addCameraMarker(camera);
        });

        newTrails.forEach(function(trail) {
            drawSavedTrail(trail);
        });
    }

    // Remember when (and against which Drive version) this device last synced
    function markSynced(timestamp, remoteModified) {
        localStorage.setItem(SYNCED_AT_KEY, String(timestamp));
        localStorage.setItem(SYNCED_REMOTE_KEY, remoteModified || "");
    }

    // Show a sync problem in the header; a 401 means the Google pass expired so we sign out
    function reportDriveError(error) {

        setSyncStatus("error");

        if (error && error.status === 401) {

            driveAccessToken = null;
            setSignedIn(false);

            setSyncError(
                "Your Google session expired. Tap Connect Google Drive to reconnect. Changes on this device are saved and will upload then."
            );

            return;
        }

        setSyncError(
            (error && error.message) ||
            "Something went wrong talking to Google Drive."
        );
    }

    // UPLOAD: send this device's cameras, trails and stands to the Drive backup file
    async function pushToDrive() {

        setSyncStatus("syncing");

        const timestamp = Date.now();

        // What gets saved in the backup file
        const payload = {
            app: "Deer Trail Cam Scorer",
            version: 1,
            lastModified: timestamp,
            cameras: getCameras(),
            trails: getTrails(),
            stands: getStands()
        };

        const result = await driveUpload(
            driveFileId,
            payload
        );

        if (result && result.id) {
            driveFileId = result.id;
        }

        markSynced(timestamp, result && result.modifiedTime);
    }

    // DOWNLOAD: replace this device's data with the copy stored in Drive
    async function pullFromDrive(file) {

        const driveData = await driveDownload(file.id);

        if (
            !driveData ||
            !Array.isArray(driveData.cameras) ||
            !Array.isArray(driveData.trails)
        ) {
            throw new Error(
                "The file in Google Drive isn't valid Deer Trail Cam data."
            );
        }

        // Clean up the downloaded cameras the same way saved ones are cleaned
        const pulledCameras = driveData.cameras.map(function(camera) {
            return {
                id: camera.id || Date.now(),
                name: camera.name || "Camera",
                lat: Number(camera.lat),
                lng: Number(camera.lng),
                sightings: Array.isArray(camera.sightings) ? camera.sightings : [],
                facing: camera.facing || "",
                emailMatch: camera.emailMatch || ""
            };
        }).filter(function(camera) {
            return Number.isFinite(camera.lat) &&
                   Number.isFinite(camera.lng);
        });

        // Tell the save effect not to treat this download as a new edit (otherwise it would upload it again)
        suppressNextPushRef.current = true;

        setCameras(pulledCameras);
        setTrails(driveData.trails);

        if (Array.isArray(driveData.stands)) {
            setStands(
                sanitizeStands(driveData.stands) || []
            );
        }

        refreshMapLayers(pulledCameras, driveData.trails);

        markSynced(Date.now(), file.modifiedTime);
    }

    // SYNC (the heart of Drive sync). Decides whether to upload, download, ask you, or do nothing:
    //   - no backup in Drive yet                          -> upload
    //   - this device has no data                         -> download
    //   - Drive unchanged since last sync                 -> upload only if you edited here
    //   - Drive changed and you did NOT edit here         -> download
    //   - Drive changed AND you edited here (or first sync with data on both) -> ask which to keep
    async function syncFromDrive() {

        // Don't run two syncs at once, and do nothing when not signed in
        if (syncBusyRef.current || !driveAccessToken) return;

        syncBusyRef.current = true;

        setSyncStatus("syncing");

        try {

            // Is there already a backup file in Drive?
            const file = await driveFindFile();

            // No backup yet: upload this device's data to create it
            if (!file) {

                await pushToDrive();

            } else {

                driveFileId = file.id;

                // Does this device have anything saved?
                const localHasData =
                    getCameras().length > 0 ||
                    getTrails().length > 0 ||
                    getStands().length > 0;

                // The Drive file version this device saw at its last sync
                const lastRemote =
                    localStorage.getItem(SYNCED_REMOTE_KEY) || "";

                // Has Drive changed since then (another device uploaded)?
                const remoteChanged = lastRemote !== file.modifiedTime;

                // Have you edited on this device since the last sync?
                const dirty = getLastModified() > getSyncedAt();

                // Nothing here to lose: just download
                if (!localHasData) {

                    await pullFromDrive(file);

                // Drive is as we left it: upload only if we have new edits
                } else if (!remoteChanged) {

                    if (dirty) {
                        await pushToDrive();
                    }

                // Drive has newer data and we have no unsynced edits: safe to download
                } else if (!dirty && lastRemote) {

                    await pullFromDrive(file);

                } else {

                    // Both sides have changes: let the user choose which copy wins
                    const useCloud = confirm(
                        "Google Drive already has saved data (from another device or an earlier sync).\n\n" +
                        "OK = load the cloud data here (replaces what's on this device).\n" +
                        "Cancel = keep this device's data and overwrite the cloud."
                    );

                    if (useCloud) {
                        await pullFromDrive(file);
                    } else {
                        await pushToDrive();
                    }
                }
            }

            setSyncStatus("synced");
            setSyncError("");

        } catch (error) {

            reportDriveError(error);

        } finally {

            syncBusyRef.current = false;
        }
    }

    // Runs when Google's sign-in popup finishes
    function handleDriveAuthResponse(response) {

        // Google reported a problem
        if (response && response.error) {

            setSyncStatus("error");

            setSyncError(
                "Google sign-in failed: " +
                (response.error_description || response.error)
            );

            return;
        }

        // Signed in: we got a pass (token)
        if (response && response.access_token) {

            if (
                window.google &&
                // The permission box for Drive access was left unticked on Google's screen
                !google.accounts.oauth2.hasGrantedAllScopes(
                    response,
                    DRIVE_SCOPE
                )
            ) {

                driveAccessToken = null;

                setSyncStatus("error");

                setSyncError(
                    "Drive access wasn't granted. When Google asks, tick the box that lets this app store its data in your Google Drive, then try again."
                );

                return;
            }

            // Connected OK: remember it, show 'Synced', and run a first sync
            localStorage.setItem(WAS_CONNECTED_KEY, "1");

            setSignedIn(true);
            setSyncError("");
            syncFromDrive();
        }
    }

    // Runs when the popup was closed or blocked before finishing
    function handleDriveTokenError(error) {

        setSyncStatus("error");

        setSyncError(
            error && error.type === "popup_closed"
                ? "The Google sign-in window was closed before it finished."
                : error && error.type === "popup_failed_to_open"
                    ? "Your browser blocked the Google sign-in popup. Allow popups for this site and try again."
                    : "Google sign-in failed."
        );
    }

    // Asks you to paste your Google Client ID (used by the gear button, or automatically if none is set)
    function askForClientId() {

        const current = getClientId();

        const value = prompt(
            "Paste your Google OAuth Client ID (from Google Cloud Console > Credentials). It ends in .apps.googleusercontent.com",
            clientIdLooksValid(current) ? current : ""
        );

        if (!value) return false;

        const id = value.trim();

        if (!clientIdLooksValid(id)) {
            alert("That doesn't look like a Client ID. It should look like 123456789012-abc123.apps.googleusercontent.com");
            return false;
        }

        localStorage.setItem(CLIENT_ID_KEY, id);
        initDriveTokenClient(handleDriveAuthResponse, handleDriveTokenError);

        return true;
    }

    // Connect button: make sure a Client ID exists, then open Google's sign-in
    function signInToDrive() {

        if (!clientIdLooksValid(getClientId())) {
            if (!askForClientId()) return;
        }

        requestDriveAccess(handleDriveAuthResponse);
    }

    // Disconnect button: forget the Google pass (your data stays on this device)
    function signOutOfDrive() {
        driveSignOut();
        localStorage.removeItem(WAS_CONNECTED_KEY);
        setSignedIn(false);
        setSyncStatus("");
        setSyncError("");
    }

    // Wait for Google's sign-in script to load, then set up the sign-in client (checks every 0.2 s)
    useEffect(function() {

        const interval = setInterval(function() {

            if (initDriveTokenClient(handleDriveAuthResponse, handleDriveTokenError)) {
                clearInterval(interval);
            }

        }, 200);

        return function() {
            clearInterval(interval);
        };

    }, []);

    // SAVE + SYNC: whenever cameras, trails or stands change, save them on this device,
    // stamp the edit time, and (if connected to Drive) sync 2 seconds later
    useEffect(function() {

        saveData(cameras, trails, stands);

        if (firstSaveRef.current) {
            firstSaveRef.current = false;
            return;
        }

        if (suppressNextPushRef.current) {
            suppressNextPushRef.current = false;
            return;
        }

        setLastModified(Date.now());

        if (signedInRef.current) {

            if (driveSyncTimeoutRef.current) {
                clearTimeout(driveSyncTimeoutRef.current);
            }

            driveSyncTimeoutRef.current = setTimeout(function() {
                syncFnRef.current();
            }, 2000);
        }

    }, [cameras, trails, stands]);

    // Check Drive again when you return to the app and once a minute while connected
    useEffect(function() {

        function trySync() {

            if (
                signedInRef.current &&
                document.visibilityState === "visible"
            ) {
                syncFnRef.current();
            }
        }

        const interval = setInterval(trySync, 60000);

        document.addEventListener("visibilitychange", trySync);

        return function() {
            clearInterval(interval);
            document.removeEventListener("visibilitychange", trySync);
        };

    }, []);

    const selectedCamera = cameras.find(function(camera) {
        return camera.id === selectedCameraId;
    });

    const selectedStand = stands.find(function(stand) {
        return stand.id === selectedStandId;
    });

    // Finishes 'Move Marker': puts the waiting camera at the tapped spot. Returns false if no camera was waiting.
    function placeMovingCamera(latlng) {

        const id = movingCameraRef.current;

        if (!id) return false;

        setCameras(function(previous) {
            return previous.map(function(camera) {
                if (camera.id !== id) return camera;
                return {
                    ...camera,
                    lat: latlng.lat,
                    lng: latlng.lng
                };
            });
        });

        const marker = cameraMarkersRef.current[id];

        if (marker) {
            marker.setLatLng(latlng);
        }

        movingCameraRef.current = null;
        setMovingCameraId(null);

        return true;
    }

    // Start 'Move Marker': remember which camera to move, then the next map tap places it
    function startMoveCamera(id) {
        movingStandRef.current = null;
        setMovingStandId(null);
        movingCameraRef.current = id;
        setMovingCameraId(id);
    }

    // Stop any move in progress (camera or stand)
    function cancelMove() {
        movingCameraRef.current = null;
        setMovingCameraId(null);
        movingStandRef.current = null;
        setMovingStandId(null);
    }

    // Finishes 'Move Stand': puts the waiting stand at the tapped spot
    function placeMovingStand(latlng) {

        const id = movingStandRef.current;

        if (!id) return false;

        setStands(function(previous) {
            return previous.map(function(stand) {
                if (stand.id !== id) return stand;
                return {
                    ...stand,
                    lat: latlng.lat,
                    lng: latlng.lng
                };
            });
        });

        movingStandRef.current = null;
        setMovingStandId(null);

        return true;
    }

    // Start 'Move Stand'
    function startMoveStand(id) {
        movingCameraRef.current = null;
        setMovingCameraId(null);
        movingStandRef.current = id;
        setMovingStandId(id);
    }

    // Start adding a stand: show the name/type form, next map tap places it
    function startStandDraft() {

        cancelMove();

        // Drawing a trail: add this point
        if (drawingTrailRef.current) {
            cancelTrail();
        }

        setSelectedCameraId(null);
        setSelectedStandId(null);
        setShowSightingForm(false);
        setShowStands(true);
        setStandDraft({ name: "", type: STAND_TYPES[0] });
    }

    // Cancel adding a stand
    function cancelStandDraft() {
        standDraftRef.current = null;
        setStandDraft(null);
    }

    // Open a stand's details and zoom the map to it
    function openStand(stand) {

        setSelectedStandId(stand.id);
        setSelectedCameraId(null);
        setShowSightingForm(false);
        setShowStands(true);
        setView("map");

        setTimeout(function() {

            if (mapRef.current) {

                mapRef.current.setView(
                    [stand.lat, stand.lng],
                    16
                );
            }

        }, 150);
    }

    // Delete a stand (after confirming)
    function deleteStand(id) {

        const stand = stands.find(function(item) {
            return item.id === id;
        });

        if (!stand) return;

        if (!confirm("Delete " + stand.name + "?")) return;

        cancelMove();

        setStands(function(previous) {
            return previous.filter(function(item) {
                return item.id !== id;
            });
        });

        setSelectedStandId(null);
    }

    // BUILD THE MAP. Runs when the Map tab opens.
    // If an old map exists for a container that no longer exists, throw it away and start fresh; otherwise just resize it.
    function initializeMap() {

        if (
            mapRef.current &&
            // (is the old map attached to a map box that is no longer on the page?)
            mapRef.current.getContainer() !==
                document.getElementById("map")
        ) {
            try {
                mapRef.current.remove();
            } catch (error) {}

            mapRef.current = null;
            cameraMarkersRef.current = {};
            trailLayersRef.current = [];
            currentTrailLayerRef.current = null;
            heatLayerRef.current = null;
            arrowMarkersRef.current = {};
            standMarkersRef.current = {};
            facingLayersRef.current = {};
        }

        if (mapRef.current) {
            setTimeout(function() {
                mapRef.current.invalidateSize();
            }, 100);
            return;
        }

        // Create the map. zoomSnap/zoomDelta give finer zoom steps (quarter-level stops, half-level per button press)
        const map = L.map("map", {
            zoomSnap: 0.25,
            zoomDelta: 0.5,
            wheelPxPerZoomLevel: 90
        }).setView(
            [42.84, -88.54],
            13
        );

        // Remember the map; bump mapVersion so the heat/arrow/stand effects draw onto it
        mapRef.current = map;
        setMapVersion(function(v) { return v + 1; });

        // Camera markers live in their own pane above the trails
        // Custom layers ('panes') decide what draws on top: trails < stands (640) < cameras (650)
        map.createPane("cameraPane");
        map.getPane("cameraPane").style.zIndex = 650;

        // Stands sit above trails but below cameras
        map.createPane("standPane");
        map.getPane("standPane").style.zIndex = 640;

        // Satellite imagery background (Esri World Imagery)
        L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {
                attribution: "Tiles &copy; Esri"
            }
        ).addTo(map);

        // Put a dot on the map for every saved camera
        cameras.forEach(function(camera) {
            addCameraMarker(camera);
        });

        // Draw every saved trail
        trails.forEach(function(trail) {
            drawSavedTrail(trail);
        });

        // MAP CLICK: what tapping the map does, in priority order:
        //   1. a camera/stand is waiting to be moved -> put it here
        //   2. a stand is being added                -> create the stand here
        //   3. a trail is being drawn                -> add a point to the trail
        //   4. otherwise                             -> ask for a name and add a new camera here
        map.on("click", function(event) {

            if (
                placeMovingCamera(event.latlng) ||
                placeMovingStand(event.latlng)
            ) {
                return;
            }

            // Adding a stand: needs a name first
            if (standDraftRef.current) {

                const draft = standDraftRef.current;

                if (!draft.name.trim()) {
                    alert("Enter a name for the stand first.");
                    return;
                }

                const stand = {
                    id: Date.now(),
                    name: draft.name.trim(),
                    type: draft.type,
                    lat: event.latlng.lat,
                    lng: event.latlng.lng
                };

                setStands(function(previous) {
                    return [...previous, stand];
                });

                standDraftRef.current = null;
                setStandDraft(null);
                setSelectedStandId(stand.id);

                return;
            }

            if (drawingTrailRef.current) {

                const point = [
                    event.latlng.lat,
                    event.latlng.lng
                ];

                setCurrentTrailPoints(function(previous) {
                    return [...previous, point];
                });

                return;
            }

            const name = prompt(
                "Enter a name for this camera:"
            );

            if (!name) return;

            const camera = {
                id: Date.now(),
                name: name,
                lat: event.latlng.lat,
                lng: event.latlng.lng,
                sightings: []
            };

            setCameras(function(previous) {
                return [...previous, camera];
            });

            addCameraMarker(camera);

            setSelectedStandId(null);
            setSelectedCameraId(camera.id);
        });
    }

    // When the Map tab opens, build the map (after a short wait so its box exists)
    useEffect(function() {

        if (view !== "map") return;

        setTimeout(function() {
            initializeMap();

            if (mapRef.current) {
                mapRef.current.invalidateSize();
            }
        }, 100);

    }, [view]);

    // Draws one camera as a dot on the map (does nothing if it already has one)
    function addCameraMarker(camera) {

        if (!mapRef.current) return;

        if (cameraMarkersRef.current[camera.id]) {
            return;
        }

        // The dot: red with a white outline by default, sitting in the camera pane so it is above trails
        const marker = L.circleMarker(
            [camera.lat, camera.lng],
            {
                pane: "cameraPane",
                radius: 7,
                color: colorsRef.current.cameraOutline,
                weight: 2,
                fillColor: colorsRef.current.camera,
                fillOpacity: 1
            }
        ).addTo(mapRef.current);

        // Tapping a camera: place a waiting move here, or open the camera and zoom to it
        marker.on("click", function(event) {

            L.DomEvent.stopPropagation(event);

            if (
                placeMovingCamera(event.latlng) ||
                placeMovingStand(event.latlng)
            ) {
                return;
            }

            setSelectedStandId(null);
            setSelectedCameraId(camera.id);
            setShowSightingForm(false);

            mapRef.current.setView(
                [camera.lat, camera.lng],
                16
            );
        });

        cameraMarkersRef.current[camera.id] = marker;
    }

    // Draws one saved trail as a line (only if trails are switched on)
    function drawSavedTrail(trail) {

        if (!mapRef.current) return;

        // The trail line
        const line = L.polyline(
            trail.points,
            {
                color: colorsRef.current.trail,
                weight: 5,
                opacity: 0.9
            }
        );

        if (showTrailsRef.current) {
            line.addTo(mapRef.current);
        }

        trailLayersRef.current.push(line);
    }

    // Draw the trail line while you are clicking points to make a new trail
    useEffect(function() {

        if (!mapRef.current) return;

        if (currentTrailLayerRef.current) {

            mapRef.current.removeLayer(
                currentTrailLayerRef.current
            );

            currentTrailLayerRef.current = null;
        }

        if (currentTrailPoints.length >= 2) {

            currentTrailLayerRef.current =
                L.polyline(
                    currentTrailPoints,
                    {
                        color: colorsRef.current.trail,
                        weight: 5,
                        opacity: 0.9
                    }
                ).addTo(mapRef.current);
        }

    }, [currentTrailPoints]);

    // Colors changed: save them and recolor the camera dots, trails and stand triangles
    useEffect(function() {

        localStorage.setItem(
            COLORS_KEY,
            JSON.stringify(colors)
        );

        Object.values(cameraMarkersRef.current).forEach(
            function(marker) {
                marker.setStyle({
                    fillColor: colors.camera,
                    color: colors.cameraOutline
                });
            }
        );

        trailLayersRef.current.forEach(function(layer) {
            layer.setStyle({ color: colors.trail });
        });

        Object.values(standMarkersRef.current).forEach(function(marker) {
            marker.setIcon(standIcon(colors));
        });

        if (currentTrailLayerRef.current) {
            currentTrailLayerRef.current.setStyle({
                color: colors.trail
            });
        }

    }, [colors]);

    // HEAT MAP: rebuild the heat layer whenever its settings, the data or the timelapse hour change
    useEffect(function() {

        if (!mapRef.current) return;

        if (heatLayerRef.current) {
            mapRef.current.removeLayer(heatLayerRef.current);
            heatLayerRef.current = null;
        }

        // Heat map off (or its library failed to load): nothing to draw
        if (!heatOn || !L.heatLayer) return;

        const points = [];

        cameras.forEach(function(camera) {

            const count = camera.sightings
                .filter(function(sighting) {
                    return matchesHeatFilter(sighting.deerType, heatFilter) &&
                        (!timelapseOn ||
                            sightingHour(sighting) === timelapseHour);
                })
                .reduce(function(total, sighting) {
                    return total + Number(sighting.number || 0);
                }, 0);

            if (count > 0) {
                points.push([camera.lat, camera.lng, count]);
            }
        });

        if (!points.length) return;

        // The busiest camera sets the top of the color scale
        let maxCount = Math.max.apply(
            null,
            points.map(function(point) {
                return point[2];
            })
        );

        // In timelapse, use the busiest camera-hour of the whole day as the scale so hours can be compared fairly
        if (timelapseOn) {

            // keep the scale fixed across the whole day so hours are comparable
            maxCount = 1;

            cameras.forEach(function(camera) {

                for (let hour = 0; hour < 24; hour++) {

                    const hourCount = camera.sightings
                        .filter(function(sighting) {
                            return matchesHeatFilter(sighting.deerType, heatFilter) &&
                                sightingHour(sighting) === hour;
                        })
                        .reduce(function(total, sighting) {
                            return total + Number(sighting.number || 0);
                        }, 0);

                    if (hourCount > maxCount) {
                        maxCount = hourCount;
                    }
                }
            });
        }

        // Draw the heat layer; radius/blur come from the Heat radius slider
        heatLayerRef.current = L.heatLayer(points, {
            radius: heatRadius,
            blur: Math.round(heatRadius * 0.7),
            maxZoom: 17,
            max: maxCount,
            minOpacity: 0.35
        }).addTo(mapRef.current);

    }, [heatOn, heatFilter, heatRadius, cameras, mapVersion, timelapseOn, timelapseHour]);

    // TIMELAPSE: while playing, move to the next hour every 0.9 seconds (23 -> 0 wraps around)
    useEffect(function() {

        if (!timelapsePlaying) return;

        const interval = setInterval(function() {
            setTimelapseHour(function(hour) {
                return (hour + 1) % 24;
            });
        }, 900);

        return function() {
            clearInterval(interval);
        };

    }, [timelapsePlaying]);

    // DIRECTION ARROWS: rebuild each camera's arrow from its sightings
    useEffect(function() {

        Object.values(arrowMarkersRef.current).forEach(function(marker) {
            try {
                marker.remove();
            } catch (error) {}
        });

        arrowMarkersRef.current = {};

        if (!mapRef.current) return;

        cameras.forEach(function(camera) {

            const bearing = averageBearing(camera);

            if (bearing === null) return;

            arrowMarkersRef.current[camera.id] = L.marker(
                [camera.lat, camera.lng],
                {
                    icon: arrowIcon(bearing, colors),
                    interactive: false,
                    keyboard: false,
                    pane: "cameraPane"
                }
            ).addTo(mapRef.current);
        });

    }, [cameras, colors, mapVersion]);

    // CAMERA FACING: draw a faint wedge from each camera showing which way it points
    useEffect(function() {

        Object.values(facingLayersRef.current).forEach(function(layer) {
            try {
                layer.remove();
            } catch (error) {}
        });

        facingLayersRef.current = {};

        const map = mapRef.current;

        if (!map) return;

        cameras.forEach(function(camera) {

            if (!DIRECTION_BEARINGS.hasOwnProperty(camera.facing)) return;

            facingLayersRef.current[camera.id] = L.polygon(
                facingWedge(camera),
                {
                    color: colors.camera,
                    weight: 1,
                    fillColor: colors.camera,
                    fillOpacity: 0.25,
                    interactive: false
                }
            ).addTo(map);
        });

    }, [cameras, colors, mapVersion]);

    // STANDS: make the triangles on the map match the stands list (add, move, remove, show/hide)
    useEffect(function() {

        const map = mapRef.current;

        if (!map) return;

        const markers = standMarkersRef.current;
        const ids = {};

        stands.forEach(function(stand) {
            ids[stand.id] = true;
        });

        Object.keys(markers).forEach(function(id) {

            if (!ids[id]) {

                try {
                    markers[id].remove();
                } catch (error) {}

                delete markers[id];
            }
        });

        stands.forEach(function(stand) {

            let marker = markers[stand.id];

            if (!marker) {

                marker = L.marker(
                    [stand.lat, stand.lng],
                    {
                        icon: standIcon(colorsRef.current),
                        pane: "standPane",
                        keyboard: false
                    }
                );

                (function(created, standId) {

                    created.on("click", function(event) {

                        L.DomEvent.stopPropagation(event);

                        const position = created.getLatLng();

                        if (
                            placeMovingCamera(position) ||
                            placeMovingStand(position)
                        ) {
                            return;
                        }

                        setSelectedStandId(standId);
                        setSelectedCameraId(null);
                        setShowSightingForm(false);

                        map.setView(position, 16);
                    });

                })(marker, stand.id);

                markers[stand.id] = marker;

            } else {

                marker.setLatLng([stand.lat, stand.lng]);
            }

            marker.unbindTooltip();

            marker.bindTooltip(
                stand.name + " (" + stand.type + ")",
                {
                    direction: "top",
                    offset: [0, -14]
                }
            );

            if (showStands) {

                if (!map.hasLayer(marker)) {
                    marker.addTo(map);
                }

            } else if (map.hasLayer(marker)) {

                map.removeLayer(marker);
            }
        });

    }, [stands, mapVersion, showStands]);

    // Save the trails/stands on-off choice and show or hide the trail lines
    useEffect(function() {

        localStorage.setItem(
            LAYERS_KEY,
            JSON.stringify({
                trails: showTrails,
                stands: showStands
            })
        );

        const map = mapRef.current;

        if (!map) return;

        trailLayersRef.current.forEach(function(layer) {

            if (showTrails) {

                if (!map.hasLayer(layer)) {
                    layer.addTo(map);
                }

            } else if (map.hasLayer(layer)) {

                map.removeLayer(layer);
            }
        });

    }, [showTrails, showStands, mapVersion]);

    // Open a camera's details, switch to the map, and zoom to it
    function openCamera(camera) {

        setSelectedStandId(null);
        setSelectedCameraId(camera.id);
        setShowSightingForm(false);
        setView("map");

        setTimeout(function() {

            if (mapRef.current) {

                mapRef.current.setView(
                    [camera.lat, camera.lng],
                    16
                );
            }

        }, 150);
    }

    // Delete a camera and all its sightings (after confirming)
    function deleteCamera(id) {

        const camera = cameras.find(function(item) {
            return item.id === id;
        });

        if (!camera) return;

        const confirmed = confirm(
            "Delete " +
            camera.name +
            " and all of its sightings?"
        );

        if (!confirmed) return;

        setCameras(function(previous) {

            return previous.filter(function(item) {
                return item.id !== id;
            });

        });

        if (
            cameraMarkersRef.current[id] &&
            mapRef.current
        ) {

            mapRef.current.removeLayer(
                cameraMarkersRef.current[id]
            );

            delete cameraMarkersRef.current[id];
        }

        setSelectedCameraId(null);
    }

    // Clear the New Sighting form back to its starting values
    function resetSightingForm() {

        setDate("");
        setTime("");
        setDeerType("Buck");
        setNumber("1");
        setAntlerPoints("");
        setDirection("");
        setNotes("");
    }

    // Save the New Sighting form as a sighting on the selected camera
    function addSighting(event) {

        // Stop the browser reloading the page when the form is submitted
        event.preventDefault();

        if (!selectedCamera) return;

        // The new sighting record
        const sighting = {
            id: Date.now(),
            date: date,
            time: time,
            deerType: deerType,
            number: Number(number) || 1,
            antlerPoints:
                antlerPoints === ""
                    ? null
                    : Number(antlerPoints),
            direction: resolveDirection(direction, selectedCamera),
            notes: notes
        };

        setCameras(function(previous) {

            return previous.map(function(camera) {

                if (camera.id !== selectedCamera.id) {
                    return camera;
                }

                return {
                    ...camera,
                    sightings: [
                        ...camera.sightings,
                        sighting
                    ]
                };
            });

        });

        resetSightingForm();
        setShowSightingForm(false);
    }

    // Remove one sighting from the selected camera
    function deleteSighting(id) {

        if (!selectedCamera) return;

        setCameras(function(previous) {

            return previous.map(function(camera) {

                if (camera.id !== selectedCamera.id) {
                    return camera;
                }

                return {
                    ...camera,
                    sightings: camera.sightings.filter(
                        function(sighting) {
                            return sighting.id !== id;
                        }
                    )
                };
            });

        });
    }

    // Start drawing a deer trail (also switches trails on)
    function startTrail() {

        cancelMove();
        cancelStandDraft();
        setShowTrails(true);
        setSelectedStandId(null);
        setSelectedCameraId(null);
        setShowSightingForm(false);

        drawingTrailRef.current = true;
        setDrawingTrail(true);
        setCurrentTrailPoints([]);
    }

    // Abandon the trail being drawn
    function cancelTrail() {

        drawingTrailRef.current = false;
        setDrawingTrail(false);
        setCurrentTrailPoints([]);

        if (
            currentTrailLayerRef.current &&
            mapRef.current
        ) {

            mapRef.current.removeLayer(
                currentTrailLayerRef.current
            );

            currentTrailLayerRef.current = null;
        }
    }

    // Save the trail being drawn (needs at least two points and a name)
    function finishTrail() {

        if (currentTrailPoints.length < 2) {

            alert(
                "A trail needs at least two points."
            );

            return;
        }

        const name = prompt(
            "Enter a name for this trail:"
        );

        if (!name) return;

        const trail = {
            id: Date.now(),
            name: name,
            points: currentTrailPoints
        };

        setTrails(function(previous) {
            return [...previous, trail];
        });

        drawingTrailRef.current = false;
        setDrawingTrail(false);
        setCurrentTrailPoints([]);

        if (
            currentTrailLayerRef.current &&
            mapRef.current
        ) {

            mapRef.current.removeLayer(
                currentTrailLayerRef.current
            );

            currentTrailLayerRef.current = null;
        }

        drawSavedTrail(trail);
    }

    // Delete a trail (after confirming)
    function deleteTrail(id) {

        const confirmed = confirm(
            "Delete this trail?"
        );

        if (!confirmed) return;

        setTrails(function(previous) {

            return previous.filter(function(trail) {
                return trail.id !== id;
            });

        });

        redrawAllTrails(
            trails.filter(function(trail) {
                return trail.id !== id;
            })
        );
    }

    // Remove all trail lines from the map and draw the given list again
    function redrawAllTrails(list) {

        if (!mapRef.current) return;

        trailLayersRef.current.forEach(function(layer) {

            mapRef.current.removeLayer(layer);

        });

        trailLayersRef.current = [];

        list.forEach(function(trail) {

            drawSavedTrail(trail);

        });
    }

    // Export Data button: download everything as a .json backup file
    function exportData() {

        const data = {
            app: "Deer Trail Cam Scorer",
            version: 1,
            exportedAt: new Date().toISOString(),
            cameras: cameras,
            trails: trails,
            stands: stands
        };

        // Turn the data into nicely indented text
        const json = JSON.stringify(
            data,
            null,
            2
        );

        // Wrap the text in a downloadable file
        const blob = new Blob(
            [json],
            {
                type: "application/json"
            }
        );

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = url;

        // File name: deer-trail-cam-backup-<today's date>.json
        link.download =
            "deer-trail-cam-backup-" +
            new Date()
                .toISOString()
                .slice(0, 10) +
            ".json";

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

        URL.revokeObjectURL(url);
    }

    // Import Data button: read a backup file and replace this device's data with it
    function importData(event) {

        const file = event.target.files[0];

        if (!file) return;

        // Read the chosen file as text
        const reader = new FileReader();

        reader.onload = function(loadEvent) {

            try {

                const data = JSON.parse(
                    loadEvent.target.result
                );

                if (
                    !data ||
                    !Array.isArray(data.cameras) ||
                    !Array.isArray(data.trails)
                ) {

                    alert(
                        "That file is not a valid Deer Trail Cam backup."
                    );

                    return;
                }

                const confirmed = confirm(
                    "Import this backup? This will replace the data currently on this device."
                );

                if (!confirmed) return;

                // Clean up imported cameras, trails and stands before using them
                const importedCameras =
                    data.cameras.map(function(camera) {

                        return {
                            id: camera.id,
                            name: camera.name,
                            lat: Number(camera.lat),
                            lng: Number(camera.lng),
                            sightings: Array.isArray(camera.sightings) ? camera.sightings : [],
                            facing: camera.facing || "",
                            emailMatch: camera.emailMatch || ""
                        };

                    });

                const importedTrails =
                    data.trails.map(function(trail) {

                        return {
                            id: trail.id,
                            name: trail.name,
                            points:
                                Array.isArray(
                                    trail.points
                                )
                                    ? trail.points
                                    : []
                        };

                    });

                localStorage.setItem(
                    CAMERA_KEY,
                    JSON.stringify(
                        importedCameras
                    )
                );

                localStorage.setItem(
                    TRAIL_KEY,
                    JSON.stringify(
                        importedTrails
                    )
                );

                setCameras(importedCameras);
                setTrails(importedTrails);

                setSelectedCameraId(null);
                setShowSightingForm(false);

                if (mapRef.current) {

                    Object.values(
                        cameraMarkersRef.current
                    ).forEach(function(marker) {

                        mapRef.current.removeLayer(
                            marker
                        );

                    });

                    cameraMarkersRef.current = {};

                    redrawAllTrails([]);

                    importedCameras.forEach(
                        function(camera) {
                            addCameraMarker(camera);
                        }
                    );

                    importedTrails.forEach(
                        function(trail) {
                            drawSavedTrail(trail);
                        }
                    );
                }

                alert(
                    "Backup imported successfully."
                );

            } catch {

                alert(
                    "Could not read that file."
                );
            }

            event.target.value = "";

        };

        reader.readAsText(file);
    }

    // ---- Numbers used by the dashboard and charts ----
    // Flat list of every sighting from every camera (each remembers which camera it came from)
    const allSightings = [];

    cameras.forEach(function(camera) {

        camera.sightings.forEach(function(sighting) {

            allSightings.push({
                ...sighting,
                cameraName: camera.name,
                cameraId: camera.id,
                inShootingHours: isShootingTime(sighting, camera)
            });

        });

    });

    // Newest sightings first
    allSightings.sort(function(a, b) {

        return new Date(
            (b.date || "") +
            "T" +
            (b.time || "00:00")
        ) -
        new Date(
            (a.date || "") +
            "T" +
            (a.time || "00:00")
        );

    });

    // Total deer across all sightings
    const totalDeer =
        allSightings.reduce(
            function(total, sighting) {
                return total +
                    Number(sighting.number || 0);
            },
            0
        );

    // Bucks seen (includes big bucks)
    const buckCount =
        allSightings
            .filter(function(s) {
                return isBuckType(s.deerType);
            })
            .reduce(function(total, s) {
                return total +
                    Number(s.number || 0);
            }, 0);

    // Big bucks seen
    const bigBuckCount =
        allSightings
            .filter(function(s) {
                return s.deerType === "Big Buck";
            })
            .reduce(function(total, s) {
                return total +
                    Number(s.number || 0);
            }, 0);

    // Does seen
    const doeCount =
        allSightings
            .filter(function(s) {
                return s.deerType === "Doe";
            })
            .reduce(function(total, s) {
                return total +
                    Number(s.number || 0);
            }, 0);

    // Fawns seen
    const fawnCount =
        allSightings
            .filter(function(s) {
                return s.deerType === "Fawn";
            })
            .reduce(function(total, s) {
                return total +
                    Number(s.number || 0);
            }, 0);

    // Deer of unknown type
    const unknownCount =
        allSightings
            .filter(function(s) {
                return s.deerType === "Unknown";
            })
            .reduce(function(total, s) {
                return total +
                    Number(s.number || 0);
            }, 0);

    // Deer per direction of travel, to find the most common one
    const directionCounts = {};

    allSightings.forEach(function(sighting) {

        if (!sighting.direction) return;

        directionCounts[sighting.direction] =
            (directionCounts[sighting.direction] || 0) +
            Number(sighting.number || 0);
    });

    // The direction with the most deer
    const topDirectionKey =
        Object.keys(directionCounts).sort(function(x, y) {
            return directionCounts[y] - directionCounts[x];
        })[0];

    // Deer seen per camera, busiest first
    const cameraActivity =
        cameras.map(function(camera) {

            return {
                name: camera.name,
                count:
                    camera.sightings.reduce(
                        function(total, sighting) {
                            return total +
                                Number(
                                    sighting.number || 0
                                );
                        },
                        0
                    )
            };

        }).sort(function(a, b) {
            return b.count - a.count;
        });

    // Each camera's score (see SCORE_CONFIG), highest first
    const cameraScores =
        cameras.map(function(camera) {

            return {
                name: camera.name,
                score: cameraScore(camera)
            };

        }).sort(function(a, b) {
            return b.score - a.score;
        });

    // Deer seen in each hour of the day (index 0 = midnight hour)
    const hourActivity = new Array(24).fill(0);

    allSightings.forEach(function(sighting) {

        const hour = sightingHour(sighting);

        if (hour === null) return;

        hourActivity[hour] += Number(sighting.number || 0);

    });

    // Draws one horizontal bar row (label, number, filled bar) sized against the biggest value
    function bar(label, value, maximum) {

        const width =
            maximum > 0
                ? Math.max(
                    2,
                    value / maximum * 100
                )
                : 0;

        return e(
            "div",
            {
                className: "bar-row",
                key: label
            },

            e(
                "div",
                {
                    className: "bar-header"
                },

                e("span", null, label),
                e("strong", null, value)
            ),

            e(
                "div",
                {
                    className: "bar-background"
                },

                e(
                    "div",
                    {
                        className: "bar",
                        style: {
                            width: width + "%"
                        }
                    }
                )
            )
        );
    }

    function updateCamera(id, patch) {

            });
        });
    }

    function updateEmailItem(key, patch) {

                return item.key === key ? { ...item, ...patch } : item;
            });

    // FETCH button: sign in to Gmail if needed, find trail camera emails we haven't handled, and make cards for their photos
    async function fetchEmails() {

        setEmailBusy(true);
        setEmailStatus("Connecting to Gmail...");

        try {

            // ask Google for permission the first time (this has to happen right after the tap)
            if (!gmailAccessToken) {
                await gmailSignIn();
            }

            setEmailStatus("Looking for new emails...");

            // things we already handled: photos added as sightings, skipped photos/emails, and cards already waiting below
            const known = {};

            cameras.forEach(function(camera) {
                camera.sightings.forEach(function(sighting) {

                    (sighting.photoIds || []).forEach(function(id) { known[id] = true; });

                    // sightings from the first version of the importer only have whole-email ids
                    if (!sighting.photoIds) {
                        (sighting.emailIds || (sighting.emailId ? [sighting.emailId] : [])).forEach(function(id) { known[id] = true; });
                    }
                });
            });

            getDismissedEmails().forEach(function(id) { known[id] = true; });

            emailItems.forEach(function(item) {
                item.msgIds.forEach(function(id) { known[id] = true; });
                item.photoIds.forEach(function(id) { known[id] = true; });
            });

            // walk through the search results until we have up to 20 emails we haven't finished with
            const ids = [];
            let pageToken = "";

            for (let page = 0; page < 6 && ids.length < 20; page++) {

                const list = await gmailGet(
                    "messages?maxResults=50&q=" + encodeURIComponent(gmailQuery) +
                    (pageToken ? "&pageToken=" + pageToken : "")
                );

                (list.messages || []).forEach(function(message) {
                    if (!known[message.id] && ids.length < 20) ids.push(message.id);
                });

                if (!list.nextPageToken) break;

                pageToken = list.nextPageToken;
            }

            // read each email; ones with no photos, or whose photos are all handled, are remembered as finished
            const loaded = [];
            const finished = [];

            for (let i = 0; i < ids.length; i++) {

                setEmailStatus("Reading email " + (i + 1) + " of " + ids.length + "...");

                const result = await gmailLoadMessage(ids[i], cameras, known, emailOcr, setEmailStatus);

                if (result.photoCount === 0 || result.items.length === 0) finished.push(ids[i]);
                else result.items.forEach(function(item) { loaded.push(item); });
            }

            if (finished.length) addDismissedEmails(finished);

            const groups = groupEmails(loaded);

            setEmailItems(function(previous) {
                return groups.concat(previous);
            });

            setEmailStatus(
                loaded.length
                    ? "Found " + loaded.length + " new photo" + (loaded.length === 1 ? "" : "s") + " in " + groups.length + " card" + (groups.length === 1 ? "" : "s") + "."
                    : "No new photos found."
            );

        } catch (error) {

            // a 401 means the Gmail pass expired; the next tap asks for a new one
            if (error && error.status === 401) {
                gmailAccessToken = null;
                setEmailStatus("Your Gmail session expired. Tap Fetch again.");
            } else {
                setEmailStatus("Error: " + (error && error.message ? error.message : "something went wrong"));
            }

        } finally {

            await stopTextReader();
            setEmailBusy(false);
        }
    }

    // When the last card from an email is finished, remember the whole email as done so it isn't read again
    function finishEmails(card) {

        const remaining = emailItems.filter(function(i) { return i.key !== card.key; });
        const stillWaiting = {};

        remaining.forEach(function(i) {
            i.msgIds.forEach(function(m) { stillWaiting[m] = true; });
        });

        const done = card.msgIds.filter(function(m) { return !stillWaiting[m]; });

        if (done.length) addDismissedEmails(done);
    }

    // Picking a camera on one card also picks it for other waiting cards that show the same camera name on the photo
    function chooseEmailCamera(item, cameraId) {

        setEmailItems(function(previous) {
            return previous.map(function(other) {

                if (other.key === item.key) return { ...other, cameraId: cameraId };

                if (item.stripName && other.stripName === item.stripName && !other.cameraId) {
                    return { ...other, cameraId: cameraId };
                }

                return other;
            });
        });
    }

    // ADD SIGHTING button on a card: save it as a sighting on the chosen camera
    function addEmailSighting(item) {

        const camera = cameras.find(function(c) { return String(c.id) === item.cameraId; });

        if (!camera) { alert("Choose a camera first."); return; }
        if (!item.deerType) { alert("Choose the deer type first."); return; }
        if (!item.date || !item.time) { alert("Enter the date and time."); return; }

        const sighting = {
            id: Date.now() + Math.floor(Math.random() * 1000),
            date: item.date,
            time: item.time,
            deerType: item.deerType,
            number: Number(item.number) || 1,
            antlerPoints: item.antlerPoints === "" ? null : Number(item.antlerPoints),
            direction: resolveDirection(item.direction, camera),
            notes: "From email: " + (item.subject || "").slice(0, 80),
            // remembers which email(s) and photo(s) this came from, so nothing is imported twice (also works across devices)
            emailIds: item.msgIds,
            photoIds: item.photoIds
        };

        setCameras(function(previous) {
            return previous.map(function(c) {

                if (c.id !== camera.id) return c;

                // first time this camera is chosen for a name seen on a photo: remember the name so it matches automatically next time
                const learn = item.stripName &&
                    !(c.emailMatch || "").trim() &&
                    normalizeName(item.stripName) !== normalizeName(c.name);

                return {
                    ...c,
                    emailMatch: learn ? item.stripName : (c.emailMatch || ""),
                    sightings: [...c.sightings, sighting]
                };
            });
        });

        finishEmails(item);

        setEmailItems(function(previous) {
            return previous.filter(function(i) { return i.key !== item.key; });
        });
    }

    function skipEmailItem(item) {

        finishEmails(item);

        });
    }

    // The Charts tab: a set of SVG charts drawn from the sighting data
    function chartsPage() {

        const sightings = chartCamera === "all"

            : allSightings.filter(function(sighting) {
                return String(sighting.cameraId) === chartCamera;
            });

        const visibleCameras = chartCamera === "all"
            ? cameras
            : cameras.filter(function(camera) {
                return String(camera.id) === chartCamera;
            });

        const cameraLookup = {};

        cameras.forEach(function(camera) {
            cameraLookup[camera.id] = camera;
        });

        // deer counts by type, for the type donut
        const typeSlices = CHART_TYPES.map(function(type) {
            return {
                label: type,
                color: TYPE_COLORS[type],
                value: sumNumber(sightings.filter(function(s) {
                    return s.deerType === type;
                }))
            };
        });

        // deer seen during shooting hours versus outside them
        let shootingCount = 0;
        let otherCount = 0;

        sightings.forEach(function(sighting) {

            const camera = cameraLookup[sighting.cameraId];
            const n = Number(sighting.number || 0);

            if (camera && isShootingTime(sighting, camera)) {
                shootingCount += n;

                "div",
                { className: "dashboard-inner" },

                e(

                    { className: "dashboard-title" },

                    // Chart: Weekly Power Rankings (cameras ranked by score, always uses every camera)
                    chartCard(
                        "power",
                        "Weekly power rankings",
                        powerRankingsView(cameras, powerWeeks(cameras, Date.now()), powerWeek, setPowerWeek),
                        true
                    ),

                    chartCard("daily", "Deer seen per day (last 30 days)", dailyChart(sightings), true),

                    // Chart: Deer type mix
                    chartCard("types", "Deer type mix", donutChart(typeSlices, "deer"), false),

                    // Chart: Shooting hours vs other hours
                    chartCard(
                        "shooting",
                        "Shooting hours vs other hours",
                        e(
                            "div",
                            null,
                            donutChart(
                                [
                                    { label: "Shooting hours", color: "#1f4d2b", value: shootingCount },
                                    { label: "Other hours", color: "#9e9e9e", value: otherCount }
                                ],
                                "deer",
