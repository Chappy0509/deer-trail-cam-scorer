// Opens Google's permission popup for Gmail and resolves when we have a pass.
// Must be called straight from a button tap so the browser allows the popup.
function gmailSignIn() {

    return new Promise(function(resolve, reject) {

        if (!window.google || !window.google.accounts) {
            reject(new Error("Google's sign-in script hasn't loaded yet. Check your connection and try again."));
            return;
        }

        if (!clientIdLooksValid(getClientId())) {
            reject(new Error("Set your Google Client ID first (the gear button in the header)."));
            return;
        }

        const client = google.accounts.oauth2.initTokenClient({
            client_id: getClientId(),
            scope: GMAIL_SCOPE,
            callback: function(response) {

                if (response && response.access_token) {

                    if (!google.accounts.oauth2.hasGrantedAllScopes(response, GMAIL_SCOPE)) {
                        reject(new Error("Gmail access wasn't granted. Tick the box allowing read access to your email and try again."));
                        return;
                    }

                    gmailAccessToken = response.access_token;
                    resolve(response.access_token);

                } else {

                    reject(new Error("Google sign-in failed: " + ((response && (response.error_description || response.error)) || "unknown error")));
                }
            },
            error_callback: function(error) {
                reject(new Error(
                    error && error.type === "popup_closed"
                        ? "The Google sign-in window was closed before it finished."
                        : "Google sign-in failed, or your browser blocked the popup."
                ));
            }
        });

        client.requestAccessToken({ prompt: "" });
    });
}

// Reads one thing from the Gmail API (throws a readable error if it fails)
async function gmailGet(path) {

    const response = await fetch(
        "https://gmail.googleapis.com/gmail/v1/users/me/" + path,
        { headers: { Authorization: "Bearer " + gmailAccessToken } }
    );

    if (!response.ok) {

        let detail = "";

        try {
            const body = await response.json();
            if (body && body.error && body.error.message) detail = body.error.message;
        } catch (error) {}

        let message = "Gmail request failed (" + response.status + ")" + (detail ? ": " + detail : "");

        if (response.status === 403) {
            message += " - make sure the Gmail API is enabled in your Google Cloud project and the gmail.readonly permission was granted.";
        }

        const error = new Error(message);
        error.status = response.status;
        throw error;
    }

    return response.json();
}

// Gmail sends data as "base64url"; turn it into plain base64 text
function base64UrlToBase64(data) {

    let b64 = data.replace(/-/g, "+").replace(/_/g, "/");

    while (b64.length % 4) b64 += "=";

    return b64;
}

// Decodes Gmail's base64url text into a normal string
function decodeGmailText(data) {

    try {
        const binary = atob(base64UrlToBase64(data));
        const bytes = Uint8Array.from(binary, function(c) { return c.charCodeAt(0); });
        return new TextDecoder("utf-8").decode(bytes);
    } catch (error) {
        return "";
    }
}

function stripHtml(html) {
    return html
        .replace(/<style[\s\S]*?<\/style>/gi, " ")
        .replace(/<[^>]+>/g, " ")
        .replace(/&nbsp;/g, " ")
        .replace(/&amp;/g, "&")
        .replace(/\s+/g, " ");
}

// Shrinks a photo to a small JPEG so a page full of photos doesn't use up the phone's memory
function shrinkImage(dataUrl, maxSide, quality) {

    return new Promise(function(resolve) {

        const img = new Image();

        img.onload = function() {

            const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
            const canvas = document.createElement("canvas");

            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);

            resolve(canvas.toDataURL("image/jpeg", quality || 0.75));
        };

        img.onerror = function() {
            resolve(dataUrl);
        };

        img.src = dataUrl;
    });
}

// A tiny JPEG (about 6-10 KB) kept with a sighting so you can see the deer later
function makeThumb(dataUrl) {
    return shrinkImage(dataUrl, 220, 0.6);
}

// Reads a photo file the user picked and returns a thumbnail data URL
function thumbFromFile(file) {
    return new Promise(function(resolve) {
        const reader = new FileReader();
        reader.onload = function() { makeThumb(reader.result).then(resolve); };
        reader.onerror = function() { resolve(""); };
        reader.readAsDataURL(file);
    });
}

const MONTH_NUMBERS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };

// Looks through the email text for a date and time (several common formats).
// If none is found (or it's wildly different from when the email arrived), uses the time the email arrived.
function parseEmailDateTime(text, receivedTs) {

    const candidates = [];

    function add(year, month, day, hour, minute, ampm) {

        let y = Number(year), mo = Number(month), d = Number(day), h = Number(hour), mi = Number(minute);

        if (y < 100) y += 2000;

        if (ampm) {
            const pm = ampm.toUpperCase() === "PM";
            if (h === 12) h = pm ? 12 : 0;
            else if (pm) h += 12;
        }

        if (mo < 1 || mo > 12 || d < 1 || d > 31 || h > 23 || mi > 59) return;

        const date = new Date(y, mo - 1, d, h, mi);

        if (date.getMonth() !== mo - 1) return;

        candidates.push(date);
    }

    let m;

    // 2026-09-28 06:45 (or with a T between)
    const iso = /(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?/gi;
    while ((m = iso.exec(text))) add(m[1], m[2], m[3], m[4], m[5], m[6]);

    // 09/28/2026 6:45 PM  (month first, as in the US)
    const us = /(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})[ ,T]+(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?/gi;
    while ((m = us.exec(text))) add(m[3], m[1], m[2], m[4], m[5], m[6]);

    // Sep 28, 2026 6:45 PM
    const named = /(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})[ ,]+(?:at\s+)?(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?/gi;
    while ((m = named.exec(text))) add(m[3], MONTH_NUMBERS[m[1].toLowerCase()], m[2], m[4], m[5], m[6]);

    // the first one within 3 days of the email arriving is believable
    const believable = candidates.find(function(date) {
        return Math.abs(date.getTime() - receivedTs) <= 3 * 86400000;
    });

    const chosen = believable || new Date(receivedTs);

    return {
        date: dayKey(chosen),
        time: String(chosen.getHours()).padStart(2, "0") + ":" + String(chosen.getMinutes()).padStart(2, "0"),
        source: believable ? "the email text" : "when the email arrived"
    };
}

// Finds which camera an email is about by looking for its name (or its 'email match text') in the email
function matchCamera(cameras, text) {

    const lower = text.toLowerCase();
    let best = null;
    let bestLength = 0;

    cameras.forEach(function(camera) {

        const needle = (camera.emailMatch || camera.name || "").trim().toLowerCase();

        if (!needle) return;

        const escaped = needle.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

        // whole-word match so a camera called "A" doesn't match every email
        if (new RegExp("(^|[^a-z0-9])" + escaped + "([^a-z0-9]|$)").test(lower) && needle.length > bestLength) {
            best = camera;
            bestLength = needle.length;
        }
    });

    return best;
}

// ---- Reading the date/time and camera name from the photo itself ----

// Trail cameras save the exact time the picture was taken inside the JPEG file (called EXIF data).
// This reads it from the raw file bytes. Returns { date: "2026-10-01", time: "14:35" } or null.
function readExifDate(bytes) {

    try {

        // a JPEG file starts with the bytes FF D8
        if (bytes[0] !== 0xFF || bytes[1] !== 0xD8) return null;

        let pos = 2;

        // walk through the JPEG's labelled sections until we find the "Exif" one
        while (pos + 4 < bytes.length) {

            if (bytes[pos] !== 0xFF) return null;

            const marker = bytes[pos + 1];
            const length = (bytes[pos + 2] << 8) | bytes[pos + 3];

            if (
                marker === 0xE1 &&
                String.fromCharCode(bytes[pos + 4], bytes[pos + 5], bytes[pos + 6], bytes[pos + 7]) === "Exif"
            ) {
                return readTiffDate(bytes, pos + 10);
            }

            // FF DA = the picture itself starts here, so there is no Exif section
            if (marker === 0xDA) return null;

            pos += 2 + length;
        }

    } catch (error) {}

    return null;
}

// Reads the date tags out of the Exif block ("base" is where its header starts)
function readTiffDate(b, base) {

    const little = b[base] === 0x49;   // "II" = numbers stored little-end first, "MM" = big-end first

    function u16(o) { return little ? (b[o] | (b[o + 1] << 8)) : ((b[o] << 8) | b[o + 1]); }

    function u32(o) {
        return little
            ? ((b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0)
            : (((b[o] << 24) | (b[o + 1] << 16) | (b[o + 2] << 8) | b[o + 3]) >>> 0);
    }

    // reads the tags we care about from one directory of tags
    function readDirectory(offset, wanted) {

        const found = {};
        const count = u16(base + offset);

        for (let i = 0; i < count; i++) {

            const entry = base + offset + 2 + i * 12;
            const tag = u16(entry);
            const type = u16(entry + 2);
            const items = u32(entry + 4);

            if (!wanted[tag]) continue;

            if (type === 2) {
                // text: stored right here if 4 characters or fewer, otherwise at the offset given
                const at = items <= 4 ? entry + 8 : base + u32(entry + 8);
                let text = "";
                for (let k = 0; k < items - 1; k++) text += String.fromCharCode(b[at + k]);
                found[tag] = text;
            } else if (type === 4) {
                found[tag] = u32(entry + 8);
            }
        }

        return found;
    }

    const main = readDirectory(u32(base + 4), { 0x0132: true, 0x8769: true });

    let text = null;

    // "date taken" lives in a sub-directory; the plain "date" tag is the fallback
    if (main[0x8769] !== undefined) {
        text = readDirectory(main[0x8769], { 0x9003: true })[0x9003] || null;
    }

    text = text || main[0x0132] || null;

    const m = text && /^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2})/.exec(text);

    if (!m || Number(m[1]) < 2000) return null;

    return { date: m[1] + "-" + m[2] + "-" + m[3], time: m[4] + ":" + m[5] };
}

// Turns the text read from the photo's black strip into { name, date, time }.
// The strip looks like:  10/1/2026  2:35PM  DOUBLE DUECE  004  CuddeLink
function parseStripText(text) {

    const flat = String(text || "").replace(/\s+/g, " ").trim();

    const m = /(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})\s+(\d{1,2}):(\d{2})\s*([AP])\s*M\s+(.+?)\s+(\d{3,4})\b/i.exec(flat);

    if (!m) return null;

    let hour = Number(m[4]);
    const pm = m[6].toUpperCase() === "P";

    if (hour === 12) hour = pm ? 12 : 0;
    else if (pm) hour += 12;

    let year = Number(m[3]);
    if (year < 100) year += 2000;

    const month = Number(m[1]);
    const day = Number(m[2]);

    if (month < 1 || month > 12 || day < 1 || day > 31 || hour > 23 || Number(m[5]) > 59) return null;

    return {
        // camera name between the time and the picture number; stray symbols at the ends are removed
        name: m[7].replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, "").replace(/\s+/g, " ").toUpperCase(),
        date: year + "-" + String(month).padStart(2, "0") + "-" + String(day).padStart(2, "0"),
        time: String(hour).padStart(2, "0") + ":" + m[5]
    };
}

// "Double Deuce" and "DOUBLE DUECE" -> "DOUBLEDUECE" (so small differences in spacing and case don't matter)
function normalizeName(name) {
    return String(name || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
}

// How many single-letter edits turn one word into another (used to forgive small reading mistakes)
function editDistance(a, b) {

    const row = [];

    for (let j = 0; j <= b.length; j++) row.push(j);

    for (let i = 1; i <= a.length; i++) {

        let previous = row[0];
        row[0] = i;

        for (let j = 1; j <= b.length; j++) {

            const saved = row[j];

            row[j] = Math.min(
                row[j] + 1,
                row[j - 1] + 1,
                previous + (a[i - 1] === b[j - 1] ? 0 : 1)
            );

            previous = saved;
        }
    }

    return row[b.length];
}

// Finds the camera whose name (or email match text) is the same as, or very close to, the name read from the photo.
// Returns null if nothing is close enough or two cameras tie.
function matchCameraByName(cameras, stripName) {

    const target = normalizeName(stripName);

    if (target.length < 2) return null;

    const digitsOf = function(text) { return text.replace(/[^0-9]/g, ""); };

    let best = null;
    let bestDistance = Infinity;
    let tie = false;

    cameras.forEach(function(camera) {

        [camera.name, camera.emailMatch].forEach(function(candidate) {

            const norm = normalizeName(candidate);

            if (!norm) return;

            // "NORTH 1" and "NORTH 2" are different cameras even though they are one letter apart
            if (digitsOf(norm) !== digitsOf(target)) return;

            const distance = editDistance(norm, target);
            const allowed = norm.length <= 4 ? 1 : Math.floor(norm.length / 4);

            if (distance > allowed) return;

            if (distance < bestDistance) {
                best = camera;
                bestDistance = distance;
                tie = false;
            } else if (distance === bestDistance && best && best.id !== camera.id) {
                tie = true;
            }
        });
    });

    return tie ? null : best;
}

// The text reader (Tesseract) is only downloaded when it is first needed
let ocrWorker = null;

function loadTextReader() {

    return new Promise(function(resolve, reject) {

        if (window.Tesseract) {
            resolve(window.Tesseract);
            return;
        }

        const script = document.createElement("script");

        script.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
        script.onload = function() { resolve(window.Tesseract); };
        script.onerror = function() { reject(new Error("Couldn't download the text reader")); };

        document.head.appendChild(script);
    });
}

async function getTextReader() {

    if (ocrWorker) return ocrWorker;

    const Tesseract = await loadTextReader();
    const worker = await Tesseract.createWorker("eng");

    // 6 = read it as one block of text; only allow the letters and symbols a time stamp uses
    await worker.setParameters({
        tessedit_pageseg_mode: "6",
        tessedit_char_whitelist: "0123456789/:-ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz "
    });

    ocrWorker = worker;

    return worker;
}

// Frees the text reader's memory when we're done
async function stopTextReader() {

    if (!ocrWorker) return;

    try {
        await ocrWorker.terminate();
    } catch (error) {}

    ocrWorker = null;
}

// Cuts the black time stamp bar off the bottom of a photo and prepares it for reading:
// enlarged, with the white-on-black text flipped to black-on-white (which text readers like better)
function stripCanvas(dataUrl) {

    return new Promise(function(resolve, reject) {

        const img = new Image();

        img.onload = function() {

            const W = img.width;
            const H = img.height;

            // look at the bottom 12% of the picture
            const look = Math.max(8, Math.round(H * 0.12));
            const probe = document.createElement("canvas");

            probe.width = W;
            probe.height = look;

            const probeContext = probe.getContext("2d");
            probeContext.drawImage(img, 0, H - look, W, look, 0, 0, W, look);

            const pixels = probeContext.getImageData(0, 0, W, look).data;

            // walk upward from the bottom while the rows are dark: that is the black bar
            let top = look;

            for (let y = look - 1; y >= 0; y--) {

                let sum = 0;
                let count = 0;

                for (let x = 0; x < W; x += 4) {
                    const i = (y * W + x) * 4;
                    sum += (pixels[i] + pixels[i + 1] + pixels[i + 2]) / 3;
                    count++;
                }

                if (sum / count < 70) top = y;
                else break;
            }

            // no clear bar found: just use the bottom 5%
            const stripHeight = look - top >= 6 ? look - top : Math.max(8, Math.round(H * 0.05));

            // enlarge small photos so the letters are big enough to read
            const scale = Math.max(1, Math.min(4, Math.round(2400 / W)));
            const pad = 12;

            const out = document.createElement("canvas");

            out.width = W * scale + pad * 2;
            out.height = stripHeight * scale + pad * 2;

            const context = out.getContext("2d");

            context.fillStyle = "#000";
            context.fillRect(0, 0, out.width, out.height);
            context.drawImage(img, 0, H - stripHeight, W, stripHeight, pad, pad, W * scale, stripHeight * scale);

            // flip to black text on white (a black border becomes a white one)
            const image = context.getImageData(0, 0, out.width, out.height);
            const d = image.data;

            for (let i = 0; i < d.length; i += 4) {
                const gray = 255 - Math.round((d[i] + d[i + 1] + d[i + 2]) / 3);
                d[i] = gray;
                d[i + 1] = gray;
                d[i + 2] = gray;
                d[i + 3] = 255;
            }

            context.putImageData(image, 0, 0);

            resolve(out);
        };

        img.onerror = function() { reject(new Error("Couldn't open the photo")); };

        img.src = dataUrl;
    });
}

// Reads the black strip on a photo. Returns { name, date, time } or null if it couldn't be read.
async function readPhotoStrip(dataUrl) {

    try {
        const worker = await getTextReader();
        const canvas = await stripCanvas(dataUrl);
        const result = await worker.recognize(canvas);
        return parseStripText(result.data.text);
    } catch (error) {
        return null;
    }
}

// Loads one email and turns each photo in it into a card (before grouping).
// 'known' lists photos we have already handled. Returns { photoCount, items }.
async function gmailLoadMessage(id, cameras, known, useOcr, onStatus) {

    const message = await gmailGet("messages/" + id + "?format=full");

    function header(name) {
        const found = ((message.payload && message.payload.headers) || []).find(function(h) {
            return h.name.toLowerCase() === name.toLowerCase();
        });
        return found ? found.value : "";
    }

    // flatten the email's nested parts into a simple list
    const leaves = [];
    (function collect(part) {
        if (!part) return;
        if (part.parts && part.parts.length) part.parts.forEach(collect);
        else leaves.push(part);
    })(message.payload);

    // the readable text of the email (plain text if there is some, otherwise the HTML with tags removed)
    let bodyText = "";
    leaves.forEach(function(part) {
        if (part.mimeType === "text/plain" && part.body && part.body.data) bodyText += " " + decodeGmailText(part.body.data);
    });
    if (!bodyText.trim()) {
        leaves.forEach(function(part) {
            if (part.mimeType === "text/html" && part.body && part.body.data) bodyText += " " + stripHtml(decodeGmailText(part.body.data));
        });
    }

    // photos: skip tiny images (logos and icons); keep up to ten
    const imageParts = leaves.filter(function(part) {
        return part.mimeType && part.mimeType.indexOf("image/") === 0 &&
            part.body && (part.body.attachmentId || part.body.data) &&
            (!part.body.size || part.body.size >= 6000);
    }).slice(0, 10);

    const subject = header("Subject");
    const from = header("From");
    const received = Number(message.internalDate) || Date.now();
    const emailTime = parseEmailDateTime(subject + "\n" + bodyText, received);

    const items = [];

    for (let index = 0; index < imageParts.length; index++) {

        const part = imageParts[index];
        const photoId = id + "#" + index;

        // already added as a sighting or skipped
        if (known[photoId]) continue;

        if (onStatus) onStatus("Reading photo " + (index + 1) + " of " + imageParts.length + " in an email...");

        let data = part.body.data;

        if (!data) {
            const attachment = await gmailGet("messages/" + id + "/attachments/" + part.body.attachmentId);
            data = attachment.data;
        }

        const base64 = base64UrlToBase64(data);
        const original = "data:" + part.mimeType + ";base64," + base64;

        // 1) the exact time the camera recorded inside the photo file
        const exif = readExifDate(Uint8Array.from(atob(base64), function(c) { return c.charCodeAt(0); }));

        // 2) the camera name (and a second copy of the time) from the black bar at the bottom of the photo
        let strip = null;

        if (useOcr) {
            if (onStatus) onStatus("Reading the camera name on photo " + (index + 1) + " of " + imageParts.length + " (the first time downloads a text reader, about 10 MB)...");
            strip = await readPhotoStrip(original);
        }

        // best available time: photo data, then the strip, then the email text, then when the email arrived
        let when;
        let source;

        if (exif) { when = exif; source = "the photo's data"; }
        else if (strip && strip.date) { when = strip; source = "the photo's time stamp bar"; }
        else { when = emailTime; source = emailTime.source; }

        const stripName = strip && strip.name ? strip.name : "";

        // camera: the name on the photo first, then the name or match text anywhere in the email
        const camera =
            (stripName ? matchCameraByName(cameras, stripName) : null) ||
            matchCamera(cameras, subject + "\n" + from + "\n" + (part.filename || "") + "\n" + bodyText);

        items.push({
            key: photoId,
            photoIds: [photoId],
            msgIds: [id],
            subject: subject,
            from: from,
            filename: part.filename || "",
            images: [await shrinkImage(original, 1000)],
            ts: new Date(when.date + "T" + when.time).getTime(),
            cameraId: camera ? String(camera.id) : "",
            stripName: stripName,
            date: when.date,
            time: when.time,
            timeSource: source,
            deerType: "",
            number: "1",
            antlerPoints: "",
            direction: ""
        });
    }

    return { photoCount: imageParts.length, items: items };
}

// Trail cameras send several photos for one deer. Photos from the same camera within
// 10 minutes of each other are combined into one card. Newest first.
function groupEmails(items) {

    const sorted = items.slice().sort(function(a, b) { return a.ts - b.ts; });
    const groups = [];

    // photos are grouped by the camera we matched, or by the name read from the photo if no camera matched
    function groupKey(item) {
        return item.cameraId ? "c" + item.cameraId : (item.stripName ? "s" + item.stripName : "");
    }

    sorted.forEach(function(item) {

        const key = groupKey(item);

        // the most recent card for this same camera (photos from other cameras may be mixed in between)
        const last = key
            ? groups.slice().reverse().find(function(group) { return groupKey(group) === key; })
            : null;

        if (last && item.ts - last.lastTs <= 10 * 60000) {

            last.photoIds = last.photoIds.concat(item.photoIds);
            last.msgIds = last.msgIds.concat(item.msgIds.filter(function(m) { return last.msgIds.indexOf(m) === -1; }));
            last.images = last.images.concat(item.images).slice(0, 6);
            last.lastTs = item.ts;

        } else {

            groups.push(Object.assign({}, item, { lastTs: item.ts }));
        }
    });

    return groups.reverse();
}

// ---- Shooting-hours check and weekly power rankings ----

// When a sighting happened as a timestamp (noon if it has no time); null if it has no date
function sightingTime(sighting) {

    if (!sighting.date) return null;

    const t = new Date(sighting.date + "T" + (sighting.time || "12:00")).getTime();

    return Number.isFinite(t) ? t : null;
}

// A camera's score as it stood at a moment in time:
// only sightings up to that moment count, and older ones are faded by the half-life
function cameraScoreAsOf(camera, asOf) {

    return camera.sightings.reduce(function(total, sighting) {

        const t = sightingTime(sighting);

        if (t === null || t > asOf) return total;

        return total + sightingScore(sighting, camera, asOf);
    }, 0);
}

// Midnight on the Monday of the week that contains a timestamp
function weekMonday(timestamp) {

    const d = new Date(timestamp);

    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));

    return d;
}

// Every week (Monday to Sunday) from the first sighting to this week, newest last.
// Each week's 'asOf' is the end of that week (or right now for the current week).
function powerWeeks(cameras, nowMs) {

    let earliest = null;

    cameras.forEach(function(camera) {
        camera.sightings.forEach(function(sighting) {
            const t = sightingTime(sighting);
            if (t !== null && (earliest === null || t < earliest)) earliest = t;
        });
    });

    if (earliest === null) return [];

    const weeks = [];
    const last = weekMonday(nowMs).getTime();

    for (let d = weekMonday(earliest); d.getTime() <= last; d.setDate(d.getDate() + 7)) {

        const start = new Date(d.getTime());

        const nextMonday = new Date(start.getTime());
        nextMonday.setDate(nextMonday.getDate() + 7);

        const sunday = new Date(start.getTime());
        sunday.setDate(sunday.getDate() + 6);

        weeks.push({
            key: dayKey(start),
            start: start,
            asOf: Math.min(nextMonday.getTime() - 1, nowMs),
            label: (start.getMonth() + 1) + "/" + start.getDate() +
                " - " + (sunday.getMonth() + 1) + "/" + sunday.getDate()
        });
    }

    // keep the most recent 26 weeks
    return weeks.slice(-26);
}

// Stands as pretend cameras, so the weekly power rankings can rank them with the same code.
// Each stand's "sightings" are the timed sightings of its connected cameras, with the deer count scaled by how strongly
// the camera counts for the stand (distance fade x direction), so the weekly score matches the stand score.
function standPseudoCameras(stands, cameras) {

    return stands.map(function(stand) {

        const sightings = [];

        cameras.forEach(function(camera) {

            const inf = standInfluence(stand, camera);

            if (!inf) return;

            const stack = standStackMultiplier(stand, camera, cameras);

            camera.sightings.forEach(function(sighting) {

                if (hourOfSighting(sighting) === null || sightingTime(sighting) === null) return;

                const raw = Number(sighting.number || 1);

                sightings.push({
                    ...sighting,
                    number: raw * inf.influence * directionFactor(sighting, camera, stand) * stack,
                    rawNumber: raw
                });
            });
        });

        return { id: stand.id, name: stand.name, sightings: sightings };
    });
}

// Cameras ranked by their score at the end of a week (highest first)
function powerRanking(cameras, week) {

    const rows = cameras.map(function(camera) {

        return {
            camera: camera,
            score: cameraScoreAsOf(camera, week.asOf),
            // deer actually seen during that week
            deer: sumNumber(camera.sightings.filter(function(sighting) {
                const t = sightingTime(sighting);
                return t !== null && t >= week.start.getTime() && t <= week.asOf;
            }).map(function(sighting) {
                // stand rankings carry the real deer count in rawNumber
                return sighting.rawNumber !== undefined ? { ...sighting, number: sighting.rawNumber } : sighting;
            }))
        };
    });

    rows.sort(function(a, b) {
        return b.score - a.score || a.camera.name.localeCompare(b.camera.name);
    });

    rows.forEach(function(row, i) {
        row.rank = i + 1;
    });

    return rows;
}

// Lines showing how every camera's rank moved over the last 8 weeks (rank 1 at the top)
function rankTrendChart(cameras, weeks, index) {

    const shownWeeks = weeks.slice(Math.max(0, index - 7), index + 1);

    if (shownWeeks.length < 2) {
        return chartNote("Rank trends appear once there are two or more weeks of data.");
    }

    const table = shownWeeks.map(function(week) {
        const byCamera = {};
        powerRanking(cameras, week).forEach(function(row) {
            byCamera[row.camera.id] = row;
        });
        return byCamera;
    });

    const finalRows = powerRanking(cameras, shownWeeks[shownWeeks.length - 1]);

    // follow every camera (or stand) that has a score this week
    const followed = finalRows.filter(function(row) { return row.score > 0; });

    if (!followed.length) return chartNote("No scores yet.");

    const maxRank = cameras.length;
    const palette = ["#1f4d2b", "#c0392b", "#2980b9", "#f39c12", "#8e44ad", "#16a085", "#d35400", "#2c3e50", "#e84393", "#7f8c8d", "#6ab04c", "#0abde3"];

    // taller when there are many cameras so every rank line has room
    const W = chartWidth(), H = Math.max(240, 22 * maxRank + 42), L = 34, R = 14, T = 14, B = 28;
    const plotW = W - L - R;
    const plotH = H - T - B;
    const stepX = plotW / (shownWeeks.length - 1);

    function xAt(i) { return L + i * stepX; }
    function yAt(rank) { return T + (maxRank === 1 ? plotH / 2 : plotH * (Math.min(rank, maxRank) - 1) / (maxRank - 1)); }

    const kids = [];

    // a grid line and number for each rank
    for (let r = 1; r <= maxRank; r++) {
        kids.push(e("line", { key: "g" + r, x1: L, x2: W - R, y1: yAt(r), y2: yAt(r), stroke: "#e3e3e3" }));
        kids.push(e("text", { key: "t" + r, x: L - 8, y: yAt(r) + 3, textAnchor: "end", fontSize: 10, fill: "#666" }, "#" + r));
    }

    // week labels along the bottom
    shownWeeks.forEach(function(week, i) {
        kids.push(e("text", { key: "w" + i, x: xAt(i), y: H - 8, textAnchor: "middle", fontSize: 10, fill: "#666" }, week.label.split(" - ")[0]));
    });

    // one colored line per followed camera
    followed.forEach(function(row, c) {

        const color = palette[c % palette.length];

        const points = table.map(function(byCamera, i) {
            return xAt(i) + "," + yAt(byCamera[row.camera.id].rank);
        }).join(" ");

        kids.push(e("polyline", { key: "l" + c, points: points, fill: "none", stroke: color, strokeWidth: 2.5 }));

        table.forEach(function(byCamera, i) {
            kids.push(e(
                "circle",
                { key: "p" + c + "-" + i, cx: xAt(i), cy: yAt(byCamera[row.camera.id].rank), r: 4, fill: color },
                e("title", null, row.camera.name + " - week of " + shownWeeks[i].label.split(" - ")[0] + ": #" + byCamera[row.camera.id].rank)
            ));
        });
    });

    return e(
        "div",
        null,
        e("svg", { viewBox: "0 0 " + W + " " + H, className: "chart-svg" }, kids),
        legendRow(followed.map(function(row, c) {
            return { label: row.camera.name, color: palette[c % palette.length] };
        }))
    );
}

// The whole Weekly Power Rankings card: week picker, ranking table, and the rank trend chart
function powerRankingsView(cameras, weeks, weekKey, onPick, noun) {

    noun = noun || "Camera";

    if (!cameras.length) return chartNote(noun === "Camera" ? "Add cameras and sightings to see power rankings." : "Add stands on the Map tab to see stand power rankings.");
    if (!weeks.length) return chartNote(noun === "Camera" ? "No sightings with dates yet." : "No dated sightings from cameras connected to your stands yet. Connect cameras in each stand's panel.");

    // the chosen week (defaults to the latest)
    let index = weeks.findIndex(function(week) { return week.key === weekKey; });
    if (index < 0) index = weeks.length - 1;

    const week = weeks[index];
    const rows = powerRanking(cameras, week);

    // last week's ranks, to show movement
    const previous = {};
    if (index > 0) {
        powerRanking(cameras, weeks[index - 1]).forEach(function(row) {
            previous[row.camera.id] = row;
        });
    }

    const medals = ["🥇", "🥈", "🥉"];

    function moveCell(row) {

        if (index === 0) return e("td", null, "-");

        const before = previous[row.camera.id];

        if (row.score <= 0) return e("td", null, "-");

        if (!before || before.score <= 0) return e("td", { className: "move-up" }, "NEW");

        const change = before.rank - row.rank;

        if (change > 0) return e("td", { className: "move-up" }, "▲ " + change);
        if (change < 0) return e("td", { className: "move-down" }, "▼ " + Math.abs(change));

        return e("td", null, "-");
    }

    return e(
        "div",
        null,

        e(
            "div",
            { className: "chart-filter" },
            e(
                "select",
                {
                    value: week.key,
                    onChange: function(event) { onPick(event.target.value); }
                },
                weeks.slice().reverse().map(function(w) {
                    return e(
                        "option",
                        { key: w.key, value: w.key },
                        "Week of " + w.label + (w.key === weeks[weeks.length - 1].key ? " (this week)" : "")
                    );
                })
            )
        ),

        e(

// True for both 'Buck' and 'Big Buck' (used wherever 'any buck' is meant)
function isBuckType(type) {
    return type === "Buck" || type === "Big Buck";
}

// Does a deer type pass the heat map's filter? ('Buck' also includes big bucks)
function matchesHeatFilter(type, filter) {
    if (filter === "All") return true;
    if (filter === "Buck") return isBuckType(type);
    return type === filter;

// The walk-in route: a list of [lat, lng] points from where you start to the stand (the stand itself is the last stop).
// Older saves only had a single start point (entryLat / entryLng); that becomes a one-point route.
function cleanEntryPath(stand) {

    let list = [];

    if (Array.isArray(stand.entryPath)) {
        list = stand.entryPath;
    } else if (stand.entryLat !== undefined && stand.entryLat !== null && stand.entryLng !== undefined && stand.entryLng !== null) {
        list = [[stand.entryLat, stand.entryLng]];
    }

    return list.filter(function(p) {
        return Array.isArray(p) && Number.isFinite(Number(p[0])) && Number.isFinite(Number(p[1]));
    }).map(function(p) { return [Number(p[0]), wrapLng(p[1])]; });
}

// Cleans a list of stands (from storage, Drive or a backup): fills in missing values and drops broken ones
function sanitizeStands(list) {

    // Not a list at all
    if (!Array.isArray(list)) return null;

    return list.map(function(stand) {
        return {
            // Give a stand an id if it lost it
            id: stand.id || Date.now() + Math.random(),
            name: stand.name || "Stand",
            type: stand.type || "Other",
            lat: Number(stand.lat),
            lng: wrapLng(stand.lng),
            // cameras you connected to this stand by hand (list of camera ids)
            cameraIds: Array.isArray(stand.cameraIds) ? stand.cameraIds : [],
            // wind directions (the way the wind is blowing FROM) this stand is good in; empty = any wind
            safeWinds: Array.isArray(stand.safeWinds) ? stand.safeWinds : [],
            // where you start your walk in (a straight line from here to the stand); null = not set
            entryPath: cleanEntryPath(stand)
        };
    }).filter(function(stand) {
        return Number.isFinite(stand.lat) &&
               Number.isFinite(stand.lng);
    });
}

// Each stand gets a score for every hour of the day, built from the cameras around it.
// A camera counts toward a stand when it is NEAR the stand, or when it sits on the SAME DEER TRAIL as the stand
// (the trail passes close to both). Hot cameras (lots of recent, big, well-timed deer) make a stand score higher.
const STAND_SCORE_CONFIG = {
    nearRadius: 100,         // (no longer used) meters: a camera this close to a stand counts, fading out to nothing at this distance
    trailSnap: 30,           // (no longer used) meters: a stand/camera within this distance of a trail line is "on" that trail
    linkedMaxDist: 200,     // meters: a connected camera fades from full strength at the stand to the minimum at this distance
    linkedMinInfluence: 0.25, // a trail-linked camera at the far end still counts at least this fraction
    linkedBonus: 1.25,       // (no longer used) trail-linked cameras get this extra multiplier (deer actually walk past both)
    stackEnabled: 1,         // 1 = extra cameras around a stand count less (camera stacking), 0 = plain sum
    stackFactor: 0.7,        // each next-best connected camera counts this fraction of the one before it
    directionEffect: 0.5     // 0 = ignore direction. 0.5 = a deer walking straight toward the stand counts 1.5x, straight away 0.5x
};

// How strongly one camera counts toward one stand (0 = not at all). Returns null if it isn't connected.
// ONLY cameras you connected by hand (stand panel > Connected cameras) count.
// Their influence fades with distance: 1 right at the stand, down to the minimum influence at the fade distance,
// and it stays at the minimum beyond that.
function standInfluence(stand, camera) {

    const cfg = STAND_SCORE_CONFIG;

    if (!Number.isFinite(camera.lat) || !Number.isFinite(camera.lng)) return null;

    const connected = (stand.cameraIds || []).some(function(id) { return String(id) === String(camera.id); });

    if (!connected) return null;

    const dist = metersBetween(stand.lat, stand.lng, camera.lat, camera.lng);
    const fade = Math.max(1, cfg.linkedMaxDist);
    const influence = Math.max(cfg.linkedMinInfluence, 1 - (1 - cfg.linkedMinInfluence) * Math.min(1, dist / fade));

    return { influence: influence, linked: false, manual: true, dist: dist };
}

// What ONE sighting is worth to its camera and to each stand that counts that camera
// (uses the same time-of-day, deer-type, age and direction rules as the real scores).
function standStackMultiplier(stand, camera, cameras) {

    if (!STAND_SCORE_CONFIG.stackEnabled) return 1;

    const cams = standScore(stand, cameras, [], Date.now()).cams;

    let index = cams.findIndex(function(c) { return String(c.camera.id) === String(camera.id); });

    // a camera with no scored sightings yet would rank last
    if (index < 0) index = cams.length;

    return Math.pow(STAND_SCORE_CONFIG.stackFactor, index);
}

function sightingPointsPreview(sighting, camera, stands, trails, cameras) {

    const base = sightingScore(sighting, camera, Date.now());
    const forStands = [];

    stands.forEach(function(stand) {

        const inf = standInfluence(stand, camera);

        if (!inf) return;

        forStands.push({
            stand: stand,
            points: base * inf.influence * directionFactor(sighting, camera, stand) * standStackMultiplier(stand, camera, cameras || [camera]),
            manual: inf.manual
        });
    });

    return { camera: base, stands: forStands };
}

// Straight-line distance in meters between two lat/lng points (haversine formula)
function metersBetween(lat1, lng1, lat2, lng2) {

    const rad = Math.PI / 180;
    const dLat = (lat2 - lat1) * rad;
    const dLng = (lng2 - lng1) * rad;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);

    return 6371000 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// Shortest distance in meters from a point to a trail line (a list of [lat, lng] points)
function metersToTrail(lat, lng, points) {

    if (!points || !points.length) return Infinity;

    // Flatten to meters around the point (good enough for short distances)
    const mPerDegLat = 111320;
    const mPerDegLng = 111320 * Math.cos(lat * Math.PI / 180);

    function toXY(p) {
        return [(p[1] - lng) * mPerDegLng, (p[0] - lat) * mPerDegLat];
    }

    let best = Infinity;

    for (let i = 0; i < points.length; i++) {

        const a = toXY(points[i]);
        const b = i + 1 < points.length ? toXY(points[i + 1]) : a;

        // Closest spot on segment a-b to the origin (0,0), which is our point
        const dx = b[0] - a[0];
        const dy = b[1] - a[1];
        const len2 = dx * dx + dy * dy;
        let t = len2 ? -(a[0] * dx + a[1] * dy) / len2 : 0;
        t = Math.max(0, Math.min(1, t));

        const d = Math.hypot(a[0] + t * dx, a[1] + t * dy);

        if (d < best) best = d;
    }

    return best;
}

// Which trails (by position in the list) a spot is on
function trailsAt(lat, lng, trails) {

    const found = [];

    (trails || []).forEach(function(trail, i) {
        if (metersToTrail(lat, lng, trail.points) <= STAND_SCORE_CONFIG.trailSnap) found.push(i);
    });

    return found;
}

// Hour-by-hour points a camera has earned (already includes the time-of-day weighting and age decay).
// Sightings with no time can't be placed in an hour, so they are left out.
// How much a sighting counts toward a stand, based on the way the deer was walking.
// Heading toward the stand = 1 + directionEffect, heading away = 1 - directionEffect, sideways = 1.
function directionFactor(sighting, camera, stand) {

    const effect = STAND_SCORE_CONFIG.directionEffect;
    const heading = DIRECTION_BEARINGS[sighting.direction];

    if (!effect || heading === undefined || !stand) return 1;

    // Right on top of the stand: no meaningful "toward"
    if (metersBetween(camera.lat, camera.lng, stand.lat, stand.lng) < 10) return 1;

    // Compass bearing from the camera to the stand
    const rad = Math.PI / 180;
    const dLng = (stand.lng - camera.lng) * rad;
    const y = Math.sin(dLng) * Math.cos(stand.lat * rad);
    const x = Math.cos(camera.lat * rad) * Math.sin(stand.lat * rad) -
        Math.sin(camera.lat * rad) * Math.cos(stand.lat * rad) * Math.cos(dLng);
    const toStand = (Math.atan2(y, x) / rad + 360) % 360;

    // cos(angle between the deer's heading and the direction to the stand): 1 = straight toward, -1 = straight away
    return Math.max(0, 1 + effect * Math.cos((heading - toStand) * rad));
}

function cameraHourPoints(camera, now, stand) {

    const hours = [];
    for (let h = 0; h < 24; h++) hours.push(0);

    (camera.sightings || []).forEach(function(sighting) {

        const h = hourOfSighting(sighting);

        if (h !== null) hours[h] += sightingScore(sighting, camera, now) * directionFactor(sighting, camera, stand);
    });

    return hours;
}

// The full score for one stand:
// { hours: [24 numbers], total, best: [top 3 hours], cams: [{ camera, hours, total, influence, linked, dist }] }
function standScore(stand, cameras, trails, now) {

    const cfg = STAND_SCORE_CONFIG;
    const hours = [];
    for (let h = 0; h < 24; h++) hours.push(0);

    const cams = [];

    cameras.forEach(function(camera) {

        const inf = standInfluence(stand, camera);

        if (!inf) return;

        const influence = inf.influence;
        const linked = inf.linked;
        const dist = inf.dist;

        const camHours = cameraHourPoints(camera, now, stand);
        const contribution = camHours.map(function(v) { return v * influence; });
        const total = contribution.reduce(function(a, b) { return a + b; }, 0);

        cams.push({ camera: camera, hours: contribution, total: total, influence: influence, linked: linked, manual: inf.manual, dist: dist });
    });

    cams.sort(function(a, b) { return b.total - a.total; });

    // CAMERA STACKING: the best camera counts fully, the next stackFactor x as much, then stackFactor^2, and so on,
    // so adding more cameras around a stand helps but can't swamp the score.
    cams.forEach(function(c, i) {

        c.stack = STAND_SCORE_CONFIG.stackEnabled ? Math.pow(STAND_SCORE_CONFIG.stackFactor, i) : 1;

        c.hours = c.hours.map(function(v) { return v * c.stack; });
        c.total *= c.stack;
        c.hours.forEach(function(v, h) { hours[h] += v; });
    });

    const order = hours.map(function(v, h) { return h; }).sort(function(a, b) { return hours[b] - hours[a]; });
    const grand = hours.reduce(function(a, b) { return a + b; }, 0);

    return {
        hours: hours,
        total: grand,
        best: grand > 0 ? order.slice(0, 3).filter(function(h) { return hours[h] > 0; }) : [],
        cams: cams
    };
}

// Scores for every stand, best first
function allStandScores(stands, cameras, trails) {

    const now = Date.now();

    return stands.map(function(stand) {
        return { stand: stand, score: standScore(stand, cameras, trails, now) };
    });
}

    return e(
        "div",
        { className: "card" },
        e("h3", null, "Stand score: " + fmtScore(score.total)),
        score.best.length
            ? e("p", null, "Best hours: " + score.best.map(hourLabel).join(", "))
            : e("p", { className: "empty" }, "No connected cameras with timed sightings yet. Connect cameras below."),
        columnChart(items, "#b26a00", 3),
        score.cams.length
            ? e(
                "div",
                { style: { marginTop: "8px" } },
                e("div", { style: { fontWeight: 600, marginBottom: "4px" } }, "Hottest cameras for this stand"),
                score.cams.slice(0, 5).map(function(c) {
                    return e(
                        "div",
                        { key: c.camera.id, style: { fontSize: "13px", display: "flex", justifyContent: "space-between" } },
                        e("span", null, c.camera.name + " · " + Math.round(c.dist) + " m" + " · " + Math.round(c.influence * 100) + "% strength" + (c.stack < 1 ? " · stacking x" + c.stack.toFixed(2) : "")),
                        e("strong", null, fmtScore(c.total))
                    );
                })
            )
            : null
    );
}

// Compass bearing in degrees for each direction (0 = north, 90 = east...)
const DIRECTION_BEARINGS = {
    N: 0, NE: 45, E: 90, SE: 135,
    S: 180, SW: 225, W: 270, NW: 315
};

// Average travel direction (degrees, 0 = north) weighted by number of deer.
// Returns null if there are no directions, or they cancel each other out.
// Average direction the deer travel past a camera, weighted by number of deer.
// Uses vector math so that, for example, NW and NE average out to N.
// Returns degrees (0 = north) or null when there is no data or the directions cancel out.
function averageBearing(camera) {

    // Running east-west total
    let x = 0;
    // Running north-south total
    let y = 0;
    // Total deer that had a direction
    let total = 0;

    camera.sightings.forEach(function(sighting) {

        // Degrees for this sighting's direction
        const bearing = DIRECTION_BEARINGS[sighting.direction];

        // Skip sightings with no direction
        if (bearing === undefined) return;

        // More deer = more influence on the average
        const weight = Number(sighting.number || 1);

        // Add this sighting's east-west part
        x += weight * Math.sin(bearing * Math.PI / 180);
        // Add this sighting's north-south part
        y += weight * Math.cos(bearing * Math.PI / 180);
        total += weight;
    });

    // No directions recorded
    if (!total) return null;

    // Directions mostly cancel each other, so there is no real 'average' to show
    if (Math.hypot(x, y) / total < 0.15) return null;

    // Convert the combined vector back into a compass bearing between 0 and 360
    return (Math.atan2(x, y) * 180 / Math.PI + 360) % 360;
}

// Nearest of the 8 compass directions for a bearing in degrees
function bearingDirection(bearing) {
    return DIRECTIONS[Math.round(bearing / 45) % 8];
}

// The arrow drawn beside a camera, rotated to point the way the deer travel
function arrowIcon(bearing, colors) {

    // SVG picture of the arrow, rotated by the bearing
    const html =
        '<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">' +
        '<g transform="rotate(' + bearing + ' 30 30)">' +
        '<path d="M30 3 L38 15 L33 15 L33 21 L27 21 L27 15 L22 15 Z" ' +
        'fill="' + colors.camera + '" stroke="' + colors.cameraOutline + '" ' +
        'stroke-width="1.5" stroke-linejoin="round"/>' +
        '</g></svg>';

    return L.divIcon({
        html: html,
        className: "",
        iconSize: [60, 60],
        iconAnchor: [30, 30]
    });
}

// Loads the saved cameras from this device, cleaning up each one; returns [] if nothing valid is saved

// Sunrise or sunset as a UTC timestamp (ms) for a calendar date and location.
// Works out sunrise or sunset for a date and location using the standard 'Almanac for Computers' method.
// Returns the moment as a UTC timestamp (milliseconds), or null if the sun never rises/sets that day.
function sunEvent(year, month0, day, lat, lng, isRise) {

    // Multiply degrees by this to get radians
    const rad = Math.PI / 180;

    // Day number of the year (Jan 1 = 1)
    const dayOfYear = Math.floor(
        (Date.UTC(year, month0, day) - Date.UTC(year, 0, 0)) / 86400000
    );

    // Longitude expressed in hours (the Earth turns 15 degrees per hour)
    const lngHour = lng / 15;
    // Approximate time of the event in days
    const t = dayOfYear + ((isRise ? 6 : 18) - lngHour) / 24;
    // The sun's mean anomaly (where it is in its orbit)
    const M = 0.9856 * t - 3.289;

    // The sun's true longitude in the sky
    let L = M +
        1.916 * Math.sin(M * rad) +
        0.020 * Math.sin(2 * M * rad) +
        282.634;

    L = ((L % 360) + 360) % 360;

    // Right ascension, then fixed to be in the same quadrant as L and converted to hours
    let RA = Math.atan(0.91764 * Math.tan(L * rad)) / rad;
    RA = ((RA % 360) + 360) % 360;
    RA += Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90;
    RA = RA / 15;

    // The sun's declination (how far north/south of the equator it is)
    const sinDec = 0.39782 * Math.sin(L * rad);
    const cosDec = Math.cos(Math.asin(sinDec));

    // Cosine of the sun's hour angle for sunrise/sunset (90.833 degrees accounts for atmosphere)
    const cosH =
        (Math.cos(90.833 * rad) - sinDec * Math.sin(lat * rad)) /
        (cosDec * Math.cos(lat * rad));

    // Sun never rises or never sets on this day at this latitude
    if (cosH > 1 || cosH < -1) return null;

    // Hour angle: use the morning side for sunrise, the evening side for sunset, then convert to hours
    let H = isRise
        ? 360 - Math.acos(cosH) / rad
        : Math.acos(cosH) / rad;

    H = H / 15;

    // Local mean time of the event, kept between 0 and 24 hours
    let T = H + RA - 0.06571 * t - 6.622;
    T = ((T % 24) + 24) % 24;

    // Convert local mean time to UTC and return it as a timestamp
    return Date.UTC(year, month0, day) + (T - lngHour) * 3600000;
}


// Sunrise, sunset and legal shooting light for a date (YYYY-MM-DD) at a spot; null if the sun doesn't rise/set
function sunTimes(lat, lng, dateString) {

    const p = dateString.split("-").map(Number);
    const rise = sunEvent(p[0], p[1] - 1, p[2], lat, lng, true);
    const set = sunEvent(p[0], p[1] - 1, p[2], lat, lng, false);

    if (rise === null || set === null) return null;

    const buffer = SCORE_CONFIG.legalBufferMinutes * 60000;

    return { rise: rise, set: set, legalStart: rise - buffer, legalEnd: set + buffer };
}

// '6:41 AM' style clock text for a timestamp (in this device's time zone)
function clockText(timestamp) {
    return new Date(timestamp).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

// ---- Seasons: a hunting season runs 1 Aug to 31 Jul, named by the year it starts ----
function seasonOf(dateString) {
    if (!dateString) return null;
    const p = dateString.split("-").map(Number);
    if (!Number.isFinite(p[0]) || !Number.isFinite(p[1])) return null;
    return p[1] >= 8 ? p[0] : p[0] - 1;
}

function seasonLabel(year) {
    return year + "-" + String((year + 1) % 100).padStart(2, "0");
}

// ---- Map features: food, water, bedding, scrapes, rubs ----
const FEATURE_TYPES = [
    { value: "Food plot", emoji: "🌾", color: "#3f9a5b" },
    { value: "Water", emoji: "💧", color: "#2980b9" },
    { value: "Bedding", emoji: "🛏", color: "#8e6b3d" },
    { value: "Scrape", emoji: "⛏", color: "#c0392b" },
    { value: "Rub", emoji: "🌲", color: "#7b5e2b" },
    { value: "Other", emoji: "📍", color: "#666666" }
];

function featureType(name) {
    return FEATURE_TYPES.find(function(t) { return t.value === name; }) || FEATURE_TYPES[FEATURE_TYPES.length - 1];
}

// The round emoji badge used for a feature on the map
function featureIcon(type) {

    const t = featureType(type);

    return L.divIcon({
        html: '<div style="width:28px;height:28px;border-radius:50%;background:' + t.color + ';border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 1px 4px rgba(0,0,0,.5)">' + t.emoji + '</div>',
        className: "",
        iconSize: [28, 28],
        iconAnchor: [14, 14]
    });

function sanitizeFeatures(list) {
    if (!Array.isArray(list)) return [];
    return list.filter(function(f) { return f && f.id && Number.isFinite(Number(f.lat)) && Number.isFinite(Number(f.lng)); }).map(function(f) {
        return { id: f.id, type: f.type || "Other", name: f.name || f.type || "Feature", notes: f.notes || "", lat: Number(f.lat), lng: wrapLng(f.lng) };
    });
}

// Compass bearing (0 = north) from one point to another
function bearingBetween(lat1, lng1, lat2, lng2) {
    const rad = Math.PI / 180;
    const dLng = (lng2 - lng1) * rad;
    const y = Math.sin(dLng) * Math.cos(lat2 * rad);
    const x = Math.cos(lat1 * rad) * Math.sin(lat2 * rad) - Math.sin(lat1 * rad) * Math.cos(lat2 * rad) * Math.cos(dLng);
    return (Math.atan2(y, x) / rad + 360) % 360;
}

// A spot 'meters' away from a point in the direction of a bearing
function pointAt(lat, lng, bearing, meters) {
    const rad = Math.PI / 180;
    return [
        lat + meters * Math.cos(bearing * rad) / 111320,
        lng + meters * Math.sin(bearing * rad) / (111320 * Math.cos(lat * rad))
    ];
}

// Average wind (direction it blows FROM, and speed) from the forecast between two hours of a day; null if no data
function forecastWindFrom(forecast, dateString, h0, h1) {

    if (!forecast) return null;

    const rows = forecast.hours.filter(function(r) {
        const h = Number(r.time.slice(11, 13));
        return r.time.slice(0, 10) === dateString && h >= h0 && h < h1 && r.dir !== null;
    });

    if (!rows.length) return null;

    const x = rows.reduce(function(a, r) { return a + Math.sin(r.dir * Math.PI / 180); }, 0);
    const y = rows.reduce(function(a, r) { return a + Math.cos(r.dir * Math.PI / 180); }, 0);

    return {
        dir: (Math.atan2(x, y) * 180 / Math.PI + 360) % 360,
        speed: rows.reduce(function(a, r) { return a + (r.speed || 0); }, 0) / rows.length
    };
}

// The scent cone: from the stand, spreading downwind (the opposite way to where the wind comes from)
const SCENT_HALF_ANGLE = 25;  // degrees either side of straight downwind

function scentConePolygon(stand, windFrom, range) {

    const center = (windFrom + 180) % 360;
    const points = [[stand.lat, stand.lng]];

    for (let a = -SCENT_HALF_ANGLE; a <= SCENT_HALF_ANGLE; a += 5) {
        points.push(pointAt(stand.lat, stand.lng, center + a, range));
    }

    return points;
}

// Is a spot inside the scent cone?
function inScentCone(stand, lat, lng, windFrom, range) {

    const dist = metersBetween(stand.lat, stand.lng, lat, lng);

    if (dist > range) return false;

    const center = (windFrom + 180) % 360;
    const diff = Math.abs(((bearingBetween(stand.lat, stand.lng, lat, lng) - center + 540) % 360) - 180);

    return diff <= SCENT_HALF_ANGLE;
}

// ---- Scent check: walk-in route + sitting scent against what's marked on the map ----
// Points along the walk from the entry point to the stand (every ~30 m). Empty if no entry point is set.
function routePoints(stand) {

    const path = stand.entryPath || [];

    if (!path.length) return [];

    return path.map(function(p) { return { lat: p[0], lng: p[1] }; }).concat([{ lat: stand.lat, lng: stand.lng }]);
}

function routeLength(stand) {

    const pts = routePoints(stand);
    let total = 0;

    for (let i = 1; i < pts.length; i++) total += metersBetween(pts[i - 1].lat, pts[i - 1].lng, pts[i].lat, pts[i].lng);

    return total;
}

// Points along the whole walk (every ~30 m, following the route's bends). Empty if no route is set.
function walkSamples(stand) {

    const route = routePoints(stand);
    const pts = [];

    for (let i = 1; i < route.length; i++) {

        const a = route[i - 1], b = route[i];
        const n = Math.max(1, Math.ceil(metersBetween(a.lat, a.lng, b.lat, b.lng) / 30));

        for (let k = 0; k < n; k++) {
            const f = k / n;
            pts.push({ lat: a.lat + (b.lat - a.lat) * f, lng: a.lng + (b.lng - a.lng) * f });
        }
    }

    return pts;
}

// If a tapped spot is within 'maxMeters' of one of your drawn trails, returns the nearest point ON the trail; else null
function snapToTrails(lat, lng, trails, maxMeters) {

    const k = Math.cos(lat * Math.PI / 180);
    let best = null, bestD = maxMeters;

    (trails || []).forEach(function(trail) {

        const pts = trail.points || [];

        for (let i = 1; i < pts.length; i++) {

            // work in meters around the tapped spot
            const ax = (pts[i - 1][1] - lng) * 111320 * k, ay = (pts[i - 1][0] - lat) * 111320;
            const bx = (pts[i][1] - lng) * 111320 * k, by = (pts[i][0] - lat) * 111320;
            const dx = bx - ax, dy = by - ay;
            const len2 = dx * dx + dy * dy;
            let t = len2 ? -(ax * dx + ay * dy) / len2 : 0;

            t = Math.max(0, Math.min(1, t));

            const d = Math.hypot(ax + dx * t, ay + dy * t);

            if (d < bestD) {
                bestD = d;
                best = [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t];
            }
        }
    });

    return best;
}

// What your scent would reach with this wind (degrees it blows FROM).
// Checks food plots, water, bedding, scrapes, rubs, and cameras with deer in the last 14 days.
// Returns [{ label, emoji, high, sit, walk, near, dist }] with the worst first.
function scentRisks(stand, cameras, features, windFrom, range) {

    if (windFrom === null || windFrom === undefined) return [];

    const samples = walkSamples(stand);
    const targets = [];

    features.forEach(function(f) {
        const t = featureType(f.type);
        targets.push({ key: "f" + f.id, label: f.name, emoji: t.emoji, lat: f.lat, lng: f.lng, high: f.type === "Bedding" || f.type === "Food plot" });
    });

    cameras.forEach(function(c) {
        const recent = c.sightings.some(function(sg) {
            const age = daysSince(sg.date);
            return age !== null && age <= 14;
        });
        if (recent) targets.push({ key: "c" + c.id, label: c.name, emoji: "📷", lat: c.lat, lng: c.lng, high: false });
    });

    const out = [];

    targets.forEach(function(tg) {

        const dist = metersBetween(stand.lat, stand.lng, tg.lat, tg.lng);
        const sit = inScentCone(stand, tg.lat, tg.lng, windFrom, range);
        const walk = samples.some(function(p) { return inScentCone(p, tg.lat, tg.lng, windFrom, range * 0.6); });
        const near = samples.some(function(p) { return metersBetween(p.lat, p.lng, tg.lat, tg.lng) <= 40; });

        if (sit || walk || near) out.push({ label: tg.label, emoji: tg.emoji, high: tg.high, sit: sit, walk: walk, near: near, dist: dist });
    });

    out.sort(function(a, b) { return (b.high ? 1 : 0) - (a.high ? 1 : 0) || a.dist - b.dist; });

    return out;
}

function scentRiskText(r) {
    const parts = [];
    if (r.near) parts.push("your walk passes within 40 m");
    if (r.walk) parts.push("walk-in scent blows over it");
    if (r.sit) parts.push("sitting scent blows over it");
    return r.emoji + " " + r.label + " (" + parts.join(", ") + ")";
}

// ---- Buck alerts ----
// Named bucks with at least 3 sightings who haven't been seen for 'days' days
function missingBucks(bucks, cameras, days) {

    const out = [];

    bucks.forEach(function(b) {
        const st = buckStats(b, cameras);
        if (st.rows.length < 3) return;
        const age = daysSince(st.last);
        if (age !== null && age >= days) out.push({ buck: b, age: age, last: st.last });
    });

    return out;
}

const NOTIFY_STATE_KEY = "deerNotifyState";

function getNotifyPrefs() {

function pushNotice(title, body, tag) {

    try {
        if (typeof navigator !== "undefined" && navigator.serviceWorker && navigator.serviceWorker.ready) {
            navigator.serviceWorker.ready.then(function(reg) {
                return reg.showNotification(title, { body: body, tag: tag, icon: "icon-192.png", badge: "icon-192.png" });
            }).catch(function() {
                try { new Notification(title, { body: body, tag: tag }); } catch (error) {}
            });
