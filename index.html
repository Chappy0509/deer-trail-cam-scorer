    // ---- OFFLINE MAP ----
    // The area to download: around every camera and stand (about 450 m extra), or the part of the map on screen
    function tileBounds() {

        if (tileArea === "view" && mapRef.current) {
            try {
                const b = mapRef.current.getBounds();
                return { south: b.getSouth(), west: b.getWest(), north: b.getNorth(), east: b.getEast() };
            } catch (error) {}
        }

        const spots = cameras.concat(stands).filter(function(p) { return Number.isFinite(p.lat) && Number.isFinite(p.lng); });

        if (!spots.length) return null;

        const pad = 0.004;

        return {
            south: Math.min.apply(null, spots.map(function(p) { return p.lat; })) - pad,
            north: Math.max.apply(null, spots.map(function(p) { return p.lat; })) + pad,
            west: Math.min.apply(null, spots.map(function(p) { return p.lng; })) - pad,
            east: Math.max.apply(null, spots.map(function(p) { return p.lng; })) + pad
        };
    }

    // How many tiles are saved right now
    async function refreshTileStored() {
        try {
            if (!window.caches) { setTileStored(null); return; }
            const cache = await caches.open(TILE_CACHE);
            setTileStored((await cache.keys()).length);
        } catch (error) {
            setTileStored(null);
        }
    }

    // Download every tile for the chosen area and save it on this device
    async function downloadOfflineMap() {

        const b = tileBounds();

        if (!b) { setTileJob({ message: "Add a camera or stand first." }); return; }
        if (!window.caches) { setTileJob({ message: "This browser can't save map tiles for offline use." }); return; }

        const total = tileCountFor(b, 12, tileMaxZoom);

        if (total > 6000) {
            setTileJob({ message: total + " tiles is too many. Pick a lower detail level or a smaller area." });
            return;
        }

        if (!confirm("Download about " + total + " map tiles (roughly " + Math.round(total * 25 / 1024) + " MB) for offline use? Best on Wi-Fi.")) return;

        tileCancelRef.current = false;

        // ask the browser not to throw the tiles away when it needs space (not every browser allows this)
        try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (error) {}

        const list = tileListFor(b, 12, tileMaxZoom);
        const cache = await caches.open(TILE_CACHE);

        let next = 0, done = 0, failed = 0, abortReason = "";

        setTileJob({ running: true, total: list.length, done: 0, failed: 0, message: "Downloading…" });

        async function worker() {

            while (next < list.length && !tileCancelRef.current) {

                const url = tileUrlFor(list[next++]);

                try {
                    if (!(await cache.match(url))) {
                        const response = await fetch(url, { mode: "cors" });
                        if (!response.ok) throw new Error("status " + response.status);
                        await cache.put(url, response);
                    }
                } catch (error) {

                    failed++;

                    if (error && error.name === "QuotaExceededError") {
                        abortReason = "This device is out of storage space.";
                        tileCancelRef.current = true;
                    } else if (done === 0 && failed >= 8) {
                        abortReason = "The map server didn't allow the download (" + (error && error.message ? error.message : "blocked") + "). Check your connection.";
                        tileCancelRef.current = true;
                    }
                }

                done++;

                if (done % 8 === 0 || done === list.length) {
                    setTileJob({ running: true, total: list.length, done: done, failed: failed, message: "Downloading…" });
                }
            }
        }

        await Promise.all([worker(), worker(), worker(), worker(), worker(), worker()]);

        setTileJob({
            running: false,
            total: list.length,
            done: done,
            failed: failed,
            message: abortReason ||
                (tileCancelRef.current ? "Stopped. Tiles downloaded so far are kept."
                    : "Done. " + (list.length - failed) + " tiles saved" + (failed ? ", " + failed + " failed" : "") + ".")
        });

        refreshTileStored();
    }

        if (!confirm("Delete the offline map from this device?")) return;

        try { await caches.delete(TILE_CACHE); } catch (error) {}

        setTileJob(null);

    }

                    e("h3", null, "Camera status" + (flagged ? " ⚠" : "")),
                    e("p", { style: { margin: "0 0 4px" } }, "Last sighting: " + (last ? last + " (" + silent + " day" + (silent === 1 ? "" : "s") + " ago)" : "none yet")),
                    e("p", { style: { margin: "0 0 8px" } }, "Last checked: " + (selectedCamera.lastChecked ? selectedCamera.lastChecked + " (" + checked + " day" + (checked === 1 ? "" : "s") + " ago)" : "not recorded")),
                    e("button", {
                        className: "secondary",
                        onClick: function() {
                            const today = todayString();
                            setCameras(function(previous) { return previous.map(function(c) { return c.id === selectedCamera.id ? { ...c, lastChecked: today } : c; }); });
                        }
                    }, "Mark checked today")
                );
            })(),

            // What the last saved sighting was worth
            pointsNotice && !showSightingForm
                ? e(
                    "div",
                    { className: "drawing", style: { marginBottom: "12px" } },
                    e("strong", null, pointsNotice.title),
                    pointsNotice.lines.map(function(line, i) {
                        return e("div", { key: i, style: { fontSize: "13px" } }, line);
                    }),
                    e("button", { className: "secondary", style: { marginTop: "8px", padding: "6px 10px" }, onClick: function() { setPointsNotice(null); } }, "Dismiss")
                )
                : null,

            // Collapsible sidebar section (side-sightings)
            e(
                Collapsible,
                {
                    id: "side-sightings",
                    title: "Sightings",
                    className: "card"
                },

                selectedCamera.sightings.length
                    ? selectedCamera.sightings
                        .slice()
                        .reverse()
                        .map(
                            function(sighting) {

                                return e(
                                    "div",
                                    {
                                        className:
                                            "sighting",
                                        key:
                                            sighting.id
                                    },

                                    e(
                                        "strong",
                                        null,

                                        sighting.number +
                                        " " +
                                        sighting.deerType
                                    ),

                                    e(
                                        "small",
                                        null,

                                        sighting.date +
                                        " at " +
                                        sighting.time
                                    ),

                                    sighting.antlerPoints
                                        ? e(
                                            "p",
                                            null,
                                            sighting.antlerPoints +
                                            " antler points"
                                        )
                                        : null,

                                    sighting.direction
                                        ? e(
                                            "p",
                                            null,
                                            "Heading: " +
                                            directionText(
                                                sighting.direction
                                            )
                                        )
                                        : null,

                                    // Was this sighting inside shooting hours?
                                    e(
                                        "p",
                                        null,
                                        "Prime hours: " +
                                        (isShootingTime(sighting)
                                            ? "Yes"
                                            : "No")
                                    ),

                                    // Moon phase and weather when it happened
                                    conditionsText(sighting)
                                        ? e("p", { style: { fontSize: "13px" } }, conditionsText(sighting))
                                        : null,

                                    // Link back to the original email (for sightings imported from email)
                                    sighting.emailIds && sighting.emailIds.length
                                        ? e(
                                            "p",
                                            null,
                                            e(
                                                "a",
                                                {
                                                    href: "https://mail.google.com/mail/u/0/#all/" + sighting.emailIds[0],
                                                    target: "_blank",
                                                    rel: "noopener"
                                                },
                                                "Open the email"
                                            )
                                        )
                                        : null,

                                    sighting.notes
                                        ? e(
                                            "p",
                                            null,
                                            sighting.notes
                                        )
                                        : null,

                                    // Named buck
                                    sighting.buckId !== undefined && bucks.find(function(b) { return String(b.id) === String(sighting.buckId); })
                                        ? e("p", null, "Buck: " + bucks.find(function(b) { return String(b.id) === String(sighting.buckId); }).name)
                                        : null,

                                    // Photo thumbnail (tap to enlarge)
                                    sighting.thumb
                                        ? e("img", {
                                            src: sighting.thumb,
                                            alt: "Sighting photo",
                                            style: { display: "block", maxWidth: "140px", borderRadius: "6px", margin: "6px 0", cursor: "pointer" },
                                            onClick: function() { setPhotoView(sighting.thumb); }
                                        })
                                        : null,

                                    // Quick fix-ups: change the deer type, or name the buck
                                    e(
                                        "div",
                                        { style: { display: "flex", gap: "6px", flexWrap: "wrap", margin: "6px 0" } },
                                        e(
                                            "select",
                                            {
                                                value: sighting.deerType,
                                                title: "Deer type",
                                                onChange: function(ev) { updateSighting(sighting.id, { deerType: ev.target.value }); }
                                            },
                                            ["Big Buck", "Buck", "Doe", "Fawn", "Unknown"].map(function(t) { return e("option", { key: t, value: t }, t); })
                                        ),
                                        isBuckType(sighting.deerType)
                                            ? e(
                                                "select",
                                                {
                                                    value: sighting.buckId === undefined ? "" : String(sighting.buckId),
                                                    title: "Which buck",
                                                    onChange: function(ev) {
                                                        updateSighting(sighting.id, { buckId: ev.target.value === "" ? undefined : (isNaN(Number(ev.target.value)) ? ev.target.value : Number(ev.target.value)) });
                                                    }
                                                },
                                                e("option", { value: "" }, "Unnamed buck"),
                                                bucks.map(function(b) { return e("option", { key: b.id, value: String(b.id) }, b.name); })
                                            )
                                            : null
                                    ),

                                    e(
                                        "button",
                                        {
                                            className:
                                                "danger",
                                            onClick:
                                                function() {
                                                    deleteSighting(
                                                        sighting.id
                                                    );
                                                }
                                        },
                                        "Delete"
                                    )
                                );

                            }
                        )
                    : e(
                        "div",
                        {
                            className: "empty"
                        },
                        "No sightings recorded."
                    )
            ),

            mapOptions()
        );
    }

    return e(
        React.Fragment,
        null,

        readOnly
            ? e("div", { style: { background: "#7b1e1e", color: "#fff", padding: "8px 12px", fontSize: "14px", display: "flex", justifyContent: "space-between", alignItems: "center", gap: "8px" } },
                e("span", null, "👁 Viewing a shared snapshot (read-only). Nothing you change is saved."),
                e("button", { className: "secondary", onClick: exitReadOnly }, "Exit"))
            : null,

        e(
            "header",
            null,

            e(
                "h1",
                null,
                "Deer Trail Cam Scorer",
                e("span", { style: { fontSize: "11px", opacity: 0.7, marginLeft: "8px", fontWeight: 400 } }, "v26")
            ),

            e(
                "div",
                {
                    className:
                        "header-buttons"
                },

                // Switch between the normal layout and the phone-friendly layout
                e(
                    "button",
                    {
                        className: "header-button",
                        title: "Switch between the phone-friendly and full layouts",
                        onClick: function() { setPhoneMode(!phoneMode); }
                    },
                    phoneMode ? "🖥 Full view" : "📱 Phone view"
                ),

                e(
                    "button",
                    {
                        className:
                            "header-button",
                        onClick:
                            signedIn
                                ? signOutOfDrive
                                : signInToDrive
                    },
                    signedIn
                        ? "Disconnect Drive"
                        : "Connect Google Drive"
                ),

                signedIn
                    ? null
                    : e(
                        "button",
                        {
                            className:
                                "header-button",
                            title:
                                "Set Google Client ID",
                            onClick:
                                askForClientId
                        },
                        "⚙"
                    ),

                signedIn ||
                syncStatus === "error" ||
                localStorage.getItem(WAS_CONNECTED_KEY) === "1"
                    ? e(
                        "span",
                        {
                            onClick: function() {
                                if (syncError) {
                                    alert(syncError);
                                }
                            },
                            style: {
                                color: "white",
                                fontSize: "12px",
                                alignSelf: "center",
                                cursor: syncError ? "pointer" : "default",
                                textDecoration: syncError
                                    ? "underline"
                                    : "none"
                            }
                        },
                        syncStatus === "syncing"
                            ? "Syncing…"
                            : syncStatus === "error"
                                ? "Sync error (tap)"
                                : signedIn
                                    ? "Synced"
                                    : "Not syncing"
                    )
                    : null,

                e(
                    "button",
                    {
                        className:
                            "header-button",
                        onClick:
                            exportData
                    },
                    "Export Data"
                ),

                e(
                    "label",
                    {
                        className:
                            "header-button",
                        style: {
                            padding:
                                "9px 12px",
                            borderRadius:
                                "6px",
                            cursor:
                                "pointer",
                            fontSize:
                                "14px"
                        }
                    },

                    "Import Data",

                    e(
                        "input",
                        {
                            className:
                                "file-input",
                            type: "file",
                            accept:
                                ".json",
                            onChange:
                                importData
                        }
                    )
                )
            )
        ),

        e(
            "div",
            {
                className: "nav"
            },

            e(
                "button",
                {
                    className:
                        view === "dashboard"
                            ? "active"
                            : "",
                    onClick:
                        function() {
                            setView(
                                "dashboard"
                            );
                        }
                },
                "Dashboard"
            ),

            e(
                "button",
                {
                    className:
                        view === "charts"
                            ? "active"
                            : "",
                    onClick:
                        function() {
                            setView("charts");
                        }
                },
                "Charts"
            ),

            e(
                "button",
                {
                    className:
                        view === "email"
                            ? "active"
                            : "",
                    onClick:
                        function() {
                            setView("email");
                        }
                },
                "Email"
            ),

            e(
                "button",
                {
                    className:
                        view === "map"
                            ? "active"
                            : "",
                    onClick:
                        function() {
                            setView("map");
                        }
                },
                "Map"
            ),

            e(
                "button",
                {
                    className: view === "hunt" ? "active" : "",
                    onClick: function() { setView("hunt"); }
                },
                "Hunt"
            ),

            e(
                "button",
                {
                    className: view === "sightings" ? "active" : "",
                    onClick: function() { setView("sightings"); }
                },
                "Sightings"
            ),

            e(
                "button",
                {
                    className: view === "bucks" ? "active" : "",
                    onClick: function() { setView("bucks"); }
                },
                "Bucks"
            ),

            e(
                "button",
                {
                    className: view === "settings" ? "active" : "",
                    onClick: function() { setView("settings"); }
                },
                "Settings"
            )
        ),

        // full screen photo viewer for sighting thumbnails
        photoView && view !== "email"
            ? e("div", { className: "photo-overlay", onClick: function() { setPhotoView(null); } }, e("img", { src: photoView, alt: "Sighting photo" }))
            : null,

        view === "dashboard"
            ? e(
                Dashboard
            )
            : view === "charts"
            ? chartsPage()
            : view === "email"
            ? emailPage()
            : view === "settings"
            ? settingsPage()
            : view === "hunt"
            ? huntPage()
            : view === "bucks"
            ? bucksPage()
            : view === "sightings"
            ? sightingsPage()
            : e(
                "div",
                {
                    className: "app"
                },

                e(
                    "div",
                    {
                        className:
                            "sidebar"
                    },

                    CameraPanel()
                ),

                e(
                    "div",
                    {
                        id: "map"
                    }
                )
            )
    );
}

const root = ReactDOM.createRoot(
    document.getElementById("root")
);

root.render(
    e(App)
);

if ("serviceWorker" in navigator) {
    window.addEventListener("load", function() {
        // updateViaCache:'none' makes the phone re-check sw.js every time instead of trusting an old copy
        navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function(reg) {
            reg.update();
        }).catch(function() {});

        // When a newer version takes over, reload once so the new page is what you see
        let reloaded = false;
        navigator.serviceWorker.addEventListener("controllerchange", function() {
            if (reloaded) return;
            reloaded = true;
            window.location.reload();
        });
    });
}

</script>

</body>
</html>
